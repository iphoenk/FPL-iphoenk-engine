name: FPL GitHub clock
run-name: >-
  FPL GitHub clock ${{ github.event_name }} operational-tick

on:
  # Independent GitHub-owned operational fallback. This is not a ChatGPT natural slot.
  schedule:
    - cron: "35 * * * *"
  workflow_dispatch:
    inputs:
      trigger_origin:
        description: "MANUAL_SMOKE (default) or EXTERNAL_INDEPENDENT_CLOCK (independent scheduler; needs repository variable FPL_EXTERNAL_CLOCK=ENABLED)"
        required: false
        default: MANUAL_SMOKE
        type: choice
        options:
          - MANUAL_SMOKE
          - EXTERNAL_INDEPENDENT_CLOCK
      external_trigger_id:
        description: "Opaque id of the external scheduler invocation (audit only)"
        required: false
        default: ""
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  tick:
    if: >-
      github.event_name == 'schedule' ||
      (
        github.event_name == 'workflow_dispatch' &&
        (inputs.trigger_origin != 'EXTERNAL_INDEPENDENT_CLOCK' || vars.FPL_EXTERNAL_CLOCK == 'ENABLED')
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 431 &&
        github.actor == github.repository_owner &&
        github.event.comment.body == '/fpl-clock-test'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve exact governed tick
        id: tick
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from ops.render_external_clock import resolve_tick

          row = resolve_tick(datetime.now(timezone.utc))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              for key, value in row.items():
                  fh.write(f"{key}={value}\n")
          print(json.dumps(row, sort_keys=True))
          PY

      - name: Bound and de-duplicate the external trigger
        id: external
        continue-on-error: true  # for external origin an unset output means no dispatch (fail closed)
        env:
          TRIGGER_ORIGIN: ${{ inputs.trigger_origin }}
          REPORT_MODE: ${{ steps.tick.outputs.report_mode }}
          REPORT_SLOT: ${{ steps.tick.outputs.report_slot }}
          FPL_EXTERNAL_CLOCK: ${{ vars.FPL_EXTERNAL_CLOCK }}
        shell: bash
        run: python -m ops.external_clock_gate

      - name: Announce external trigger provenance before any dispatch
        if: steps.external.outputs.proceed == 'true' && inputs.trigger_origin == 'EXTERNAL_INDEPENDENT_CLOCK'
        env:
          REPORT_MODE: ${{ steps.tick.outputs.report_mode }}
          REPORT_SLOT: ${{ steps.tick.outputs.report_slot }}
          EXTERNAL_TRIGGER_ID: ${{ inputs.external_trigger_id }}
          ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/external-announcement.txt"
          import os
          from ops.external_clock_gate import announcement
          print(announcement(
              {"report_mode": os.environ["REPORT_MODE"], "report_slot": os.environ["REPORT_SLOT"]},
              external_trigger_id=os.environ["EXTERNAL_TRIGGER_ID"], actor=os.environ["ACTOR"],
          ))
          PY
          gh issue comment 431 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/external-announcement.txt"

      - name: Dispatch exact operational fallback
        id: child
        if: (steps.external.outputs.proceed == 'true' || inputs.trigger_origin != 'EXTERNAL_INDEPENDENT_CLOCK')
        env:
          LOGICAL_SLOT: ${{ steps.tick.outputs.logical_slot }}
          OBSERVED_AT: ${{ steps.tick.outputs.observed_at }}
          REPORT_MODE: ${{ steps.tick.outputs.report_mode }}
          REPORT_SLOT: ${{ steps.tick.outputs.report_slot }}
          CHECKPOINT_TIME: ${{ steps.tick.outputs.checkpoint_time }}
        shell: bash
        run: |
          set -euo pipefail
          dispatch_epoch="$(date -u +%s)"
          gh workflow run fpl-external-clock-fallback.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f logical_slot="$LOGICAL_SLOT" \
            -f observed_at="$OBSERVED_AT" \
            -f report_mode="$REPORT_MODE" \
            -f report_slot="$REPORT_SLOT" \
            -f checkpoint_time="$CHECKPOINT_TIME"

          exact_title="FPL external clock $LOGICAL_SLOT $REPORT_MODE"
          run_id=""
          for attempt in $(seq 1 24); do
            run_id="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow fpl-external-clock-fallback.yml \
                --event workflow_dispatch \
                --branch main \
                --limit 30 \
                --json databaseId,createdAt,displayTitle \
              | jq -r --arg title "$exact_title" --argjson epoch "$dispatch_epoch" '
                  map(
                    select(
                      (.createdAt | fromdateiso8601) >= ($epoch - 5) and
                      .displayTitle == $title
                    )
                  )
                  | sort_by(.createdAt)
                  | last
                  | .databaseId // empty
                '
            )"
            [[ -n "$run_id" ]] && break
            sleep 5
          done

          if [[ -z "$run_id" ]]; then
            echo "::error::Exact fallback child run was not created"
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Created fallback child run: $run_id"

      - name: Wait for exact fallback child
        if: (steps.external.outputs.proceed == 'true' || inputs.trigger_origin != 'EXTERNAL_INDEPENDENT_CLOCK')
        env:
          CHILD_RUN_ID: ${{ steps.child.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "$CHILD_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --exit-status
          echo "Fallback child terminal success: $CHILD_RUN_ID"

      - name: Write origin-separated operational clock evidence
        if: always() && (steps.external.outputs.proceed == 'true' || inputs.trigger_origin != 'EXTERNAL_INDEPENDENT_CLOCK')
        # A skipped external trigger (disabled, nothing due, duplicate, prior failure) writes nothing.
        env:
          LOGICAL_SLOT: ${{ steps.tick.outputs.logical_slot }}
          OBSERVED_AT: ${{ steps.tick.outputs.observed_at }}
          REPORT_MODE: ${{ steps.tick.outputs.report_mode }}
          REPORT_SLOT: ${{ steps.tick.outputs.report_slot }}
          CHILD_RUN_ID: ${{ steps.child.outputs.run_id }}
          TRIGGER_ORIGIN: ${{ inputs.trigger_origin }}
        shell: bash
        run: |
          set -euo pipefail
          status="PASS"
          if [[ "${{ job.status }}" != "success" ]]; then
            status="FAIL"
          fi
          origin="MANUAL_SMOKE"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then origin="GITHUB_NATIVE_OPERATIONAL_SCHEDULE"; fi
          if [[ "${TRIGGER_ORIGIN:-}" == "EXTERNAL_INDEPENDENT_CLOCK" ]]; then origin="EXTERNAL_INDEPENDENT_CLOCK"; fi
          body="FPL_GITHUB_CLOCK | status=$status | event=$GITHUB_EVENT_NAME | schedule_origin=$origin | logical_slot=${LOGICAL_SLOT:-UNKNOWN} | observed_at=${OBSERVED_AT:-UNKNOWN} | report_mode=${REPORT_MODE:-UNKNOWN} | report_slot=${REPORT_SLOT:-NONE} | clock_run_id=$GITHUB_RUN_ID | fallback_run_id=${CHILD_RUN_ID:-NONE} | natural_clock_proof=false | downstream_terminal=UNVERIFIED_DISPATCH_ONLY"
          gh issue comment 431 --repo "$GITHUB_REPOSITORY" --body "$body"

  missed-slot-audit:
    # Read-only reconciliation of due DEEP/PRICE occurrences against private
    # readback and orchestrator run state. It runs beside, never before, the
    # tick job: it cannot delay, replace, or fail the clock, never dispatches,
    # never back-fills, and never creates natural-execution proof.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.trigger_origin != 'EXTERNAL_INDEPENDENT_CLOCK')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Expose effective recovery-dispatch switch
        env:
          FPL_RECOVERY_DISPATCH_VALUE: ${{ vars.FPL_RECOVERY_DISPATCH }}
        shell: bash
        run: |
          if [ "$FPL_RECOVERY_DISPATCH_VALUE" = "ENABLED" ]; then state=ENABLED; else state="DISABLED (value is not exactly ENABLED)"; fi
          echo "::notice title=FPL_RECOVERY_DISPATCH::$state"

      - name: Audit due occurrences without dispatch or backfill
        continue-on-error: true
        env:
          FPL_PRIVATE_REPORTS_TOKEN: ${{ secrets.FPL_PRIVATE_REPORTS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python -m ops.audit_due_occurrences --lookback-hours 36 --output "$RUNNER_TEMP/missed-slot-audit.json"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          data = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "missed-slot-audit.json")))
          print("### FPL missed-slot audit (audit only: no dispatch, no backfill)")
          print("")
          print("| occurrence | state | reason | clock diagnosis |")
          print("| --- | --- | --- | --- |")
          for row in data["rows"]:
              print(f"| `{row['occurrence_id']}` | {row['state']} | {row['reason']} | {row.get('diagnosis', '')} |")
          print("")
          print("counts: " + json.dumps(data["counts"], sort_keys=True))
          print("")
          print("clock cadence: " + json.dumps(data.get("clock_cadence"), sort_keys=True))
          plan = data.get("recovery_plan") or {}
          print("")
          print("recovery plan (advisory, dispatch disabled): eligible=" + json.dumps([d["occurrence_id"] for d in plan.get("eligible", [])]) + " dispatch=" + str(plan.get("dispatch")))
          PY

      - name: Persist missed-slot audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fpl-missed-slot-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/missed-slot-audit.json
          if-no-files-found: ignore
          retention-days: 30

  recovery-dispatch:
    # PREPARED AND DISABLED. Runs only when the owner sets the repository
    # variable FPL_RECOVERY_DISPATCH to exactly ENABLED after separate approval.
    # Consumes the advisory plan of the audit job; at most one future-only,
    # idempotent, #431-announced dispatch of the existing orchestrator per run.
    # Never backfills, never retries a failed occurrence, creates no scheduler.
    needs: missed-slot-audit
    if: >-
      vars.FPL_RECOVERY_DISPATCH == 'ENABLED' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      issues: write
    concurrency:
      group: fpl-recovery-dispatch
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      FPL_RECOVERY_DISPATCH: ${{ vars.FPL_RECOVERY_DISPATCH }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: fpl-missed-slot-audit-${{ github.run_id }}
          path: audit

      - name: Governed recovery dispatch (future-only, idempotent, labelled)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m ops.recovery_dispatch --audit audit/missed-slot-audit.json
