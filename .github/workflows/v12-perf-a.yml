name: V12 PERF-A same-host ABAB

on:
  pull_request:
    paths:
      - "src/engines/v12_perf_a.py"
      - "config/performance/v12_perf_a.json"
      - "tests/test_perf_a_experiment.py"
      - ".github/workflows/v12-perf-a.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perf-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install locked V12 dependencies
        run: python -m pip install --no-deps -r requirements-ci.lock
      - name: Validate frozen PERF-A contract
        run: python -m pytest -q tests/test_perf_a_experiment.py
      - name: Execute same-host normalized/native ABAB
        run: python -m src.engines.v12_perf_a --output artifacts/perf-a/perf_a.json
      - name: Upload PERF-A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v12-perf-a-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/perf-a/perf_a.json
          retention-days: 30
          if-no-files-found: error
