name: V4 temporary full search profiler

on:
  push:
    branches:
      - codex/v4-full-universe-tactical-20260903
    paths:
      - .github/workflows/v4-full-search-profile-temp.yml
      - tools/v4_full_search_profile_temp.py
      - tools/v4_exact_lazy_utility_patch_temp.py
      - tools/v4_exact_hotpath_patch_temp.py

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install --disable-pip-version-check -r requirements.txt
      - name: Apply lazy exact utility candidate patch
        run: python tools/v4_exact_lazy_utility_patch_temp.py
      - name: Apply exact hotpath candidate patch
        run: python tools/v4_exact_hotpath_patch_temp.py
      - name: Profile exact production-sized package search for 25 seconds
        shell: bash
        run: |
          set +e
          python tools/v4_full_search_profile_temp.py
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            exit "$code"
          fi

  estimate:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install --disable-pip-version-check -r requirements.txt
      - name: Estimate outgoing-task work without enumerating incoming packages
        shell: bash
        run: |
          python - <<'PY'
          from collections import Counter, defaultdict
          from itertools import combinations
          from math import comb
          from time import perf_counter
          from src.engines.v4_decision_pipeline import effective_planning_squad
          from src.engines.v4_full_universe_package_search import safe_prune_incoming_players
          from src.engines.v4_tactical_interaction import build_tactical_interactions
          from src.engines.v4_wc_optimizer import POSITION_COUNTS, build_candidates, reconcile_owned_costs
          from src.utils import CONFIG, DATA, read_json

          started = perf_counter()
          predictions = read_json(DATA / 'predictions_v4.json', {})
          universe = read_json(DATA / 'universe.json', {})
          team = read_json(DATA / 'team.json', {})
          latest = read_json(DATA / 'latest.json', {})
          prices = read_json(DATA / 'prices.json', {})
          understat = read_json(DATA / 'understat_tactical_v4.json', {})
          configured = read_json(CONFIG / 'locked_squad.json', {})
          locked = effective_planning_squad(team, configured, latest)
          candidates = build_candidates(predictions, universe)
          interactions = build_tactical_interactions(predictions, universe, understat)
          reconciled, affordability = reconcile_owned_costs(candidates, locked)
          budget = int(affordability['available_budget_tenths'])
          owned = {int(r.get('element')) for r in locked.get('players') or [] if r.get('element') is not None}
          by_id = {p.element: p for p in reconciled}
          current = tuple(by_id[e] for e in sorted(owned))
          external, proofs = safe_prune_incoming_players(
              reconciled, owned, interactions=interactions, prices=prices,
              predictions=predictions, universe=universe,
          )
          pools = {pos: [] for pos in POSITION_COUNTS}
          for p in external:
              pools[p.position].append(p)

          rows = []
          by_k = defaultdict(int)
          total = 0
          for k in range(1, 4):
              for outs_raw in combinations(current, k):
                  outs = tuple(sorted(outs_raw, key=lambda p: (p.position, p.element)))
                  out_ids = {p.element for p in outs}
                  keep_cost = sum(p.cost for p in current if p.element not in out_ids)
                  need = Counter(p.position for p in outs)
                  filtered_sizes = {
                      pos: sum(1 for p in pools[pos] if keep_cost + p.cost <= budget)
                      for pos in need
                  }
                  weight = 1
                  for pos, count in need.items():
                      n = filtered_sizes[pos]
                      weight *= comb(n, count) if n >= count else 0
                  task = tuple(sorted(out_ids))
                  total += weight
                  by_k[k] += weight
                  rows.append((weight, k, task, tuple(sorted(need.items())), filtered_sizes))
          rows.sort(reverse=True)
          task_count = len(rows)
          print({
              'elapsed_s': round(perf_counter()-started, 3),
              'candidate_count': len(candidates),
              'safe_pruned': len(proofs),
              'remaining_external': len(external),
              'pool_sizes': {p: len(v) for p,v in pools.items()},
              'outgoing_task_count': task_count,
              'estimated_incoming_combinations_upper_bound': total,
              'estimated_by_k': dict(by_k),
              'mean_weight': round(total/max(1,task_count), 2),
              'top_30_tasks': rows[:30],
          }, flush=True)
          PY
