name: V4 temporary governance persist fix + attestation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v4-attestation-refresh-temp.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/v4-runtime-secret-inheritance
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Correct persist flag placement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('src/services/governance_service.py')
          text=p.read_text()
          wrong='''    postflight = framework_postflight_truth_service.run(\n        predictions=predictions,\n        latest=latest,\n        universe=universe,\n        persist=False,\n    )'''
          right='''    postflight = framework_postflight_truth_service.run(\n        predictions=predictions,\n        latest=latest,\n        universe=universe,\n    )'''
          if wrong not in text:
              raise SystemExit('wrong postflight persist anchor not found')
          text=text.replace(wrong,right,1)

          old='''    maturity = v4_maturity_reconciler.reconcile(\n        postflight,\n        predictions=predictions,\n        latest=latest,\n        universe=universe,\n    )'''
          new='''    maturity = v4_maturity_reconciler.reconcile(\n        postflight,\n        predictions=predictions,\n        latest=latest,\n        universe=universe,\n        persist=False,\n    )'''
          if old not in text:
              raise SystemExit('maturity reconcile anchor not found')
          text=text.replace(old,new,1)
          if text.count('persist=False') != 1:
              raise SystemExit(f'unexpected persist=False count: {text.count("persist=False")}')
          p.write_text(text)
          PY
      - name: Rebuild governed architecture attestation
        run: python tools/v4_architecture_guard_attest.py
      - name: Install test dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Verify full deterministic suite
        run: python -m pytest -q
      - name: Verify governed orchestration smoke
        run: python -m src.services.orchestrator daily --stats --deep-stats
      - name: Commit corrective patch to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/governance_service.py config/architecture_guard_attestation.json
          git diff --cached --exit-code && exit 0 || true
          git commit -m 'fix(v4): scope maturity persistence dedup correctly'
          git push origin HEAD:codex/v4-runtime-secret-inheritance
