name: V6 FFScout native identity dedupe staging v2

on:
  push:
    branches:
      - fix/v6-ffscout-native-identity-dedupe

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-v6-ci.lock
      - name: Install V6 CI dependencies
        run: python -m pip install --require-hashes -r requirements-v6-ci.lock
      - name: Execute repaired staging patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/v6-ffscout-native-identity-dedupe-stage.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          block = source[start:end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          code = code.replace("if text.count(old_build) != 1:\\n              raise", "if text.count(old_build) != 1:\n    raise")
          code = code.replace("if text.count(old_players) != 1:\\n              raise", "if text.count(old_players) != 1:\n    raise")
          code = code.replace("if text.count(governance_anchor) != 1:\\n              raise", "if text.count(governance_anchor) != 1:\n    raise")
          exec(compile(code, 'ffscout_native_identity_dedupe_stage.py', 'exec'), {'__name__': '__main__'})
          test = Path('tests/test_data_platform_ffscout_native_identity_inventory.py')
          test_text = test.read_text(encoding='utf-8').replace('/p{code}.png', '/{code}.png')
          test.write_text(test_text, encoding='utf-8')
          PY
      - name: Run focused FFScout and identity tests
        run: |
          python -m pytest -q \
            tests/test_data_platform_ffscout_native_identity_inventory.py \
            tests/test_data_platform_identity_wave_b_gap_semantics.py \
            tests/test_data_platform_identity_wave_b_provider_limitations.py
      - name: Run full V6 data-platform contracts
        run: python -m pytest -q tests/test_data_platform_*.py
      - name: Commit production fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/runtime_v6/ffscout_public.py tests/test_data_platform_ffscout_native_identity_inventory.py
          git commit -m 'Deduplicate FFScout native identity inventory'
          git push origin HEAD:${GITHUB_REF_NAME}
