name: FPL V4 Official freshness heartbeat

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      publish:
        required: true
        type: boolean

permissions:
  contents: write

env:
  RUNTIME_BRANCH: runtime-data-v4

jobs:
  refresh-official:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Acquire fresh Official FPL snapshot
        run: python -m src.services.raw_snapshot_service live

      - name: Build compact Official freshness contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          snapshot = json.loads(Path('data/runtime/snapshot.v1.json').read_text())
          health = snapshot.get('endpoint_health') or {}
          phase = snapshot.get('phase') or {}
          required = ['bootstrap', 'fixtures', 'event_status', 'entry', 'history', 'transfers']
          if phase.get('submitted_gw'):
              required.append('picks')
          if phase.get('scoring_gw'):
              required.append('event_live')
          states = {key: (health.get(key) or {}).get('status') for key in required}
          failed = [key for key, value in states.items() if value not in {'LIVE', 'IDLE'}]
          payload = {
              'schema_version': 1,
              'contract': 'V4_OFFICIAL_FRESHNESS_V1',
              'generated_at': snapshot.get('generated_at'),
              'source': 'OFFICIAL_FPL',
              'status': 'PASS' if not failed else 'PARTIAL',
              'phase': phase,
              'squad_authority': snapshot.get('squad_authority'),
              'required_endpoints': required,
              'endpoint_states': states,
              'failed_endpoints': failed,
              'endpoint_health': health,
              'snapshot_path': 'data/runtime/snapshot.v1.json',
              'decision_artifacts_refreshed': False,
              'decision_artifacts_may_be_older_than_official_fact_snapshot': True,
              'governance': {
                  'official_fact_freshness_decoupled_from_full_model_compute': True,
                  'fresh_fact_snapshot_never_implies_fresh_prediction': True,
                  'stale_prediction_must_remain_labelled_stale': True,
              },
          }
          Path('data/official_freshness_v4.json').write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n')
          print(json.dumps({'status': payload['status'], 'generated_at': payload['generated_at'], 'failed': failed}))
          PY

      - name: Publish Official freshness without overwriting model artifacts
        if: inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fpl-iphoenk-bot"
          git config user.email "actions@users.noreply.github.com"
          publish_tree="$RUNNER_TEMP/v4-official-refresh"
          rm -rf "$publish_tree"

          git fetch --depth=1 origin "+refs/heads/${RUNTIME_BRANCH}:refs/remotes/origin/${RUNTIME_BRANCH}"
          git worktree add --detach "$publish_tree" "origin/${RUNTIME_BRANCH}"
          mkdir -p "$publish_tree/data/runtime" "$publish_tree/data"
          cp "$GITHUB_WORKSPACE/data/runtime/snapshot.v1.json" "$publish_tree/data/runtime/snapshot.v1.json"
          cp "$GITHUB_WORKSPACE/data/official_freshness_v4.json" "$publish_tree/data/official_freshness_v4.json"

          cd "$publish_tree"
          git add -f data/runtime/snapshot.v1.json data/official_freshness_v4.json
          if git diff --cached --quiet; then
            echo "Official freshness unchanged; nothing to publish"
            exit 0
          fi
          git commit -m "data(v4): refresh Official fact snapshot [skip ci]"

          for attempt in 1 2 3; do
            if git push origin HEAD:"$RUNTIME_BRANCH"; then
              exit 0
            fi
            echo "Publish race on attempt ${attempt}; rebasing onto latest runtime branch"
            git fetch --depth=1 origin "+refs/heads/${RUNTIME_BRANCH}:refs/remotes/origin/${RUNTIME_BRANCH}"
            git rebase "origin/${RUNTIME_BRANCH}"
            sleep "$attempt"
          done
          echo "Failed to publish Official freshness after bounded retries" >&2
          exit 1
