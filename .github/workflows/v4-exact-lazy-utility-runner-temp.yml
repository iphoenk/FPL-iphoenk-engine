name: V4 temporary exact lazy utility acceptance
on:
  push:
    branches: [codex/v4-full-universe-tactical-20260903]
    paths: [.github/workflows/v4-exact-lazy-utility-runner-temp.yml]
permissions:
  contents: write
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/v4-full-universe-tactical-20260903
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install --disable-pip-version-check -r requirements.txt pytest
      - run: python tools/v4_exact_lazy_utility_patch_temp.py
      - name: Focused correctness regression
        run: python -m pytest -q tests/test_v4_full_universe_package_search_proof.py tests/test_v4_full_universe_authority_fail_closed.py tests/test_v496_e2e_performance_hardening.py tests/test_v4_p1_structural_hardening.py
      - name: Profile cold optimization beyond SLO
        continue-on-error: true
        run: /usr/bin/time -f 'cold_optimization_elapsed=%e' timeout 150s python -m src.services.optimization_slo_service
      - name: Show package artifact diagnostics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/wc_package_audit_v4.json')
          if not p.exists():
              print('package_artifact_missing')
              raise SystemExit(0)
          d=json.loads(p.read_text())
          print(json.dumps({'search': d.get('search',{}).get('status'), 'diagnostics': d.get('search',{}).get('diagnostics',{})}, indent=2))
          PY
