name: P17 PR690 protected-round validation

on:
  push:
    branches:
      - audit/p17-pr690-protected-round-validation-20260924
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7766288dd21d08b2710a1b84cc77ff40966f92dd
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r requirements-ci.lock
      - name: Run bounded exactness and performance gate
        run: |
          python -m pytest -q tests/test_lineup_distributional_optimizer.py -k \
            "p17_batch_has_no_undocumented_numpy_round_calls or \
             p17_boundary_dense_all_public_route_fields_match_scalar_family_and_chunk or \
             p17_cross_route_batch_matches_scalar_one_transfer_families or \
             p17_cross_route_batch_2043_routes_five_gw_under_ten_seconds or \
             p17_cross_route_batch_2043_routes_five_gw_tie_rich_under_ten_seconds or \
             python_round_vec_bitwise_matches_python_round_near_decimal_halves or \
             python_round_vec_domain_guards or \
             cross_route_route_utility_rounding_matches_scalar_oracle_at_production_half_boundaries"
