name: V12 D-P2 report precompute control

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write

concurrency:
  group: v12-d-p2-precompute-${{ github.event.comment.id }}
  cancel-in-progress: false

env:
  PRECOMPUTE_CONFIG: config/delivery/v12_precompute_control.json

jobs:
  precompute-control:
    if: >-
      github.event.issue.number == 431 &&
      github.actor == github.repository_owner &&
      startsWith(github.event.comment.body, '/v12-precompute ')
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Validate bounded owner precompute request
        id: plan
        shell: bash
        env:
          PRECOMPUTE_COMMAND: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          python -m src.engines.v12_precompute_control             --command "$PRECOMPUTE_COMMAND"             --config "$PRECOMPUTE_CONFIG"             --output "$RUNNER_TEMP/precompute-plan.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          plan = json.loads((Path(os.environ["RUNNER_TEMP"]) / "precompute-plan.json").read_text())
          assert plan["counts_as_core_slot"] is False
          assert plan["advances_scheduler_proof"] is False
          for key in ("wait_seconds", "report_kind", "logical_slot", "dispatch_reason", "dispatch_workflow"):
              print(f"{key}={plan[key]}", file=open(os.environ["GITHUB_OUTPUT"], "a"))
          PY

      - name: Wait until governed T-15 precompute release
        if: steps.plan.outputs.wait_seconds != '0'
        shell: bash
        env:
          WAIT_SECONDS: ${{ steps.plan.outputs.wait_seconds }}
        run: |
          set -euo pipefail
          test "$WAIT_SECONDS" -ge 0
          test "$WAIT_SECONDS" -le 3900
          sleep "$WAIT_SECONDS"

      - name: Revalidate occurrence before dispatch
        shell: bash
        env:
          PRECOMPUTE_COMMAND: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          python -m src.engines.v12_precompute_control             --command "$PRECOMPUTE_COMMAND"             --config "$PRECOMPUTE_CONFIG"             --output "$RUNNER_TEMP/precompute-release.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          plan = json.loads((Path(os.environ["RUNNER_TEMP"]) / "precompute-release.json").read_text())
          assert plan["wait_seconds"] == 0, plan
          assert plan["counts_as_core_slot"] is False
          assert plan["advances_scheduler_proof"] is False
          PY

      - name: Dispatch existing governed V6 report-prefetch path
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_KIND: ${{ steps.plan.outputs.report_kind }}
          LOGICAL_SLOT: ${{ steps.plan.outputs.logical_slot }}
          DISPATCH_REASON: ${{ steps.plan.outputs.dispatch_reason }}
          DISPATCH_WORKFLOW: ${{ steps.plan.outputs.dispatch_workflow }}
        run: |
          set -euo pipefail
          gh api --method POST             "repos/${GITHUB_REPOSITORY}/actions/workflows/${DISPATCH_WORKFLOW}/dispatches"             -f ref="${GITHUB_SHA}"             -f 'inputs[mode]=report_prefetch'             -f "inputs[reason]=${DISPATCH_REASON}"             -f "inputs[report_kind]=${REPORT_KIND}"             -f "inputs[logical_slot]=${LOGICAL_SLOT}"             -f 'inputs[scope]='             -f 'inputs[gw_from]='             -f 'inputs[gw_to]='             -f 'inputs[force]=false'
          echo "D-P2 dispatched existing V6 report_prefetch only; no core slot or scheduler proof is minted."
