name: V4.9.6 one-shot lineup probe fix

on:
  push:
    branches:
      - codex/v4.9.6-architecture-consolidation
    paths:
      - .github/workflows/v496-one-shot-lineup-probe.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v4.9.6-architecture-consolidation
          fetch-depth: 0
      - name: Replace stale formation reference with canonical legality
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/engines/framework_health_audit.py')
          text = path.read_text(encoding='utf-8')
          old_import = 'from src.engines.fpl_legality import plan_legality_checks\n'
          new_import = 'from src.engines.fpl_legality import formation_from_rows, plan_legality_checks\n'
          if text.count(old_import) != 1:
              raise RuntimeError(f'expected one legality import, found {text.count(old_import)}')
          text = text.replace(old_import, new_import, 1)
          old_probe = '''def _probe_lineup() -> tuple[bool, dict]:\n    lineup = read_json(DATA / "lineup_decision_v4.json", {})\n    xi = list(lineup.get("starting_xi") or [])\n    guardrails = lineup.get("guardrails") or {}\n    return len(xi) == 11 and lineup.get("formation") in LEGAL_FORMS and all(guardrails.values()), {"xi": len(xi), "formation": lineup.get("formation")}\n'''
          new_probe = '''def _probe_lineup() -> tuple[bool, dict]:\n    lineup = read_json(DATA / "lineup_decision_v4.json", {})\n    xi = list(lineup.get("starting_xi") or [])\n    guardrails = lineup.get("guardrails") or {}\n    derived_formation = formation_from_rows(xi)\n    valid = (\n        len(xi) == 11\n        and derived_formation is not None\n        and lineup.get("formation") == derived_formation\n        and all(guardrails.values())\n    )\n    return valid, {\n        "xi": len(xi),\n        "formation": lineup.get("formation"),\n        "derived_formation": derived_formation,\n    }\n'''
          if text.count(old_probe) != 1:
              raise RuntimeError(f'expected one stale lineup probe, found {text.count(old_probe)}')
          path.write_text(text.replace(old_probe, new_probe, 1), encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/v496-one-shot-lineup-probe.yml
          git config user.name "fpl-iphoenk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(v4.9.6): use canonical legality in lineup health probe"
          git push origin HEAD:codex/v4.9.6-architecture-consolidation
