name: V6 Wave B promote reviewed Understat bridge

on:
  push:
    branches:
      - ops/v6-identity-wave-b-promote-understat

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/v6-identity-wave-b-opta-bridge
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewed deterministic Wave B promotion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          source_path = Path('src/runtime_v6/verified_crosswalks.py')
          text = source_path.read_text(encoding='utf-8')
          start = text.index('def _player_link(')
          end = text.index('\ndef _player_mapping_by_code', start)
          replacement = '''def _player_link(source_id: str, native_id: Any, config_source: dict[str, Any], row: dict[str, Any]) -> dict[str, Any]:
              method = str(
                  row.get("verification_method")
                  or config_source.get("player_verification_method")
                  or config_source.get("verification_method")
                  or "VERIFIED_PLAYER_PROVIDER_CROSSWALK"
              )
              row_evidence = row.get("evidence")
              evidence = (
                  list(row_evidence)
                  if isinstance(row_evidence, list)
                  else list(config_source.get("evidence") or [])
              )
              bridge_path = row.get("bridge_path")
              return {
                  "source_id": source_id,
                  "source_native_id": native_id,
                  "external_id": native_id,
                  "mapping_method": method,
                  "method": method,
                  "verification_status": STATUS,
                  "status": STATUS,
                  "confidence": 1.0,
                  "verified": True,
                  "joinable": True,
                  "verified_at": (
                      row.get("verified_at")
                      or config_source.get("player_crosswalk_verified_at")
                      or config_source.get("verified_at")
                  ),
                  "provenance": {
                      "source_id": source_id,
                      "canonical_anchor": "official_fpl.bootstrap.elements.code",
                      "official_fpl_code": row.get("official_fpl_code"),
                      "official_fpl_element_id": row.get("official_fpl_element_id"),
                      "reep_id": row.get("reep_id"),
                      "provider_column": config_source.get("player_crosswalk_provider_column"),
                      "verification_release": (
                          row.get("verification_release")
                          or config_source.get("player_crosswalk_release")
                      ),
                      "verification_commit": (
                          row.get("verification_commit")
                          or config_source.get("player_crosswalk_commit")
                      ),
                      "crosswalk_config": "config/v6/verified_crosswalks.json",
                      "evidence": evidence,
                      "bridge_path": list(bridge_path) if isinstance(bridge_path, list) else [],
                      "review_status": row.get("review_status"),
                      "review_reference": row.get("review_reference"),
                      "name_matching_used": False,
                      "fuzzy_matching_used": False,
                  },
              }
          '''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          source_path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          candidates = [
            (11772,508395,102,'rp778e5fbd915144'),
            (1045,168144,184,'rpbef301701841d2'),
            (9011,242313,207,'rped11a865b62820'),
            (8379,243016,372,'rpecc5cfdbee4a41'),
            (5680,93605,541,'rp29058d1009e215'),
            (7783,204561,558,'rp89d0897e3db3b7'),
            (11087,498444,583,'rpc1f40d84f43065'),
            (8372,469266,589,'rpe6c1d110d82044'),
            (212,173774,598,'rp47ddf39d81eeeb'),
            (12162,637238,616,'rp041584cf54da9f'),
            (8685,490884,617,'rp3a4c205b1c3bb9'),
            (8325,218543,619,'rp13413376223a27'),
            (11911,551050,635,'rp757ea0b0aa9b5a'),
          ]
          release = '20260907T201034Z'
          manifest_sha = '65356d7522832ea58c19993a95eb31ceb9d6e22e3ff518014387734b13e43529'
          bridges_sha = 'a03aef520a454bdcd181b5b332b91e7b41ee57f4914e6e2c456cf49a8b86a735'
          reviewed_at = '2026-09-13T14:28:58Z'
          review_ref = 'github-actions:run/34762762105'
          method = 'REEP_V1_OPTA_PERSON_NUMERIC_TO_UNDERSTAT'
          bridge_path = [
              'official_fpl.bootstrap.elements.code',
              'reep_v1:opta/person_numeric',
              'reep_v1:understat/player',
              'official_fpl.bootstrap.elements.id',
          ]

          cfg_path = Path('config/v6/verified_crosswalks.json')
          cfg = json.loads(cfg_path.read_text(encoding='utf-8'))
          understat = cfg['sources']['understat']
          rows = list(understat.get('players') or [])
          by_native = {str(r['source_native_id']): r for r in rows}
          by_code = {int(r['official_fpl_code']): r for r in rows}
          promoted = 0
          for native, code, element_id, reep_id in candidates:
              if str(native) in by_native:
                  existing = by_native[str(native)]
                  if int(existing['official_fpl_code']) != code:
                      raise SystemExit(f'native conflict understat:{native}')
                  continue
              if code in by_code:
                  existing = by_code[code]
                  if str(existing['source_native_id']) != str(native):
                      raise SystemExit(f'official code conflict understat:{code}')
                  continue
              row = {
                  'official_fpl_code': code,
                  'official_fpl_element_id': element_id,
                  'reep_id': reep_id,
                  'source_native_id': native,
                  'verification_method': method,
                  'verification_release': release,
                  'verified_at': reviewed_at,
                  'review_status': 'DETERMINISTIC_BRIDGE_REVIEWED',
                  'review_reference': review_ref,
                  'bridge_path': bridge_path,
                  'evidence': [
                      f'official_fpl:bootstrap.elements.code:{code}',
                      f'official_fpl:bootstrap.elements.id:{element_id}',
                      f'reep_v1:opta/person_numeric:{code}',
                      f'reep_v1:understat/player:{native}',
                      f'reep_v1:reep_id:{reep_id}',
                      f'reep_v1_release:{release}',
                      f'reep_v1_manifest_sha256:{manifest_sha}',
                      f'reep_v1_bridges_sha256:{bridges_sha}',
                  ],
              }
              rows.append(row)
              by_native[str(native)] = row
              by_code[code] = row
              promoted += 1

          rows.sort(key=lambda r: (int(r['official_fpl_code']), str(r['source_native_id'])))
          understat['players'] = rows
          understat['wave_b_extension'] = {
              'verification_method': method,
              'release': release,
              'manifest_sha256': manifest_sha,
              'bridges_sha256': bridges_sha,
              'reviewed_at': reviewed_at,
              'review_reference': review_ref,
              'promoted_mapping_count': 13,
              'name_matching_used': False,
              'fuzzy_matching_used': False,
              'auto_promotion_used': False,
          }
          if len(rows) != 516:
              raise SystemExit(f'expected 516 Understat configured mappings, got {len(rows)}')
          cfg_path.write_text(json.dumps(cfg, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(f'promoted={promoted} total_understat={len(rows)}')
          PY

      - name: Sanity check changed files
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile src/runtime_v6/verified_crosswalks.py
          python - <<'PY'
          from src.runtime_v6.verified_crosswalks import load_verified_crosswalks
          cfg = load_verified_crosswalks()
          rows = cfg['sources']['understat']['players']
          assert len(rows) == 516
          assert len({str(r['source_native_id']) for r in rows}) == 516
          assert len({int(r['official_fpl_code']) for r in rows}) == 516
          wave = [r for r in rows if r.get('verification_method') == 'REEP_V1_OPTA_PERSON_NUMERIC_TO_UNDERSTAT']
          assert len(wave) == 13
          assert all(r.get('review_status') == 'DETERMINISTIC_BRIDGE_REVIEWED' for r in wave)
          assert all(r.get('bridge_path') for r in wave)
          assert all(r.get('evidence') for r in wave)
          print('crosswalk promotion sanity PASS')
          PY

      - name: Commit to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/runtime_v6/verified_crosswalks.py config/v6/verified_crosswalks.json
          git diff --cached --check
          git commit -m 'Promote reviewed Reep v1 Understat Wave B mappings'
          git push origin HEAD:feat/v6-identity-wave-b-opta-bridge
