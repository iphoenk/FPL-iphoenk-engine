name: V4.9.7 comparator truth correction

on:
  push:
    branches:
      - codex/v4.9.7-challenger-comparator

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v4.9.7-challenger-comparator
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/v497_truth_fix.py
      - name: Commit truth correction if needed
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/challenger_comparator_service.py tests/test_v497_challenger_comparator.py config/service_registry.json config/service_contract_registry.json
          git commit -m "fix(v4): use official event points for recent challenger signal"
          git push origin HEAD:codex/v4.9.7-challenger-comparator
