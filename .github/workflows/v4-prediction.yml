name: FPL iphoenk V4 prediction gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fpl-iphoenk-v4-gate
  cancel-in-progress: true

jobs:
  validate-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout V4 prediction branch
        uses: actions/checkout@v4
        with:
          ref: v4-prediction-engine
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Unit and acceptance tests
        env: {PYTHONPATH: "${{ github.workspace }}"}
        run: python -m pytest -q
      - name: Mandatory FPL 2026/27 rules compliance audit
        env: {PYTHONPATH: "${{ github.workspace }}"}
        run: python -m src.engines.compliance_audit
      - name: Generate V4 point-in-time prediction snapshot
        env: {PYTHONPATH: "${{ github.workspace }}"}
        run: python -m src.engine daily --stats
      - name: Persist forward-valid deadline snapshot and reconcile finished GW when available
        env: {PYTHONPATH: "${{ github.workspace }}"}
        run: python -m src.engines.v4_validation_cycle cycle
      - name: Framework health PRE-FLIGHT - Gate0 DSS50 Extensions Enhancements
        env: {PYTHONPATH: "${{ github.workspace }}"}
        run: python -m src.engines.framework_health_audit --phase preflight
      - name: V4.6.2 high-performance unified decision and evidence pipeline
        env: {PYTHONPATH: "${{ github.workspace }}"}
        run: python -m src.engines.v4_decision_pipeline
      - name: Framework health POST-FLIGHT - final decision readiness
        env: {PYTHONPATH: "${{ github.workspace }}"}
        run: python -m src.engines.framework_health_audit --phase postflight
      - name: V4.6 framework-aware acceptance and quality gate
        env: {PYTHONPATH: "${{ github.workspace }}"}
        run: |
          python - <<'PY'
          import json, statistics
          from src.engines.reliability import validate_snapshot

          pre=json.load(open('data/framework_health_preflight_v4.json'))
          h=json.load(open('data/framework_health_v4.json'))
          assert pre.get('engine')=='v4.6-framework-health-auditor' and pre.get('phase')=='preflight', pre
          assert h.get('engine')=='v4.6-framework-health-auditor' and h.get('phase')=='postflight', h
          assert h.get('registry_integrity') is True and h.get('go_allowed') is True, h
          assert h['dss_core']['declared']==50 and h['dss_core']['integrity_ok'] is True
          assert h['dss_extensions']['declared']==16 and h['dss_extensions']['integrity_ok'] is True
          assert h['enhancements']['declared']==8 and h['enhancements']['integrity_ok'] is True
          assert h['gate0']['pass'] is True and h['gate0']['counts'].get('FAIL',0)==0, h['gate0']
          rc=h.get('reporting_contract',{})
          assert rc.get('health_check_first') and rc.get('raw_optimizer_distinct_from_governed_recommendation')
          assert rc.get('manual_draft_distinct_from_final_lock') and rc.get('gate0_fail_blocks_go')

          s=json.load(open('data/latest.json')); r=validate_snapshot(s); assert r['ok'], r
          assert s['schema_version'] >= 40 and s['engine_version'].startswith('4.0')
          c=json.load(open('data/compliance_audit.json')); assert c.get('overall')=='PASS', c
          p=json.load(open('data/predictions_v4.json')); players=p.get('players',[])
          assert p.get('point_in_time') is True and len(players) >= 500

          w=json.load(open('data/wc_decision_v4.json'))
          assert int(w.get('schema_version',0)) >= 447 and str(w.get('engine','')).startswith('v4.4.6-wc-optimizer-packed-clubs'), w
          assert w.get('screened_players',0)>=500 and len(w.get('optimized_elements',[]))==15
          assert w.get('classification') in {'KEEP_15','OPTIONAL_IMPROVEMENT','MATERIAL_UPGRADE'}
          wp=w.get('performance',{})
          assert wp.get('fast_finalist_scoring') and wp.get('winner_only_legality_check')
          assert wp.get('beam_size_unchanged') and wp.get('packed_club_signature') and wp.get('counter_copy_eliminated')
          assert wp.get('direct_challenger_position_index')

          a=json.load(open('data/wc_package_audit_v4.json'))
          assert int(a.get('schema_version',0)) >= 447 and str(a.get('engine','')).startswith('v4.4.6-wc-package-audit'), a
          assert a.get('max_replacements')==4 and set(a.get('best_by_replacement_count',{}))=={'1','2','3','4'}
          assert a.get('overall_verdict') in {'KEEP_15','OPTIONAL_IMPROVEMENT','MATERIAL_UPGRADE'}
          assert a.get('guardrails',{}).get('risk_penalty_enabled') and a.get('guardrails',{}).get('search_width_unchanged')
          perf=a.get('performance',{})
          assert perf.get('metrics_cache_entries',0)>0 and perf.get('single_pass_metrics') and perf.get('compact_target_cache')
          assert perf.get('score_only_hotloop') and perf.get('redundant_target_validation_removed') and perf.get('candidate_reuse_supported')

          l=json.load(open('data/lineup_decision_v4.json'))
          assert int(l.get('schema_version',0)) >= 452 and str(l.get('engine','')).startswith('v4.5.2-lineup-robust-governance'), l
          assert len(l.get('starting_xi',[]))==11
          assert l.get('formation') in {'3-4-3','3-5-2','4-3-3','4-4-2','4-5-1','5-2-3','5-3-2','5-4-1'}
          xi_ids={x['element'] for x in l['starting_xi']}
          assert l['captain']['element'] in xi_ids and l['vice_captain']['element'] in xi_ids and l['captain']['element']!=l['vice_captain']['element']
          assert len(l.get('bench',{}).get('order',[]))==3 and l.get('bench',{}).get('gk')
          assert l.get('chip_context',{}).get('single_chip_rule_respected') is True
          guards=l.get('guardrails',{})
          assert guards.get('captain_risk_adjusted') and guards.get('captain_safe_pool_preferred')
          assert guards.get('manual_draft_not_overwritten_without_margin') and guards.get('prediction_interval_robustness')
          assert l.get('governance',{}).get('decision') in {'OPTIMIZER_ONLY','HOLD_MANUAL_DRAFT','CHANGE_RECOMMENDED'}

          e=json.load(open('data/recommendation_sanity_v4.json'))
          assert int(e.get('schema_version',0))>=460 and str(e.get('engine','')).startswith('v4.6-evidence-fusion-sanity'), e
          assert e.get('point_in_time') is True and e.get('final_verdict') in {'KEEP_15','OPTIONAL_IMPROVEMENT','MATERIAL_UPGRADE'}
          eg=e.get('guardrails',{})
          assert eg.get('raw_optimizer_not_authoritative') and eg.get('rate_spike_detection') and eg.get('team_cluster_penalty')
          assert eg.get('outgoing_baseline_resistance') and eg.get('early_season_multi_change_cap') and eg.get('point_in_time_required')

          q=json.load(open('data/decision_pipeline_v4.json'))
          assert int(q.get('schema_version',0))>=461 and str(q.get('engine','')).startswith('v4.6.1-unified-decision-pipeline-fast-parallel'), q
          pg=q.get('performance_guardrails',{})
          assert pg.get('shared_json_loaded_once') and pg.get('shared_candidates_built_once') and pg.get('fork_copy_on_write') and pg.get('parallel_wc_package')
          assert pg.get('search_quality_reduction') is False and pg.get('wc_beam_unchanged') and pg.get('package_frontier_beam_unchanged')
          timings=q.get('timings',{}); assert timings.get('total_pipeline_ms',0)>0

          all_x=[]
          for row in players:
              assert len(row.get('fixtures',[]))<=15 and row.get('xpts_5',0)>=0
              for fx in row.get('fixtures',[]):
                  x=fx['xpts']; all_x.append(x); assert 0<=x<25
                  assert fx['components'].get('defcon',0)<=2.001
                  if row.get('position')=='GK': assert fx['components'].get('defcon',0)==0
                  assert fx['lower80']<=x<=fx['upper80']
                  d=fx['xmins']; assert abs(d['start_probability']+d['bench_probability']+d['dnp_probability']-1)<.002
          assert all_x and statistics.median(all_x)<8 and sum(x>15 for x in all_x)/len(all_x)<.03
          print('V4.6 FRAMEWORK HEALTH + QUALITY GATE PASS', {
              'health':h['overall'],'gate0':h['gate0']['counts'],'dss50':h['dss_core']['counts'],
              'extensions':h['dss_extensions']['counts'],'enhancements':h['enhancements']['counts'],
              'recommendation':e['final_verdict'],'lineup':l['governance']['decision'],
              'formation':l['formation'],'captain':l['captain']['name'],'pipeline_ms':timings['total_pipeline_ms']})
          PY
      - name: Package V4 quality-test inputs
        if: always()
        run: |
          mkdir -p v4-artifact
          cp data/predictions_v4.json data/latest.json data/live.json data/universe.json data/team.json data/compliance_audit.json data/wc_decision_v4.json data/wc_package_audit_v4.json data/lineup_decision_v4.json data/recommendation_sanity_v4.json data/decision_pipeline_v4.json data/framework_health_preflight_v4.json data/framework_health_v4.json v4-artifact/ 2>/dev/null || true
          cp config/manual_lineup.json config/dss_core_registry.json config/dss_extension_registry.json config/enhancement_layers_registry.json config/gate0_registry.json v4-artifact/ 2>/dev/null || true
          if [ -d data/validation ]; then cp -R data/validation v4-artifact/; fi
      - name: Upload V4 prediction artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-prediction-quality-inputs
          path: v4-artifact/
          if-no-files-found: error
          retention-days: 30
