name: V4 frontier insertion profiler temp

on:
  push:
    branches: [codex/v4-full-universe-tactical-20260903]
    paths:
      - .github/workflows/v4-frontier-insertion-profiler-temp.yml

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/v4-full-universe-tactical-20260903
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Measure exact shard plan against governed throughput
        run: |
          python -u -m src.engines.v4_full_universe_shard_planner --emit-matrix
          python -u - <<'PY'
          import json
          plan=json.load(open('data/runtime/v4_full_universe_shard_plan.json'))
          registry=plan['registry']
          planner=registry['planner']
          workflow=registry['workflow']
          throughput=float(planner['observed_hotpath_packages_per_second'])
          target_seconds=float(planner['target_worker_seconds'])
          target_combinations=int(planner['target_combinations_per_shard'])
          balance=plan['balance']
          max_work=int(balance['max_estimated_shard_work'])
          total=int(balance['estimated_total_work'])
          shards=int(balance['derived_shard_count'])
          expected_by_target=int(throughput*target_seconds)
          estimate_seconds=max_work/max(1.0,throughput)
          configured_target_seconds=target_combinations/max(1.0,throughput)
          print('PLAN_SUMMARY', {
              'shards': shards,
              'tasks': plan['partition_proof']['task_count'],
              'estimated_total_work': total,
              'max_estimated_shard_work': max_work,
              'observed_hotpath_packages_per_second': throughput,
              'target_worker_seconds': target_seconds,
              'throughput_implied_target_combinations': expected_by_target,
              'configured_target_combinations_per_shard': target_combinations,
              'configured_target_implied_seconds': round(configured_target_seconds,2),
              'max_shard_estimated_seconds_at_observed_throughput': round(estimate_seconds,2),
              'worker_timeout_seconds': workflow['worker_timeout_seconds'],
          })
          assert plan['partition_proof']['all_task_ids_unique'] is True
          assert plan['partition_proof']['root_ranges_complete_and_disjoint_per_outgoing_set'] is True
          assert balance['task_cover_complete'] is True
          assert balance['task_assignment_disjoint'] is True
          PY
