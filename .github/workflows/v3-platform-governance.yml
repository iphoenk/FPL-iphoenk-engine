name: V3 Platform Governance Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-platform-governance:
    environment: v3-governance-auditor
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Mint isolated V3 governance auditor token
        id: governance_auditor_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.V3_GOVERNANCE_AUDITOR_APP_ID }}
          private-key: ${{ secrets.V3_GOVERNANCE_AUDITOR_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: FPL-iphoenk-engine
          permission-administration: write

      - name: Verify GitHub-native V3 platform controls
        env:
          GH_TOKEN: ${{ steps.governance_auditor_token.outputs.token }}
          V3_DEFAULT_BRANCH: main
          RUNTIME_BRANCH: runtime-data
          V3_REQUIRED_CHECK: verify
          V3_RUNTIME_PUBLISHER_APP_ID: ${{ vars.V3_RUNTIME_APP_ID }}
        run: python -m src.runtime_v3.platform_governance_audit
