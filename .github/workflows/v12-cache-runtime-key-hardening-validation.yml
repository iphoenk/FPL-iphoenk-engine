name: V12 cache runtime-key hardening validation

on:
  push:
    branches:
      - validation/v12-cache-runtime-key-hardening-20260925

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout validation head
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run cache correctness suite
        run: |
          pytest -q             tests/test_v12_cache_runtime_identity.py             tests/test_stage2_derived_cache.py             tests/test_lineup_distributional_optimizer.py::test_p17_exact_decision_core_cache_requires_full_fingerprint_match             tests/test_lineup_distributional_optimizer.py::test_p17_cache_observability_proves_hit_miss_write_and_numerical_invalidation             tests/test_monte_carlo_engine.py::test_mc_summary_cache_reuses_simulation_and_rebinds_occurrence
