name: V6 private auth diagnostic (read-only)
run-name: FPL private auth probe

on:
  workflow_dispatch:
    inputs:
      auth_attempt:
        description: "REUSE_ONLY reads saved token, never refreshes; CONTROLLED_ONCE may rotate; choose NORMAL otherwise."
        required: true
        type: choice
        default: NORMAL
        options:
          - NORMAL
          - CONTROLLED_ONCE
          - REUSE_ONLY
          - STORE_HEALTH
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: fpl-private-auth-probe
  cancel-in-progress: false

jobs:
  private-auth-probe:
    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        (
          (inputs.auth_attempt != 'CONTROLLED_ONCE' && inputs.auth_attempt != 'REUSE_ONLY' && inputs.auth_attempt != 'STORE_HEALTH') ||
          github.actor == github.repository_owner
        )
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 431 &&
        github.actor == github.repository_owner &&
        (
          github.event.comment.body == '/fpl-auth-probe' ||
          github.event.comment.body == '/fpl-auth-probe STORE_HEALTH' ||
          github.event.comment.body == '/fpl-auth-probe CONTROLLED_ONCE'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: v12-private-reports-publisher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-v6.lock
      - name: Install locked read-only client dependencies
        run: python -m pip install --require-hashes -r requirements-v6.lock
      - name: Checkout private rotating credential store (only when opted in)
        if: ${{ vars.FPL_AUTH_MODE == 'rotating_oidc' || (github.event_name == 'workflow_dispatch' && (inputs.auth_attempt == 'CONTROLLED_ONCE' || inputs.auth_attempt == 'REUSE_ONLY' || inputs.auth_attempt == 'STORE_HEALTH')) || (github.event_name == 'issue_comment' && (github.event.comment.body == '/fpl-auth-probe STORE_HEALTH' || github.event.comment.body == '/fpl-auth-probe CONTROLLED_ONCE')) }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: iphoenk/fpl-reports-private
          ref: main
          path: private-reports
          token: ${{ secrets.FPL_PRIVATE_REPORTS_TOKEN }}
          persist-credentials: true
      - name: Diagnose rotating store read-only (no OIDC grant)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.auth_attempt == 'STORE_HEALTH') || (github.event_name == 'issue_comment' && github.event.comment.body == '/fpl-auth-probe STORE_HEALTH') }}
        env:
          FPL_OIDC_STORE_KEY: ${{ secrets.FPL_OIDC_STORE_KEY }}
          FPL_OIDC_STORE_DIR: private-reports
        run: python -m src.runtime_v6.domains.report_plane.oidc_store_health
      - name: Independent worker REUSE_ONLY (no refresh calls or credential writes)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_attempt == 'REUSE_ONLY' }}
        env:
          FPL_OIDC_STORE_KEY: ${{ secrets.FPL_OIDC_STORE_KEY }}
          FPL_OIDC_STORE_DIR: private-reports
          FPL_TEAM_ID: ${{ vars.FPL_TEAM_ID }}
        run: python -m src.runtime_v6.domains.report_plane.oidc_reuse_probe
      - name: Probe /me then /my-team with safe HTTP-only output
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.auth_attempt == 'REUSE_ONLY' || inputs.auth_attempt == 'STORE_HEALTH')) && !(github.event_name == 'issue_comment' && github.event.comment.body == '/fpl-auth-probe STORE_HEALTH') }}
        env:
          FPL_AUTH_MODE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.auth_attempt == 'CONTROLLED_ONCE') || (github.event_name == 'issue_comment' && github.event.comment.body == '/fpl-auth-probe CONTROLLED_ONCE')) && 'rotating_oidc' || vars.FPL_AUTH_MODE || 'disabled' }}
          FPL_OIDC_OWNER_CONTROLLED_GRANT: ${{ ((github.event_name == 'workflow_dispatch' && inputs.auth_attempt == 'CONTROLLED_ONCE') || (github.event_name == 'issue_comment' && github.event.comment.body == '/fpl-auth-probe CONTROLLED_ONCE')) && 'true' || 'false' }}
          FPL_SESSION_B64: ${{ secrets.FPL_SESSION_B64 }}
          FPL_ACCESS_TOKEN: ${{ secrets.FPL_ACCESS_TOKEN }}
          FPL_OIDC_CLIENT_ID: ${{ vars.FPL_OIDC_CLIENT_ID }}
          FPL_OIDC_CONTRACT_VERIFIED: ${{ ((github.event_name == 'workflow_dispatch' && inputs.auth_attempt == 'CONTROLLED_ONCE') || (github.event_name == 'issue_comment' && github.event.comment.body == '/fpl-auth-probe CONTROLLED_ONCE')) && 'true' || vars.FPL_OIDC_CONTRACT_VERIFIED }}
          FPL_OIDC_STORE_KEY: ${{ secrets.FPL_OIDC_STORE_KEY }}
          FPL_OIDC_STORE_DIR: private-reports
          FPL_TEAM_ID: ${{ vars.FPL_TEAM_ID }}
        run: python -m src.runtime_v6.domains.report_plane.auth_probe
