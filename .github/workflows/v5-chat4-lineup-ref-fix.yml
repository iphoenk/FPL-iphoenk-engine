name: V5 Chat4 Lineup Ref Fix

on:
  push:
    branches:
      - codex/v5-chat4-current-lineup-parity
    paths:
      - .github/workflows/v5-chat4-lineup-ref-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v5-chat4-current-lineup-parity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Apply lineup metric reference fix
        run: python tools/v5_fix_lineup_metric_refs.py
      - name: Run focused regression and commit
        run: |
          python -m pytest -q tests/test_v5_v312_decision_parity.py tests/test_v5_current_lineup_parity_semantics.py
          git config user.name "iphoenk"
          git config user.email "103485057+iphoenk@users.noreply.github.com"
          git add src/v5/decision/lineup_optimizer.py
          git diff --cached --check
          git commit -m "fix(v5): repair lineup risk metric references"
          git push origin HEAD:codex/v5-chat4-current-lineup-parity
