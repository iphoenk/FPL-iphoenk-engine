name: FPL V6 CI contracts

on:
  pull_request:
    paths:
      - "config/v6/**"
      - "config/venues/**"
      - "src/runtime_v6/**"
      - "tests/test_data_ingestion_engine.py"
      - "tests/test_adaptive_polling.py"
      - "tests/test_weather_context.py"
      - "tests/test_data_platform_hardening.py"
      - "tests/test_data_platform_runtime_control.py"
      - "tests/test_data_platform_publish_integrity.py"
      - ".github/workflows/v6-ci.yml"
      - ".github/workflows/v6-hourly-data-ingestion.yml"
  push:
    branches: [main]
    paths:
      - "config/v6/**"
      - "config/venues/**"
      - "src/runtime_v6/**"
      - "tests/test_data_ingestion_engine.py"
      - "tests/test_adaptive_polling.py"
      - "tests/test_weather_context.py"
      - "tests/test_data_platform_hardening.py"
      - "tests/test_data_platform_runtime_control.py"
      - "tests/test_data_platform_publish_integrity.py"
      - ".github/workflows/v6-ci.yml"
      - ".github/workflows/v6-hourly-data-ingestion.yml"

permissions:
  contents: read

concurrency:
  group: fpl-v6-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Validate V6 contracts without network acquisition
        run: >-
          python -m pytest -q
          tests/test_data_ingestion_engine.py
          tests/test_adaptive_polling.py
          tests/test_weather_context.py
          tests/test_data_platform_hardening.py
          tests/test_data_platform_runtime_control.py
          tests/test_data_platform_publish_integrity.py
