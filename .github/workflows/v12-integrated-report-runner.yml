name: V12 integrated report runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scalar-evidence:
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout target PR head
        uses: actions/checkout@v4
        with:
          ref: ec0960bec30573e2585cf7076bc7bcc2611a5df6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install locked test dependencies
        run: python -m pip install --no-deps -r requirements-ci.lock

      - name: Fetch diagnostic harness
        run: |
          mkdir -p scripts
          curl -fsSL https://raw.githubusercontent.com/iphoenk/FPL-iphoenk-engine/d117cf35a04bdb8b50e5ca621f389cb7891eb016/scripts/p17_benchmark_diagnostics.py -o scripts/p17_benchmark_diagnostics.py
          sha256sum scripts/p17_benchmark_diagnostics.py

      - name: Capture full scalar repetition
        run: |
          mkdir -p scalar-capture
          git rev-parse HEAD | tee scalar-capture/target_sha.txt
          date -u +%Y-%m-%dT%H:%M:%SZ | tee scalar-capture/timestamp_utc.txt
          python scripts/p17_benchmark_diagnostics.py             --child-mode scalar             --route-count 2043             --output scalar-capture/scalar_2043_run_${{ matrix.repetition }}.json
          python - <<'PY'
          import json, pathlib, os, platform, subprocess
          root=pathlib.Path("scalar-capture")
          payload={
            "event":"workflow_dispatch",
            "workflow_ref":"audit/evidence-2026-09-23",
            "target_sha":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
            "runner_label":"ubuntu-latest",
            "python":platform.python_version(),
            "cpu_count":os.cpu_count(),
            "repetition":int("${{ matrix.repetition }}"),
          }
          (root/"capture_metadata.json").write_text(json.dumps(payload,indent=2)+"\n")
          PY

      - name: Upload scalar capture
        uses: actions/upload-artifact@v4
        with:
          name: audit-scalar-full-r${{ matrix.repetition }}-${{ github.run_id }}
          path: scalar-capture
          if-no-files-found: error
          retention-days: 14
