name: V4 temporary Understat perf attestation

on:
  push:
    branches:
      - codex/v4-understat-tactical-parity-20260902
    paths:
      - '.github/workflows/v4-understat-perf-attest-temp.yml'

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  attest-and-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/v4-understat-tactical-parity-20260902
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Build final-tree architecture attestation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v4-understat-perf-attest-temp.yml
          python tools/v4_architecture_guard_attest.py

      - name: Full regression and governed runtime preflight
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q
          python -m src.services.orchestrator daily --stats --deep-stats
          python -m src.engines.v4_quality_gate

      - name: Verify repeated FAST p95 without weakening SLO
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          import subprocess

          subprocess.run(['python','-m','src.services.hot_orchestrator','daily','--stats','--deep-stats'], check=True)
          setup=json.load(open('data/hot_orchestration_v4.json'))
          assert setup['status']=='PASS', setup
          assert setup['guardrails']['official_fpl_refreshed_this_run'] is True, setup
          assert setup['guardrails']['exact_optimizer_search_width_unchanged'] is True, setup

          runs=[]
          for index in range(5):
              subprocess.run(['python','-m','src.services.hot_orchestrator','daily','--stats','--deep-stats'], check=True)
              h=json.load(open('data/hot_orchestration_v4.json'))
              assert h['status']=='PASS', h
              assert h['guardrails']['official_fpl_refreshed_this_run'] is True, h
              assert h['guardrails']['exact_optimizer_search_width_unchanged'] is True, h
              assert (h.get('prediction_base_cache') or {}).get('hit') is True, h
              runs.append(float(h['serving_e2e_excluding_startup_assurance_ms']))

          ordered=sorted(runs)
          p95=ordered[max(0, min(len(ordered)-1, math.ceil(0.95*len(ordered))-1))]
          print(json.dumps({'measured_serving_ms': runs, 'p95_ms': p95, 'target_ms': 3000.0}))
          assert p95 <= 3000.0, {'p95_ms':p95,'target_ms':3000.0,'runs':runs}
          PY

      - name: Commit regenerated attestation and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/architecture_guard_attestation.json .github/workflows/v4-understat-perf-attest-temp.yml
          git diff --cached --quiet && { echo '::error::Expected attestation/cleanup changes'; exit 1; }
          git commit -m 'chore(v4): refresh architecture attestation after Understat perf hardening'
          git push origin HEAD:codex/v4-understat-tactical-parity-20260902
