name: FPL iphoenk V4.9.1 prediction and service gate

on:
  workflow_dispatch:
  schedule:
    # 04:30, 12:30 and 21:30 Asia/Jakarta (UTC+7).
    - cron: "30 21 * * *"
    - cron: "30 5 * * *"
    - cron: "30 14 * * *"
  push:
    branches:
      - v4-prediction-engine
    paths-ignore:
      - 'data/**'
  pull_request:
    branches:
      - v4-prediction-engine


permissions:
  contents: write

concurrency:
  group: fpl-iphoenk-v4-gate
  cancel-in-progress: true

jobs:
  validate-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'schedule' && 'v4-prediction-engine' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install cached dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Unit and acceptance tests
        run: python -m pytest -q
      - name: Run process-isolated V4 services
        run: python -m src.services.orchestrator daily --stats --deep-stats
      - name: Centralized V4.9.1 service quality gate
        run: python -m src.engines.v4_quality_gate
      - name: Concise acceptance summary
        run: |
          python - <<'PY'
          import json
          h=json.load(open('data/framework_health_v4.json'))
          w=json.load(open('data/wc_decision_v4.json'))
          latest=json.load(open('data/latest.json'))
          pipeline=json.load(open('data/decision_pipeline_v4.json'))
          checkpoint=json.load(open('data/checkpoint_decision_v4.json'))
          orchestration=json.load(open('data/service_orchestration_v4.json'))
          print({
              'pipeline_health': h['pipeline_health'],
              'prediction_health': h['prediction_health'],
              'capability_health': h['capability_health'],
              'decision_engine': h['decision_engine'],
              'capability_coverage': h['capability_coverage'],
              'recommendation_allowed': h['recommendation_allowed'],
              'go_allowed': h['go_allowed'],
              'gate0': h['gate0']['counts'],
              'budget_tenths': w['budget_tenths'],
              'price_basis': w['affordability']['price_basis'],
              'refresh_ms': latest.get('performance', {}).get('engine_before_snapshot_write_ms'),
              'preflight_ms': json.load(open('data/framework_health_preflight_v4.json')).get('performance_ms'),
              'decision_pipeline_ms': pipeline.get('timings', {}).get('total_pipeline_ms'),
              'postflight_ms': h.get('performance_ms'),
              'checkpoint': checkpoint['checkpoint_context']['policy_id'],
              'action': checkpoint['action_state'],
              'headline': checkpoint['headline'],
              'services': orchestration['summary']['services_passed'],
              'orchestration_ms': orchestration['duration_ms'],
          })
          PY
      - name: Upload branch data only
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "fpl-iphoenk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "data(v4): prediction acceptance snapshot"
          git fetch origin v4-prediction-engine
          git rebase origin/v4-prediction-engine
          git push origin HEAD:v4-prediction-engine
