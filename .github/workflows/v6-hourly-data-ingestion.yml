name: FPL V6 hourly data ingestion

on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"

permissions:
  contents: write

concurrency:
  group: fpl-v6-hourly-data-ingestion
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNTIME_BRANCH: runtime-data-v6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Validate V6 contract
        run: python -m pytest -q tests/test_data_ingestion_engine.py

      - name: Pull all V6 sources
        run: python -m src.runtime_v6.collector

      - name: Upload immutable run artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v6-data-${{ github.run_id }}
          path: |
            data/v6/manifest.json
            data/v6/current/*.json
          retention-days: 14
          if-no-files-found: error

      - name: Publish latest snapshots to runtime-data-v6
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${RUNTIME_BRANCH}"
          rm -rf /tmp/v6-runtime
          git worktree add /tmp/v6-runtime "origin/${RUNTIME_BRANCH}"
          mkdir -p /tmp/v6-runtime/data/v6/current
          cp data/v6/manifest.json /tmp/v6-runtime/data/v6/manifest.json
          cp data/v6/current/*.json /tmp/v6-runtime/data/v6/current/
          cd /tmp/v6-runtime
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v6
          if git diff --cached --quiet; then
            echo "No V6 snapshot change"
            exit 0
          fi
          git commit -m "data(v6): hourly source refresh ${{ github.run_id }}"
          git push origin HEAD:"${RUNTIME_BRANCH}"
