services:
  ingestion:
    build: {context: ../.., dockerfile: deploy/v5/Dockerfile}
    environment:
      V5_SERVICE_ID: ingestion
      V5_SERVICE_PORT: 8101
      FPL_TEAM_ID: ${FPL_TEAM_ID:-}
      FPL_AUTH_MODE: ${FPL_AUTH_MODE:-disabled}
      FPL_SESSION_B64: ${FPL_SESSION_B64:-}
      FPL_ACCESS_TOKEN: ${FPL_ACCESS_TOKEN:-}
      FPL_REFRESH_TOKEN: ${FPL_REFRESH_TOKEN:-}
      FPL_OIDC_TOKEN_URL: ${FPL_OIDC_TOKEN_URL:-}
      FPL_OIDC_CLIENT_ID: ${FPL_OIDC_CLIENT_ID:-}
      FPL_OIDC_CLIENT_SECRET: ${FPL_OIDC_CLIENT_SECRET:-}
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:-}
    ports: ["8101:8101"]
    volumes: ["../../data/v5:/app/data/v5"]
    healthcheck: &health
      test: ["CMD", "python", "-c", "import os,requests; p=os.environ['V5_SERVICE_PORT']; requests.get(f'http://127.0.0.1:{p}/health', timeout=2).raise_for_status()"]
      interval: 10s
      timeout: 3s
      retries: 5
  truth:
    build: {context: ../.., dockerfile: deploy/v5/Dockerfile}
    environment: {V5_SERVICE_ID: truth, V5_SERVICE_PORT: 8102, FPL_TEAM_ID: "${FPL_TEAM_ID:-}"}
    ports: ["8102:8102"]
    depends_on: {ingestion: {condition: service_healthy}}
    healthcheck: *health
  price:
    build: {context: ../.., dockerfile: deploy/v5/Dockerfile}
    environment: {V5_SERVICE_ID: price, V5_SERVICE_PORT: 8103}
    ports: ["8103:8103"]
    depends_on: {truth: {condition: service_healthy}}
    healthcheck: *health
  prediction:
    build: {context: ../.., dockerfile: deploy/v5/Dockerfile}
    environment: {V5_SERVICE_ID: prediction, V5_SERVICE_PORT: 8104}
    ports: ["8104:8104"]
    depends_on: {truth: {condition: service_healthy}}
    healthcheck: *health
  decision:
    build: {context: ../.., dockerfile: deploy/v5/Dockerfile}
    environment: {V5_SERVICE_ID: decision, V5_SERVICE_PORT: 8105}
    ports: ["8105:8105"]
    depends_on: {price: {condition: service_healthy}, prediction: {condition: service_healthy}}
    healthcheck: *health
  snapshot:
    build: {context: ../.., dockerfile: deploy/v5/Dockerfile}
    environment: {V5_SERVICE_ID: snapshot, V5_SERVICE_PORT: 8106}
    ports: ["8106:8106"]
    volumes: ["../../data/v5:/app/data/v5"]
    healthcheck: *health
  evaluation:
    build: {context: ../.., dockerfile: deploy/v5/Dockerfile}
    environment: {V5_SERVICE_ID: evaluation, V5_SERVICE_PORT: 8107}
    ports: ["8107:8107"]
    depends_on: {prediction: {condition: service_healthy}, snapshot: {condition: service_healthy}}
    healthcheck: *health
  governance:
    build: {context: ../.., dockerfile: deploy/v5/Dockerfile}
    environment: {V5_SERVICE_ID: governance, V5_SERVICE_PORT: 8108}
    ports: ["8108:8108"]
    depends_on: {truth: {condition: service_healthy}, price: {condition: service_healthy}, prediction: {condition: service_healthy}, evaluation: {condition: service_healthy}, decision: {condition: service_healthy}}
    healthcheck: *health
  reporting:
    build: {context: ../.., dockerfile: deploy/v5/Dockerfile}
    environment: {V5_SERVICE_ID: reporting, V5_SERVICE_PORT: 8109}
    ports: ["8109:8109"]
    depends_on: {truth: {condition: service_healthy}, price: {condition: service_healthy}, prediction: {condition: service_healthy}, decision: {condition: service_healthy}, governance: {condition: service_healthy}, watchlist: {condition: service_healthy}}
    healthcheck: *health
  watchlist:
    build: {context: ../.., dockerfile: deploy/v5/Dockerfile}
    environment: {V5_SERVICE_ID: watchlist, V5_SERVICE_PORT: 8110}
    ports: ["8110:8110"]
    depends_on: {truth: {condition: service_healthy}, price: {condition: service_healthy}, prediction: {condition: service_healthy}, decision: {condition: service_healthy}}
    healthcheck: *health
  orchestrator:
    build: {context: ../.., dockerfile: deploy/v5/Dockerfile}
    environment:
      V5_SERVICE_ID: orchestrator
      V5_SERVICE_PORT: 8100
      FPL_TEAM_ID: ${FPL_TEAM_ID:-}
      V5_INTERNAL_WIRE_PROFILE: ${V5_INTERNAL_WIRE_PROFILE:-advanced_binary}
      V5_SERVICE_INGESTION_URL: http://ingestion:8101
      V5_SERVICE_TRUTH_URL: http://truth:8102
      V5_SERVICE_PRICE_URL: http://price:8103
      V5_SERVICE_PREDICTION_URL: http://prediction:8104
      V5_SERVICE_DECISION_URL: http://decision:8105
      V5_SERVICE_SNAPSHOT_URL: http://snapshot:8106
      V5_SERVICE_EVALUATION_URL: http://evaluation:8107
      V5_SERVICE_GOVERNANCE_URL: http://governance:8108
      V5_SERVICE_REPORTING_URL: http://reporting:8109
      V5_SERVICE_WATCHLIST_URL: http://watchlist:8110
    ports: ["8100:8100"]
    depends_on: {ingestion: {condition: service_healthy}, truth: {condition: service_healthy}, price: {condition: service_healthy}, prediction: {condition: service_healthy}, decision: {condition: service_healthy}, snapshot: {condition: service_healthy}, evaluation: {condition: service_healthy}, governance: {condition: service_healthy}, watchlist: {condition: service_healthy}, reporting: {condition: service_healthy}}
    healthcheck: *health
