name: FPL iphoenk collector v3.9

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  schedule:
    - cron: "55 * * * *"
    - cron: "15 * * * *"

permissions:
  contents: read

concurrency:
  group: fpl-iphoenk-${{ github.event_name == 'pull_request' && github.head_ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUNTIME_BRANCH: runtime-data
  FPL_TEAM_ID: "3462711"

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      should_collect: ${{ steps.cadence.outputs.should_collect }}
      reason: ${{ steps.cadence.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide collector cadence
        id: cadence
        env:
          PYTHONPATH: ${{ github.workspace }}
          FPL_SCHEDULE_EXPR: ${{ github.event.schedule }}
        run: python -m src.engines.collector_gate

  test:
    needs: gate
    if: github.event_name == 'pull_request' || needs.gate.outputs.should_collect == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile runtime modules
        run: python -m compileall -q src live_service.py fpl_daily_tasks.py
      - name: Reliability, rules registry, Official expansion, auth, Price Radar and framework tests
        run: python -m pytest -q

  collect:
    if: github.event_name != 'pull_request' && needs.gate.outputs.should_collect == 'true'
    needs: [gate, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Collector mode
        run: echo "Collector gate=${{ needs.gate.outputs.reason }} runtime_branch=${RUNTIME_BRANCH}"
      - name: Hydrate persisted state from runtime bridge
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$RUNTIME_BRANCH"
          for file in price_cache.json price_trajectory.json rules_source_state.json; do
            if git cat-file -e "origin/${RUNTIME_BRANCH}:data/${file}" 2>/dev/null; then
              git show "origin/${RUNTIME_BRANCH}:data/${file}" > "data/${file}"
              echo "Hydrated data/${file} from ${RUNTIME_BRANCH}"
            else
              echo "No prior data/${file}; starting clean"
            fi
          done
      - name: Generate public Official FPL snapshot
        run: |
          python -m src.engine daily --stats
          python -m src.reliability_overlay
          python -m src.engines.price_radar
          python -m src.engines.official_expansion
      - name: Optional authenticated Official read-only overlay
        env:
          FPL_AUTH_MODE: ${{ secrets.FPL_AUTH_MODE }}
          FPL_SESSION_B64: ${{ secrets.FPL_SESSION_B64 }}
          FPL_ACCESS_TOKEN: ${{ secrets.FPL_ACCESS_TOKEN }}
          FPL_REFRESH_TOKEN: ${{ secrets.FPL_REFRESH_TOKEN }}
          FPL_OIDC_TOKEN_URL: ${{ secrets.FPL_OIDC_TOKEN_URL }}
          FPL_OIDC_CLIENT_ID: ${{ secrets.FPL_OIDC_CLIENT_ID }}
          FPL_OIDC_CLIENT_SECRET: ${{ secrets.FPL_OIDC_CLIENT_SECRET }}
        run: python -m src.engines.authenticated_official
      - name: Official FPL Rules Registry integrity audit
        run: python -m src.engines.rules_compliance_audit
      - name: Framework health PRE-FLIGHT
        run: |
          python -m src.engines.framework_health_audit --phase preflight --strict
          cp data/framework_health_preflight.json data/framework_health.json
      - name: Validate generated snapshot, rules registry and framework contract
        run: |
          python - <<'PY'
          import json
          from src.engines.reliability import validate_snapshot
          from src.rules import RULESET_ID, active_ruleset_fingerprint
          from src.version import ENGINE_VERSION, SCHEMA_VERSION
          s=json.load(open('data/latest.json'))
          p=json.load(open('data/prices.json'))
          c=json.load(open('data/chips.json'))
          d=json.load(open('data/official_detail.json'))
          a=json.load(open('data/auth.json'))
          t=json.load(open('data/price_trajectory.json'))
          pa=json.load(open('data/price_alerts.json'))
          rr=json.load(open('data/rules_compliance.json'))
          fh=json.load(open('data/framework_health.json'))
          assert s['engine_version'] == ENGINE_VERSION
          assert s['schema_version'] == SCHEMA_VERSION
          assert s.get('snapshot_id')
          assert s.get('native',{}).get('entry')
          assert s.get('provenance',{}).get('entry',{}).get('source') == 'official_fpl'
          assert s.get('ruleset',{}).get('id') == RULESET_ID
          assert s.get('ruleset',{}).get('fingerprint_sha256') == active_ruleset_fingerprint()
          assert (s.get('ruleset',{}).get('goal_points',{}).get('1') == 10 or s.get('ruleset',{}).get('goal_points',{}).get(1) == 10)
          assert s.get('chip_ledger',{}).get('ruleset_id') == RULESET_ID
          assert c.get('ruleset_id') == RULESET_ID
          assert rr.get('overall') == 'PASS', rr
          assert rr.get('ruleset_id') == RULESET_ID
          assert rr.get('registry_integrity',{}).get('status') == 'PASS'
          assert rr.get('ruleset_fingerprint_sha256') == active_ruleset_fingerprint()
          assert rr.get('governance',{}).get('remote_change_never_auto_mutates_rules') is True
          assert s.get('price_summary',{}).get('filter_policy',{}).get('min_ownership_pct') == 0.5
          assert all(x.get('ownership_pct',0) >= 0.5 and abs(x.get('net_transfers',0)) >= 5000 for x in p.get('top_buy_pressure',[]))
          assert all(x.get('ownership_pct',0) >= 0.5 and abs(x.get('net_transfers',0)) >= 5000 for x in p.get('top_sell_pressure',[]))
          assert p.get('official_price_predictor_health',{}).get('status') == 'LIVE'
          assert p.get('players')
          assert any(x.get('official_progress_pct') is not None for x in p.get('players',[]))
          assert s.get('price_summary',{}).get('trajectory_features',{}).get('predicted_change_date') is True
          assert s.get('price_summary',{}).get('trajectory_features',{}).get('acceleration_deceleration') is True
          assert t.get('players')
          assert pa.get('policy',{}).get('watch_capacity') == 50
          assert s.get('files',{}).get('price_trajectory') == 'data/price_trajectory.json'
          assert s.get('files',{}).get('price_alerts') == 'data/price_alerts.json'
          ods=s.get('official_detail_summary',{})
          assert ods.get('detail_requested',0) >= 15
          assert d.get('owned_element_ids')
          assert d.get('official_health',{}).get('element_summary',{}).get('requested',0) >= 15
          assert 'fixture_stats' in d and 'event_live_rich' in d and 'dream_team' in d
          auth=s.get('authenticated_official',{})
          assert auth == a
          assert auth.get('state') in {'DISABLED','MISCONFIGURED','VALID','EXPIRED_OR_REJECTED','UNAVAILABLE','ENTRY_MISMATCH','PARTIAL','PARTIAL_AUTH_REJECTED','POLICY_BLOCKED'}
          assert auth.get('raw_authenticated_payload_persisted') is False
          assert auth.get('policy',{}).get('resource_methods') == ['GET']
          assert fh.get('framework_schema') >= 2
          assert fh.get('registry_integrity') is True
          assert fh.get('rules_registry',{}).get('status') == 'PASS'
          assert fh.get('gate0',{}).get('ruleset_id') == RULESET_ID
          assert fh.get('gate0',{}).get('counts',{}).get('FAIL',0) == 0
          assert fh.get('dss_core',{}).get('declared') == 50
          assert fh.get('dss_extensions',{}).get('declared') == 16
          assert fh.get('enhancements',{}).get('declared') == 8
          assert fh.get('governance',{}).get('file_exists_is_not_sufficient_for_active') is True
          assert fh.get('governance',{}).get('rules_registry_precedes_gate0') is True
          assert fh.get('governance',{}).get('gate0_consumes_active_ruleset') is True
          assert fh.get('governance',{}).get('gate0_fail_blocks_go') is True
          assert fh.get('overall') in {'GREEN','AMBER'}
          r=validate_snapshot(s)
          print(r)
          if not r['ok']: raise SystemExit(2)
          PY
      - name: Stamp runtime publication metadata
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          p='data/latest.json'
          s=json.load(open(p))
          s['runtime_publish']={
              'branch': os.environ.get('RUNTIME_BRANCH','runtime-data'),
              'source_commit': os.environ.get('GITHUB_SHA'),
              'published_at': datetime.now(timezone.utc).isoformat(),
          }
          with open(p,'w') as f: json.dump(s,f,indent=2,ensure_ascii=False)
          PY
      - name: Publish validated bridge to isolated runtime worktree
        shell: bash
        run: |
          set -euo pipefail

          runtime_tmp="$(mktemp -d)"
          publish_tree="$(mktemp -d)"
          trap 'git worktree remove --force "$publish_tree" >/dev/null 2>&1 || true; rm -rf "$runtime_tmp" "$publish_tree"' EXIT
          cp -a data/. "$runtime_tmp/"

          git config user.name "fpl-iphoenk-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin "$RUNTIME_BRANCH"
          if ! git show-ref --verify --quiet "refs/remotes/origin/$RUNTIME_BRANCH"; then
            echo "ERROR: runtime branch $RUNTIME_BRANCH does not exist"
            exit 2
          fi

          git worktree add --detach "$publish_tree" "origin/$RUNTIME_BRANCH"
          cd "$publish_tree"

          for attempt in 1 2 3; do
            git fetch origin "$RUNTIME_BRANCH"
            git reset --hard "origin/$RUNTIME_BRANCH"
            rm -rf data
            mkdir -p data
            cp -a "$runtime_tmp/." data/
            git add data/

            if git diff --cached --quiet; then
              echo "No runtime data changes"
              exit 0
            fi

            git commit -m "data: refresh FPL runtime snapshot [skip ci]"
            if git push origin HEAD:"$RUNTIME_BRANCH"; then
              echo "Runtime bridge published successfully"
              exit 0
            fi

            echo "Runtime publish race detected, retrying attempt $((attempt + 1))/3"
            sleep $((attempt * 2))
          done

          echo "ERROR: failed to publish runtime bridge after 3 attempts"
          exit 3
