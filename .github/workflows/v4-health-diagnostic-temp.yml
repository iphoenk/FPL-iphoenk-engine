name: V4 temporary health diagnostic

on:
  push:
    branches:
      - codex/v4-understat-tactical-parity-20260902
    paths:
      - '.github/workflows/v4-health-diagnostic-temp.yml'

permissions:
  contents: read

env:
  RUNTIME_BRANCH: runtime-data-v4

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/v4-understat-tactical-parity-20260902
          fetch-depth: 0
      - name: Hydrate latest governed V4 runtime state
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "+refs/heads/${RUNTIME_BRANCH}:refs/remotes/origin/${RUNTIME_BRANCH}"
          git archive "origin/${RUNTIME_BRANCH}" data | tar -x -C "$GITHUB_WORKSPACE"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Reproduce postflight health and emit exact blockers
        shell: bash
        run: |
          set -euo pipefail
          python -m src.services.orchestrator daily --stats --deep-stats
          python - <<'PY'
          import json
          from pathlib import Path
          health=json.loads(Path('data/framework_health_v4.json').read_text())
          lineup=json.loads(Path('data/lineup_decision_v4.json').read_text())
          print('V4_LINEUP_GUARDRAILS='+json.dumps(lineup.get('guardrails') or {}, sort_keys=True))
          print('V4_LINEUP_META='+json.dumps({
              'formation':lineup.get('formation'),
              'xi_count':len(lineup.get('starting_xi') or []),
              'bench_count':len(lineup.get('bench') or []),
              'captain':lineup.get('captain'),
              'vice_captain':lineup.get('vice_captain'),
          }, sort_keys=True))
          print('V4_HEALTH_DIAGNOSTIC='+json.dumps({
              'overall':health.get('overall'),
              'pipeline_health':health.get('pipeline_health'),
              'prediction_health':health.get('prediction_health'),
              'capability_health':health.get('capability_health'),
              'decision_engine':health.get('decision_engine'),
              'go_allowed':health.get('go_allowed'),
              'critical_failed':health.get('critical_failed'),
              'critical_partial':health.get('critical_partial'),
              'critical_warmup':health.get('critical_warmup'),
              'capability_coverage':health.get('capability_coverage'),
          }, sort_keys=True))
          raise SystemExit('TEMP_HEALTH_DIAGNOSTIC_FAIL_CLOSED')
          PY
