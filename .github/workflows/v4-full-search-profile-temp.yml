name: V4 temporary full search profiler

on:
  push:
    branches:
      - codex/v4-full-universe-tactical-20260903
    paths:
      - .github/workflows/v4-full-search-profile-temp.yml
      - tools/v4_full_search_profile_temp.py
      - tools/v4_exact_lazy_utility_patch_temp.py
      - tools/v4_exact_hotpath_patch_temp.py

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install --disable-pip-version-check -r requirements.txt
      - name: Apply lazy exact utility candidate patch
        run: python tools/v4_exact_lazy_utility_patch_temp.py
      - name: Apply exact hotpath candidate patch
        run: python tools/v4_exact_hotpath_patch_temp.py
      - name: Profile exact production-sized package search for 25 seconds
        shell: bash
        run: |
          set +e
          python tools/v4_full_search_profile_temp.py
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            exit "$code"
          fi
