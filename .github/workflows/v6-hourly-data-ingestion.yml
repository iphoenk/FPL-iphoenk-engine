name: FPL V6 hourly fresh-data acquisition

on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"
  push:
    branches: [main]
    paths:
      - "config/v6/**"
      - "src/runtime_v6/**"
      - "tests/test_data_ingestion_engine.py"
      - ".github/workflows/v6-hourly-data-ingestion.yml"

permissions:
  contents: write

concurrency:
  group: fpl-v6-hourly-data-ingestion
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUNTIME_BRANCH: runtime-data-v6
      SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Validate V6 data-only contract
        run: python -m pytest -q tests/test_data_ingestion_engine.py
      - name: Pull all 27 V6 sources
        run: python -m src.runtime_v6.collector
      - name: Show V6 manifest
        run: python -m json.tool data/v6/manifest.json
      - name: Upload immutable acquisition artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v6-data-${{ github.run_id }}
          path: data/v6/
          retention-days: 14
          if-no-files-found: error
      - name: Publish latest V6 database snapshot
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${RUNTIME_BRANCH}"
          rm -rf /tmp/v6-runtime
          git worktree add /tmp/v6-runtime "origin/${RUNTIME_BRANCH}"
          rm -rf /tmp/v6-runtime/data/v6
          mkdir -p /tmp/v6-runtime/data
          cp -R data/v6 /tmp/v6-runtime/data/v6
          cd /tmp/v6-runtime
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v6
          if git diff --cached --quiet; then
            echo "No V6 snapshot change"
            exit 0
          fi
          git commit -m "data(v6): hourly 27-source refresh ${{ github.run_id }}"
          git push origin HEAD:"${RUNTIME_BRANCH}"
