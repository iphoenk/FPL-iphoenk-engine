name: V4 parallel objective attestation temp

on:
  push:
    branches: [codex/v4-full-universe-tactical-20260903]
    paths:
      - .github/workflows/v4-parallel-objective-attestation-temp.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/v4-full-universe-tactical-20260903
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install --disable-pip-version-check -r requirements.txt
      - name: Rebuild governed architecture attestation
        run: python tools/v4_architecture_guard_attest.py
      - name: Commit attestation only
        run: |
          git config user.name 'fpl-iphoenk-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add config/architecture_guard_attestation.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore(v4): attest exact parallel objective DP architecture'
          git push origin HEAD:codex/v4-full-universe-tactical-20260903
