name: P1.7 FT shadow exactness diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: audit/p17-ft-shadow-exactness-diagnostic-20260924
          path: app

      - name: Checkout frozen runtime snapshot
        uses: actions/checkout@v4
        with:
          ref: 9fc2ce5e590518c399765e6fd576bb96db6e5897
          path: runtime-data

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run FT shadow exactness diagnostic
        working-directory: app
        run: |
          python scripts/audit_p17_ft_shadow_exactness.py \
            --runtime-root ../runtime-data \
            --slot 2026-09-24T14:20:00+07:00 \
            --output artifacts/p17-ft-shadow/diagnostic.json

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: p17-ft-shadow-diagnostic-${{ github.run_id }}
          path: app/artifacts/p17-ft-shadow/diagnostic.json
          retention-days: 14
