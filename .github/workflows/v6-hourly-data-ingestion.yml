name: FPL V6 hourly fresh-data acquisition

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
  push:
    branches: [main]
    paths:
      - "config/v6/**"
      - "src/runtime_v6/**"
      - "tests/test_data_ingestion_engine.py"
      - "tests/test_adaptive_polling.py"
      - "tests/test_weather_context.py"
      - ".github/workflows/v6-hourly-data-ingestion.yml"

permissions:
  contents: write

concurrency:
  group: fpl-v6-hourly-data-ingestion
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNTIME_BRANCH: runtime-data-v6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Hydrate previous V6 last-good snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf data/v6
          mkdir -p data
          if git fetch origin "${RUNTIME_BRANCH}"; then
            if git cat-file -e "origin/${RUNTIME_BRANCH}:data/v6" 2>/dev/null; then
              git archive "origin/${RUNTIME_BRANCH}" data/v6 | tar -x -C .
              echo "Hydrated previous runtime-data-v6 snapshot"
            else
              echo "runtime-data-v6 exists without data/v6; starting clean"
            fi
          else
            echo "runtime-data-v6 not available yet; starting clean"
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Validate V6 data-only and active-source contracts
        run: python -m pytest -q tests/test_data_ingestion_engine.py tests/test_adaptive_polling.py tests/test_weather_context.py

      - name: Run active V6 acquisition cycle
        run: python -m src.runtime_v6.collector

      - name: Validate publishable V6 manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from src.runtime_v6.registry import load_registry

          manifest = json.loads(Path("data/v6/manifest.json").read_text())
          registry = load_registry()
          expected_active = registry["activation"]["active_source_count"]
          assert manifest["source_count"] == expected_active
          assert manifest["governance"]["data_only"] is True
          assert manifest["governance"]["decision_authority"] == "NONE"
          assert manifest["governance"]["weather_direct_xpts_multiplier"] is False
          print(json.dumps({
              "overall": manifest["overall"],
              "elapsed_ms": manifest["elapsed_ms"],
              "source_count": manifest["source_count"],
              "health_counts": manifest["health_counts"],
              "critical_failures": manifest["critical_failures"],
              "activation": manifest["activation"],
          }, indent=2))
          PY

      - name: Upload immutable acquisition artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v6-data-${{ github.run_id }}
          path: data/v6/
          retention-days: 14
          if-no-files-found: error

      - name: Publish latest V6 database snapshot
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${RUNTIME_BRANCH}"
          rm -rf /tmp/v6-runtime
          git worktree add /tmp/v6-runtime "origin/${RUNTIME_BRANCH}"
          rm -rf /tmp/v6-runtime/data/v6
          mkdir -p /tmp/v6-runtime/data
          cp -R data/v6 /tmp/v6-runtime/data/v6
          cd /tmp/v6-runtime
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/v6 is intentionally ignored on code branches. Runtime snapshots
          # live only on runtime-data-v6, so force-add that isolated write-set.
          git add -f data/v6
          if git diff --cached --quiet; then
            echo "No V6 snapshot change"
            exit 0
          fi
          git commit -m "data(v6): hourly active-source refresh ${{ github.run_id }}"
          git push origin HEAD:"${RUNTIME_BRANCH}"
