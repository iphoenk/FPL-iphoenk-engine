name: FPL V4 reusable production core

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      publish:
        required: true
        type: boolean

permissions:
  contents: write

env:
  RUNTIME_BRANCH: runtime-data-v4

jobs:
  validate-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Hydrate latest V4 runtime state
        if: inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$RUNTIME_BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "+refs/heads/${RUNTIME_BRANCH}:refs/remotes/origin/${RUNTIME_BRANCH}"
            if git cat-file -e "origin/${RUNTIME_BRANCH}:data" 2>/dev/null; then
              git archive "origin/${RUNTIME_BRANCH}" data | tar -x -C "$GITHUB_WORKSPACE"
              echo "Hydrated runtime state from ${RUNTIME_BRANCH}"
            fi
          else
            echo "No ${RUNTIME_BRANCH} branch yet; using canonical seed data"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install cached dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Unit and acceptance tests
        id: deterministic_tests
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short 2>&1 | tee pytest-diagnostic.txt
          test_exit=${PIPESTATUS[0]}
          set -e
          exit "$test_exit"

      - name: Upload deterministic failure diagnostics
        if: failure() && steps.deterministic_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: pytest-diagnostic.txt
          if-no-files-found: error
          retention-days: 7

      - name: Run process-isolated DAG-parallel V4 services
        run: python -m src.services.orchestrator daily --stats --deep-stats

      - name: Centralized V4 core quality gate
        run: python -m src.engines.v4_quality_gate

      - name: Core acceptance summary
        run: |
          python - <<'PY'
          import json
          h=json.load(open('data/framework_health_v4.json'))
          o=json.load(open('data/service_orchestration_v4.json'))
          a=json.load(open('data/architecture_ownership_v4.json'))
          c=json.load(open('data/checkpoint_decision_v4.json'))
          print({'pipeline_health':h['pipeline_health'],'capability_coverage':h['capability_coverage'],'gate0':h['gate0']['counts'],'services':o['summary']['services_passed'],'orchestration_ms':o['duration_ms'],'architecture_guard':a['status'],'action':c['action_state']})
          PY

      - name: Publish core branch data
        if: inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          publish_tree="$RUNNER_TEMP/v4-runtime-core"
          rm -rf "$publish_tree"
          git config user.name "fpl-iphoenk-bot"
          git config user.email "actions@users.noreply.github.com"
          git worktree add --detach "$publish_tree" HEAD
          cd "$publish_tree"
          git checkout --orphan runtime-snapshot
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$GITHUB_WORKSPACE/data" ./data
          git add -f data/
          git commit -m "data(v4): prediction acceptance snapshot [skip ci]"
          git push --force origin HEAD:"$RUNTIME_BRANCH"

      - name: Advanced enrichment ablation post-publish diagnostic gate
        run: |
          python -m src.engines.v4_advanced_ablation
          python - <<'PY'
          import json
          a=json.load(open('data/advanced_ablation_v4.json'))
          assert a['status']=='PASS', a
          assert a['ablation']['full_shadow_parity']['ok'] is True, a
          assert a['interpretation']['impact_is_diagnostic_not_health_threshold'] is True, a
          PY

      - name: Publish ablation diagnostic data
        if: inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          publish_tree="$RUNNER_TEMP/v4-runtime-ablation"
          rm -rf "$publish_tree"
          git config user.name "fpl-iphoenk-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch --depth=1 origin "+refs/heads/${RUNTIME_BRANCH}:refs/remotes/origin/${RUNTIME_BRANCH}"
          git worktree add --detach "$publish_tree" "origin/${RUNTIME_BRANCH}"
          mkdir -p "$publish_tree/data"
          cp "$GITHUB_WORKSPACE/data/advanced_ablation_v4.json" "$publish_tree/data/advanced_ablation_v4.json"
          cd "$publish_tree"
          git add data/advanced_ablation_v4.json
          if git diff --cached --quiet; then echo "No ablation data changes"; exit 0; fi
          git commit -m "data(v4): advanced ablation diagnostic [skip ci]"
          git push origin HEAD:"$RUNTIME_BRANCH"

      - name: Verify published V4 runtime snapshot
        if: inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "+refs/heads/${RUNTIME_BRANCH}:refs/remotes/origin/${RUNTIME_BRANCH}"
          git cat-file -e "origin/${RUNTIME_BRANCH}:data/framework_health_v4.json"
          git cat-file -e "origin/${RUNTIME_BRANCH}:data/latest.json"
          git cat-file -e "origin/${RUNTIME_BRANCH}:data/advanced_ablation_v4.json"
          echo "Published V4 runtime snapshot to ${RUNTIME_BRANCH}"
