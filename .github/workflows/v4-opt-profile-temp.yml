name: V4 temporary exact-search scale probe
on:
  push:
    branches:
      - codex/v4-full-universe-tactical-20260903
    paths:
      - .github/workflows/v4-opt-profile-temp.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/v4-full-universe-tactical-20260903
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check -r requirements.txt
      - name: Measure governed incoming universe and repeated pattern work
        run: |
          python - <<'PY'
          from collections import Counter
          from itertools import combinations
          from math import comb
          from src.engines.v4_decision_pipeline import effective_planning_squad, UNDERSTAT_FILE
          from src.engines.v4_wc_optimizer import build_candidates, reconcile_owned_costs
          from src.engines.v4_tactical_interaction import build_tactical_interactions
          from src.engines.v4_full_universe_package_search import safe_prune_incoming_players
          from src.utils import DATA, CONFIG, read_json

          predictions = read_json(DATA / 'predictions_v4.json', {})
          universe = read_json(DATA / 'universe.json', {})
          prices = read_json(DATA / 'prices.json', {})
          team = read_json(DATA / 'team.json', {})
          latest = read_json(DATA / 'latest.json', {})
          configured = read_json(CONFIG / 'locked_squad.json', {})
          understat = read_json(UNDERSTAT_FILE, {})
          locked = effective_planning_squad(team, configured, latest)
          candidates = build_candidates(predictions, universe)
          reconciled, affordability = reconcile_owned_costs(candidates, locked)
          owned = {int(r['element']) for r in locked.get('players') or []}
          interactions = build_tactical_interactions(predictions, universe, understat)
          pruned, proofs = safe_prune_incoming_players(
              reconciled, owned,
              interactions=interactions, prices=prices,
              predictions=predictions, universe=universe,
          )
          pools = Counter(p.position for p in pruned)
          by_id = {p.element:p for p in reconciled}
          current = [by_id[e] for e in sorted(owned)]
          patterns = Counter()
          for k in (1,2,3):
              for outs in combinations(current, k):
                  pattern = tuple(sorted(Counter(p.position for p in outs).items()))
                  patterns[(k,pattern)] += 1
          print('CANDIDATES', len(candidates))
          print('RECONCILED', len(reconciled))
          print('SAFE_PRUNED', len(proofs))
          print('INCOMING_REMAINING', len(pruned))
          print('POOLS', dict(sorted(pools.items())))
          total_naive = 0
          unique_catalog = 0
          for (k, pattern), outgoing_sets in sorted(patterns.items(), key=str):
              ways = 1
              for pos, count in pattern:
                  ways *= comb(pools[pos], count)
              total_naive += ways * outgoing_sets
              unique_catalog += ways
              print('PATTERN', k, pattern, 'OUTSETS', outgoing_sets, 'RAW_IN_COMBOS', ways, 'REPEATED_WORK', ways*outgoing_sets)
          print('RAW_PACKAGE_ENUMERATION_UPPER_BOUND', total_naive)
          print('UNIQUE_PATTERN_CATALOG_UPPER_BOUND', unique_catalog)
          print('CATALOG_REUSE_FACTOR', round(total_naive / max(1,unique_catalog), 3))
          print('BUDGET', affordability.get('available_budget_tenths'))
          PY
