name: P17 PR690 classwide exactness validation

on:
  push:
    branches:
      - audit/p17-pr690-classwide-validation-20260924

permissions:
  contents: read

jobs:
  exactness-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/p17-pr690-classwide-validation-20260924
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run classwide exactness tests
        run: |
          pytest -q tests/test_lineup_distributional_optimizer.py -k \
            "p17_batch_has_no_undocumented_numpy_round_calls or \
             p17_boundary_dense_all_public_route_fields_match_scalar_family_and_chunk or \
             p17_cross_route_batch_matches_scalar_one_transfer_families or \
             python_round_vec_bitwise_matches_python_round_near_decimal_halves or \
             python_round_vec_domain_guards or \
             cross_route_route_utility_rounding_matches_scalar_oracle_at_production_half_boundaries"
