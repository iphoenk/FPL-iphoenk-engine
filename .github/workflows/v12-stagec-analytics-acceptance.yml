name: V12 StageC analytics acceptance

on:
  push:
    branches:
      - main
      - analytics/universe-breakout-external-challenge-20260925
    paths:
      - "src/models/v12_metric_provenance.py"
      - "src/models/v12_multiwindow_form.py"
      - "src/models/v12_analytics_foundation.py"
      - "src/models/v12_stageb_evidence.py"
      - "src/engines/v12_stageb_ab.py"
      - "src/models/v12_stagec_universe_scanner.py"
      - "src/models/v12_external_challenge.py"
      - "src/engines/v12_stagec_reporting.py"
      - "src/engines/v12_integrated_report_runner.py"
      - "config/intelligence/v12_stageb_evidence.json"
      - "config/intelligence/v12_stagec_universe_scanner.json"
      - "config/intelligence/v12_stagec_external_claims.json"
      - "tests/test_stage1_analytics_foundation.py"
      - "tests/test_integrated_report_runner.py"
      - ".github/workflows/v12-stagec-analytics-acceptance.yml"
  pull_request:
    paths:
      - "src/models/v12_metric_provenance.py"
      - "src/models/v12_multiwindow_form.py"
      - "src/models/v12_analytics_foundation.py"
      - "src/models/v12_stageb_evidence.py"
      - "src/engines/v12_stageb_ab.py"
      - "src/models/v12_stagec_universe_scanner.py"
      - "src/models/v12_external_challenge.py"
      - "src/engines/v12_stagec_reporting.py"
      - "src/engines/v12_integrated_report_runner.py"
      - "config/intelligence/v12_stageb_evidence.json"
      - "config/intelligence/v12_stagec_universe_scanner.json"
      - "config/intelligence/v12_stagec_external_claims.json"
      - "tests/test_stage1_analytics_foundation.py"
      - "tests/test_integrated_report_runner.py"
      - ".github/workflows/v12-stagec-analytics-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v12-stagec-analytics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analytics-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install locked CI dependencies
        run: python -m pip install --no-deps -r requirements-ci.lock

      - name: Run Stage A/B/C acceptance
        env:
          V12_STAGEC_SCANNER_ENABLED: "1"
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_stage1_analytics_foundation.py \
            tests/test_integrated_report_runner.py
