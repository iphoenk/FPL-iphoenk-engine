name: V4 one-shot architecture attestation refresh

on:
  push:
    branches:
      - codex/v4-official-freshness-hardening-r2
    paths:
      - .github/workflows/v4-attestation-refresh-r2.yml
      - src/sources/official_fpl.py

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v4-official-freshness-hardening-r2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install verifier dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Regenerate content-addressed architecture attestation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from src.services import architecture_guard_service as guard

          result = guard.run(force_full_scan=True)
          if result.get('status') != 'PASS':
              raise SystemExit('full Architecture Guard scan failed')
          payload = {
              'schema_version': guard.ATTESTATION_SCHEMA_VERSION,
              'fingerprint': guard.repository_fingerprint(),
              'release': guard.RELEASE_VERSION,
              'guard_schema_version': result.get('schema_version'),
              'result': result,
          }
          Path('config/architecture_guard_attestation.json').write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          print(payload['fingerprint'])
          PY

      - name: Verify attestation resolves from governed bytes
        run: python -m pytest -q tests/test_v4_architecture_attestation.py tests/test_v4_official_live_acquisition.py

      - name: Commit refreshed attestation only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fpl-iphoenk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add config/architecture_guard_attestation.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(v4): refresh architecture guard attestation"
          git push origin HEAD:codex/v4-official-freshness-hardening-r2
