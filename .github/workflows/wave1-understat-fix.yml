name: Wave 1 Understat identity fix

on:
  push:
    branches:
      - fix/wave1-understat-identity

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[wave1-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wave1-understat-identity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install -q pytest
      - name: Apply deterministic Wave 1 crosswalks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('config/v6/verified_crosswalks.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          source = payload['sources']['understat']
          rows = source['players']
          existing_native = {str(r['source_native_id']) for r in rows}
          existing_code = {int(r['official_fpl_code']) for r in rows}
          additions = [
              {'official_fpl_code': 627221, 'official_fpl_element_id': 599, 'source_native_id': 12847, 'verification_method': 'WAVE1_OFFICIAL_FPL_CODE_TO_OBSERVED_UNDERSTAT_NATIVE_ID', 'verified_at': '2026-09-15T20:06:00Z', 'review_status': 'DETERMINISTIC_BRIDGE_REVIEWED', 'review_reference': 'wave1-understat-identity-2026-09-15', 'bridge_path': ['official_fpl.bootstrap.elements.code', 'understat.observed_native_player_id', 'official_fpl.bootstrap.elements.id'], 'evidence': ['official_fpl:bootstrap.elements.code:627221', 'official_fpl:bootstrap.elements.id:599', 'runtime-data-v6:understat.observed_native_player_id:12847']},
              {'official_fpl_code': 601772, 'official_fpl_element_id': 636, 'source_native_id': 13078, 'verification_method': 'WAVE1_OFFICIAL_FPL_CODE_TO_OBSERVED_UNDERSTAT_NATIVE_ID', 'verified_at': '2026-09-15T20:06:00Z', 'review_status': 'DETERMINISTIC_BRIDGE_REVIEWED', 'review_reference': 'wave1-understat-identity-2026-09-15', 'bridge_path': ['official_fpl.bootstrap.elements.code', 'understat.observed_native_player_id', 'official_fpl.bootstrap.elements.id'], 'evidence': ['official_fpl:bootstrap.elements.code:601772', 'official_fpl:bootstrap.elements.id:636', 'runtime-data-v6:understat.observed_native_player_id:13078']},
              {'official_fpl_code': 437497, 'official_fpl_element_id': 637, 'source_native_id': 8190, 'verification_method': 'WAVE1_OFFICIAL_FPL_CODE_TO_OBSERVED_UNDERSTAT_NATIVE_ID', 'verified_at': '2026-09-15T20:06:00Z', 'review_status': 'DETERMINISTIC_BRIDGE_REVIEWED', 'review_reference': 'wave1-understat-identity-2026-09-15', 'bridge_path': ['official_fpl.bootstrap.elements.code', 'understat.observed_native_player_id', 'official_fpl.bootstrap.elements.id'], 'evidence': ['official_fpl:bootstrap.elements.code:437497', 'official_fpl:bootstrap.elements.id:637', 'runtime-data-v6:understat.observed_native_player_id:8190']},
          ]
          for row in additions:
              native = str(row['source_native_id'])
              code = int(row['official_fpl_code'])
              if native in existing_native:
                  continue
              if code in existing_code:
                  raise SystemExit(f'canonical code collision: {code}')
              rows.append(row)
              existing_native.add(native)
              existing_code.add(code)
          rows.sort(key=lambda r: int(r['official_fpl_code']))
          path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Run Wave 1 regression tests
        run: python -m pytest -q tests/test_wave1_understat_identity.py
      - name: Commit deterministic crosswalks
        run: |
          if git diff --quiet -- config/v6/verified_crosswalks.json; then
            echo 'No config diff to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/v6/verified_crosswalks.json
          git commit -m 'fix: close Wave 1 Understat identity gaps [wave1-applied]'
          git push origin HEAD:fix/wave1-understat-identity
