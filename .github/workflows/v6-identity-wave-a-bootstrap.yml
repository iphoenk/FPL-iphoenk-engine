name: V6 Identity Wave A bootstrap

on:
  push:
    branches:
      - feat/v6-identity-wave-a-coverage-truth
    paths:
      - .github/workflows/v6-identity-wave-a-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire-wave-a:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/v6-identity-wave-a-coverage-truth
      - name: Wire identity coverage truth into collector
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/runtime_v6/collector.py')
          s=p.read_text()
          old='from .identity import build_player_identity_map\n'
          new=old+'from .identity_coverage import build_player_identity_coverage_truth\n'
          if new not in s:
              if old not in s: raise SystemExit('identity import anchor missing')
              s=s.replace(old,new,1)
          old=') -> list[str]:\n    datasets = build_source_native_datasets(results, identity_map)'
          new=') -> tuple[list[str], dict[str, dict[str, Any]]]:\n    datasets = build_source_native_datasets(results, identity_map)'
          if new not in s:
              if old not in s: raise SystemExit('publish signature anchor missing')
              s=s.replace(old,new,1)
          old='    return artifacts\n\n\ndef run() -> dict[str, Any]:'
          new='    return artifacts, datasets\n\n\ndef run() -> dict[str, Any]:'
          if new not in s:
              if old not in s: raise SystemExit('publish return anchor missing')
              s=s.replace(old,new,1)
          old='    normalized_source_artifacts = _publish_source_native_datasets(results, identity_map)\n    write_json(EVIDENCE / "lineage.json", build_lineage_catalog(config))'
          new='    normalized_source_artifacts, normalized_source_datasets = _publish_source_native_datasets(results, identity_map)\n    identity_coverage_truth = build_player_identity_coverage_truth(identity_map, normalized_source_datasets)\n    write_json(EVIDENCE / "player_identity_coverage.json", identity_coverage_truth)\n    write_json(EVIDENCE / "lineage.json", build_lineage_catalog(config))'
          if new not in s:
              if old not in s: raise SystemExit('publish call anchor missing')
              s=s.replace(old,new,1)
          old='            "verified_crosswalk_artifact": "data/v6/evidence/verified_crosswalks.json",\n            "fuzzy_name_matching_allowed": False,'
          new='            "verified_crosswalk_artifact": "data/v6/evidence/verified_crosswalks.json",\n            "coverage_truth_artifact": "data/v6/evidence/player_identity_coverage.json",\n            "fuzzy_name_matching_allowed": False,'
          if new not in s:
              if old not in s: raise SystemExit('identity manifest anchor missing')
              s=s.replace(old,new,1)
          old='            "verified_crosswalks": "data/v6/evidence/verified_crosswalks.json",\n            "artifact_catalog": "data/v6/evidence/artifact_catalog.json",'
          new='            "verified_crosswalks": "data/v6/evidence/verified_crosswalks.json",\n            "player_identity_coverage": "data/v6/evidence/player_identity_coverage.json",\n            "artifact_catalog": "data/v6/evidence/artifact_catalog.json",'
          if new not in s:
              if old not in s: raise SystemExit('paths anchor missing')
              s=s.replace(old,new,1)
          old='            "verified_crosswalks_are_evidence_backed": True,\n            "fuzzy_identity_matching": False,'
          new='            "verified_crosswalks_are_evidence_backed": True,\n            "identity_coverage_uses_separate_canonical_and_observed_join_metrics": True,\n            "unobserved_players_are_not_assumed_absent_from_provider": True,\n            "fuzzy_identity_matching": False,'
          if new not in s:
              if old not in s: raise SystemExit('governance anchor missing')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          python -m compileall -q src/runtime_v6/identity_coverage.py src/runtime_v6/collector.py
          git diff --check
          git diff -- src/runtime_v6/collector.py
      - name: Commit collector wiring
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No collector changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/runtime_v6/collector.py
          git commit -m 'V6 Wave A: publish dual identity coverage truth'
          git push origin HEAD:feat/v6-identity-wave-a-coverage-truth
