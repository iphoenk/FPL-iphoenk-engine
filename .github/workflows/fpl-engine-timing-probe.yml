name: FPL V4 top-of-hour timing probe

on:
  workflow_dispatch:
  schedule:
    # Lightweight wake-up for Final Review targets that fall at :00 WIB.
    # Ordinary :00 checks exit after one Official FPL bootstrap request.
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: fpl-iphoenk-v4-timing-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run_full: ${{ steps.resolve.outputs.run_full }}
      policy_id: ${{ steps.resolve.outputs.policy_id }}
      reason: ${{ steps.resolve.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4-prediction-engine
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install lightweight probe dependency
        run: pip install --disable-pip-version-check requests
      - name: Resolve governed :00 checkpoint
        id: resolve
        run: python -m src.services.checkpoint_timing_probe

  core:
    needs: probe
    if: needs.probe.outputs.run_full == 'true'
    uses: ./.github/workflows/fpl-engine-core.yml
    permissions:
      contents: write
    with:
      ref: v4-prediction-engine
      publish: true
