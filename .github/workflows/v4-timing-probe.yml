name: FPL V4 timing probe

on:
  workflow_dispatch:
  schedule:
    # Master Monitor secondary wake-up for Final Review / reconciliation transitions.
    # GitHub cron is UTC; minute :00 remains :00 WIB.
    - cron: "0 * * * *"

permissions:
  contents: read

concurrency:
  group: fpl-iphoenk-v4-gate
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run_full: ${{ steps.timing.outputs.run_full }}
      policy_id: ${{ steps.timing.outputs.policy_id }}
      reason: ${{ steps.timing.outputs.reason }}
      canonical_sha: ${{ steps.canonical.outputs.canonical_sha }}
    steps:
      - name: Checkout canonical V4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v4-prediction-engine
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install minimal runtime dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Resolve :00 timing only
        id: timing
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.services.checkpoint_timing_probe
      - name: Capture canonical V4 SHA
        id: canonical
        shell: bash
        run: echo "canonical_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Probe summary
        run: echo "policy=${{ steps.timing.outputs.policy_id }} reason=${{ steps.timing.outputs.reason }} run_full=${{ steps.timing.outputs.run_full }}"

  core:
    needs: probe
    if: needs.probe.outputs.run_full == 'true'
    permissions:
      contents: read
    secrets: inherit
    uses: iphoenk/FPL-iphoenk-engine/.github/workflows/fpl-engine-core.yml@v4-prediction-engine
    with:
      ref: ${{ needs.probe.outputs.canonical_sha }}
      publish: true
