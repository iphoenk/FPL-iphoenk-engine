name: V4 temporary contextual prune probe
on:
  push:
    branches: [codex/v4-full-universe-tactical-20260903]
    paths: [.github/workflows/v4-contextual-prune-probe-temp.yml, tools/v4_contextual_prune_probe_temp.py]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/v4-full-universe-tactical-20260903
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check -r requirements.txt
      - run: python tools/v4_contextual_prune_probe_temp.py
