name: V3 Lock Hash Bootstrap

on:
  pull_request:
    paths:
      - 'requirements.lock'
      - 'requirements-ci.lock'
      - 'tools/emit_dependency_hashes.py'
      - '.github/workflows/v3-lock-hash-bootstrap.yml'

permissions:
  contents: read

jobs:
  emit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Emit current-platform lock hashes
        run: |
          set -euo pipefail
          python tools/emit_dependency_hashes.py requirements.lock requirements-ci.lock > "$RUNNER_TEMP/dependency-hashes.txt"
          echo '--- V3_DEPENDENCY_HASHES_BEGIN ---'
          cat "$RUNNER_TEMP/dependency-hashes.txt"
          echo '--- V3_DEPENDENCY_HASHES_END ---'
