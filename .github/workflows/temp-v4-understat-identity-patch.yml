name: TEMP V4 Understat unresolved identity diagnostic

on:
  push:
    branches:
      - fix/v4-official-understat-player-mapping-20260902

permissions:
  contents: write

jobs:
  live-candidate-diagnostic:
    if: ${{ !contains(github.event.head_commit.message, '[candidate-diagnostic]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v4-official-understat-player-mapping-20260902
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Generate unresolved candidate diagnostic
        run: PYTHONPATH=. python tools/temp_v4_understat_unresolved_diag.py
      - name: Persist diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/v4_understat_unresolved_candidates.json
          git commit -m "chore(v4): capture unresolved Understat candidates [candidate-diagnostic]"
          git push origin HEAD:fix/v4-official-understat-player-mapping-20260902
