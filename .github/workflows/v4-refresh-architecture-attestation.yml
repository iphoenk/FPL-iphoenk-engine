name: V4 refresh architecture attestation

on:
  push:
    branches:
      - codex/v4-owned-challenger-decision-engine
    paths-ignore:
      - config/architecture_guard_attestation.json

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Build governed architecture attestation
        run: python tools/v4_architecture_guard_attest.py
      - name: Commit refreshed attestation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/architecture_guard_attestation.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "V4: refresh architecture guard attestation"
          git push origin HEAD:codex/v4-owned-challenger-decision-engine
