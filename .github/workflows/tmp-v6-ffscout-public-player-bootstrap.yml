name: Temporary V6 FFScout public player bootstrap

on:
  push:
    branches:
      - fix/v6-ffscout-public-player-identity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Patch canonical V6 wiring
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          registry_path = Path('config/v6/source_registry.json')
          registry = json.loads(registry_path.read_text())
          ffscout = next(source for source in registry['sources'] if source['id'] == 'ffscout')
          requests = ffscout.setdefault('requests', [])
          if not any(request.get('id') == 'team_news' for request in requests):
              requests.append({
                  'id': 'team_news',
                  'url': 'https://www.fantasyfootballscout.co.uk/team-news/',
                  'expect': 'text',
                  'validation': {
                      'required_text_any': ['Predicted Line-ups', 'Predicted Lineups']
                  },
              })
          ffscout['acquisition_kind'] = 'generic_http'
          ffscout['content_hash_dedup'] = True
          registry_path.write_text(json.dumps(registry, indent=2, ensure_ascii=False) + '\n')

          scope_path = Path('config/v6/entity_scope_policy.json')
          scope = json.loads(scope_path.read_text())
          scope.setdefault('source_overrides', {})['ffscout'] = ['PLAYER', 'FEED']
          governance = scope.setdefault('governance', {})
          governance['ffscout_player_identity_requires_stable_native_id_before_player_scope'] = True
          governance['ffscout_public_premierleague_media_code_is_stable_identity_evidence'] = True
          governance['ffscout_public_player_identity_method'] = 'FFSCOUT_PUBLIC_PREMIERLEAGUE_MEDIA_CODE_EXACT'
          scope_path.write_text(json.dumps(scope, indent=2, ensure_ascii=False) + '\n')

          collector_path = Path('src/runtime_v6/collector.py')
          text = collector_path.read_text()
          import_anchor = 'from .entity_scope import entity_scopes_for_source, source_scope_map\n'
          import_line = 'from .ffscout_public import augment_ffscout_public_dataset, enrich_ffscout_public_identity\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('collector import anchor missing')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          augment_anchor = '    datasets = augment_source_native_datasets(results, identity_map, datasets)\n'
          augment_line = '    datasets = augment_ffscout_public_dataset(results, identity_map, datasets)\n'
          if augment_line not in text:
              if augment_anchor not in text:
                  raise SystemExit('collector dataset anchor missing')
              text = text.replace(augment_anchor, augment_anchor + augment_line, 1)

          old_identity = '''    identity_map = apply_entity_scope_identity_semantics(\n        enrich_verified_external_crosswalks(\n            enrich_shared_identity_bridges(\n                build_player_identity_map(official, results, source_ids),\n                official,\n                results,\n            ),\n            results,\n        ),\n        scopes,\n    )\n'''
          new_identity = '''    identity_map = apply_entity_scope_identity_semantics(\n        enrich_ffscout_public_identity(\n            enrich_verified_external_crosswalks(\n                enrich_shared_identity_bridges(\n                    build_player_identity_map(official, results, source_ids),\n                    official,\n                    results,\n                ),\n                results,\n            ),\n            results,\n        ),\n        scopes,\n    )\n'''
          if 'enrich_ffscout_public_identity(' not in text.split('identity_map =', 1)[1]:
              if old_identity not in text:
                  raise SystemExit('collector identity anchor missing')
              text = text.replace(old_identity, new_identity, 1)
          collector_path.write_text(text)

          workflow = Path('.github/workflows/tmp-v6-ffscout-public-player-bootstrap.yml')
          if workflow.exists():
              workflow.unlink()
          PY
      - name: Run focused FFScout identity tests
        run: python -m pytest -q tests/test_data_platform_ffscout_public_player_identity.py tests/test_data_platform_ffscout_identity_scope.py
      - name: Commit canonical wiring and remove bootstrap workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'v6: wire deterministic FFScout public player identity'
          git push origin HEAD:fix/v6-ffscout-public-player-identity
