name: V5 P0 Control Plane Patch

on:
  push:
    branches:
      - codex/v5-p0-control-plane-consolidation
    paths:
      - .github/workflows/v5-p0-control-plane-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v5-p0-control-plane-consolidation
          fetch-depth: 0
      - name: Apply P0 control-plane consolidation
        run: python tools/v5_p0_control_plane_patch.py
      - name: Validate patch syntax
        run: |
          python -m py_compile scripts/v5_evidence_scheduler_gate.py scripts/v5_dispatch_shadow_trigger.py tools/v5_p0_control_plane_patch.py
          python -m json.tool config/v5_convergence_manifest.json >/dev/null
          python -m json.tool config/v5_acceptance_registry.json >/dev/null
          python -m json.tool config/v5_capability_parity_registry.json >/dev/null
          python -m json.tool IMPLEMENTATION_STATUS.json >/dev/null
          git diff --check
      - name: Commit P0 patch
        run: |
          git config user.name "iphoenk"
          git config user.email "103485057+iphoenk@users.noreply.github.com"
          git add config/v5_convergence_manifest.json config/v5_acceptance_registry.json config/v5_capability_parity_registry.json IMPLEMENTATION_STATUS.json tests/test_v5_metadata_authority_hygiene.py .github/workflows/v5-on-demand-report.yml .github/workflows/v5-evidence-scheduler.yml scripts/v5_evidence_scheduler_gate.py scripts/v5_dispatch_shadow_trigger.py tests/test_v5_control_plane_governance.py
          git commit -m "fix(v5): consolidate deployed baseline and evidence control plane"
          git push origin HEAD:codex/v5-p0-control-plane-consolidation
