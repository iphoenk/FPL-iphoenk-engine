name: V4 temporary explicit Understat dependency patch

on:
  push:
    branches:
      - codex/v4-understat-tactical-parity-20260902
    paths:
      - '.github/workflows/v4-understat-explicit-dependency-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/v4-understat-tactical-parity-20260902
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Apply explicit dependency fix and regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, got {count}")
              p.write_text(text.replace(old, new, 1))

          projected = 'src/services/projected_value_market_challenger.py'
          replace_once(
              projected,
              '    external: dict[str, Any] | None = None,\n    per_position: int = 5,\n) -> dict[str, Any]:',
              '    external: dict[str, Any] | None = None,\n    understat_data: dict[str, Any] | None = None,\n    per_position: int = 5,\n) -> dict[str, Any]:',
          )
          replace_once(
              projected,
              '    external = external if external is not None else read_json(DATA / "tactical_external_evidence.json", {})\n    current = list(tactical.get("watchlist") or [])',
              '    external = external if external is not None else read_json(DATA / "tactical_external_evidence.json", {})\n    understat_data = understat_data if understat_data is not None else read_json(DATA / "understat_tactical_v4.json", {})\n    current = list(tactical.get("watchlist") or [])',
          )
          replace_once(
              projected,
              '                "tactical": _compact_tactical(pred, uni, external),',
              '                "tactical": _compact_tactical(pred, uni, external, understat_data),',
          )

          optimization = 'src/services/optimization_slo_service.py'
          replace_once(
              optimization,
              '        universe=universe,\n        per_position=int(discovery_cfg["visible_watchlist_per_position"]),\n    )',
              '        universe=universe,\n        understat_data=understat_tactical,\n        per_position=int(discovery_cfg["visible_watchlist_per_position"]),\n    )',
          )

          test_path = Path('tests/test_understat_decision_safety.py')
          test_text = test_path.read_text()
          import_line = 'from src.services.projected_value_market_challenger import rerank_visible_watchlist\n'
          if import_line not in test_text:
              anchor = 'from src.intelligence.understat_package_context import augment_package_tactical_context\n'
              if test_text.count(anchor) != 1:
                  raise SystemExit('test import anchor drifted')
              test_text = test_text.replace(anchor, anchor + import_line, 1)
          test_name = 'def test_projected_value_rerank_forwards_explicit_understat_dependency():'
          if test_name not in test_text:
              test_text += '''\n\ndef test_projected_value_rerank_forwards_explicit_understat_dependency():\n    positions = ("GK", "DEF", "MID", "FWD")\n    current = []\n    for pos_index, position in enumerate(positions):\n        for rank in range(5):\n            current.append({\n                "element": 10 * (pos_index + 1) + rank,\n                "position": position,\n                "score": 5.0 - rank * 0.1,\n                "xpts_5": 5.0 - rank * 0.1,\n            })\n    discovery = {\n        "candidates": [{\n            "element": 99,\n            "position": "GK",\n            "mandatory_review": True,\n            "identity_sanity": {\n                "status": "PASS",\n                "official_fact": {\n                    "element": 99,\n                    "name": "Explicit Understat GK",\n                    "team_id": 1,\n                    "team": "Test",\n                    "position": "GK",\n                    "now_cost": 45,\n                    "ownership": 0.1,\n                    "status": "a",\n                },\n            },\n            "projected_value": {"score": 9.0, "value_per_million_5gw": 2.0},\n        }],\n    }\n    predictions = {\n        "players": [{\n            "element": 99,\n            "position": "GK",\n            "xpts_5": 8.0,\n            "xpts_15": 24.0,\n            "uncertainty": 0.1,\n            "fixtures": [{\n                "opponent": 2,\n                "xmins": {\n                    "start_probability": 0.95,\n                    "dnp_probability": 0.01,\n                    "expected_minutes": 90,\n                },\n                "components": {},\n            }],\n            "priors": {"tactical_role": "GK"},\n        }],\n    }\n    universe = {"players": [{"element": 99, "name": "Explicit Understat GK", "position": "GK"}]}\n    understat = {\n        "source": {"freshness": "FRESH"},\n        "tactical_matchups": {\n            "99": {"state": "POSITIVE", "confidence": 0.91, "dimensions": {"pressing": "EDGE"}},\n        },\n    }\n\n    out = rerank_visible_watchlist(\n        {"watchlist": current},\n        discovery=discovery,\n        predictions=predictions,\n        universe=universe,\n        external={},\n        understat_data=understat,\n        per_position=5,\n    )\n\n    promoted = next(row for row in out["watchlist"] if row.get("element") == 99)\n    assert promoted["tactical"]["understat"]["state"] == "POSITIVE"\n    assert promoted["tactical"]["understat"]["confidence"] == 0.91\n    assert promoted["tactical"]["understat"]["direct_xpts_mutation"] is False\n    assert promoted["tactical"]["understat"]["direct_xmins_mutation"] is False\n'''
          test_path.write_text(test_text)

          temp = Path('.github/workflows/v4-understat-explicit-dependency-temp.yml')
          if not temp.exists():
              raise SystemExit('temporary workflow missing before cleanup')
          temp.unlink()
          PY
          python tools/v4_architecture_guard_attest.py
      - name: Commit patched governed bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && { echo '::error::Patch produced no changes'; exit 1; }
          git commit -m 'fix(v4): forward Understat through optimization rerank'
          git push origin HEAD:codex/v4-understat-tactical-parity-20260902
