name: V4.9.6 internal evidence one-shot migration

on:
  push:
    branches:
      - codex/v4.9.6.2-internal-evidence-closeout

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v4.9.6.2-internal-evidence-closeout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply internal evidence closeout migration
        run: python tools/v4962_internal_evidence_closeout.py
      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "fpl-iphoenk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/models/v4_prediction.py src/engines/framework_health_audit.py src/engines/v4_quality_gate.py config/architecture_ownership_registry.json tests/test_v4962_internal_evidence_closeout.py README.md
          if git diff --cached --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git commit -m "feat(v4): activate sustainability and fixture swing evidence"
          git push origin HEAD:codex/v4.9.6.2-internal-evidence-closeout
