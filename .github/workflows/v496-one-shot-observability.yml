name: V4.9.6 one-shot observability

on:
  push:
    branches:
      - codex/v4.9.6-architecture-consolidation
    paths:
      - .github/workflows/v496-one-shot-observability.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v4.9.6-architecture-consolidation
          fetch-depth: 0
      - name: Surface bounded service failure output
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/services/orchestrator.py')
          text = path.read_text(encoding='utf-8')
          old = '''                    if result.returncode != 0:\n                        row["status"] = "FAIL"\n                        service_states[service_id] = "FAIL"\n                        raise RuntimeError(f"service failed: {service_id} exit={result.returncode}")\n'''
          new = '''                    if result.returncode != 0:\n                        row["status"] = "FAIL"\n                        service_states[service_id] = "FAIL"\n                        detail = row["stderr_tail"] or row["stdout_tail"] or "no service output"\n                        raise RuntimeError(\n                            f"service failed: {service_id} exit={result.returncode}: {detail}"\n                        )\n'''
          if text.count(old) != 1:
              raise RuntimeError(f'expected one orchestrator failure block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/v496-one-shot-observability.yml
          git config user.name "fpl-iphoenk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(v4.9.6): surface bounded service failure diagnostics"
          git push origin HEAD:codex/v4.9.6-architecture-consolidation
