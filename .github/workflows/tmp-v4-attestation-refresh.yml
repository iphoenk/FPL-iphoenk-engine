name: Temporary V4 attestation refresh

on:
  push:
    branches:
      - audit/v4-frontier-exclusion-observability

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate governed V4 architecture attestation
        run: PYTHONPATH=. python tools/v4_architecture_guard_attest.py
      - name: Upload generated attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-architecture-attestation-refresh
          path: config/architecture_guard_attestation.json
          if-no-files-found: error
