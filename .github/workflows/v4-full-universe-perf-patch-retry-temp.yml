name: V4 temporary exact-search performance patch retry

on:
  push:
    branches:
      - codex/v4-full-universe-tactical-20260903
    paths:
      - .github/workflows/v4-full-universe-perf-patch-retry-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/v4-full-universe-tactical-20260903
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Reuse governed patch recipe
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/v4-full-universe-perf-patch-temp.yml').read_text(encoding='utf-8')
          marker = '      - name: Patch exact full-universe hot path without search truncation\n'
          start = source.index(marker)
          run_marker = '        run: |\n'
          body_start = source.index(run_marker, start) + len(run_marker)
          end = source.index('      - name: Run focused regression tests\n', body_start)
          body = textwrap.dedent(source[body_start:end])
          Path('/tmp/v4-perf-patch.sh').write_text(body, encoding='utf-8')
          PY
          bash /tmp/v4-perf-patch.sh
      - name: Run focused regression tests
        run: |
          python -m pytest -q \
            tests/test_v4_full_universe_package_search_proof.py \
            tests/test_v4_full_universe_authority_fail_closed.py \
            tests/test_v496_e2e_performance_hardening.py \
            tests/test_v4_p1_structural_hardening.py
      - name: Refresh governed architecture attestation
        run: python tools/v4_architecture_guard_attest.py
      - name: Commit exact performance hardening
        run: |
          set -euo pipefail
          git config user.name "fpl-iphoenk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/engines/v4_full_universe_package_search_core.py config/architecture_guard_attestation.json
          git diff --cached --quiet && exit 0
          git commit -m "perf(v4): defer full-universe package evidence materialization"
          git push origin HEAD:codex/v4-full-universe-tactical-20260903
