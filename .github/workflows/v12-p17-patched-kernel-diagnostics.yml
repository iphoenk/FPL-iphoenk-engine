name: V12 P1.7 patched-kernel diagnostics

on:
  push:
    branches:
      - v12-p17-r4-diagnostics
    workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v12-p17-patched-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install locked V12 test dependencies
        run: python -m pip install --no-deps -r requirements-ci.lock

      - name: Prove scalar-batch golden and adversarial exactness
        run: |
          python -m pytest -q             tests/test_lineup_distributional_optimizer.py::test_p17_core14_family_kernel_matches_scalar_across_positions_and_five_gw             tests/test_lineup_distributional_optimizer.py::test_p17_lazy_lexicographic_preserves_first_tie_and_skips_later_keys             tests/test_lineup_distributional_optimizer.py::test_p17_lazy_lexicographic_rejects_non_finite_ranking_keys             tests/test_lineup_distributional_optimizer.py::test_p17_core14_family_adversarial_full_tie_matches_scalar

      - name: Run unchanged 10 second gate
        run: |
          python -m pytest -q             tests/test_lineup_distributional_optimizer.py::test_p17_cross_route_batch_2043_routes_five_gw_under_ten_seconds

      - name: Run five-sample P1.7 diagnostics
        run: |
          python scripts/p17_benchmark_diagnostics.py             --repeats 5             --scalar-route-count 65             --artifact-dir artifacts/p17-benchmark

      - name: Capture runner environment
        if: always()
        run: |
          mkdir -p artifacts/p17-benchmark
          {
            echo "=== lscpu ==="
            lscpu
            echo
            echo "=== NumPy runtime ==="
            python -c 'import numpy as np; print("numpy", np.__version__); (np.show_runtime() if hasattr(np, "show_runtime") else np.show_config())'
          } > artifacts/p17-benchmark/runtime_environment.txt 2>&1

      - name: Upload benchmark diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p17-patched-kernel-diagnostics-${{ github.run_id }}
          path: artifacts/p17-benchmark
          if-no-files-found: warn
          retention-days: 14
