name: V4 temporary attestation refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v4-attestation-refresh-temp.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/v4-runtime-secret-inheritance
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Rebuild governed architecture attestation
        run: python tools/v4_architecture_guard_attest.py
      - name: Install test dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Verify full deterministic suite
        run: python -m pytest -q
      - name: Commit governed attestation to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/architecture_guard_attestation.json
          git diff --cached --exit-code && exit 0 || true
          git commit -m 'chore(v4): refresh architecture guard attestation'
          git push origin HEAD:codex/v4-runtime-secret-inheritance
# refresh-token: governance-contract-preserved
