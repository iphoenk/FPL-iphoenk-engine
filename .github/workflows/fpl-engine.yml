name: FPL iphoenk collector v3.6

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  schedule:
    - cron: "55 * * * *"
    - cron: "15 * * * *"

permissions:
  contents: read

concurrency:
  group: fpl-iphoenk-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUNTIME_BRANCH: runtime-data

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      should_collect: ${{ steps.cadence.outputs.should_collect }}
      reason: ${{ steps.cadence.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide collector cadence
        id: cadence
        env:
          PYTHONPATH: ${{ github.workspace }}
          FPL_SCHEDULE_EXPR: ${{ github.event.schedule }}
        run: python -m src.engines.collector_gate

  test:
    needs: gate
    if: github.event_name == 'pull_request' || needs.gate.outputs.should_collect == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile runtime modules
        run: python -m compileall -q src live_service.py fpl_daily_tasks.py
      - name: Reliability, rules, cadence and Official expansion tests
        run: python -m pytest -q

  collect:
    if: github.event_name != 'pull_request' && needs.gate.outputs.should_collect == 'true'
    needs: [gate, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Collector mode
        run: echo "Collector gate=${{ needs.gate.outputs.reason }} runtime_branch=${RUNTIME_BRANCH}"
      - name: Generate Official FPL snapshot
        run: |
          python -m src.engine daily --stats
          python -m src.reliability_overlay
          python -m src.engines.price_radar
          python -m src.engines.official_expansion
      - name: Validate generated snapshot
        run: |
          python - <<'PY'
          import json
          from src.engines.reliability import validate_snapshot
          from src.rules import RULESET_ID
          from src.version import ENGINE_VERSION, SCHEMA_VERSION
          s=json.load(open('data/latest.json'))
          p=json.load(open('data/prices.json'))
          c=json.load(open('data/chips.json'))
          d=json.load(open('data/official_detail.json'))
          assert s['engine_version'] == ENGINE_VERSION
          assert s['schema_version'] == SCHEMA_VERSION
          assert s.get('snapshot_id')
          assert s.get('native',{}).get('entry')
          assert s.get('provenance',{}).get('entry',{}).get('source') == 'official_fpl'
          assert s.get('ruleset',{}).get('id') == RULESET_ID
          assert (s.get('ruleset',{}).get('goal_points',{}).get('1') == 10 or s.get('ruleset',{}).get('goal_points',{}).get(1) == 10)
          assert s.get('chip_ledger',{}).get('ruleset_id') == RULESET_ID
          assert c.get('ruleset_id') == RULESET_ID
          assert s.get('price_summary',{}).get('filter_policy',{}).get('min_ownership_pct') == 0.5
          assert all(x.get('ownership_pct',0) >= 0.5 and abs(x.get('net_transfers',0)) >= 5000 for x in p.get('top_buy_pressure',[]))
          assert all(x.get('ownership_pct',0) >= 0.5 and abs(x.get('net_transfers',0)) >= 5000 for x in p.get('top_sell_pressure',[]))
          ods=s.get('official_detail_summary',{})
          assert ods.get('detail_requested',0) >= 15
          assert d.get('owned_element_ids')
          assert d.get('official_health',{}).get('element_summary',{}).get('requested',0) >= 15
          assert 'fixture_stats' in d and 'event_live_rich' in d and 'dream_team' in d
          r=validate_snapshot(s)
          print(r)
          if not r['ok']: raise SystemExit(2)
          PY
      - name: Stamp runtime publication metadata
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          p='data/latest.json'
          s=json.load(open(p))
          s['runtime_publish']={
              'branch': os.environ.get('RUNTIME_BRANCH','runtime-data'),
              'source_commit': os.environ.get('GITHUB_SHA'),
              'published_at': datetime.now(timezone.utc).isoformat(),
          }
          with open(p,'w') as f: json.dump(s,f,indent=2,ensure_ascii=False)
          PY
      - name: Publish validated bridge to runtime branch
        shell: bash
        run: |
          set -euo pipefail
          runtime_tmp="$(mktemp -d)"
          cp -a data/. "$runtime_tmp/"
          git config user.name "fpl-iphoenk-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin "$RUNTIME_BRANCH" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$RUNTIME_BRANCH"; then
            git checkout -B "$RUNTIME_BRANCH" "origin/$RUNTIME_BRANCH"
          else
            git checkout -b "$RUNTIME_BRANCH"
          fi
          rm -rf data
          mkdir -p data
          cp -a "$runtime_tmp/." data/
          git add data/
          if git diff --cached --quiet; then
            echo "No runtime data changes"
            exit 0
          fi
          git commit -m "data: refresh FPL runtime snapshot [skip ci]"
          git push origin "$RUNTIME_BRANCH"
