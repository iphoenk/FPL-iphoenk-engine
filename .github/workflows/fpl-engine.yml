name: FPL V4 production gate

on:
  workflow_dispatch:
  push:
    branches: [v4-prediction-engine]
    paths-ignore: ['data/**']
  pull_request:
    branches: [v4-prediction-engine]

# The hourly :30 scheduler lives on the repository default branch and dispatches
# this branch's reusable core. GitHub scheduled workflows do not execute from a
# non-default branch, so keeping a cron here would be misleading dead config.
permissions:
  contents: write

# Production publication (push/manual), the :30 scheduler, and stale-recovery
# runs must serialize on the same lock and must never cancel one another.
# PR validation is non-publishing and gets an isolated per-PR lock so a new PR
# commit may supersede only its own older validation run, never production.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('fpl-iphoenk-v4-pr-{0}', github.event.pull_request.number) || 'fpl-iphoenk-v4-gate' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    uses: ./.github/workflows/fpl-engine-core.yml
    permissions:
      contents: write
    with:
      ref: ${{ github.sha }}
      publish: ${{ github.event_name != 'pull_request' }}
