name: V12 integrated report runner

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  cache-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Capture Actions cache inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cache-inventory
          python - <<'PY'
          import json, os, urllib.request, datetime
          repo=os.environ["GITHUB_REPOSITORY"]
          url=f"https://api.github.com/repos/{repo}/actions/caches?per_page=100"
          req=urllib.request.Request(url,headers={
            "Accept":"application/vnd.github+json",
            "Authorization":f"Bearer {os.environ['GH_TOKEN']}",
            "X-GitHub-Api-Version":"2022-11-28",
          })
          with urllib.request.urlopen(req) as response:
              payload=json.load(response)
          out={
            "source_url":url,
            "timestamp_utc":datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00","Z"),
            "run_id":int(os.environ["GITHUB_RUN_ID"]),
            "event":os.environ["GITHUB_EVENT_NAME"],
            "head_sha":os.environ["GITHUB_SHA"],
            "total_count":payload.get("total_count"),
            "actions_caches":payload.get("actions_caches",[]),
          }
          open("cache-inventory/cache_inventory.json","w").write(json.dumps(out,indent=2)+"\n")
          print("total_count",out["total_count"])
          for row in out["actions_caches"]:
              print(row.get("id"),row.get("key"),row.get("size_in_bytes"),row.get("ref"))
          PY

      - name: Upload cache inventory
        uses: actions/upload-artifact@v4
        with:
          name: audit-cache-inventory-${{ github.run_id }}
          path: cache-inventory
          if-no-files-found: error
          retention-days: 14
