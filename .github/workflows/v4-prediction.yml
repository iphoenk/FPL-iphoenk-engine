name: FPL iphoenk V4 production scheduler

on:
  workflow_dispatch:
  schedule:
    # Default-branch dispatcher for the canonical V4 :30 WIB master evaluation.
    # Scheduled workflows only execute from the repository default branch.
    - cron: "30 * * * *"

permissions:
  contents: write

concurrency:
  group: fpl-iphoenk-v4-gate
  cancel-in-progress: false

jobs:
  core:
    uses: iphoenk/FPL-iphoenk-engine/.github/workflows/fpl-engine-core.yml@v4-prediction-engine
    permissions:
      contents: write
    with:
      ref: v4-prediction-engine
      publish: true
