name: V5 Evidence Dispatcher

on:
  schedule:
    # Default-branch scheduler. The V5 branch itself intentionally has no cron.
    - cron: "30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: v5-evidence-dispatcher
  cancel-in-progress: true

env:
  V5_CODE_BRANCH: v5-unified-engine
  V5_SHADOW_BRANCH: v5-shadow-runtime
  V3_RUNTIME_BRANCH: runtime-data
  TZ_AUTHORITY: Asia/Jakarta

jobs:
  evidence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      reasons: ${{ steps.gate.outputs.reasons }}
    steps:
      - name: Checkout V5 scheduler authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v5-unified-engine
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce V5 canonical merged-PR provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V5_PROVENANCE_BRANCH=v5-unified-engine \
          V5_PROVENANCE_SHA="$(git rev-parse HEAD)" \
          python -m src.v5.canonical_provenance

      - name: Evaluate governed evidence window
        id: gate
        shell: bash
        run: python scripts/v5_evidence_scheduler_gate.py --event-name "$GITHUB_EVENT_NAME"

      - name: No-op outside governed evidence windows or during baseline drift
        if: steps.gate.outputs.should_run != 'true'
        run: echo "No heavy V5 cycle required; either outside an evidence window or deployed production baseline is not reconciled."

  shadow-cycle:
    needs: evidence-gate
    if: needs.evidence-gate.outputs.should_run == 'true'
    uses: iphoenk/FPL-iphoenk-engine/.github/workflows/v5-shadow-cycle.yml@v5-unified-engine
    with:
      scheduler_reasons: ${{ needs.evidence-gate.outputs.reasons }}
      scheduler_source: default-branch-reusable-dispatcher
    secrets: inherit
