name: V4 layer vector index profiler temp

on:
  push:
    branches: [codex/v4-full-universe-tactical-20260903]
    paths:
      - .github/workflows/v4-layer-vector-index-profiler-temp.yml

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: codex/v4-full-universe-tactical-20260903, fetch-depth: 1}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements.txt}
      - run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Apply ephemeral exact vector-layer index
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/engines/v4_full_universe_exact_state_frontier.py')
          text=path.read_text()
          text=text.replace('from typing import Any, Callable, Iterator\n','from typing import Any, Callable, Iterator\n\nimport numpy as np\n',1)
          marker='def _front_insert(\n'
          start=text.index(marker)
          end=text.index('\ndef _skyband_insert(',start)
          replacement=r'''_LAYER_VECTOR_CACHE: dict[int, dict[str, Any]] = {}


def _gw_flat(state: IncomingState) -> tuple[float, ...]:
    return tuple(value for position in state.gw_values for gw_rows in position for value in gw_rows)


def _layer_matrix(layer: list[IncomingState]) -> dict[str, Any]:
    key=id(layer)
    cache=_LAYER_VECTOR_CACHE.get(key)
    row_ids=tuple(id(row) for row in layer)
    if cache is not None and cache.get("row_ids")==row_ids:
        return cache
    n=len(layer)
    capacity=max(8, 1 << max(3, (max(1,n)-1).bit_length()))
    scalar=np.empty((capacity,12),dtype=np.float64)
    gw_width=len(_gw_flat(layer[0])) if layer else 0
    gw=np.empty((capacity,gw_width),dtype=np.float64)
    for index,row in enumerate(layer):
        scalar[index]=(
            row.cost,row.x3,row.x5,row.x10,row.x15,
            row.projection_uncertainty,row.xmins_uncertainty,row.tactical_uncertainty,
            row.roster_change_uncertainty,row.price_risk,row.tactical_role_confidence,
            row.opponent_matchup_confidence,
        )
        if gw_width:
            gw[index]=_gw_flat(row)
    cache={"row_ids":row_ids,"scalar":scalar,"gw":gw,"size":n,"capacity":capacity}
    _LAYER_VECTOR_CACHE[key]=cache
    return cache


def _layer_append_cache(layer: list[IncomingState], row: IncomingState) -> None:
    cache=_LAYER_VECTOR_CACHE.get(id(layer))
    if cache is None:
        return
    old_ids=cache.get("row_ids") or tuple()
    if old_ids != tuple(id(item) for item in layer[:-1]):
        _LAYER_VECTOR_CACHE.pop(id(layer),None)
        return
    size=int(cache["size"])
    capacity=int(cache["capacity"])
    if size>=capacity:
        new_capacity=capacity*2
        scalar=np.empty((new_capacity,12),dtype=np.float64)
        scalar[:size]=cache["scalar"][:size]
        gw=np.empty((new_capacity,cache["gw"].shape[1]),dtype=np.float64)
        if gw.shape[1]:
            gw[:size]=cache["gw"][:size]
        cache["scalar"]=scalar; cache["gw"]=gw; cache["capacity"]=new_capacity
    cache["scalar"][size]=(
        row.cost,row.x3,row.x5,row.x10,row.x15,
        row.projection_uncertainty,row.xmins_uncertainty,row.tactical_uncertainty,
        row.roster_change_uncertainty,row.price_risk,row.tactical_role_confidence,
        row.opponent_matchup_confidence,
    )
    if cache["gw"].shape[1]:
        cache["gw"][size]=_gw_flat(row)
    cache["size"]=size+1
    cache["row_ids"]=old_ids+(id(row),)


def _front_insert(
    layer: list[IncomingState],
    candidate: IncomingState,
    *,
    frontier_epsilon: float,
    relation: Callable[..., bool],
    metrics: dict[str, int] | None = None,
) -> tuple[bool, list[IncomingState]]:
    _metric_add(metrics,"frontier_insert_calls")
    if not layer:
        layer.append(candidate)
        _LAYER_VECTOR_CACHE.pop(id(layer),None)
        return True,[]
    if relation not in (rank_dominates,frontier_dominates,dominates):
        for incumbent in layer:
            _metric_add(metrics,"dominance_full_checks")
            if relation(incumbent,candidate,frontier_epsilon=frontier_epsilon):
                _metric_add(metrics,"frontier_insert_rejected")
                return False,[]
        displaced=[row for row in layer if relation(candidate,row,frontier_epsilon=frontier_epsilon)]
        _metric_add(metrics,"dominance_full_checks",len(layer))
        if displaced:
            ids={id(row) for row in displaced}; layer[:]=[row for row in layer if id(row) not in ids]
            _LAYER_VECTOR_CACHE.pop(id(layer),None)
        layer.append(candidate); _LAYER_VECTOR_CACHE.pop(id(layer),None)
        return True,displaced

    cache=_layer_matrix(layer)
    n=int(cache["size"]); a=cache["scalar"][:n]
    c=np.asarray((
        candidate.cost,candidate.x3,candidate.x5,candidate.x10,candidate.x15,
        candidate.projection_uncertainty,candidate.xmins_uncertainty,candidate.tactical_uncertainty,
        candidate.roster_change_uncertainty,candidate.price_risk,candidate.tactical_role_confidence,
        candidate.opponent_matchup_confidence,
    ),dtype=np.float64)
    # cols: cost,x3,x5,x10,x15,proj,xmins,tact,roster,price,role,opp
    rank_dom=(a[:,0]<=c[0])&(a[:,2]>=c[2])&(a[:,4]>=c[4])&(a[:,5]<=c[5])&(a[:,6]<=c[6])&(a[:,7]<=c[7])&(a[:,8]<=c[8])
    rank_dom &= (a[:,2]>c[2]+_TWO_DP_ROUND_ERROR)|(a[:,4]>c[4]+_TWO_DP_ROUND_ERROR)|(a[:,0]<c[0])
    rank_rev=(c[0]<=a[:,0])&(c[2]>=a[:,2])&(c[4]>=a[:,4])&(c[5]<=a[:,5])&(c[6]<=a[:,6])&(c[7]<=a[:,7])&(c[8]<=a[:,8])
    rank_rev &= (c[2]>a[:,2]+_TWO_DP_ROUND_ERROR)|(c[4]>a[:,4]+_TWO_DP_ROUND_ERROR)|(c[0]<a[:,0])
    if relation in (rank_dominates,dominates):
        if cache["gw"].shape[1]:
            cg=np.asarray(_gw_flat(candidate),dtype=np.float64)
            rank_dom &= np.all(cache["gw"][:n]>=cg,axis=1)
            rank_rev &= np.all(cg>=cache["gw"][:n],axis=1)

    k=max(1,len(candidate.players)); h=float(frontier_epsilon)+_TWO_DP_ROUND_ERROR; s=(float(frontier_epsilon)+_FOUR_DP_ROUND_ERROR)*k
    front_dom=(a[:,0]<=c[0])&(a[:,5]<=c[5])&(a[:,6]<=c[6])&(a[:,7]<=c[7])&(a[:,8]<=c[8])&(a[:,9]<=c[9])&(a[:,1]>=c[1])&(a[:,2]>=c[2])&(a[:,3]>=c[3])&(a[:,4]>=c[4])&(a[:,10]>=c[10])&(a[:,11]>=c[11])
    front_dom &= (a[:,1]>c[1]+h)|(a[:,2]>c[2]+h)|(a[:,3]>c[3]+h)|(a[:,4]>c[4]+h)|(a[:,9]+s<c[9])|(a[:,10]>c[10]+s)|(a[:,11]>c[11]+s)
    front_rev=(c[0]<=a[:,0])&(c[5]<=a[:,5])&(c[6]<=a[:,6])&(c[7]<=a[:,7])&(c[8]<=a[:,8])&(c[9]<=a[:,9])&(c[1]>=a[:,1])&(c[2]>=a[:,2])&(c[3]>=a[:,3])&(c[4]>=a[:,4])&(c[10]>=a[:,10])&(c[11]>=a[:,11])
    front_rev &= (c[1]>a[:,1]+h)|(c[2]>a[:,2]+h)|(c[3]>a[:,3]+h)|(c[4]>a[:,4]+h)|(c[9]+s<a[:,9])|(c[10]>a[:,10]+s)|(c[11]>a[:,11]+s)

    dom=rank_dom if relation is rank_dominates else front_dom if relation is frontier_dominates else (rank_dom&front_dom)
    rev=rank_rev if relation is rank_dominates else front_rev if relation is frontier_dominates else (rank_rev&front_rev)
    _metric_add(metrics,"dominance_full_checks",n)
    if bool(np.any(dom)):
        _metric_add(metrics,"frontier_insert_rejected")
        return False,[]
    displaced=[row for row,flag in zip(layer,rev.tolist()) if flag]
    if displaced:
        ids={id(row) for row in displaced}; layer[:]=[row for row in layer if id(row) not in ids]
        _metric_add(metrics,"frontier_states_displaced",len(displaced))
        _LAYER_VECTOR_CACHE.pop(id(layer),None)
    layer.append(candidate)
    if displaced:
        _LAYER_VECTOR_CACHE.pop(id(layer),None)
    else:
        _layer_append_cache(layer,candidate)
    return True,displaced
'''
          path.write_text(text[:start]+replacement+text[end:])
          PY
          python -m py_compile src/engines/v4_full_universe_exact_state_frontier.py
      - name: Exact semantic oracle tests
        run: python -m pytest -q tests/test_v4_full_universe_exact_state_frontier.py tests/test_v4_full_universe_authority_fail_closed.py
      - name: Production-scale exact frontier regression
        run: /usr/bin/time -f 'regression_elapsed=%e' python -m pytest -q tests/test_v4_exact_frontier_production_scale.py
