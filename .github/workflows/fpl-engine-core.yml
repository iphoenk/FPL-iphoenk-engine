name: FPL V4 reusable production core

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      publish:
        required: true
        type: boolean

permissions:
  contents: write

env:
  RUNTIME_BRANCH: runtime-data-v4

jobs:
  validate-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Capture production baseline for decision comparison
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/v4-before"
          rm -rf "$baseline"
          mkdir -p "$baseline"
          if git ls-remote --exit-code --heads origin "$RUNTIME_BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "+refs/heads/${RUNTIME_BRANCH}:refs/remotes/origin/${RUNTIME_BRANCH}"
            for file in checkpoint_decision_v4.json serving_payload_v4.json serving_benchmark_v4.json; do
              if git cat-file -e "origin/${RUNTIME_BRANCH}:data/${file}" 2>/dev/null; then
                git show "origin/${RUNTIME_BRANCH}:data/${file}" > "$baseline/$file"
              fi
            done
          fi

      - name: Hydrate latest V4 runtime state
        if: inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$RUNTIME_BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "+refs/heads/${RUNTIME_BRANCH}:refs/remotes/origin/${RUNTIME_BRANCH}"
            if git cat-file -e "origin/${RUNTIME_BRANCH}:data" 2>/dev/null; then
              git archive "origin/${RUNTIME_BRANCH}" data | tar -x -C "$GITHUB_WORKSPACE"
              echo "Hydrated runtime state from ${RUNTIME_BRANCH}"
            fi
          else
            echo "No ${RUNTIME_BRANCH} branch yet; using canonical seed data"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install cached dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Unit and acceptance tests
        id: deterministic_tests
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short 2>&1 | tee pytest-diagnostic.txt
          test_exit=${PIPESTATUS[0]}
          set -e
          exit "$test_exit"

      - name: Upload deterministic failure diagnostics
        if: failure() && steps.deterministic_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: pytest-diagnostic.txt
          if-no-files-found: error
          retention-days: 7

      - name: Run 8 bounded DAG-parallel V4 services
        run: python -m src.services.orchestrator daily --stats --deep-stats

      - name: Centralized V4 core quality gate
        run: python -m src.engines.v4_quality_gate

      - name: Core acceptance summary
        run: |
          python - <<'PY'
          import json
          h=json.load(open('data/framework_health_v4.json'))
          o=json.load(open('data/service_orchestration_v4.json'))
          a=json.load(open('data/architecture_ownership_v4.json'))
          c=json.load(open('data/checkpoint_decision_v4.json'))
          telemetry=(h.get('capability_telemetry') or {})
          assert len((telemetry.get('capabilities') or {})) == 17, telemetry
          assert telemetry.get('false_green_forbidden') is True, telemetry
          print({'pipeline_health':h['pipeline_health'],'capability_coverage':h['capability_coverage'],'capability_telemetry':telemetry.get('summary'),'gate0':h['gate0']['counts'],'services':o['summary']['services_passed'],'orchestration_ms':o['duration_ms'],'architecture_guard':a['status'],'action':c['action_state']})
          PY

      - name: Build before-after decision diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          baseline = Path(os.environ['RUNNER_TEMP']) / 'v4-before'
          output = Path('v4-before-after-diagnostic.json')

          def load(path):
              try:
                  return json.loads(Path(path).read_text())
              except (FileNotFoundError, json.JSONDecodeError):
                  return {}

          before_c = load(baseline / 'checkpoint_decision_v4.json')
          before_s = load(baseline / 'serving_payload_v4.json')
          before_b = load(baseline / 'serving_benchmark_v4.json')
          after_c = load('data/checkpoint_decision_v4.json')
          after_s = load('data/serving_payload_v4.json')
          after_b = load('data/serving_benchmark_v4.json')
          orchestration = load('data/service_orchestration_v4.json')

          def ids(rows):
              return [row.get('element') for row in (rows or [])]

          def transfer(checkpoint):
              t = (((checkpoint.get('canonical_resolution') or {}).get('dimensions') or {}).get('transfer') or {})
              return {
                  'action': t.get('action'),
                  'candidate_state': t.get('candidate_state'),
                  'out': ids(t.get('out')),
                  'in': ids(t.get('in')),
                  'expected_net_gain_3_5gw': t.get('expected_net_gain_3_5gw'),
                  'multi_horizon_projection': t.get('multi_horizon_projection'),
                  'execution_authorized': t.get('execution_authorized'),
                  'blocking_reasons': t.get('blocking_reasons') or [],
              }

          def compact(checkpoint, serving, benchmark):
              resolution = checkpoint.get('canonical_resolution') or {}
              dims = resolution.get('dimensions') or {}
              freshness = resolution.get('freshness') or {}
              tactical = serving.get('tactical') or {}
              quick = benchmark.get('quick_serving') or {}
              return {
                  'generated_at': serving.get('generated_at') or checkpoint.get('evaluated_at'),
                  'overall_action': resolution.get('overall_action') or checkpoint.get('action_state'),
                  'headline': resolution.get('headline') or checkpoint.get('headline'),
                  'squad_action': (dims.get('squad') or {}).get('action'),
                  'transfer': transfer(checkpoint),
                  'formation': serving.get('formation'),
                  'xi_elements': ids(serving.get('xi')),
                  'bench_elements': ids(serving.get('bench')),
                  'captain_element': (serving.get('captain') or {}).get('element'),
                  'vice_captain_element': (serving.get('vice_captain') or {}).get('element'),
                  'captaincy_action': (dims.get('captaincy') or {}).get('action'),
                  'chip_action': (dims.get('chip') or {}).get('action'),
                  'planning_chip': (dims.get('chip') or {}).get('planning_chip'),
                  'price_action': (dims.get('price') or {}).get('action'),
                  'tactical_owned_count': len(tactical.get('owned') or []),
                  'tactical_watchlist_count': len(tactical.get('watchlist') or []),
                  'freshness_state': freshness.get('freshness_state'),
                  'freshness_mode': freshness.get('freshness_mode'),
                  'source_age_minutes': freshness.get('source_age_minutes'),
                  'quick_serving_ms': quick.get('actual_ms'),
              }

          before = compact(before_c, before_s, before_b) if before_c and before_s else None
          after = compact(after_c, after_s, after_b)
          comparable = before is not None
          stable_fields = [
              'overall_action', 'squad_action', 'formation', 'xi_elements', 'bench_elements',
              'captain_element', 'vice_captain_element', 'captaincy_action', 'chip_action',
              'planning_chip', 'price_action', 'tactical_owned_count', 'tactical_watchlist_count',
          ]
          changed = {key: {'before': before.get(key), 'after': after.get(key)}
                     for key in stable_fields if comparable and before.get(key) != after.get(key)}
          transfer_changed = comparable and before.get('transfer') != after.get('transfer')
          result = {
              'schema_version': 1,
              'purpose': 'PR validation evidence only; comparison is diagnostic, not an equality gate because Official FPL state can legitimately refresh between runs',
              'baseline_source': 'runtime-data-v4' if comparable else 'UNAVAILABLE',
              'after_source': 'current PR validation run',
              'before': before,
              'after': after,
              'comparison': {
                  'comparable': comparable,
                  'stable_field_changes': changed,
                  'transfer_changed': transfer_changed,
                  'exact_structural_parity': comparable and not changed,
                  'decision_consistency': {
                      'headline_matches_overall': str(after.get('headline') or '').startswith(str(after.get('overall_action') or '')),
                      'exact_15_owned': len(after_s.get('owned_15') or []) == 15,
                      'exact_20_watchlist': len(after_s.get('watchlist_20') or []) == 20,
                      'exact_11_xi': len(after_s.get('xi') or []) == 11,
                      'exact_4_bench': len(after_s.get('bench') or []) == 4,
                  },
                  'performance': {
                      'orchestration_ms': orchestration.get('duration_ms'),
                      'quick_serving_after_ms': after.get('quick_serving_ms'),
                      'quick_serving_before_ms': before.get('quick_serving_ms') if comparable else None,
                  },
              },
          }
          output.write_text(json.dumps(result, indent=2, ensure_ascii=False) + '\n')
          print(json.dumps(result['comparison'], ensure_ascii=False))
          PY

      - name: Upload before-after decision diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: v4-before-after-${{ github.run_id }}-${{ github.run_attempt }}
          path: v4-before-after-diagnostic.json
          if-no-files-found: error
          retention-days: 14

      - name: Stamp runtime publication freshness
        if: inputs.publish
        run: python -m src.services.runtime_publish_stamp

      - name: Publish core branch data
        if: inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          publish_tree="$RUNNER_TEMP/v4-runtime-core"
          rm -rf "$publish_tree"
          git config user.name "fpl-iphoenk-bot"
          git config user.email "actions@users.noreply.github.com"
          git worktree add --detach "$publish_tree" HEAD
          cd "$publish_tree"
          git checkout --orphan runtime-snapshot
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$GITHUB_WORKSPACE/data" ./data
          git add -f data/
          git commit -m "data(v4): prediction acceptance snapshot [skip ci]"
          git push --force origin HEAD:"$RUNTIME_BRANCH"

      - name: Advanced enrichment ablation post-publish diagnostic gate
        run: |
          python -m src.engines.v4_advanced_ablation
          python - <<'PY'
          import json
          a=json.load(open('data/advanced_ablation_v4.json'))
          assert a['status']=='PASS', a
          assert a['ablation']['full_shadow_parity']['ok'] is True, a
          assert a['interpretation']['impact_is_diagnostic_not_health_threshold'] is True, a
          PY

      - name: Repeated FAST and warm-serving p95 benchmark
        if: inputs.publish == false
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          import statistics
          import subprocess
          from pathlib import Path

          runs=[]
          repeat_count=5
          for index in range(repeat_count):
              subprocess.run(['python','-m','src.services.hot_orchestrator','daily','--stats','--deep-stats'], check=True)
              h=json.load(open('data/hot_orchestration_v4.json'))
              assert h['status']=='PASS', h
              assert h['guardrails']['official_fpl_refreshed_this_run'] is True, h
              assert h['guardrails']['exact_optimizer_search_width_unchanged'] is True, h
              runs.append({
                  'run': index + 1,
                  'total_e2e_ms': float(h['total_e2e_ms']),
                  'serving_e2e_ms': float(h['serving_e2e_excluding_startup_assurance_ms']),
                  'decision_ms': float(h['decision_compute_ms']),
                  'official_ms': float(h['official_acquisition_ms']),
                  'optimizer_cache_hit': bool(h['optimizer_cache_hit']),
              })

          def p95(values):
              ordered=sorted(values)
              return ordered[max(0, min(len(ordered)-1, math.ceil(0.95*len(ordered))-1))]

          serving=[row['serving_e2e_ms'] for row in runs]
          total=[row['total_e2e_ms'] for row in runs]
          warm=json.load(open('data/serving_benchmark_v4.json')).get('warm_serving') or {}
          result={
              'schema_version': 1,
              'runs': runs,
              'fast_serving': {
                  'run_count': repeat_count,
                  'median_ms': round(statistics.median(serving), 2),
                  'p95_ms': round(p95(serving), 2),
                  'target_p95_ms': 3000.0,
              },
              'full_hot_path': {
                  'median_ms': round(statistics.median(total), 2),
                  'p95_ms': round(p95(total), 2),
              },
              'warm_serving': warm,
              'guardrails': {
                  'repeated_production_sized_runs': True,
                  'official_refreshed_each_fast_run': True,
                  'decision_intelligence_preserved': True,
                  'optimizer_search_width_unchanged': True,
              },
          }
          result['fast_serving']['status']='PASS' if result['fast_serving']['p95_ms'] < 3000.0 else 'FAIL'
          Path('data/hot_orchestration_benchmark_v4.json').write_text(json.dumps(result,indent=2)+'\n')
          assert result['fast_serving']['status']=='PASS', result
          assert int(warm.get('runs') or 0) >= 25, warm
          assert float(warm.get('p95_ms') or 1e9) < 1000.0, warm
          assert warm.get('status') == 'PASS', warm
          print(json.dumps({'fast':result['fast_serving'],'warm':warm},ensure_ascii=False))
          PY

      - name: Upload E2E hot-path benchmark
        if: inputs.publish == false
        uses: actions/upload-artifact@v4
        with:
          name: v4-hot-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/hot_orchestration_v4.json
            data/hot_orchestration_benchmark_v4.json
            data/serving_benchmark_v4.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish ablation diagnostic data
        if: inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          publish_tree="$RUNNER_TEMP/v4-runtime-ablation"
          rm -rf "$publish_tree"
          git config user.name "fpl-iphoenk-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch --depth=1 origin "+refs/heads/${RUNTIME_BRANCH}:refs/remotes/origin/${RUNTIME_BRANCH}"
          git worktree add --detach "$publish_tree" "origin/${RUNTIME_BRANCH}"
          mkdir -p "$publish_tree/data"
          cp "$GITHUB_WORKSPACE/data/advanced_ablation_v4.json" "$publish_tree/data/advanced_ablation_v4.json"
          cd "$publish_tree"
          git add data/advanced_ablation_v4.json
          if git diff --cached --quiet; then echo "No ablation data changes"; exit 0; fi
          git commit -m "data(v4): advanced ablation diagnostic [skip ci]"
          git push origin HEAD:"$RUNTIME_BRANCH"

      - name: Verify published V4 runtime snapshot
        if: inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "+refs/heads/${RUNTIME_BRANCH}:refs/remotes/origin/${RUNTIME_BRANCH}"
          git cat-file -e "origin/${RUNTIME_BRANCH}:data/framework_health_v4.json"
          git cat-file -e "origin/${RUNTIME_BRANCH}:data/latest.json"
          git cat-file -e "origin/${RUNTIME_BRANCH}:data/advanced_ablation_v4.json"
          git cat-file -e "origin/${RUNTIME_BRANCH}:data/serving_payload_v4.json"
          git cat-file -e "origin/${RUNTIME_BRANCH}:data/serving_benchmark_v4.json"
          python - <<'PY'
          import json, subprocess
          raw=subprocess.check_output(['git','show','origin/runtime-data-v4:data/latest.json'],text=True)
          latest=json.loads(raw)
          assert latest.get('runtime_publish_at'), latest
          assert latest.get('freshness_state') in {'FRESH','PARTIAL','STALE','UNKNOWN'}, latest
          health=json.loads(subprocess.check_output(['git','show','origin/runtime-data-v4:data/framework_health_v4.json'],text=True))
          telemetry=health.get('capability_telemetry') or {}
          assert len(telemetry.get('capabilities') or {}) == 17, telemetry
          assert telemetry.get('false_green_forbidden') is True, telemetry
          benchmark=json.loads(subprocess.check_output(['git','show','origin/runtime-data-v4:data/serving_benchmark_v4.json'],text=True))
          warm=benchmark.get('warm_serving') or {}
          assert int(warm.get('runs') or 0) >= 25, warm
          assert float(warm.get('p95_ms') or 1e9) < 1000.0, warm
          PY
          echo "Published V4 runtime snapshot to ${RUNTIME_BRANCH}"
