name: V12 integrated report runner

on:
  # TEMPORARY P1-N branch-acceptance trigger. Remove after evidence capture.
  push:
    branches:
      - delivery/private-plane-p1-20260926-r2
  workflow_dispatch:
    inputs:
      report_mode:
        description: Canonical report mode
        required: true
        default: DEEP
        type: string
      report_slot:
        description: Exact Asia/Jakarta report occurrence ISO-8601
        required: true
        type: string
      checkpoint_time:
        description: Optional visible checkpoint HH:MM
        required: false
        default: ""
        type: string
      profile_mode:
        description: Performance profiling mode (OFF or COLD)
        required: false
        default: "OFF"
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: v12-report-${{ github.event_name }}-${{ github.sha }}-${{ github.event.issue.number || inputs.report_slot }}
  cancel-in-progress: false

jobs:
  parse:
    if: >-
      (
        github.event_name == 'push' &&
        github.actor == github.repository_owner &&
        github.ref_name == 'delivery/private-plane-p1-20260926-r2'
      ) ||
      (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 431 &&
        github.event.comment.user.login == github.repository_owner &&
        startsWith(github.event.comment.body, '/v12-report-run')
      )
    runs-on: ubuntu-latest
    outputs:
      report_mode: ${{ steps.args.outputs.report_mode }}
      report_slot: ${{ steps.args.outputs.report_slot }}
      checkpoint_time: ${{ steps.args.outputs.checkpoint_time }}
      profile_mode: ${{ steps.args.outputs.profile_mode }}
    steps:
      - id: args
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.report_mode }}
          INPUT_SLOT: ${{ inputs.report_slot }}
          INPUT_CHECKPOINT: ${{ inputs.checkpoint_time }}
          INPUT_PROFILE_MODE: ${{ inputs.profile_mode }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          if os.environ["EVENT_NAME"] == "push":
              mode = "DEEP"
              slot = datetime.now(ZoneInfo("Asia/Jakarta")).replace(
                  microsecond=0
              ).isoformat()
              checkpoint = ""
              profile_mode = "OFF"
          elif os.environ["EVENT_NAME"] == "workflow_dispatch":
              mode = os.environ.get("INPUT_MODE") or "DEEP"
              slot = os.environ.get("INPUT_SLOT") or ""
              if slot.strip().upper() == "AUTO":
                  if os.environ.get("REF_NAME") == "main":
                      raise SystemExit("AUTO report_slot is branch-acceptance only")
                  slot = datetime.now(ZoneInfo("Asia/Jakarta")).replace(
                      microsecond=0
                  ).isoformat()
              checkpoint = os.environ.get("INPUT_CHECKPOINT") or ""
              profile_mode = os.environ.get("INPUT_PROFILE_MODE") or "OFF"
          else:
              body = os.environ.get("COMMENT_BODY") or ""
              def arg(name, default=""):
                  m = re.search(rf"(?:^|\s){re.escape(name)}=([^\s]+)", body)
                  return m.group(1) if m else default
              mode = arg("report_mode", "DEEP")
              slot = arg("report_slot")
              checkpoint = arg("checkpoint_time")
              profile_mode = arg("profile_mode", "OFF")
          profile_mode = str(profile_mode or "OFF").upper()
          if profile_mode not in {"OFF", "COLD"}:
              raise SystemExit("profile_mode must be OFF or COLD")
          if not slot:
              raise SystemExit("report_slot is required")
          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as fh:
              fh.write(f"report_mode={mode.upper()}\n")
              fh.write(f"report_slot={slot}\n")
              fh.write(f"checkpoint_time={checkpoint}\n")
              fh.write(f"profile_mode={profile_mode}\n")
          PY

  run:
    needs: parse
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_CORETYPE: Haswell
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      NPY_DISABLE_CPU_FEATURES: "X86_V4,AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR"
    # issue_comment is cache-read-only by default. This job is owner-gated above
    # and checks out only production main/runtime-data, so explicit cache write
    # cannot be populated from commenter-controlled code.
    cache-mode: write
    steps:
      - name: Checkout report code authority
        uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref_name || 'main' }}
          path: app

      - name: Checkout factual runtime-data-v6
        uses: actions/checkout@v4
        with:
          ref: runtime-data-v6
          path: runtime-data

      - name: Checkout private decision and personal data plane
        uses: actions/checkout@v4
        with:
          repository: iphoenk/fpl-reports-private
          ref: main
          path: private-reports
          token: ${{ secrets.FPL_PRIVATE_REPORTS_TOKEN }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare branch-only real DEEP acceptance snapshot
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref_name != 'main' && needs.parse.outputs.report_mode == 'DEEP'
        working-directory: app
        env:
          REPORT_SLOT: ${{ needs.parse.outputs.report_slot }}
          FPL_AUTH_MODE: ${{ vars.FPL_AUTH_MODE || 'disabled' }}
          FPL_SESSION_B64: ${{ secrets.FPL_SESSION_B64 }}
          FPL_ACCESS_TOKEN: ${{ secrets.FPL_ACCESS_TOKEN }}
          FPL_TEAM_ID: ${{ vars.FPL_TEAM_ID }}
          FPL_PRIORITY_LEAGUES: ${{ vars.FPL_PRIORITY_LEAGUES }}
        shell: bash
        run: |
          set -euo pipefail
          private_prefetch_log="$RUNNER_TEMP/p1-real-prefetch-private.log"
          legacy_current_team_hash=""
          if [ -f ../runtime-data/data/v6/personal/current_team.json ]; then
            legacy_current_team_hash="$(sha256sum ../runtime-data/data/v6/personal/current_team.json | awk '{print $1}')"
          fi

          set +e
          python -m src.runtime_v6.domains.report_plane.report_prefetch \
            --report-kind full_master \
            --logical-slot "$REPORT_SLOT" \
            --requested-by "P1_REAL_DEEP_BRANCH_ACCEPTANCE" \
            --requested-for-report "DEEP" \
            --personal \
            --mini-league \
            --force \
            --output-root ../runtime-data/data/v6 \
            >"$private_prefetch_log" 2>&1
          rc=$?
          set -e
          if [[ $rc -ne 0 && $rc -ne 3 ]]; then
            echo "P1_REAL_PREFETCH=FAIL"
            exit "$rc"
          fi

          rm -rf ../acceptance-private-input ../acceptance-public-sanitize
          mkdir -p ../acceptance-private-input ../acceptance-public-sanitize

          auth_candidate="false"
          if [ -f ../runtime-data/data/v6/personal/current_team.json ]; then
            current_hash="$(sha256sum ../runtime-data/data/v6/personal/current_team.json | awk '{print $1}')"
            if [ -z "$legacy_current_team_hash" ] || [ "$current_hash" != "$legacy_current_team_hash" ]; then
              if python - <<'PY'
          import json
          from pathlib import Path

          p = Path("../runtime-data/data/v6/personal/current_team.json")
          obj = json.loads(p.read_text(encoding="utf-8"))
          auth_state = str(obj.get("auth_state") or "").upper()
          if auth_state not in {"AVAILABLE", "AUTH_AVAILABLE"}:
              raise SystemExit(1)
          if not obj.get("generated_at"):
              raise SystemExit(1)
          PY
              then
                auth_candidate="true"
              fi
            fi
          fi

          if [ "$auth_candidate" = "true" ]; then
            python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          p = Path("../runtime-data/data/v6/personal/current_team.json")
          obj = json.loads(p.read_text(encoding="utf-8"))
          payload = json.dumps(
              obj,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=False,
              default=str,
          ).encode("utf-8")
          digest = hashlib.sha256(payload).hexdigest()
          Path("../p1-current-team-pre.sha256").write_text(
              digest + "\n", encoding="utf-8"
          )
          PY

            python -m src.runtime_v6.domains.report_plane.private_boundary \
              --public-root ../runtime-data/data/v6 \
              --private-root ../acceptance-private-input \
              >/dev/null

            python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          before = Path("../p1-current-team-pre.sha256").read_text(
              encoding="utf-8"
          ).strip()
          p = Path("../acceptance-private-input/personal/current_team.json")
          obj = json.loads(p.read_text(encoding="utf-8"))
          payload = json.dumps(
              obj,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=False,
              default=str,
          ).encode("utf-8")
          after = hashlib.sha256(payload).hexdigest()
          if before != after:
              raise SystemExit("P1 current-team semantics changed across private split")
          print(f"P1_PERSONAL_PAYLOAD_IDENTITY={after}")
          PY

            mkdir -p ../private-reports/personal
            cp ../acceptance-private-input/personal/current_team.json \
              ../private-reports/personal/current_team.json
            if [ -d ../acceptance-private-input/personal/snapshots ]; then
              mkdir -p ../private-reports/personal/snapshots
              cp -a ../acceptance-private-input/personal/snapshots/. \
                ../private-reports/personal/snapshots/
            fi
            (
              cd ../private-reports
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -A -- personal
              if ! git diff --cached --quiet; then
                git commit -m "data(private): P1 real acceptance current-team ${GITHUB_RUN_ID}" >/dev/null
                git pull --rebase origin main >/dev/null
                git push origin HEAD:main >/dev/null
              fi
            )
            echo "P1_PERSONAL_SOURCE=AUTH_CURRENT_PRIVATE"
          else
            # The public runtime branch may still contain legacy current-team
            # state until the coordinated P1 cutover. Never consume that stale
            # public copy during branch acceptance. Sanitize it from the
            # ephemeral public tree and validate against an already-private
            # authenticated/manual/owner-state candidate instead.
            rm -f ../runtime-data/data/v6/personal/current_team.json
            python -m src.runtime_v6.domains.report_plane.private_boundary \
              --public-root ../runtime-data/data/v6 \
              --private-root ../acceptance-public-sanitize \
              >/dev/null
            python - <<'PY'
          from pathlib import Path

          root = Path("../private-reports/personal")
          has_current = (root / "current_team.json").is_file()
          has_manual = any((root / "manual").glob("*.json"))
          has_owner = (root / "owner_state.json").is_file()
          if not (has_current or has_manual or has_owner):
              raise SystemExit(
                  "P1 acceptance requires private current/manual/owner state"
              )
          print("P1_PERSONAL_SOURCE=EXISTING_PRIVATE_STATE")
          PY
          fi

          test ! -e ../runtime-data/data/v6/personal/current_team.json
          (
            cd ../runtime-data
            git config user.name "p1-acceptance"
            git config user.email "p1-acceptance@invalid.local"
            git add -A -- data/v6
            if ! git diff --cached --quiet; then
              git commit -m "validation(p1): ephemeral sanitized V6 snapshot ${GITHUB_RUN_ID}" >/dev/null
            fi
          )
          echo "P1_REAL_ACCEPTANCE_SNAPSHOT=PASS"

      - name: Validate normalized numeric runtime and capture physical host
        id: runtime
        working-directory: app
        run: |
          mkdir -p artifacts/v12-report
          python -m src.engines.v12_cache_runtime_identity \
            --output artifacts/v12-report/runtime_environment.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          proof = json.loads(
              Path("artifacts/v12-report/runtime_environment.json").read_text(
                  encoding="utf-8"
              )
          )
          model = str(proof.get("physical_cpu_model") or "UNKNOWN").replace("\n", " ")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as fh:
              fh.write(f"physical_cpu_model={model}\n")
          PY

      - name: Enforce active V12-only execution boundary
        working-directory: app
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path("src/engines/v12_integrated_report_runner.py").read_text(encoding="utf-8")
          forbidden = (
              "from src.runtime_v3",
              "import src.runtime_v3",
              "from src.runtime_v4",
              "import src.runtime_v4",
              "from src.runtime_v5",
              "import src.runtime_v5",
              "full_authority_cache",
          )
          bad = [token for token in forbidden if token in src]
          if bad:
              raise SystemExit(f"legacy execution boundary violated: {bad}")
          PY

      - name: Restore deterministic Stage-2 derived projection cache
        if: needs.parse.outputs.profile_mode != 'COLD'
        id: stage2-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: app/.cache/v12-stage2
          key: v12-stage2-derived-${{ runner.os }}-${{ hashFiles('app/src/engines/v12_stage2_derived_cache.py', 'app/src/models/historical_projection.py', 'app/src/engines/v12_contextual_dynamics.py', 'app/src/engines/v12_player_events.py', 'app/src/engines/v12_player_minutes.py', 'app/src/engines/v12_position_probability_components.py', 'app/src/engines/p0_decision_quality.py', 'app/src/models/v12_stage1_analytics.py', 'app/src/rules.py', 'app/config/intelligence/player_events.json', 'app/config/intelligence/player_minutes.json', 'app/config/intelligence/historical_priors.json', 'app/config/intelligence/v12_contextual_dynamics.json') }}-${{ github.run_id }}
          restore-keys: |
            v12-stage2-derived-${{ runner.os }}-${{ hashFiles('app/src/engines/v12_stage2_derived_cache.py', 'app/src/models/historical_projection.py', 'app/src/engines/v12_contextual_dynamics.py', 'app/src/engines/v12_player_events.py', 'app/src/engines/v12_player_minutes.py', 'app/src/engines/v12_position_probability_components.py', 'app/src/engines/p0_decision_quality.py', 'app/src/models/v12_stage1_analytics.py', 'app/src/rules.py', 'app/config/intelligence/player_events.json', 'app/config/intelligence/player_minutes.json', 'app/config/intelligence/historical_priors.json', 'app/config/intelligence/v12_contextual_dynamics.json') }}-

      - name: Ensure Stage-2 derived cache directory
        working-directory: app
        run: mkdir -p .cache/v12-stage2

      # P1 privacy: exact P1.7 and MC payloads contain private decision state.
      # They remain runner-local and never enter the public GitHub Actions cache.
      - name: Ensure ephemeral P1.7 decision-cache directory
        working-directory: app
        run: mkdir -p .cache/v12-p17

      - name: Ensure ephemeral MC decision-cache directory
        working-directory: app
        run: mkdir -p .cache/v12-mc

      - name: Restore previous valid DEEP baseline from private history
        if: needs.parse.outputs.report_mode == 'DEEP'
        working-directory: app
        env:
          REPORT_SLOT: ${{ needs.parse.outputs.report_slot }}
          GH_TOKEN: ${{ github.token }}
          P1_BRANCH_ACCEPTANCE: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref_name != 'main' }}
        run: |
          set -euo pipefail
          rm -rf artifacts/previous-deep
          python - <<'PY'
          import json
          import os
          import shutil
          from datetime import datetime
          from pathlib import Path

          target = datetime.fromisoformat(os.environ["REPORT_SLOT"].replace("Z", "+00:00"))
          root = Path("../private-reports/reports")
          candidates = []
          for path in root.glob("**/report_bundle.json"):
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
                  if str(payload.get("report_mode") or "").upper() != "DEEP":
                      continue
                  slot = datetime.fromisoformat(
                      str(payload.get("report_slot") or "").replace("Z", "+00:00")
                  )
                  if slot < target:
                      candidates.append((slot, path.parent))
              except (OSError, ValueError, json.JSONDecodeError):
                  continue
          if candidates:
              _, source = max(candidates, key=lambda item: item[0])
              dest = Path("artifacts/previous-deep")
              shutil.copytree(source, dest)
              print("PREVIOUS_PRIVATE_DEEP_BASELINE=AVAILABLE")
          else:
              print("PREVIOUS_PRIVATE_DEEP_BASELINE=UNAVAILABLE")
          PY
          if [ ! -f artifacts/previous-deep/report_bundle.json ] && [ "$P1_BRANCH_ACCEPTANCE" = "true" ]; then
            rm -rf artifacts/previous-deep-candidate
            for run_id in $(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/v12-integrated-report-runner.yml/runs?branch=main&status=success&per_page=20" \
              --jq '.workflow_runs[].id'); do
              artifact_name="v12-report-DEEP-${run_id}"
              rm -rf artifacts/previous-deep-candidate
              if gh run download "$run_id" \
                --repo "${GITHUB_REPOSITORY}" \
                --name "$artifact_name" \
                --dir artifacts/previous-deep-candidate >/dev/null 2>&1; then
                if [ -f artifacts/previous-deep-candidate/report_bundle.json ]; then
                  mv artifacts/previous-deep-candidate artifacts/previous-deep
                  echo "P1_ACCEPTANCE_LEGACY_BASELINE=AVAILABLE"
                  break
                fi
              fi
            done
            rm -rf artifacts/previous-deep-candidate
          fi

      - name: Execute occurrence-bound integrated report
        id: report
        working-directory: app
        env:
          REPORT_MODE: ${{ needs.parse.outputs.report_mode }}
          REPORT_SLOT: ${{ needs.parse.outputs.report_slot }}
          CHECKPOINT_TIME: ${{ needs.parse.outputs.checkpoint_time }}
          PROFILE_MODE: ${{ needs.parse.outputs.profile_mode }}
          V12_STAGE2_DERIVED_CACHE_DIR: .cache/v12-stage2
          V12_P17_DECISION_CACHE_DIR: .cache/v12-p17
          V12_MC_SIM_CACHE_DIR: .cache/v12-mc
        run: |
          private_input_root="../private-reports"
          if [ -f ../acceptance-private-input/personal/current_team.json ]; then
            private_input_root="../acceptance-private-input"
          fi
          args=(
            --runtime-data-root "../runtime-data"
            --private-data-root "$private_input_root"
            --disable-legacy-private-sources
            --require-private-personal
            --report-mode "$REPORT_MODE"
            --report-slot "$REPORT_SLOT"
            --output-dir "artifacts/v12-report"
          )
          if [ -n "$CHECKPOINT_TIME" ]; then
            args+=(--checkpoint-time "$CHECKPOINT_TIME")
          fi
          if [ -f artifacts/previous-deep/report_bundle.json ]; then
            args+=(--previous-visible-deep-dir "artifacts/previous-deep")
          fi
          mkdir -p artifacts/v12-private-delivery
          private_log="artifacts/v12-private-delivery/runner.log"
          if [ "$PROFILE_MODE" = "COLD" ]; then
            rm -rf .cache/v12-stage2 .cache/v12-p17 .cache/v12-mc
            mkdir -p \
              .cache/v12-stage2 \
              .cache/v12-p17 \
              .cache/v12-mc \
              artifacts/v12-report/stage-profiles
            export V12_STAGE_PROFILE_DIR="artifacts/v12-report/stage-profiles"
          fi
          set +e
          python -m src.engines.v12_integrated_report_runner "${args[@]}" \
            >"$private_log" 2>&1
          runner_status=$?
          set -e
          unset V12_STAGE_PROFILE_DIR || true
          if [ "$PROFILE_MODE" = "COLD" ]; then
            python -m src.engines.v12_profile_summary \
              --profile-dir artifacts/v12-report/stage-profiles \
              --log "$private_log" \
              --output-json artifacts/v12-report/profile_summary.json \
              --output-md artifacts/v12-report/profile_summary.md >/dev/null 2>&1 || true
          fi
          python -m src.engines.v12_delivery_security scan-log --path "$private_log"
          grep -E '^\[(V12_STAGE|V12_STAGE2_CACHE|P1_2B_PERF)\]' "$private_log" || true
          exit "$runner_status"

      - name: Persist deterministic Stage-2 derived projection cache before downstream acceptance
        if: always() && needs.parse.outputs.report_mode == 'DEEP' && needs.parse.outputs.profile_mode != 'COLD'
        uses: actions/cache/save@v4
        with:
          path: app/.cache/v12-stage2
          key: v12-stage2-derived-${{ runner.os }}-${{ hashFiles('app/src/engines/v12_stage2_derived_cache.py', 'app/src/models/historical_projection.py', 'app/src/engines/v12_contextual_dynamics.py', 'app/src/engines/v12_player_events.py', 'app/src/engines/v12_player_minutes.py', 'app/src/engines/v12_position_probability_components.py', 'app/src/engines/p0_decision_quality.py', 'app/src/models/v12_stage1_analytics.py', 'app/src/rules.py', 'app/config/intelligence/player_events.json', 'app/config/intelligence/player_minutes.json', 'app/config/intelligence/historical_priors.json', 'app/config/intelligence/v12_contextual_dynamics.json') }}-${{ github.run_id }}

      - name: Read integrated runner proof
        id: proof
        working-directory: app
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          proof = json.loads(
              Path("artifacts/v12-report/execution_proof.json").read_text(encoding="utf-8")
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as fh:
              fh.write(f"runner_status={proof.get('runner_status', 'UNKNOWN')}\n")
              fh.write(f"pre_render={proof.get('pre_render_qa_status', 'UNKNOWN')}\n")
              fh.write(f"post_render={proof.get('post_render_qa_status', 'UNKNOWN')}\n")
              fh.write(f"human_facing={proof.get('human_facing_qa_status', 'UNKNOWN')}\n")
          PY

      - name: Enforce Stage3 natural integrated acceptance
        if: needs.parse.outputs.report_mode == 'DEEP'
        id: stage3
        working-directory: app
        run: |
          model_sha="$(git rev-parse HEAD)"
          runtime_sha="$(git -C ../runtime-data rev-parse HEAD)"
          private_input_root="../private-reports"
          if [ -f ../acceptance-private-input/personal/current_team.json ]; then
            private_input_root="../acceptance-private-input"
          fi
          mkdir -p artifacts/v12-private-delivery
          python -m src.engines.v12_stage3_acceptance \
            --bundle artifacts/v12-report/report_bundle.json \
            --runtime-data-root ../runtime-data \
            --private-data-root "$private_input_root" \
            --model-sha "$model_sha" \
            --runtime-sha "$runtime_sha" \
            --canonical control/fpl_master_v12/FPL_MASTER_CANONICAL_V12.txt \
            --output artifacts/v12-report/stage3_acceptance.json \
            >artifacts/v12-private-delivery/stage3.log 2>&1
          python - <<'PY'
          import json, os
          from pathlib import Path
          proof = json.loads(
              Path("artifacts/v12-report/stage3_acceptance.json").read_text(
                  encoding="utf-8"
              )
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as fh:
              fh.write(f"status={proof.get('status', 'UNKNOWN')}\n")
          PY

      - name: Record Stage3 not applicable for PRICE
        if: needs.parse.outputs.report_mode == 'PRICE'
        working-directory: app
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          Path("artifacts/v12-report/stage3_acceptance.json").write_text(
              json.dumps(
                  {
                      "status": "NOT_APPLICABLE",
                      "report_mode": "PRICE",
                      "reason": "PRICE delivery barrier does not execute or alter Stage3/MC",
                  },
                  indent=2,
              ),
              encoding="utf-8",
          )
          PY

      - name: Publish canonical output to private repository
        if: always()
        id: private_delivery
        working-directory: app
        env:
          REPORT_MODE: ${{ needs.parse.outputs.report_mode }}
          REPORT_SLOT: ${{ needs.parse.outputs.report_slot }}
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/v12-private-delivery
          model_sha="$(git rev-parse HEAD)"
          runtime_sha="$(git -C ../runtime-data rev-parse HEAD)"
          python -m src.engines.v12_private_publisher \
            --canonical-dir artifacts/v12-report \
            --private-root ../private-reports \
            --run-id "${GITHUB_RUN_ID}" \
            --model-sha "$model_sha" \
            --runtime-sha "$runtime_sha" \
            --receipt-out artifacts/v12-private-delivery/receipt.json \
            >artifacts/v12-private-delivery/publisher.log 2>&1
          publisher_rc=$?
          if [ "$publisher_rc" -eq 0 ]; then
            (
              cd ../private-reports
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add latest reports
              if ! git diff --cached --quiet; then
                git commit -m "report(v12): private ${REPORT_MODE} ${REPORT_SLOT} run ${GITHUB_RUN_ID}"
              fi
              git pull --rebase origin main
              git push origin HEAD:main
              local_sha="$(git rev-parse HEAD)"
              remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
              test "$local_sha" = "$remote_sha"
            )
            publisher_rc=$?
          fi
          if [ "$publisher_rc" -eq 0 ]; then
            echo "status=PASS" >> "$GITHUB_OUTPUT"
            echo "PRIVATE_DELIVERY=PASS"
          else
            echo "status=FAIL" >> "$GITHUB_OUTPUT"
            echo "PRIVATE_DELIVERY=FAIL"
          fi
          exit 0

      - name: Build allowlisted public operational proof
        if: always()
        id: public_proof
        working-directory: app
        env:
          REPORT_MODE: ${{ needs.parse.outputs.report_mode }}
          REPORT_SLOT: ${{ needs.parse.outputs.report_slot }}
          PROFILE_MODE: ${{ needs.parse.outputs.profile_mode }}
          PRIVATE_DELIVERY_STATUS: ${{ steps.private_delivery.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail
          model_sha="$(git rev-parse HEAD)"
          runtime_sha="$(git -C ../runtime-data rev-parse HEAD)"
          receipt_arg=()
          if [ -s artifacts/v12-private-delivery/receipt.json ]; then
            receipt_arg=(--private-receipt artifacts/v12-private-delivery/receipt.json)
          fi
          python -m src.engines.v12_delivery_security build-proof \
            --execution-proof artifacts/v12-report/execution_proof.json \
            --stage3-acceptance artifacts/v12-report/stage3_acceptance.json \
            "${receipt_arg[@]}" \
            --report-mode "$REPORT_MODE" \
            --report-slot "$REPORT_SLOT" \
            --run-id "${GITHUB_RUN_ID}" \
            --model-sha "$model_sha" \
            --runtime-sha "$runtime_sha" \
            --private-delivery-status "${PRIVATE_DELIVERY_STATUS:-FAIL}" \
            --profile-mode "${PROFILE_MODE:-OFF}" \
            --output artifacts/v12-public-proof/public_proof.json
          python -m src.engines.v12_delivery_security issue-proof \
            --public-proof artifacts/v12-public-proof/public_proof.json \
            --output artifacts/v12-public-proof/issue_proof.txt

      - name: Upload safe public operational proof only
        if: always() && steps.public_proof.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: v12-public-proof-${{ needs.parse.outputs.report_mode }}-${{ github.run_id }}
          path: app/artifacts/v12-public-proof/public_proof.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish allowlisted completion proof to issue 431
        if: always() && steps.public_proof.outcome == 'success'
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 431 --repo "${GITHUB_REPOSITORY}" \
            --body-file artifacts/v12-public-proof/issue_proof.txt

      - name: Enforce fail-closed human delivery
        if: always()
        env:
          PRIVATE_DELIVERY_STATUS: ${{ steps.private_delivery.outputs.status }}
          PUBLIC_PROOF_OUTCOME: ${{ steps.public_proof.outcome }}
        run: |
          set -euo pipefail
          test "${PRIVATE_DELIVERY_STATUS:-FAIL}" = "PASS"
          test "${PUBLIC_PROOF_OUTCOME:-failure}" = "success"
