name: V12 P1.7 benchmark diagnostics
# validation-sync: 2026-09-24T03:20:00+07:00

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v12-p17-benchmark-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install locked V12 test dependencies
        run: python -m pip install --no-deps -r requirements-ci.lock

      - name: Run five-sample normal and tie-rich P1.7 diagnostics
        run: |
          python scripts/p17_benchmark_diagnostics.py \
            --repeats 5 \
            --scalar-route-count 65 \
            --artifact-dir artifacts/p17-benchmark

      - name: Compare isolated gate versus full-suite gate
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/p17-benchmark
          lscpu > artifacts/p17-benchmark/runtime_environment.txt 2>&1
          python -c 'import numpy as np; print("numpy", np.__version__); np.show_runtime() if hasattr(np, "show_runtime") else np.show_config()' >> artifacts/p17-benchmark/runtime_environment.txt 2>&1

          set +e
          python -m pytest -q tests/test_lineup_distributional_optimizer.py::test_p17_cross_route_batch_2043_routes_five_gw_under_ten_seconds > artifacts/p17-benchmark/isolated_gate.log 2>&1
          isolated_rc=$?
          python -m pytest -q tests/test_lineup_distributional_optimizer.py::test_p17_cross_route_batch_2043_routes_five_gw_tie_rich_under_ten_seconds > artifacts/p17-benchmark/tie_rich_gate.log 2>&1
          tie_rich_rc=$?
          python -m pytest -q tests/test_lineup_distributional_optimizer.py > artifacts/p17-benchmark/lineup_suite.log 2>&1
          suite_rc=$?
          set -e

          python -c 'import json,re; from pathlib import Path; root=Path("artifacts/p17-benchmark"); extract=lambda p: {"elapsed_seconds": (float(m.group(1)) if (m:=re.search(r"assert ([0-9.]+) <= 10\\.0", p.read_text(encoding="utf-8", errors="replace"))) else None), "tail": p.read_text(encoding="utf-8", errors="replace")[-2500:]}; payload={"isolated_gate":extract(root/"isolated_gate.log"),"lineup_suite_gate":extract(root/"lineup_suite.log")}; (root/"gate_context_comparison.json").write_text(json.dumps(payload,indent=2),encoding="utf-8"); print(json.dumps(payload,indent=2))'
          echo "isolated_rc=$isolated_rc"
          echo "tie_rich_rc=$tie_rich_rc"
          echo "suite_rc=$suite_rc"
          exit 0

      - name: Upload benchmark diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p17-benchmark-diagnostics-${{ github.run_id }}
          path: artifacts/p17-benchmark
          if-no-files-found: error
          retention-days: 14
