name: FPL V6 hourly fresh-data acquisition

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Governed V6 invocation mode"
        required: true
        default: "master_orchestrated"
        type: choice
        options:
          - master_orchestrated
          - manual_recovery
      reason:
        description: "Audit reason for governed V6 invocation"
        required: true
        type: string
      confirm:
        description: "For manual_recovery only: type RECOVER_V6"
        required: false
        type: string
  schedule:
    - cron: "23 * * * *"
    - cron: "53 * * * *"

# The built-in GITHUB_TOKEN remains read-only. Runtime write authority is minted
# only from the dedicated V6 publisher GitHub App inside the publish job.
permissions:
  contents: read

concurrency:
  group: fpl-v6-hourly-data-ingestion
  cancel-in-progress: false

env:
  RUNTIME_BRANCH: runtime-data-v6
  V6_SCHEDULE_POLICY: config/v6/schedule_policy.json

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.slot_guard.outputs.skip }}
      schedule_kind: ${{ steps.scheduler.outputs.kind }}
    env:
      V6_PREVIOUS_MANIFEST: /tmp/v6-previous-manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Authorize governed manual recovery and FPL Master orchestration
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          V6_DISPATCH_MODE: ${{ inputs.mode }}
          V6_DISPATCH_REASON: ${{ inputs.reason }}
          V6_MANUAL_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          policy = json.loads(Path(os.environ["V6_SCHEDULE_POLICY"]).read_text(encoding="utf-8"))
          mode = str(os.environ.get("V6_DISPATCH_MODE") or "")
          reason = str(os.environ.get("V6_DISPATCH_REASON") or "").strip()
          if os.environ.get("GITHUB_ACTOR") != os.environ.get("GITHUB_REPOSITORY_OWNER"):
              raise SystemExit("V6 governed dispatch is restricted to the repository owner")
          if not reason:
              raise SystemExit("V6 governed dispatch requires an audit reason")

          if mode == "master_orchestrated":
              master = dict(policy.get("master_orchestrated") or {})
              if master.get("enabled") is not True:
                  raise SystemExit("V6 master orchestration is disabled")
              if master.get("authoritative_runtime_snapshot") is not True:
                  raise SystemExit("V6 master orchestration policy is not authoritative")
              print("Governed V6 FPL Master orchestration authorized")
          elif mode == "manual_recovery":
              manual = dict(policy.get("manual_recovery") or {})
              if manual.get("enabled") is not True:
                  raise SystemExit("V6 governed manual recovery is disabled")
              if os.environ.get("V6_MANUAL_CONFIRM") != str(manual.get("confirmation_phrase") or ""):
                  raise SystemExit("V6 manual recovery confirmation phrase mismatch")
              print("Governed V6 manual recovery authorized")
          else:
              raise SystemExit(f"Unsupported V6 governed dispatch mode: {mode}")
          PY

      - name: Hydrate previous V6 last-good snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf data/v6
          mkdir -p data
          if git fetch origin "${RUNTIME_BRANCH}"; then
            if git cat-file -e "origin/${RUNTIME_BRANCH}:data/v6" 2>/dev/null; then
              git archive "origin/${RUNTIME_BRANCH}" data/v6 | tar -x -C .
              echo "Hydrated previous runtime-data-v6 snapshot"
            else
              echo "runtime-data-v6 exists without data/v6; starting clean"
            fi
          else
            echo "runtime-data-v6 not available yet; starting clean"
          fi
          if [[ -f data/v6/manifest.json ]]; then
            cp data/v6/manifest.json "${V6_PREVIOUS_MANIFEST}"
          else
            printf '{}\n' > "${V6_PREVIOUS_MANIFEST}"
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-v6.lock

      - name: Classify scheduler invocation
        id: scheduler
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          policy = json.loads(Path(os.environ["V6_SCHEDULE_POLICY"]).read_text(encoding="utf-8"))
          event_name = str(os.environ.get("GITHUB_EVENT_NAME") or "")
          schedule = str(event.get("schedule") or "")
          scheduled_kinds = {
              str(policy["primary_cron_utc"]): "primary",
              str(policy["recovery_cron_utc"]): "recovery",
          }
          if event_name == "schedule":
              kind = scheduled_kinds.get(schedule, "scheduled_unknown")
          elif event_name == "workflow_dispatch":
              mode = str((event.get("inputs") or {}).get("mode") or "")
              if mode == "master_orchestrated" and (policy.get("master_orchestrated") or {}).get("enabled") is True:
                  kind = str((policy.get("master_orchestrated") or {}).get("schedule_kind") or "master_orchestrated")
              elif mode == "manual_recovery" and (policy.get("manual_recovery") or {}).get("enabled") is True:
                  kind = str((policy.get("manual_recovery") or {}).get("schedule_kind") or "manual_recovery")
              else:
                  kind = "governed_dispatch_unknown"
          else:
              kind = "non_production_local"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"V6_SCHEDULE_KIND={kind}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"kind={kind}\n")
          print(f"V6 schedule kind: {kind}")
          PY

      - name: Guard already-published logical scheduler slot
        id: slot_guard
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from src.runtime_v6.registry import load_registry
          from src.runtime_v6.runtime_control import scheduled_slot_already_completed

          previous_path = Path(os.environ["V6_PREVIOUS_MANIFEST"])
          previous = json.loads(previous_path.read_text(encoding="utf-8")) if previous_path.exists() else {}
          registry = load_registry()
          interval = int((registry.get("cadence") or {}).get("scheduler_interval_minutes") or 60)
          skip = scheduled_slot_already_completed(
              previous,
              scheduler_interval_minutes=interval,
              event_name=os.environ.get("GITHUB_EVENT_NAME"),
              schedule_kind=os.environ.get("V6_SCHEDULE_KIND"),
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"skip={'true' if skip else 'false'}\n")
          print(f"logical scheduler slot already published: {skip}")
          PY

      - name: Install V6 locked runtime dependencies
        if: steps.slot_guard.outputs.skip != 'true'
        run: python -m pip install --require-hashes -r requirements-v6.lock

      - name: Validate V6 production preflight
        if: steps.slot_guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src/runtime_v6
          python -m src.runtime_v6.architecture_independence_validate
          python - <<'PY'
          from src.runtime_v6.registry import dependency_layers, load_registry

          registry = load_registry()
          assert registry["engine"] == "V6_FRESH_DATA_PLATFORM"
          assert registry["policy"]["data_only"] is True
          assert registry["policy"]["decision_authority"] == "NONE"
          assert registry["policy"]["prediction_authority"] == "NONE"
          assert registry["policy"]["optimizer_authority"] == "NONE"
          assert dependency_layers(registry)
          print({
              "active_sources": registry["activation"]["active_source_count"],
              "required_sources": registry["activation"]["required_active_sources"],
              "dependency_layers": dependency_layers(registry),
          })
          PY

      - name: Run active V6 acquisition cycle
        if: steps.slot_guard.outputs.skip != 'true'
        run: python -m src.runtime_v6.collector

      - name: Apply V6 scheduler and missed-cycle health
        if: steps.slot_guard.outputs.skip != 'true'
        run: python -m src.runtime_v6.runtime_control

      - name: Validate V6 publish-tree integrity
        if: steps.slot_guard.outputs.skip != 'true'
        run: python -m src.runtime_v6.publish_integrity

      - name: Validate publishable V6 manifest
        if: steps.slot_guard.outputs.skip != 'true'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from src.runtime_v6.registry import load_registry

          manifest = json.loads(Path("data/v6/manifest.json").read_text())
          integrity = json.loads(Path("data/v6/health/publish_integrity.json").read_text())
          identity = json.loads(Path("data/v6/evidence/player_identity_map.json").read_text())
          registry = load_registry()
          expected_active = registry["activation"]["active_source_count"]
          required_active = registry["activation"]["required_active_sources"]
          control = manifest["runtime_control"]
          event_name = os.environ["GITHUB_EVENT_NAME"]
          assert manifest["source_count"] == expected_active
          assert manifest["activation"]["required_active_sources"] == required_active
          assert manifest["governance"]["data_only"] is True
          assert manifest["governance"]["decision_authority"] == "NONE"
          assert manifest["governance"]["weather_direct_xpts_multiplier"] is False
          assert manifest["governance"]["production_authoritative_snapshots_require_schedule"] is False
          assert manifest["governance"]["production_authoritative_snapshots_require_governed_trigger"] is True
          assert manifest["governance"]["master_orchestrated_is_authoritative"] is True
          assert manifest["governance"]["manual_recovery_is_authoritative"] is False
          assert manifest["governance"]["single_logical_acquisition_per_scheduler_slot"] is True
          assert manifest["governance"]["scheduled_recovery_is_idempotent"] is True
          assert manifest["governance"]["publish_integrity_required"] is True
          assert manifest["governance"]["identity_mapping_is_deterministic_only"] is True
          assert manifest["governance"]["fuzzy_identity_matching"] is False
          assert identity["governance"]["fuzzy_name_matching_allowed"] is False
          assert integrity["status"] == "PASS", integrity
          assert integrity["current_source_files_exact"] is True
          assert integrity["resolved_registry_exact"] is True
          assert integrity["identity_map_consistent"] is True
          assert control["event_name"] == event_name
          assert control["schedule_kind"] == os.environ["V6_SCHEDULE_KIND"]
          if event_name == "schedule":
              assert control["scheduled_cycle"] is True
              assert control["authoritative_runtime_snapshot"] is True
              assert control["manual_recovery"] is False
              assert manifest["governance"]["production_ingestion_schedule_only"] is True
          elif event_name == "workflow_dispatch" and os.environ["V6_SCHEDULE_KIND"] == "master_orchestrated":
              assert control["scheduled_cycle"] is False
              assert control["master_orchestrated"] is True
              assert control["authoritative_runtime_snapshot"] is True
              assert control["manual_recovery"] is False
              assert control["counts_as_completed_operational_slot"] is True
              assert "NON_AUTHORITATIVE_MANUAL_RECOVERY" not in manifest["control_failures"]
          elif event_name == "workflow_dispatch" and os.environ["V6_SCHEDULE_KIND"] == "manual_recovery":
              assert control["scheduled_cycle"] is False
              assert control["master_orchestrated"] is False
              assert control["authoritative_runtime_snapshot"] is False
              assert control["manual_recovery"] is True
              assert "NON_AUTHORITATIVE_MANUAL_RECOVERY" in manifest["control_failures"]
          else:
              raise AssertionError(f"unexpected V6 production event: {event_name}")
          print(json.dumps({
              "overall": manifest["overall"],
              "elapsed_ms": manifest["elapsed_ms"],
              "source_count": manifest["source_count"],
              "health_counts": manifest["health_counts"],
              "critical_failures": manifest["critical_failures"],
              "control_failures": manifest["control_failures"],
              "runtime_control": control,
              "publish_integrity": integrity,
              "identity_coverage": identity["coverage"],
              "activation": manifest["activation"],
          }, indent=2))
          PY

      - name: Package verified runtime snapshot
        if: steps.slot_guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tar -C "$GITHUB_WORKSPACE" -cf "$RUNNER_TEMP/v6-runtime-data.tar" data/v6

      - name: Transfer verified runtime snapshot to isolated publisher
        if: steps.slot_guard.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v6-runtime-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v6-runtime-data.tar
          retention-days: 14
          if-no-files-found: error

  publish:
    needs: collect
    if: needs.collect.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: v6-runtime-publisher
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require dedicated V6 publisher app configuration
        shell: bash
        env:
          V6_RUNTIME_APP_ID: ${{ vars.V6_RUNTIME_APP_ID }}
          V6_RUNTIME_APP_PRIVATE_KEY: ${{ secrets.V6_RUNTIME_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$V6_RUNTIME_APP_ID"
          test -n "$V6_RUNTIME_APP_PRIVATE_KEY"
          echo "Dedicated V6 publisher app configuration present"

      - name: Mint governed V6 runtime publisher token
        id: runtime_app_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.V6_RUNTIME_APP_ID }}
          private-key: ${{ secrets.V6_RUNTIME_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: FPL-iphoenk-engine
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          token: ${{ steps.runtime_app_token.outputs.token }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Download verified runtime snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: v6-runtime-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v6-runtime-publication

      - name: Revalidate transferred runtime snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/v6-publication-check"
          mkdir -p "$RUNNER_TEMP/v6-publication-check"
          tar -xf "$RUNNER_TEMP/v6-runtime-publication/v6-runtime-data.tar" -C "$RUNNER_TEMP/v6-publication-check"
          test -f "$RUNNER_TEMP/v6-publication-check/data/v6/manifest.json"
          test -f "$RUNNER_TEMP/v6-publication-check/data/v6/health/publish_integrity.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "v6-publication-check" / "data" / "v6"
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          integrity = json.loads((root / "health" / "publish_integrity.json").read_text(encoding="utf-8"))
          assert manifest["governance"]["data_only"] is True
          assert manifest["governance"]["decision_authority"] == "NONE"
          assert manifest["governance"]["prediction_authority"] == "NONE"
          assert manifest["governance"]["optimizer_authority"] == "NONE"
          assert manifest["governance"]["production_authoritative_snapshots_require_schedule"] is False
          assert manifest["governance"]["production_authoritative_snapshots_require_governed_trigger"] is True
          assert manifest["governance"]["manual_recovery_is_authoritative"] is False
          assert integrity["status"] == "PASS", integrity
          assert integrity["resolved_registry_exact"] is True
          print({"overall": manifest["overall"], "tree_sha256": integrity.get("tree_sha256")})
          PY

      - name: Capture runtime branch lease
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${RUNTIME_BRANCH}"
          runtime_base="$(git rev-parse "refs/remotes/origin/${RUNTIME_BRANCH}")"
          echo "RUNTIME_BASE_SHA=$runtime_base" >> "$GITHUB_ENV"

      - name: Publish atomic V6 runtime snapshot
        shell: bash
        env:
          PUBLISH_TOKEN: ${{ steps.runtime_app_token.outputs.token }}
        run: |
          set -euo pipefail
          publish_tree="$RUNNER_TEMP/v6-runtime-worktree"
          rm -rf "$publish_tree"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add --detach "$publish_tree" "$GITHUB_SHA"
          cd "$publish_tree"
          git checkout --orphan runtime-snapshot
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xf "$RUNNER_TEMP/v6-runtime-publication/v6-runtime-data.tar"
          git add -f data/v6
          git commit -m "data(v6): atomic hourly snapshot ${{ github.run_id }} [${{ needs.collect.outputs.schedule_kind }}] [dedicated_v6_github_app]"
          published_sha="$(git rev-parse HEAD)"
          basic_auth="$(printf 'x-access-token:%s' "$PUBLISH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic_auth" push \
            --force-with-lease="refs/heads/${RUNTIME_BRANCH}:${RUNTIME_BASE_SHA}" \
            origin "HEAD:refs/heads/${RUNTIME_BRANCH}"
          echo "PUBLISHED_RUNTIME_SHA=$published_sha" >> "$GITHUB_ENV"

      - name: Verify published V6 runtime provenance and exact tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "+refs/heads/${RUNTIME_BRANCH}:refs/remotes/origin/${RUNTIME_BRANCH}"
          published_head="$(git rev-parse "refs/remotes/origin/${RUNTIME_BRANCH}")"
          test "$published_head" = "$PUBLISHED_RUNTIME_SHA"

          verify_tree="$RUNNER_TEMP/v6-runtime-verify"
          rm -rf "$verify_tree"
          git worktree add --detach "$verify_tree" "refs/remotes/origin/${RUNTIME_BRANCH}"
          unauthorized="$(git -C "$verify_tree" ls-files | grep -v '^data/v6/' || true)"
          if [ -n "$unauthorized" ]; then
            echo "Unauthorized files outside data/v6/:"
            echo "$unauthorized"
            exit 1
          fi

          diff -qr \
            "$RUNNER_TEMP/v6-publication-check/data/v6" \
            "$verify_tree/data/v6"

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "v6-runtime-verify" / "data" / "v6"
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          integrity = json.loads((root / "health" / "publish_integrity.json").read_text(encoding="utf-8"))
          assert manifest["governance"]["data_only"] is True
          assert manifest["governance"]["decision_authority"] == "NONE"
          assert manifest["governance"]["production_authoritative_snapshots_require_schedule"] is False
          assert manifest["governance"]["production_authoritative_snapshots_require_governed_trigger"] is True
          assert integrity["status"] == "PASS", integrity
          assert integrity["resolved_registry_exact"] is True
          print({
              "published": True,
              "overall": manifest["overall"],
              "generated_at": manifest["generated_at"],
              "schedule_kind": manifest["runtime_control"]["schedule_kind"],
              "authoritative_runtime_snapshot": manifest["runtime_control"].get("authoritative_runtime_snapshot"),
              "publisher_mode": "dedicated_v6_github_app",
              "tree_sha256": integrity.get("tree_sha256"),
          })
          PY
