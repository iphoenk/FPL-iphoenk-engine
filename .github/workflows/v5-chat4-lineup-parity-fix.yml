name: V5 Chat4 Lineup Parity Fix

on:
  push:
    branches:
      - codex/v5-chat4-current-lineup-parity
    paths:
      - .github/workflows/v5-chat4-lineup-parity-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v5-chat4-current-lineup-parity
          fetch-depth: 0
      - name: Apply native V5 parity hardening
        run: python tools/v5_chat4_parity_patch.py
      - name: Commit patch
        run: |
          git config user.name "iphoenk"
          git config user.email "103485057+iphoenk@users.noreply.github.com"
          git add src/v5/intelligence/projection.py src/v5/decision/lineup_optimizer.py
          git diff --cached --check
          git commit -m "fix(v5): reconcile current production projection and XI risk semantics"
          git push origin HEAD:codex/v5-chat4-current-lineup-parity
