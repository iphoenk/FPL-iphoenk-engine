name: V3 Wave Parallelism Bootstrap

on:
  push:
    branches:
      - codex/v3-compiled-wave-parallelism

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[wave-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v3-compiled-wave-parallelism
          fetch-depth: 1
      - name: Apply compiled-wave scheduler patch
        run: python tools/apply_v3_compiled_wave_parallelism.py
      - name: Commit compiled-wave scheduler patch
        shell: bash
        run: |
          git config user.name "fpl-iphoenk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/runtime_v3/domain_orchestrator.py tests/test_runtime_compiled_wave_parallelism.py
          git diff --cached --check
          git commit -m "perf(v3): execute isolation-safe compiled waves [wave-patched]"
          git push origin HEAD:codex/v3-compiled-wave-parallelism
