name: V3 CI

on:
  pull_request:
    paths-ignore:
      - 'data/**'
      - 'src/runtime_v6/**'
      - 'config/v6/**'
      - 'docs/V6_*.md'
      - 'tests/test_data_ingestion_engine.py'
      - 'tests/test_adaptive_polling.py'
      - 'tests/test_weather_context.py'
      - 'tests/test_data_platform_*.py'
      - 'requirements-v6.lock'
      - 'requirements-v6-ci.lock'
      - 'src/platform/repository_version_isolation_validate.py'
      - '.github/workflows/repository-governance.yml'
      - '.github/workflows/v6-ci.yml'
      - '.github/workflows/v6-hourly-data-ingestion.yml'
      - '.github/workflows/v4-prediction.yml'
      - '.github/workflows/v4-timing-probe.yml'
      - '.github/workflows/fpl-engine-recovery.yml'
      - '.github/workflows/v5-evidence-dispatcher.yml'
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'src/runtime_v6/**'
      - 'config/v6/**'
      - 'docs/V6_*.md'
      - 'tests/test_data_ingestion_engine.py'
      - 'tests/test_adaptive_polling.py'
      - 'tests/test_weather_context.py'
      - 'tests/test_data_platform_*.py'
      - 'requirements-v6.lock'
      - 'requirements-v6-ci.lock'
      - 'src/platform/repository_version_isolation_validate.py'
      - '.github/workflows/repository-governance.yml'
      - '.github/workflows/v6-ci.yml'
      - '.github/workflows/v6-hourly-data-ingestion.yml'
      - '.github/workflows/v4-prediction.yml'
      - '.github/workflows/v4-timing-probe.yml'
      - '.github/workflows/fpl-engine-recovery.yml'
      - '.github/workflows/v5-evidence-dispatcher.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: v3-ci-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  v3-verify:
    name: v3-verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}
      FPL_AUTH_MODE: disabled
      RUNTIME_BRANCH: runtime-data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Enforce merged-PR provenance for main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m src.runtime_v3.main_pr_provenance
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install locked CI dependencies
        run: pip install --no-deps -r requirements-ci.lock
      - name: Compile runtime modules
        run: python -m compileall -q src live_service.py fpl_daily_tasks.py
      - name: Validate capability terminology contract
        run: python -m src.runtime_v3.capability_terminology_validate
      - name: Validate architecture ownership contract
        run: python -m src.engines.architecture_contract_validate
      - name: Validate interactive SLO authority contract
        run: python -m src.runtime_v3.interactive_slo_contract_validate
      - name: Validate governance metadata and retired implementation contract
        run: python -m src.runtime_v3.governance_metadata_validate
      - name: Enforce no-duplicate architecture and REC ownership
        run: python -m src.engines.v3_architecture_ownership_guard
      - name: Validate canonical capability telemetry
        run: python -m src.runtime_v3.capability_telemetry
      - name: Validate hardened FAST lane contract
        run: python -m src.runtime_v3.fast_lane_contract_validate
      - name: Full unit and regression suite
        run: python -m pytest -q
      - name: Hydrate operational LKG for release acceptance
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "+${RUNTIME_BRANCH}:refs/remotes/origin/${RUNTIME_BRANCH}" || true
          python - <<'PY' > "$RUNNER_TEMP/hydrate-paths.txt"
          import json
          cfg=json.load(open('config/runtime/runtime_publish_registry.json'))
          for path in cfg.get('hydrate_paths', []):
              print(path)
          PY
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            if git cat-file -e "origin/${RUNTIME_BRANCH}:data/${file}" 2>/dev/null; then
              mkdir -p "data/$(dirname "$file")"
              git show "origin/${RUNTIME_BRANCH}:data/${file}" > "data/${file}"
              echo "Hydrated data/${file}"
            fi
          done < "$RUNNER_TEMP/hydrate-paths.txt"
      - name: Composite FULL + FAST release acceptance
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: python -m src.runtime_v3.release_acceptance
      - name: Prove FAST decision runtime consistently under 3s
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: python -m src.runtime_v3.fast_consistency_acceptance
      - name: Benchmark unified interactive fastpath against canonical instant SLO
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: python -m src.runtime_v3.unified_fastpath --benchmark
      - name: Benchmark certified exhaustive optimizer on production-scale LKG
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          timeout 420s python -m src.engines.package_optimizer_exhaustive_accelerated --no-persist | tee "$RUNNER_TEMP/exhaustive-finalizer.json"
