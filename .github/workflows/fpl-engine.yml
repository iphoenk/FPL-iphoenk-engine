name: FPL iphoenk V4.7.1 correctness gate

on:
  workflow_dispatch:
  push:
    branches:
      - v4-prediction-engine
    paths-ignore:
      - 'data/**'


permissions:
  contents: write

concurrency:
  group: fpl-iphoenk-v4-gate
  cancel-in-progress: true

jobs:
  validate-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Unit and acceptance tests
        run: python -m pytest -q
      - name: Generate V4 point-in-time prediction snapshot
        run: python -m src.engine daily --stats
      - name: Rules compliance evidence
        run: python -m src.engines.compliance_audit
      - name: Framework health PRE-FLIGHT
        run: python -m src.engines.framework_health_audit --phase preflight --strict
      - name: Generate governed V4 decision outputs
        run: python -m src.engines.v4_decision_pipeline
      - name: Framework health POST-FLIGHT
        run: python -m src.engines.framework_health_audit --phase postflight --strict
      - name: Centralized V4.7.1 correctness quality gate
        run: python -m src.engines.v4_quality_gate
      - name: Concise acceptance summary
        run: |
          python - <<'PY'
          import json
          h=json.load(open('data/framework_health_v4.json'))
          w=json.load(open('data/wc_decision_v4.json'))
          print({
              'health': h['overall'],
              'recommendation_allowed': h['recommendation_allowed'],
              'go_allowed': h['go_allowed'],
              'gate0': h['gate0']['counts'],
              'budget_tenths': w['budget_tenths'],
              'price_basis': w['affordability']['price_basis'],
          })
          PY
      - name: Upload branch data only
        shell: bash
        run: |
          git config user.name "fpl-iphoenk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "data(v4): prediction acceptance snapshot"
          git fetch origin v4-prediction-engine
          git rebase origin/v4-prediction-engine
          git push origin HEAD:v4-prediction-engine
