name: V4 temporary package optimization service split v2
on:
  push:
    branches: [codex/v4-full-universe-tactical-20260903]
    paths:
      - .github/workflows/v4-package-service-split-v2-temp.yml
permissions:
  contents: write
jobs:
  split-and-accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/v4-full-universe-tactical-20260903
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Stage architecture split
        run: python tools/v4_package_optimization_service_split_runner_v2_temp.py
      - name: Compile changed Python
        run: python -m py_compile src/engines/v4_package_artifact_contract.py src/services/package_optimization_service.py src/engines/v4_decision_pipeline.py src/services/orchestrator.py src/services/hot_orchestrator.py
      - name: Focused service and exact-search regression
        run: python -m pytest -q tests/test_v4_package_optimization_service_boundary.py tests/test_service_orchestrator.py tests/test_v4_full_universe_package_search_proof.py tests/test_v4_full_universe_authority_fail_closed.py tests/test_v496_e2e_performance_hardening.py tests/test_v4_p1_structural_hardening.py
      - name: Full V4 regression
        run: python -m pytest -q
      - name: Refresh governed architecture attestation
        run: python tools/v4_architecture_guard_attest.py
      - name: Verify architecture guard from fresh attestation
        run: python -m src.services.architecture_guard_service
      - name: Exact package optimization service cold SLO
        run: /usr/bin/time -f 'package_service_elapsed=%e' timeout 65s python -m src.services.package_optimization_service
      - name: Decision consumer hard SLO after exact package artifact
        run: /usr/bin/time -f 'decision_consumer_elapsed=%e' timeout 12s python -m src.services.optimization_slo_service
      - name: Verify package lineage and decision artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('data/package_optimization_manifest_v4.json').read_text())
          package=json.loads(Path('data/wc_package_audit_v4.json').read_text())
          decision=json.loads(Path('data/decision_pipeline_v4.json').read_text())
          assert manifest['status']=='PASS'
          assert manifest['slo_status']=='PASS'
          assert manifest['duration_ms'] < manifest['slo_ms'] == 60000
          assert package['search']['status']=='FULL_UNIVERSE_PROVEN'
          assert package['search']['authoritative_for_recommendation'] is True
          assert package['decision_authority']=='ENGINE_ADVISORY_ONLY_FULL_UNIVERSE_PROVEN'
          assert package['search'].get('heuristic_candidate_cutoff') is False
          assert package['search'].get('beam_cutoff') is False
          assert decision['timings']['total_pipeline_ms'] < 5000
          assert decision['performance_guardrails']['package_artifact_lineage_verified'] is True
          assert decision['performance_guardrails']['package_search_recompute_in_decision_boundary'] is False
          print(json.dumps({'package_ms':manifest['duration_ms'],'package_slo_ms':manifest['slo_ms'],'decision_ms':decision['timings']['total_pipeline_ms'],'search':package['search']['status']}, indent=2))
          PY
      - name: Commit accepted split and attestation
        run: |
          git config user.name 'fpl-iphoenk-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            src/engines/v4_package_artifact_contract.py \
            src/services/package_optimization_service.py \
            src/engines/v4_decision_pipeline.py \
            src/services/orchestrator.py \
            src/services/hot_orchestrator.py \
            config/service_registry.json \
            config/service_contract_registry.json \
            config/architecture_ownership_registry.json \
            config/optimizer_equivalence_registry.json \
            config/release_manifest.json \
            config/architecture_guard_attestation.json \
            tests/test_v496_e2e_performance_hardening.py \
            tests/test_v4_p1_structural_hardening.py \
            tests/test_v4_package_optimization_service_boundary.py
          git diff --cached --check
          git commit -m 'refactor(v4): isolate exact package optimization service'
          git push origin HEAD:codex/v4-full-universe-tactical-20260903
