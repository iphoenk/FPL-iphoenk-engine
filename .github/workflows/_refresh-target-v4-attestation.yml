name: Temporary V4 target attestation refresher

on:
  push:
    branches: [codex/v4-attestation-refresh-util]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/v4-atomic-publish-node24
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Refresh target attestation from full guard
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from src.services import architecture_guard_service as guard
          result=guard.run(force_full_scan=True)
          assert result.get('status') == 'PASS', result
          payload={
              'schema_version': guard.ATTESTATION_SCHEMA_VERSION,
              'fingerprint': guard.repository_fingerprint(),
              'release': guard.RELEASE_VERSION,
              'guard_schema_version': result.get('schema_version'),
              'result': result,
          }
          Path('config/architecture_guard_attestation.json').write_text(
              json.dumps(payload,indent=2,ensure_ascii=False)+'\n',encoding='utf-8'
          )
          print(payload['fingerprint'])
          PY
          git config user.name 'fpl-iphoenk-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add config/architecture_guard_attestation.json
          git commit -m 'chore(v4): refresh architecture attestation for atomic publish' || exit 0
          git push origin HEAD:codex/v4-atomic-publish-node24
