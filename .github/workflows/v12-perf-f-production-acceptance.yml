name: V12 PERF-F production acceptance

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: v12-perf-f-production-acceptance
  cancel-in-progress: false

jobs:
  controlled-production-case:
    if: >-
      github.event.issue.number == 431 &&
      github.actor == github.repository_owner &&
      startsWith(github.event.comment.body, '/v12-perf-f ')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: v12-private-reports-publisher
    permissions:
      contents: read
    steps:
      - name: Parse PERF-F request
        id: request
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from datetime import datetime
          from pathlib import Path

          required_cases = {
              "NO_CHANGE",
              "MINI_LEAGUE_ONLY",
              "PRICE_ONLY",
              "OUR15_AVAILABILITY",
              "CAPTAIN_CHANGE",
              "VICE_CAPTAIN_CHANGE",
              "MATERIAL_PROJECTION",
              "P4_SCENARIO_HIT",
              "P4_SCENARIO_MISS",
          }
          raw = os.environ["COMMENT_BODY"].strip().split()
          if not raw or raw[0] != "/v12-perf-f":
              raise SystemExit("PERF-F marker mismatch")
          values = {}
          for token in raw[1:]:
              if "=" not in token:
                  raise SystemExit(f"malformed token: {token}")
              key, value = token.split("=", 1)
              if key in values or not key or not value:
                  raise SystemExit(f"invalid token: {token}")
              values[key] = value
          if set(values) != {"case", "report_slot"}:
              raise SystemExit(
                  f"PERF-F request requires case + report_slot, got {sorted(values)}"
              )
          case = values["case"].upper()
          if case not in required_cases:
              raise SystemExit(f"unsupported PERF-F case: {case}")
          slot = datetime.fromisoformat(values["report_slot"].replace("Z", "+00:00"))
          if slot.tzinfo is None or slot.utcoffset() is None:
              raise SystemExit("report_slot must be timezone-aware")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as fh:
              fh.write(f"case={case}\n")
              fh.write(f"report_slot={slot.isoformat()}\n")
          PY

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Require production main execution
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "main"
          echo "production_sha=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: iphoenk/FPL-iphoenk-engine
          ref: runtime-data-v6
          path: runtime-data
          fetch-depth: 1
          persist-credentials: false

      - name: Require private publisher credential
        shell: bash
        env:
          FPL_PRIVATE_REPORTS_TOKEN: ${{ secrets.FPL_PRIVATE_REPORTS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FPL_PRIVATE_REPORTS_TOKEN"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: iphoenk/fpl-reports-private
          ref: main
          path: private-reports
          token: ${{ secrets.FPL_PRIVATE_REPORTS_TOKEN }}
          persist-credentials: true
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked canonical runtime
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Execute production-real PERF-F case
        env:
          FPL_V12_PRIVATE_CACHE_KEY_B64: ${{ secrets.FPL_V12_PRIVATE_CACHE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/perf-f-work"
          python -m src.engines.v12_perf_f_acceptance             --app-root "$GITHUB_WORKSPACE"             --runtime-data-root "$GITHUB_WORKSPACE/runtime-data"             --private-input-root "$GITHUB_WORKSPACE/private-reports"             --private-publisher-root "$GITHUB_WORKSPACE/private-reports"             --workspace "$RUNNER_TEMP/perf-f-work"             --report-slot "${{ steps.request.outputs.report_slot }}"             --case "${{ steps.request.outputs.case }}"             --run-id "${GITHUB_RUN_ID}"             --result-out "$RUNNER_TEMP/perf-f-result.json"

      - name: Record non-sensitive acceptance summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -s "$RUNNER_TEMP/perf-f-result.json"; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path
          row = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "perf-f-result.json").read_text(
                  encoding="utf-8"
              )
          )
          safe = {
              "case": row.get("case"),
              "status": row.get("status"),
              "reason": row.get("reason"),
              "total_seconds": row.get("total_seconds"),
              "latency_pass": row.get("latency_pass"),
              "semantic_equal": row.get("semantic_equal"),
              "cache_correctness_pass": row.get("cache_correctness_pass"),
              "cache_performance": row.get("cache_performance"),
              "private_publish_pass": row.get("private_publish_pass"),
              "production_sha": row.get("production_sha"),
              "runtime_data_sha": row.get("runtime_data_sha"),
          }
          with (Path(os.environ["GITHUB_STEP_SUMMARY"])).open(
              "a", encoding="utf-8"
          ) as fh:
              fh.write("PERF-F_RESULT=" + json.dumps(safe, sort_keys=True) + "\n")
          print(json.dumps(safe, sort_keys=True))
          PY
          fi
