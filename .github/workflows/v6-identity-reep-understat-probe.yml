name: V6 Identity Reep Understat bridge probe

on:
  push:
    branches:
      - ops/v6-identity-reep-manifest-probe

permissions:
  contents: read

jobs:
  probe-understat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download and inspect pinned bridges
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/reep-probe
          curl --fail --location --retry 3 --retry-delay 2 \
            --output /tmp/reep-probe/bridges.csv.gz \
            https://data.reep.football/releases/20260907T201034Z/csv/bridges.csv.gz
          printf '%s  %s\n' \
            a03aef520a454bdcd181b5b332b91e7b41ee57f4914e6e2c456cf49a8b86a735 \
            /tmp/reep-probe/bridges.csv.gz | sha256sum -c -
          python - <<'PY'
          import csv, gzip, json
          from collections import Counter, defaultdict
          from pathlib import Path

          samples = {'8379', '10016', '14758', '1045', '212'}
          provider_namespaces = Counter()
          provider_counts = Counter()
          sample_understat_rows = []
          sample_reep_ids = set()
          all_rows_by_reep = defaultdict(list)

          with gzip.open('/tmp/reep-probe/bridges.csv.gz', 'rt', encoding='utf-8', newline='') as handle:
              reader = csv.DictReader(handle)
              print('FIELDNAMES=' + json.dumps(reader.fieldnames))
              for row in reader:
                  provider = str(row.get('provider') or '').strip().lower()
                  namespace = str(row.get('namespace') or '').strip().lower()
                  external_id = str(row.get('external_id') or '').strip()
                  reep_id = str(row.get('reep_id') or '').strip()
                  provider_counts[provider] += 1
                  provider_namespaces[(provider, namespace)] += 1
                  if provider == 'understat' and namespace == 'player' and external_id in samples:
                      sample_understat_rows.append(row)
                      sample_reep_ids.add(reep_id)
                  if reep_id:
                      all_rows_by_reep[reep_id].append(row)

          sample_all_provider_rows = {
              reep_id: sorted(
                  all_rows_by_reep[reep_id],
                  key=lambda row: (
                      str(row.get('provider') or ''),
                      str(row.get('namespace') or ''),
                      str(row.get('external_id') or ''),
                  ),
              )
              for reep_id in sorted(sample_reep_ids)
          }
          relevant_provider_counts = {
              provider: count
              for provider, count in sorted(provider_counts.items())
              if any(token in provider for token in ('fpl', 'premier', 'opta', 'transfermarkt', 'understat'))
          }
          relevant_provider_namespaces = {
              f'{provider}:{namespace}': count
              for (provider, namespace), count in sorted(provider_namespaces.items())
              if any(token in provider for token in ('fpl', 'premier', 'opta', 'transfermarkt', 'understat'))
          }
          out = {
              'sample_understat_rows': sample_understat_rows,
              'sample_all_provider_rows': sample_all_provider_rows,
              'relevant_provider_counts': relevant_provider_counts,
              'relevant_provider_namespaces': relevant_provider_namespaces,
          }
          print(json.dumps(out, indent=2, sort_keys=True))
          Path('/tmp/reep-probe/understat_probe.json').write_text(
              json.dumps(out, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Upload probe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reep-v1-understat-probe
          path: /tmp/reep-probe/understat_probe.json
          retention-days: 1
