# Reference configuration. NOT deployed. Do not add secrets here.
# Secret GITHUB_TOKEN is set out-of-band with `wrangler secret put GITHUB_TOKEN` at activation time.
name = "fpl-external-clock"
main = "worker.js"
compatibility_date = "2026-10-01"

[triggers]
# UTC. Hours cover DEEP 04:30/12:30/21:30 WIB and PRICE 23:30 Europe/London in both BST and GMT;
# four pings per hour-window. GitHub-side resolve_tick decides what (if anything) is due.
crons = ["5,20,35,50 21,22,23,0,5,6,14,15 * * *"]

[vars]
# Second kill switch (the first is the GitHub repository variable FPL_EXTERNAL_CLOCK).
EXTERNAL_CLOCK_ENABLED = "false"
