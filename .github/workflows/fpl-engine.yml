name: FPL iphoenk collector

on:
  workflow_dispatch:
  schedule:
    - cron: "20 * * * *"

permissions:
  contents: write

concurrency:
  group: fpl-iphoenk-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Export Master snapshot
        run: python export_master.py

      - name: Commit refreshed data
        shell: bash
        run: |
          git config user.name "fpl-iphoenk-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/latest.json data/history.jsonl

          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "data: refresh FPL snapshot"
            git push
          fi
