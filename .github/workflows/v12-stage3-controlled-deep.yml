name: V12 Stage3 controlled DEEP acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v12-stage3-controlled-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  controlled-deep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact Stage3 code head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          path: app

      - name: Gate expensive controlled acceptance
        id: gate
        working-directory: app
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          message="$(git log -1 --pretty=%B)"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || printf '%s' "$message" | grep -Fq '[stage3-controlled]'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout fresh factual runtime-data-v6 read-only
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: runtime-data-v6
          path: runtime-data

      - name: Setup Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked V12 dependencies
        if: steps.gate.outputs.run == 'true'
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Capture exact controlled occurrence
        if: steps.gate.outputs.run == 'true'
        id: occurrence
        working-directory: app
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          latest = json.loads(
              Path("../runtime-data/data/v6/report_prefetch/latest.json").read_text(
                  encoding="utf-8"
              )
          )
          if latest.get("report_kind") != "full_master":
              raise SystemExit("latest V6 report-prefetch is not full_master")
          if latest.get("fresh_for_target_report") is not True:
              raise SystemExit("latest full_master prefetch is not governed fresh")
          slot = latest.get("target_logical_report_slot")
          if not slot:
              raise SystemExit("target_logical_report_slot unavailable")
          app_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          runtime_sha = subprocess.check_output(
              ["git", "-C", "../runtime-data", "rev-parse", "HEAD"], text=True
          ).strip()
          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as fh:
              fh.write(f"report_slot={slot}\n")
              fh.write(f"model_sha={app_sha}\n")
              fh.write(f"runtime_sha={runtime_sha}\n")
          PY

      - name: Prove frozen upstream and zero V6-owned diff
        if: steps.gate.outputs.run == 'true'
        working-directory: app
        run: |
          set -euo pipefail
          stage2="2e770f5403c211851b122248c201dd7d8b81c3e1"
          git merge-base --is-ancestor "$stage2" HEAD
          changed="$(git diff --name-only "$stage2"...HEAD)"
          if printf '%s\n' "$changed" | grep -Eq '^(src/runtime_v6/|config/v6/|data/v6/)'; then
            printf '%s\n' "$changed"
            echo "Stage3 changed a V6-owned path" >&2
            exit 1
          fi

      - name: Execute controlled DEEP end to end
        if: steps.gate.outputs.run == 'true'
        working-directory: app
        env:
          REPORT_SLOT: ${{ steps.occurrence.outputs.report_slot }}
        run: |
          python -m src.engines.v12_integrated_report_runner             --runtime-data-root "../runtime-data"             --report-mode DEEP             --report-slot "$REPORT_SLOT"             --output-dir "artifacts/stage3-controlled"

      - name: Enforce Stage3 controlled acceptance
        if: steps.gate.outputs.run == 'true'
        working-directory: app
        env:
          MODEL_SHA: ${{ steps.occurrence.outputs.model_sha }}
          RUNTIME_SHA: ${{ steps.occurrence.outputs.runtime_sha }}
        run: |
          python -m src.engines.v12_stage3_acceptance             --bundle artifacts/stage3-controlled/report_bundle.json             --runtime-data-root ../runtime-data             --model-sha "$MODEL_SHA"             --runtime-sha "$RUNTIME_SHA"             --canonical control/fpl_master_v12/FPL_MASTER_CANONICAL_V12.txt             --output artifacts/stage3-controlled/stage3_acceptance.json

      - name: Upload immutable controlled evidence
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v12-stage3-controlled-${{ github.run_id }}
          path: |
            app/artifacts/stage3-controlled/report_bundle.json
            app/artifacts/stage3-controlled/report_body.md
            app/artifacts/stage3-controlled/execution_proof.json
            app/artifacts/stage3-controlled/stage3_acceptance.json
          if-no-files-found: error
          retention-days: 30
