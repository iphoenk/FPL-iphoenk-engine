name: V5 Real Shadow Cycle

on:
  workflow_dispatch:
  push:
    branches: [v5-unified-engine]
    paths:
      - 'config/v5_shadow_trigger.json'

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}
  FPL_TEAM_ID: "3462711"
  V3_SOURCE_BRANCH: v3.15-fast-report-serving
  V3_RUNTIME_BRANCH: runtime-data
  V5_SHADOW_BRANCH: v5-shadow-runtime

jobs:
  shadow-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout V5 beta
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Hydrate prior V5 shadow state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$V3_SOURCE_BRANCH" "$V3_RUNTIME_BRANCH" "$V5_SHADOW_BRANCH"
          mkdir -p .shadow data/v5
          if git cat-file -e "origin/${V5_SHADOW_BRANCH}:data/v5/latest.json" 2>/dev/null; then
            shadow_tmp="$(mktemp -d)"
            git archive "origin/${V5_SHADOW_BRANCH}" data/v5 | tar -x -C "$shadow_tmp"
            rm -rf data/v5
            cp -a "$shadow_tmp/data/v5" data/v5
            rm -rf "$shadow_tmp"
            echo "Hydrated prior V5 shadow state"
          else
            echo "No prior V5 shadow state; starting clean"
          fi

      - name: Generate fresh V3.15 reference
        shell: bash
        env:
          FPL_AUTH_MODE: ${{ secrets.FPL_AUTH_MODE }}
          FPL_SESSION_B64: ${{ secrets.FPL_SESSION_B64 }}
          FPL_ACCESS_TOKEN: ${{ secrets.FPL_ACCESS_TOKEN }}
          FPL_REFRESH_TOKEN: ${{ secrets.FPL_REFRESH_TOKEN }}
          FPL_OIDC_TOKEN_URL: ${{ secrets.FPL_OIDC_TOKEN_URL }}
          FPL_OIDC_CLIENT_ID: ${{ secrets.FPL_OIDC_CLIENT_ID }}
          FPL_OIDC_CLIENT_SECRET: ${{ secrets.FPL_OIDC_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          v3_tree="$(mktemp -d)"
          trap 'git worktree remove --force "$v3_tree" >/dev/null 2>&1 || true; rm -rf "$v3_tree"' EXIT
          git worktree add --detach "$v3_tree" "origin/$V3_SOURCE_BRANCH"

          mkdir -p "$v3_tree/data/stats"
          for file in price_cache.json price_trajectory.json rules_source_state.json prediction_ledger.json challenger_observations.json report_state.json dss_watchlist.json; do
            if git cat-file -e "origin/${V3_RUNTIME_BRANCH}:data/${file}" 2>/dev/null; then
              git show "origin/${V3_RUNTIME_BRANCH}:data/${file}" > "$v3_tree/data/${file}"
            fi
          done
          if git cat-file -e "origin/${V3_RUNTIME_BRANCH}:data/stats/vaastav_previous_season.json" 2>/dev/null; then
            git show "origin/${V3_RUNTIME_BRANCH}:data/stats/vaastav_previous_season.json" > "$v3_tree/data/stats/vaastav_previous_season.json"
          fi

          (
            cd "$v3_tree"
            export PYTHONPATH="$v3_tree"
            python -m src.runtime_v3.orchestrator --mode daily --stats
            python -m src.engines.production_contract_validate
            python -m src.engines.watchlist_contract_validate
            python -m src.engines.report_serving_validate
          )

          cp "$v3_tree/data/latest.json" .shadow/v3_latest.json
          cp "$v3_tree/data/lineup_decision.json" .shadow/v3_lineup_decision.json
          python - <<'PY'
          import json
          latest=json.load(open('.shadow/v3_latest.json'))
          lineup=json.load(open('.shadow/v3_lineup_decision.json'))
          print({
              'reference_branch': 'v3.15-fast-report-serving',
              'engine_version': latest.get('engine_version'),
              'generated_at': latest.get('generated_at'),
              'planning_gw': (latest.get('phase') or {}).get('planning_gw'),
              'formation': lineup.get('formation'),
              'captain': (lineup.get('captain') or {}).get('element') if isinstance(lineup.get('captain'), dict) else lineup.get('captain'),
          })
          assert str(latest.get('engine_version') or '').startswith('3.15'), latest.get('engine_version')
          PY

      - name: Start V5 bounded-context microservices
        env:
          FPL_AUTH_MODE: ${{ secrets.FPL_AUTH_MODE }}
          FPL_SESSION_B64: ${{ secrets.FPL_SESSION_B64 }}
          FPL_ACCESS_TOKEN: ${{ secrets.FPL_ACCESS_TOKEN }}
          FPL_REFRESH_TOKEN: ${{ secrets.FPL_REFRESH_TOKEN }}
          FPL_OIDC_TOKEN_URL: ${{ secrets.FPL_OIDC_TOKEN_URL }}
          FPL_OIDC_CLIENT_ID: ${{ secrets.FPL_OIDC_CLIENT_ID }}
          FPL_OIDC_CLIENT_SECRET: ${{ secrets.FPL_OIDC_CLIENT_SECRET }}
        run: docker compose -f deploy/v5/docker-compose.yml up -d --build

      - name: Wait for V5 cluster health
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8100/health >/dev/null; then
              echo "V5 cluster is healthy"
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/v5/docker-compose.yml ps
          exit 1

      - name: Run real V3.15 versus V5 shadow cycle
        env:
          V3_REFERENCE_BRANCH: v3.15-fast-report-serving
          V5_SERVICE_INGESTION_URL: http://127.0.0.1:8101
          V5_SERVICE_TRUTH_URL: http://127.0.0.1:8102
          V5_SERVICE_PRICE_URL: http://127.0.0.1:8103
          V5_SERVICE_PREDICTION_URL: http://127.0.0.1:8104
          V5_SERVICE_DECISION_URL: http://127.0.0.1:8105
          V5_SERVICE_SNAPSHOT_URL: http://127.0.0.1:8106
          V5_SERVICE_EVALUATION_URL: http://127.0.0.1:8107
          V5_SERVICE_GOVERNANCE_URL: http://127.0.0.1:8108
          V5_SERVICE_REPORTING_URL: http://127.0.0.1:8109
          V5_SERVICE_WATCHLIST_URL: http://127.0.0.1:8110
        run: python -m src.v5.shadow_cycle

      - name: Validate shadow acceptance invariants
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/v5/shadow/latest_shadow_cycle.json'))
          w=json.load(open('data/v5/dss_watchlist.json'))
          checks=p['operational_invariants']['checks']
          positions=w.get('positions') or {}
          position_counts={pos: len(positions.get(pos) or []) for pos in ('GK','DEF','MID','FWD')}
          print({
              'v3_engine_version': p['v3'].get('engine_version'),
              'cycle_pass': p['acceptance_progress']['cycle_pass'],
              'parity': p['parity'],
              'operational_invariants': checks,
              'watchlist_position_counts': position_counts,
          })
          assert str(p['v3'].get('engine_version') or '').startswith('3.15'), p['v3'].get('engine_version')
          assert all(checks.values()), f'V5 operational invariant failure: {checks}'
          assert all(position_counts[pos] == 5 for pos in position_counts), f'watchlist positional contract failed: {position_counts}'
          assert p['parity']['pass'] is True, f"V3.15/V5 parity failed: {p['parity']}"
          assert p['acceptance_progress']['cycle_pass'] is True, 'cycle must not count as successful acceptance'
          PY

      - name: Upload shadow-cycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-real-shadow-cycle-${{ github.run_number }}
          path: |
            .shadow/v3_latest.json
            .shadow/v3_lineup_decision.json
            data/v5/shadow/
            data/v5/user_report.json
            data/v5/technical_appendix.json
            data/v5/framework_health.json
            data/v5/dss_watchlist.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish isolated V5 shadow state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f data/v5/shadow/latest_shadow_cycle.json || { echo "No completed cycle to publish"; exit 0; }
          runtime_tmp="$(mktemp -d)"
          publish_tree="$(mktemp -d)"
          trap 'git worktree remove --force "$publish_tree" >/dev/null 2>&1 || true; rm -rf "$runtime_tmp" "$publish_tree"' EXIT
          cp -a data/v5 "$runtime_tmp/v5"
          git config user.name "fpl-iphoenk-shadow-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin "$V5_SHADOW_BRANCH"
          git worktree add --detach "$publish_tree" "origin/$V5_SHADOW_BRANCH"
          cd "$publish_tree"
          rm -rf data/v5
          mkdir -p data
          cp -a "$runtime_tmp/v5" data/v5
          git add data/v5
          if git diff --cached --quiet; then
            echo "No shadow-state changes"
            exit 0
          fi
          git commit -m "shadow: record real V3.15 V5 cycle $GITHUB_RUN_NUMBER [skip ci]"
          git push origin HEAD:"$V5_SHADOW_BRANCH"

      - name: Stop V5 cluster
        if: always()
        run: docker compose -f deploy/v5/docker-compose.yml down -v
