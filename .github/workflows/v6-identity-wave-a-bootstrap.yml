name: V6 Identity Wave A bootstrap

on:
  push:
    branches:
      - feat/v6-identity-wave-a-coverage-truth
    paths:
      - .github/workflows/v6-identity-wave-a-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/v6-identity-wave-a-coverage-truth
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-v6-ci.lock
      - name: Install V6 CI dependencies
        run: python -m pip install --require-hashes -r requirements-v6-ci.lock
      - name: Validate Wave A and full V6 contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m src.runtime_v6.architecture_independence_validate
          python -m src.runtime_v6.authority_contract
          python -m pytest -q \
            tests/test_data_ingestion_engine.py \
            tests/test_adaptive_polling.py \
            tests/test_data_platform_*.py \
            tests/test_data_platform_production_acceptance.py
