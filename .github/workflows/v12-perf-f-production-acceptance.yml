name: V12 PERF-F production acceptance

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  # PERF-F cases must remain serial, but unrelated issue-comment fanout must
  # not occupy/replace the single pending governed acceptance slot.
  group: >-
    ${{
      (
        github.event.issue.number == 431 &&
        github.actor == github.repository_owner &&
        startsWith(github.event.comment.body, '/v12-perf-f ')
      ) &&
      'v12-perf-f-production-acceptance-command' ||
      format('v12-perf-f-production-acceptance-noise-{0}', github.event.comment.id)
    }}
  cancel-in-progress: false

jobs:
  controlled-production-case:
    if: >-
      github.event.issue.number == 431 &&
      github.actor == github.repository_owner &&
      startsWith(github.event.comment.body, '/v12-perf-f ')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: v12-private-reports-publisher
    permissions:
      contents: read
    steps:
      - name: Parse PERF-F request
        id: request
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from datetime import datetime
          from pathlib import Path

          required_cases = {
              "NO_CHANGE",
              "MINI_LEAGUE_ONLY",
              "PRICE_ONLY",
              "OUR15_AVAILABILITY",
              "CAPTAIN_CHANGE",
              "VICE_CAPTAIN_CHANGE",
              "MATERIAL_PROJECTION",
              "P4_SCENARIO_HIT",
              "P4_SCENARIO_MISS",
          }
          raw = os.environ["COMMENT_BODY"].strip().split()
          if not raw or raw[0] != "/v12-perf-f":
              raise SystemExit("PERF-F marker mismatch")
          values = {}
          for token in raw[1:]:
              if "=" not in token:
                  raise SystemExit(f"malformed token: {token}")
              key, value = token.split("=", 1)
              if key in values or not key or not value:
                  raise SystemExit(f"invalid token: {token}")
              values[key] = value
          keys = set(values)
          if keys not in ({"case", "report_slot"}, {"cases", "report_slot"}):
              raise SystemExit(
                  "PERF-F request requires either case + report_slot or "
                  f"cases + report_slot, got {sorted(values)}"
              )
          if "case" in values:
              cases = [values["case"].upper()]
          else:
              cases = [
                  token.strip().upper()
                  for token in values["cases"].split(",")
                  if token.strip()
              ]
          if not cases:
              raise SystemExit("PERF-F request has no cases")
          if len(cases) != len(set(cases)):
              raise SystemExit("PERF-F request contains duplicate cases")
          unsupported = [case for case in cases if case not in required_cases]
          if unsupported:
              raise SystemExit(f"unsupported PERF-F cases: {unsupported}")
          slot = datetime.fromisoformat(values["report_slot"].replace("Z", "+00:00"))
          if slot.tzinfo is None or slot.utcoffset() is None:
              raise SystemExit("report_slot must be timezone-aware")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as fh:
              fh.write(f"cases={','.join(cases)}\n")
              fh.write(f"report_slot={slot.isoformat()}\n")
          PY

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Require production main execution
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "main"
          echo "production_sha=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Require private publisher credential
        shell: bash
        env:
          FPL_PRIVATE_REPORTS_TOKEN: ${{ secrets.FPL_PRIVATE_REPORTS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FPL_PRIVATE_REPORTS_TOKEN"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: iphoenk/fpl-reports-private
          ref: main
          path: private-reports
          token: ${{ secrets.FPL_PRIVATE_REPORTS_TOKEN }}
          persist-credentials: true
          fetch-depth: 1

      - name: Resolve governed PERF-F runtime-data ref
        id: runtime
        shell: bash
        env:
          PERF_F_CASES: ${{ steps.request.outputs.cases }}
          PERF_F_REPORT_SLOT: ${{ steps.request.outputs.report_slot }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          p4_required = {
              "OUR15_AVAILABILITY",
              "MATERIAL_PROJECTION",
              "P4_SCENARIO_HIT",
              "P4_SCENARIO_MISS",
          }
          cases = {
              token.strip().upper()
              for token in os.environ["PERF_F_CASES"].split(",")
              if token.strip()
          }
          requested_slot = os.environ["PERF_F_REPORT_SLOT"]
          runtime_ref = "runtime-data-v6"
          source = "CURRENT_RUNTIME_BRANCH"

          if cases & p4_required:
              path = Path("private-reports/scenarios/latest.json")
              if not path.is_file():
                  raise SystemExit("P4-consuming PERF-F chain has no private package")
              package = json.loads(path.read_text(encoding="utf-8"))
              binding = dict(package.get("occurrence_binding") or {})
              runtime_sha = str(binding.get("runtime_data_sha") or "").strip()
              package_slot = str(binding.get("report_slot") or "").strip()
              if package_slot != requested_slot:
                  raise SystemExit(
                      "P4/PERF-F occurrence mismatch: "
                      f"package={package_slot} requested={requested_slot}"
                  )
              if not re.fullmatch(r"[0-9a-f]{40}", runtime_sha):
                  raise SystemExit("P4 package has no valid runtime_data_sha binding")
              runtime_ref = runtime_sha
              source = "P4_OCCURRENCE_BINDING"

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as fh:
              fh.write(f"runtime_ref={runtime_ref}\n")
              fh.write(f"source={source}\n")
          PY

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: iphoenk/FPL-iphoenk-engine
          ref: ${{ steps.runtime.outputs.runtime_ref }}
          path: runtime-data
          fetch-depth: 1
          persist-credentials: false

      - name: Verify governed PERF-F runtime-data binding
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C runtime-data rev-parse HEAD)"
          source="${{ steps.runtime.outputs.source }}"
          expected="${{ steps.runtime.outputs.runtime_ref }}"
          if [ "$source" = "P4_OCCURRENCE_BINDING" ]; then
            test "$actual" = "$expected"
          fi
          echo "PERF_F_RUNTIME_DATA_SHA=$actual" >> "$GITHUB_STEP_SUMMARY"
          echo "PERF_F_RUNTIME_BINDING_SOURCE=$source" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked canonical runtime
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Execute production-real PERF-F case chain
        env:
          FPL_V12_PRIVATE_CACHE_KEY_B64: ${{ secrets.FPL_V12_PRIVATE_CACHE_KEY_B64 }}
          PERF_F_CASES: ${{ steps.request.outputs.cases }}
          PERF_F_REPORT_SLOT: ${{ steps.request.outputs.report_slot }}
          # PERF-F cold oracle must use the same normalized numerical runtime
          # as P4. Otherwise identical scenario math can drift at floating-point
          # boundaries and falsely fail semantic equality.
          OPENBLAS_CORETYPE: Haswell
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          NPY_DISABLE_CPU_FEATURES: "X86_V4,AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR"
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -r -a CASES <<< "$PERF_F_CASES"
          for CASE in "${CASES[@]}"; do
            echo "PERF-F serial case: $CASE" >> "$GITHUB_STEP_SUMMARY"
            WORK_DIR="$RUNNER_TEMP/perf-f-work-${CASE,,}"
            RESULT_OUT="$RUNNER_TEMP/perf-f-result-${CASE}.json"
            rm -rf "$WORK_DIR"
            python -m src.engines.v12_perf_f_acceptance \
              --app-root "$GITHUB_WORKSPACE" \
              --runtime-data-root "$GITHUB_WORKSPACE/runtime-data" \
              --private-input-root "$GITHUB_WORKSPACE/private-reports" \
              --private-publisher-root "$GITHUB_WORKSPACE/private-reports" \
              --workspace "$WORK_DIR" \
              --report-slot "$PERF_F_REPORT_SLOT" \
              --case "$CASE" \
              --run-id "${GITHUB_RUN_ID}-${CASE,,}" \
              --result-out "$RESULT_OUT"
          done

      - name: Record non-sensitive acceptance summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          rows = []
          for path in sorted(root.glob("perf-f-result-*.json")):
              row = json.loads(path.read_text(encoding="utf-8"))
              safe = {
                  "case": row.get("case"),
                  "status": row.get("status"),
                  "reason": row.get("reason"),
                  "total_seconds": row.get("total_seconds"),
                  "latency_pass": row.get("latency_pass"),
                  "semantic_equal": row.get("semantic_equal"),
                  "cache_correctness_pass": row.get("cache_correctness_pass"),
                  "cache_performance": row.get("cache_performance"),
                  "private_publish_pass": row.get("private_publish_pass"),
                  "production_sha": row.get("production_sha"),
                  "runtime_data_sha": row.get("runtime_data_sha"),
              }
              rows.append(safe)

          if rows:
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open(
                  "a", encoding="utf-8"
              ) as fh:
                  for safe in rows:
                      fh.write(
                          "PERF-F_RESULT="
                          + json.dumps(safe, sort_keys=True)
                          + "\n"
                      )
              for safe in rows:
                  print(json.dumps(safe, sort_keys=True))
          PY
