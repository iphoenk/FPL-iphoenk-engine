name: P1 one-shot historical exposure cleanup residual pass

on:
  push:
    paths:
      - ".github/workflows/p1-one-shot-historical-cleanup.yml"

permissions:
  contents: read
  actions: write
  issues: read

jobs:
  cleanup-residual:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect all redacted historical V12 run IDs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/historical-run-ids.txt
          for page in $(seq 1 20); do
            json="$(gh api "repos/${GITHUB_REPOSITORY}/issues/431/comments?per_page=100&page=${page}")"
            count="$(jq 'length' <<<"$json")"
            jq -r '.[] | select((.body // "") | startswith("HISTORICAL_V12_PROOF_REDACTED"))
              | (.body | capture("run_id=(?<run>[0-9]+)").run)' <<<"$json" >> /tmp/historical-run-ids.txt
            if [ "$count" -lt 100 ]; then
              break
            fi
          done
          sort -u /tmp/historical-run-ids.txt -o /tmp/historical-run-ids.txt
          echo "HISTORICAL_RUN_IDS=$(wc -l < /tmp/historical-run-ids.txt | tr -d ' ')"

      - name: Delete any residual historical V12 runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          deleted=0
          already_missing=0
          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >/dev/null 2>&1; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >/dev/null
              deleted=$((deleted + 1))
            else
              already_missing=$((already_missing + 1))
            fi
          done < /tmp/historical-run-ids.txt
          echo "RESIDUAL_RUNS_DELETED=${deleted}"
          echo "HISTORICAL_RUNS_ALREADY_MISSING=${already_missing}"

      - name: Verify all historical run IDs are gone and decision caches remain zero
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remaining=0
          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >/dev/null 2>&1; then
              echo "::error::historical run still exists: ${run_id}"
              remaining=$((remaining + 1))
            fi
          done < /tmp/historical-run-ids.txt
          [ "$remaining" -eq 0 ]

          legacy_comments=0
          decision_caches=0
          for page in $(seq 1 20); do
            comments="$(gh api "repos/${GITHUB_REPOSITORY}/issues/431/comments?per_page=100&page=${page}")"
            count="$(jq 'length' <<<"$comments")"
            found="$(jq '[.[] | select((.body // "") | contains("V12_REPORT_RUN"))] | length' <<<"$comments")"
            legacy_comments=$((legacy_comments + found))
            if [ "$count" -lt 100 ]; then break; fi
          done
          [ "$legacy_comments" -eq 0 ]

          for page in $(seq 1 20); do
            caches="$(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100&page=${page}")"
            count="$(jq '.actions_caches | length' <<<"$caches")"
            found="$(jq '[.actions_caches[]
              | select((.key | startswith("v12-p17-decision-")) or (.key | startswith("v12-mc-summary-")))] | length' <<<"$caches")"
            decision_caches=$((decision_caches + found))
            if [ "$count" -lt 100 ]; then break; fi
          done
          [ "$decision_caches" -eq 0 ]
          echo "P1_HISTORICAL_NON_GIT_CLEANUP_FULL_VERIFY=PASS"
