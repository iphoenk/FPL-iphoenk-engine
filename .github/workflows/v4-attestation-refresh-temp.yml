name: V4 temporary architecture attestation refresh

on:
  push:
    branches: [codex/v4-runtime-secret-inheritance]
    paths:
      - '.github/workflows/v4-attestation-refresh-temp.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/v4-runtime-secret-inheritance
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Rebuild governed architecture attestation
        run: python tools/v4_architecture_guard_attest.py
      - name: Verify regenerated attestation
        run: python -m pytest -q tests/test_v4_architecture_attestation.py tests/test_v496_architecture_consolidation.py tests/test_v4_p0_production_publication_governance.py
      - name: Commit regenerated attestation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/architecture_guard_attestation.json data/architecture_ownership_v4.json
          if git diff --cached --quiet; then
            echo 'Attestation already current'
            exit 0
          fi
          git commit -m 'chore(v4): refresh architecture attestation for publisher secret wiring'
          git push origin HEAD:codex/v4-runtime-secret-inheritance
