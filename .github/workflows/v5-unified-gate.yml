name: V5 Unified Gate
on:
  push:
    branches: [v5-unified-engine]
    paths-ignore:
      - 'config/v5_shadow_trigger.json'
      - 'config/v5_on_demand_trigger.json'
  pull_request: {branches: [v5-unified-engine]}
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  bootstrap-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: {PYTHONPATH: "${{ github.workspace }}"}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - name: Enforce V5 canonical merged-PR provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/v5-unified-engine'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m src.v5.canonical_provenance
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Deployed production baseline gate
        run: |
          set -euo pipefail
          git fetch origin main runtime-data --quiet
          AUTHORITY=$(python -c "import json; print(json.load(open('config/v5_convergence_manifest.json'))['baselines']['production_source_authority'])")
          test "$AUTHORITY" = "runtime-data:data/runtime_manifest.json#source_commit"
          MAIN_HEAD=$(git rev-parse origin/main)
          RUNTIME_SOURCE=$(git show origin/runtime-data:data/runtime_manifest.json | python -c "import json,sys; print(json.load(sys.stdin)['source_commit'])")
          [[ "$RUNTIME_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${RUNTIME_SOURCE}^{commit}"
          git merge-base --is-ancestor "$RUNTIME_SOURCE" origin/main
          echo "V5_PRODUCTION_SOURCE_SHA=$RUNTIME_SOURCE" >> "$GITHUB_ENV"
          echo "deployed_runtime_source=$RUNTIME_SOURCE repository_main=$MAIN_HEAD authority=$AUTHORITY"
      - name: V5 bootstrap acceptance
        run: python -m src.v5.acceptance
      - name: V5 bootstrap tests
        run: python -m pytest -q tests/test_v5_bootstrap.py
      - name: V5 architecture and performance gates
        run: python -m pytest -q tests/test_v5_architecture_principles.py tests/test_v5_config_cache.py tests/test_v5_reporting_watchlist_performance.py tests/test_v5_interactive_performance.py
      - name: V5 comparator tactical and market parity gates
        run: python -m pytest -q tests/test_v5_owned_challenger_comparator.py tests/test_v5_owned_challenger_context.py tests/test_v5_owned_challenger_scenarios.py tests/test_v5_observed_tactical_context.py tests/test_v5_tactical_decision_consumption.py tests/test_v5_transfer_momentum.py
      - name: V5 microservice topology and contract gates
        run: python -m pytest -q tests/test_v5_microservices.py tests/test_v5_canonical_provenance.py
      - name: V5 service transport resilience
        run: python -m pytest -q tests/test_v5_service_transport.py
      - name: V5 Official API cache and singleflight
        run: python -m pytest -q tests/test_v5_public_api_cache.py
      - name: V5 degraded-mode governance
        run: python -m pytest -q tests/test_v5_degraded_mode.py
      - name: V5 cluster health diagnostics
        run: python -m pytest -q tests/test_v5_cluster_health.py
      - name: V5 full DSS core and extension coverage
        run: python -m pytest -q tests/test_v5_full_dss_core.py
      - name: V5 V3.12 decision parity
        run: python -m pytest -q tests/test_v5_v312_decision_parity.py
      - name: V5 V3.14 reporting and full DSS watchlist parity
        run: python -m pytest -q tests/test_v5_v313_reporting_watchlist.py
      - name: V5 V3.20 football-truth baseline convergence
        run: python -m pytest -q tests/test_v5_v3181_convergence.py
      - name: V5 structural shadow parity
        run: python -m pytest -q tests/test_v5_shadow_parity.py tests/test_v5_shadow_acceptance_accounting.py
      - name: V5 native decision and Gate0 governance
        run: python -m pytest -q tests/test_v5_decision_governance.py tests/test_v5_on_demand_report.py
      - name: V5 advanced beta.4 hardening
        run: python -m pytest -q tests/test_v5_feature_bundle.py tests/test_v5_advanced_prediction.py tests/test_v5_correlated_simulation.py tests/test_v5_temporal_backtest.py tests/test_v5_release_attestation.py tests/test_v5_team_review.py
      - name: V4 adopted-intelligence regression suite
        run: python -m pytest -q tests/test_v4_prediction.py tests/test_v4_lineup_optimizer.py tests/test_v4_validation.py tests/test_v4_recommendation_sanity.py tests/test_v4_wc_package_audit.py
      - name: V5 complete regression suite
        run: python -m pytest -q
