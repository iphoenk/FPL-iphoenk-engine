name: One-shot V4 atomic publish hardening

on:
  push:
    branches: [codex/v4-atomic-publish-node24]
    paths-ignore:
      - 'config/architecture_guard_attestation.json'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/v4-atomic-publish-node24
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Rewrite reusable core into one runtime mutation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/fpl-engine-core.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace('actions/checkout@v4', 'actions/checkout@v7')
          text = text.replace('actions/setup-python@v5', 'actions/setup-python@v7')
          text = text.replace('actions/upload-artifact@v4', 'actions/upload-artifact@v7')

          start_marker = '      - name: Stamp runtime publication freshness\n'
          repeat_marker = '      - name: Repeated FAST and warm-serving p95 benchmark\n'
          start = text.index(start_marker)
          repeat = text.index(repeat_marker, start)
          replacement = '''      - name: Advanced enrichment ablation diagnostic\n        id: advanced_ablation\n        continue-on-error: ${{ inputs.publish }}\n        run: |\n          python -m src.engines.v4_advanced_ablation\n          python - <<'PYCODE'\n          import json\n          a=json.load(open('data/advanced_ablation_v4.json'))\n          assert a['status']=='PASS', a\n          assert a['ablation']['full_shadow_parity']['ok'] is True, a\n          assert a['interpretation']['impact_is_diagnostic_not_health_threshold'] is True, a\n          PYCODE\n\n      - name: Record ablation execution status for atomic publication\n        if: always() && inputs.publish\n        env:\n          ABLATION_OUTCOME: ${{ steps.advanced_ablation.outcome }}\n        run: |\n          python - <<'PYCODE'\n          import json, os\n          from pathlib import Path\n          p=Path('data/advanced_ablation_v4.json')\n          try:\n              obj=json.loads(p.read_text())\n          except Exception:\n              obj={'schema_version': 1, 'status': 'DIAGNOSTIC_UNAVAILABLE'}\n          obj['runtime_execution']={\n              'outcome': os.environ.get('ABLATION_OUTCOME') or 'unknown',\n              'failure_cannot_block_core_publish': True,\n              'observational_outside_decision_chain': True,\n          }\n          p.write_text(json.dumps(obj,indent=2,ensure_ascii=False)+'\\n',encoding='utf-8')\n          PYCODE\n\n      - name: Stamp runtime publication freshness\n        if: inputs.publish\n        run: python -m src.services.runtime_publish_stamp\n\n      - name: Publish complete runtime snapshot atomically\n        if: inputs.publish\n        shell: bash\n        run: |\n          set -euo pipefail\n          publish_tree="$RUNNER_TEMP/v4-runtime-core"\n          rm -rf "$publish_tree"\n          git config user.name "fpl-iphoenk-bot"\n          git config user.email "actions@users.noreply.github.com"\n          git worktree add --detach "$publish_tree" HEAD\n          cd "$publish_tree"\n          git checkout --orphan runtime-snapshot\n          git rm -rf . >/dev/null 2>&1 || true\n          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +\n          cp -a "$GITHUB_WORKSPACE/data" ./data\n          git add -f data/\n          git commit -m "data(v4): atomic production snapshot [skip ci]"\n          git push --force origin HEAD:"$RUNTIME_BRANCH"\n\n'''
          text = text[:start] + replacement + text[repeat:]

          second_marker = '      - name: Publish ablation diagnostic data\n'
          verify_marker = '      - name: Verify published V4 runtime snapshot\n'
          second = text.index(second_marker)
          verify = text.index(verify_marker, second)
          text = text[:second] + text[verify:]

          if text.count('git push --force origin HEAD:"$RUNTIME_BRANCH"') != 1:
              raise SystemExit('expected exactly one runtime force-push')
          if 'Publish ablation diagnostic data' in text:
              raise SystemExit('second runtime mutation still present')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Full Architecture Guard and refresh attestation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from src.services import architecture_guard_service as guard
          result=guard.run(force_full_scan=True)
          if result.get('status') != 'PASS':
              raise SystemExit('full Architecture Guard scan failed')
          payload={
              'schema_version': guard.ATTESTATION_SCHEMA_VERSION,
              'fingerprint': guard.repository_fingerprint(),
              'release': guard.RELEASE_VERSION,
              'guard_schema_version': result.get('schema_version'),
              'result': result,
          }
          Path('config/architecture_guard_attestation.json').write_text(
              json.dumps(payload,indent=2,ensure_ascii=False)+'\n',encoding='utf-8'
          )
          print(payload['fingerprint'])
          PY
      - name: Commit governed changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'fpl-iphoenk-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/fpl-engine-core.yml config/architecture_guard_attestation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor(v4): publish one atomic runtime snapshot'
          git push origin HEAD:codex/v4-atomic-publish-node24
