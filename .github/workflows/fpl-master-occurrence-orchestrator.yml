name: FPL Master occurrence orchestrator
run-name: >-
  ${{
    github.event_name == 'workflow_dispatch' &&
    format('FPL Master occurrence {0} {1}', inputs.report_mode, inputs.report_slot) ||
    format('FPL Master occurrence comment {0}', github.event.comment.id)
  }}

on:
  workflow_dispatch:
    inputs:
      report_mode:
        description: "DEEP or PRICE"
        required: true
        type: string
      report_slot:
        description: "Exact Asia/Jakarta occurrence ISO-8601"
        required: true
        type: string
      checkpoint_time:
        description: "Exact local HH:MM"
        required: true
        type: string
      scheduler_authority:
        description: "Governed caller identity"
        required: true
        default: "CHATGPT_FPL_MASTER_SCHEDULER"
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: fpl-master-occurrence-orchestrator
  cancel-in-progress: false

jobs:
  orchestrate:
    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        (
          inputs.scheduler_authority == 'CHATGPT_FPL_MASTER_SCHEDULER' ||
          inputs.scheduler_authority == 'EXTERNAL_CLOCK_FALLBACK'
        )
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 431 &&
        github.actor == github.repository_owner &&
        startsWith(github.event.comment.body, '/fpl-master-tick ')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      COMMAND: ${{ github.event_name == 'workflow_dispatch' && format('/fpl-master-tick report_mode={0} report_slot={1} checkpoint_time={2}', inputs.report_mode, inputs.report_slot, inputs.checkpoint_time) || github.event.comment.body }}
      REQUEST_ID: fpl_master_orchestrator_${{ github.run_id }}

    steps:
      - name: Parse and validate occurrence
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import shlex
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          tokens = shlex.split(os.environ["COMMAND"])
          if not tokens or tokens[0] != "/fpl-master-tick":
              raise SystemExit("invalid command")

          args = {}
          for token in tokens[1:]:
              if "=" not in token:
                  raise SystemExit(f"invalid argument: {token}")
              key, value = token.split("=", 1)
              if key in args:
                  raise SystemExit(f"duplicate argument: {key}")
              args[key] = value

          allowed = {"report_mode", "report_slot", "checkpoint_time"}
          unknown = set(args) - allowed
          if unknown:
              raise SystemExit(f"unknown arguments: {sorted(unknown)}")

          mode = str(args.get("report_mode") or "").upper()
          slot = str(args.get("report_slot") or "")
          if mode not in {"DEEP", "PRICE"}:
              raise SystemExit("report_mode must be DEEP or PRICE")
          if not slot:
              raise SystemExit("report_slot is required")

          dt = datetime.fromisoformat(slot)
          if dt.utcoffset() is None or int(dt.utcoffset().total_seconds()) != 7 * 3600:
              raise SystemExit("report_slot must use Asia/Jakarta +07:00")
          if dt.second != 0 or dt.microsecond != 0:
              raise SystemExit("report_slot must be exact to the minute")
          now = datetime.now(ZoneInfo("Asia/Jakarta"))
          scheduler_skew = timedelta(minutes=5)
          if dt > now + scheduler_skew:
              raise SystemExit("report_slot exceeds bounded scheduler skew")
          # A governed scheduler may enqueue a logical slot a few minutes early.
          # Keep report_slot unchanged: downstream factual binding and generated_at
          # checks remain occurrence-bound and cannot claim pre-slot output as current.

          checkpoint = args.get("checkpoint_time") or dt.strftime("%H:%M")
          if checkpoint != dt.strftime("%H:%M"):
              raise SystemExit("checkpoint_time must equal report_slot local HH:MM")

          if mode == "DEEP" and checkpoint not in {"04:30", "12:30", "21:30"}:
              raise SystemExit("DEEP occurrence must be 04:30, 12:30, or 21:30 WIB")
          if mode == "PRICE":
              london = dt.astimezone(ZoneInfo("Europe/London"))
              if london.strftime("%H:%M") != "23:30":
                  raise SystemExit("PRICE occurrence must bind to 23:30 Europe/London")

          report_kind = "full_master" if mode == "DEEP" else "05:30_price"
          occurrence_id = f"{mode}|{slot}"
          serving_file = "deep.json" if mode == "DEEP" else "price.json"

          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as fh:
              fh.write(f"report_mode={mode}\n")
              fh.write(f"report_slot={slot}\n")
              fh.write(f"checkpoint_time={checkpoint}\n")
              fh.write(f"report_kind={report_kind}\n")
              fh.write(f"occurrence_id={occurrence_id}\n")
              fh.write(f"serving_file={serving_file}\n")
          PY

      - name: Idempotency guard
        id: guard
        env:
          OCCURRENCE_ID: ${{ steps.parse.outputs.occurrence_id }}
          FPL_PRIVATE_REPORTS_TOKEN: ${{ secrets.FPL_PRIVATE_REPORTS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          comments_file="$RUNNER_TEMP/issue-431-comments.txt"
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/issues/431/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .body' \
            > "$comments_file"
          if grep -F "FPL_MASTER_RECEIPT occurrence_id=${OCCURRENCE_ID} status=READY_FULL" "$comments_file" >/dev/null ||
             grep -F "FPL_MASTER_RECEIPT occurrence_id=${OCCURRENCE_ID} status=READY_DEGRADED" "$comments_file" >/dev/null ||
             grep -F "FPL_MASTER_RECEIPT occurrence_id=${OCCURRENCE_ID} status=READY_REUSED" "$comments_file" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reuse_source=EXISTING_RECEIPT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "${FPL_PRIVATE_REPORTS_TOKEN:-}" ]]; then
            tmp="$RUNNER_TEMP/delivery-status.json"
            if GH_TOKEN="$FPL_PRIVATE_REPORTS_TOKEN" gh api \
              "/repos/iphoenk/fpl-reports-private/contents/latest/delivery_status.json?ref=main" \
              --jq '.content' | tr -d '\n' | base64 -d > "$tmp" 2>/dev/null; then
              if OCCURRENCE_ID="$OCCURRENCE_ID" python - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "delivery-status.json"
          obj = json.loads(p.read_text(encoding="utf-8"))
          report_slot = datetime.fromisoformat(
              os.environ["OCCURRENCE_ID"].split("|", 1)[1]
          )
          generated_at = datetime.fromisoformat(str(obj.get("generated_at") or ""))
          ok = (
              obj.get("occurrence_id") == os.environ["OCCURRENCE_ID"]
              and obj.get("delivery_status") in {"READY_FULL", "READY_DEGRADED"}
              and generated_at >= report_slot
          )
          if (
              obj.get("occurrence_id") == os.environ["OCCURRENCE_ID"]
              and generated_at < report_slot
          ):
              print("PRIVATE_LATEST_BEFORE_OCCURRENCE", file=sys.stderr)
          raise SystemExit(0 if ok else 1)
          PY
              then
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "reuse_source=PRIVATE_LATEST" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "reuse_source=NONE" >> "$GITHUB_OUTPUT"

      - name: Dispatch and bind exact V6 report-prefetch
        id: prefetch
        if: steps.guard.outputs.skip != 'true'
        env:
          REPORT_KIND: ${{ steps.parse.outputs.report_kind }}
          REPORT_SLOT: ${{ steps.parse.outputs.report_slot }}
        shell: bash
        run: |
          set -euo pipefail
          expected="V6 report_prefetch ${REPORT_KIND} ${REPORT_SLOT} ${REQUEST_ID}"
          dispatched_after="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run v6-natural-data-ingestion.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f mode=report_prefetch \
            -f reason="$REQUEST_ID" \
            -f report_kind="$REPORT_KIND" \
            -f logical_slot="$REPORT_SLOT" \
            -f force=true

          run_id=""
          for _ in $(seq 1 30); do
            payload="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/v6-natural-data-ingestion.yml/runs?event=workflow_dispatch&per_page=30")"
            run_id="$(printf '%s' "$payload" | jq -r \
              --arg expected "$expected" \
              --arg after "$dispatched_after" \
              '.workflow_runs[] | select(.display_title == $expected and .created_at >= $after) | .id' | head -n1)"
            if [[ -n "$run_id" && "$run_id" != "null" ]]; then
              break
            fi
            sleep 2
          done
          test -n "$run_id"
          test "$run_id" != "null"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Dispatch and bind exact integrated report
        id: report
        if: steps.guard.outputs.skip != 'true' && steps.prefetch.outcome == 'success'
        env:
          REPORT_MODE: ${{ steps.parse.outputs.report_mode }}
          REPORT_SLOT: ${{ steps.parse.outputs.report_slot }}
          CHECKPOINT_TIME: ${{ steps.parse.outputs.checkpoint_time }}
        shell: bash
        run: |
          set -euo pipefail
          expected="V12 ${REPORT_MODE} ${REPORT_SLOT} ${REQUEST_ID}"
          dispatched_after="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run v12-integrated-report-runner.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f report_mode="$REPORT_MODE" \
            -f report_slot="$REPORT_SLOT" \
            -f checkpoint_time="$CHECKPOINT_TIME" \
            -f profile_mode=OFF \
            -f request_id="$REQUEST_ID"

          run_id=""
          for _ in $(seq 1 30); do
            payload="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/v12-integrated-report-runner.yml/runs?event=workflow_dispatch&per_page=30")"
            run_id="$(printf '%s' "$payload" | jq -r \
              --arg expected "$expected" \
              --arg after "$dispatched_after" \
              '.workflow_runs[] | select(.display_title == $expected and .created_at >= $after) | .id' | head -n1)"
            if [[ -n "$run_id" && "$run_id" != "null" ]]; then
              break
            fi
            sleep 2
          done
          test -n "$run_id"
          test "$run_id" != "null"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Checkout canonical occurrence terminality verifier
        if: steps.guard.outputs.skip != 'true' && steps.report.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: occurrence-verifier-source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact private serving publication
        id: verify
        if: steps.guard.outputs.skip != 'true' && steps.report.outcome == 'success'
        env:
          FPL_PRIVATE_REPORTS_TOKEN: ${{ secrets.FPL_PRIVATE_REPORTS_TOKEN }}
          REPORT_MODE: ${{ steps.parse.outputs.report_mode }}
          REPORT_SLOT: ${{ steps.parse.outputs.report_slot }}
          OCCURRENCE_ID: ${{ steps.parse.outputs.occurrence_id }}
          SERVING_FILE: ${{ steps.parse.outputs.serving_file }}
          PYTHONPATH: ${{ github.workspace }}/occurrence-verifier-source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FPL_PRIVATE_REPORTS_TOKEN:-}"

          GH_TOKEN="$FPL_PRIVATE_REPORTS_TOKEN" gh api \
            "/repos/iphoenk/fpl-reports-private/contents/latest/${SERVING_FILE}?ref=main" \
            --jq '.content' | tr -d '\n' | base64 -d > "$RUNNER_TEMP/serving.json"

          if [[ "$REPORT_MODE" == "DEEP" ]]; then
            GH_TOKEN="$FPL_PRIVATE_REPORTS_TOKEN" gh api \
              "/repos/iphoenk/fpl-reports-private/contents/latest/delivery_status.json?ref=main" \
              --jq '.content' | tr -d '\n' | base64 -d > "$RUNNER_TEMP/delivery-status.json"
          fi

          read -r history_dir body_name < <(
            python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          serving = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "serving.json").read_text(
                  encoding="utf-8"
              )
          )
          slot = os.environ["REPORT_SLOT"]
          mode = os.environ["REPORT_MODE"]
          planning_gw = int(serving.get("planning_gw") or 0)
          if planning_gw <= 0:
              raise SystemExit("private digest missing planning_gw")
          dt = datetime.fromisoformat(slot)
          start_year = dt.year if dt.month >= 7 else dt.year - 1
          season = f"{start_year}-{str(start_year + 1)[-2:]}"
          slot_token = (
              slot.replace(":", "")
              .replace("+", "_plus_")
              .replace("-", "")
              .replace("T", "_")
          )
          body_name = "serving_report.md" if mode == "DEEP" else "report_body.md"
          print(
              f"reports/{season}/gw_{planning_gw}/{slot_token}",
              body_name,
          )
          PY
          )

          GH_TOKEN="$FPL_PRIVATE_REPORTS_TOKEN" gh api \
            "/repos/iphoenk/fpl-reports-private/contents/${history_dir}/delivery_receipt.json?ref=main" \
            --jq '.content' | tr -d '\n' | base64 -d > "$RUNNER_TEMP/history-receipt.json"

          GH_TOKEN="$FPL_PRIVATE_REPORTS_TOKEN" gh api \
            "/repos/iphoenk/fpl-reports-private/contents/${history_dir}/digest.json?ref=main" \
            --jq '.content' | tr -d '\n' | base64 -d > "$RUNNER_TEMP/history-digest.json"

          GH_TOKEN="$FPL_PRIVATE_REPORTS_TOKEN" gh api \
            "/repos/iphoenk/fpl-reports-private/contents/${history_dir}/stage3_acceptance.json?ref=main" \
            --jq '.content' | tr -d '\n' | base64 -d > "$RUNNER_TEMP/stage3-acceptance.json"

          GH_TOKEN="$FPL_PRIVATE_REPORTS_TOKEN" gh api \
            "/repos/iphoenk/fpl-reports-private/contents/${history_dir}/${body_name}?ref=main" \
            --jq '.content' | tr -d '\n' | base64 -d > "$RUNNER_TEMP/history-body.md"

          if [[ "$REPORT_MODE" == "DEEP" ]]; then
            GH_TOKEN="$FPL_PRIVATE_REPORTS_TOKEN" gh api \
              "/repos/iphoenk/fpl-reports-private/contents/latest/report.md?ref=main" \
              --jq '.content' | tr -d '\n' | base64 -d > "$RUNNER_TEMP/latest-body.md"
          fi

          HISTORY_DIR="$history_dir" BODY_NAME="$body_name" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from src.engines.v12_occurrence_terminality import classify_occurrence

          root = Path(os.environ["RUNNER_TEMP"])
          serving = json.loads((root / "serving.json").read_text(encoding="utf-8"))
          receipt = json.loads((root / "history-receipt.json").read_text(encoding="utf-8"))
          digest = json.loads((root / "history-digest.json").read_text(encoding="utf-8"))
          stage3 = json.loads((root / "stage3-acceptance.json").read_text(encoding="utf-8"))
          delivery = json.loads((root / "delivery-status.json").read_text(encoding="utf-8"))
          mode = os.environ["REPORT_MODE"]
          slot = os.environ["REPORT_SLOT"]
          occurrence_id = os.environ["OCCURRENCE_ID"]

          body = (root / "history-body.md").read_bytes()
          latest_body = (root / "latest-body.md").read_bytes() if mode == "DEEP" else body
          body_sha = hashlib.sha256(body).hexdigest()
          latest_sha = hashlib.sha256(latest_body).hexdigest()
          expected_sha = str(serving.get("canonical_body_sha256") or "")
          root_failure = str(delivery.get("root_failure") or "").strip().upper()
          delivery_status = str(delivery.get("delivery_status") or "").strip().upper()
          stage3_status = str(stage3.get("status") or "").strip().upper()

          # Write forensic publication evidence before semantic classification.
          history_path = f"{os.environ['HISTORY_DIR']}/{os.environ['BODY_NAME']}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"delivery_status={delivery_status or 'UNKNOWN'}\n")
              fh.write(f"report_sha={body_sha}\n")
              fh.write(f"report_size={len(body)}\n")
              fh.write(f"history_path={history_path}\n")
              fh.write(f"canonical_body_sha256={body_sha}\n")
              fh.write("terminality=UNKNOWN\n")

          evidence = {
              "report_mode": mode,
              "report_slot": slot,
              "occurrence_id": occurrence_id,
              "serving": {**serving, "canonical_body_sha256": expected_sha},
              "delivery": delivery,
              "historical": {
                  "exists": bool(body),
                  "path": history_path,
                  "body_size": len(body),
                  "body_sha256": body_sha,
                  "receipt_body_sha256": str(receipt.get("canonical_body_sha256") or ""),
                  "digest_body_sha256": str(digest.get("canonical_body_sha256") or ""),
                  "receipt_report_slot": str(receipt.get("report_slot") or ""),
                  "receipt_report_mode": str(receipt.get("report_mode") or ""),
              },
              "latest": {
                  "exists": bool(latest_body),
                  "advanced": latest_sha == body_sha,
                  "body_sha256": latest_sha,
              },
              "private_delivery_status": receipt.get("private_delivery_status"),
              "exact_publication": receipt.get("serving_snapshot_published") is True,
              "stage3": {
                  "validation": stage3_status,
                  "action": serving.get("stage3_action") or "WAIT",
                  "engineering_closure_blocks_report": stage3.get("engineering_closure_blocks_report") is True,
              },
              "degradation": {
                  "governed": (
                      delivery_status == "READY_DEGRADED"
                      and root_failure in {"ANALYTICS_INCOMPLETE", "BLOCKED_UPSTREAM", "PREFETCH_NOT_TERMINAL"}
                      and stage3_status == "DEGRADED"
                      and stage3.get("engineering_closure_blocks_report") is not True
                  ),
                  "attributable": bool(root_failure),
                  "reason": root_failure,
              },
              "personal_authority_violation": receipt.get("personal_authority_violation") is True,
              "privacy_violation": receipt.get("privacy_validation_status") != "PASS",
              "fabricated_evidence": receipt.get("fabricated_evidence") is True,
              "mandatory_math_failure": (
                  stage3.get("mandatory_math_failure") is True
                  or stage3.get("engineering_closure_blocks_report") is True
              ),
          }
          result = classify_occurrence(evidence)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"terminality={result['terminality']}\n")

          if result["terminality"] == "FAILED_VERIFY":
              raise SystemExit("occurrence terminality FAILED_VERIFY: " + ",".join(result["failures"]))
          print(json.dumps(result, sort_keys=True))
          PY

      - name: Publish occurrence receipt
        if: always()
        env:
          OCCURRENCE_ID: ${{ steps.parse.outputs.occurrence_id }}
          REPORT_MODE: ${{ steps.parse.outputs.report_mode }}
          REPORT_SLOT: ${{ steps.parse.outputs.report_slot }}
          REUSE: ${{ steps.guard.outputs.skip }}
          REUSE_SOURCE: ${{ steps.guard.outputs.reuse_source }}
          PREFETCH_OUTCOME: ${{ steps.prefetch.outcome }}
          PREFETCH_RUN: ${{ steps.prefetch.outputs.run_id }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
          REPORT_RUN: ${{ steps.report.outputs.run_id }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          DELIVERY_STATUS: ${{ steps.verify.outputs.delivery_status }}
          REPORT_SHA: ${{ steps.verify.outputs.report_sha }}
          REPORT_SIZE: ${{ steps.verify.outputs.report_size }}
          HISTORY_PATH: ${{ steps.verify.outputs.history_path }}
          CANONICAL_BODY_SHA256: ${{ steps.verify.outputs.canonical_body_sha256 }}
          TERMINALITY: ${{ steps.verify.outputs.terminality }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${REUSE:-}" == "true" ]]; then
            status="READY_REUSED"
          elif [[ -n "${TERMINALITY:-}" && "${TERMINALITY:-}" != "UNKNOWN" ]]; then
            status="${TERMINALITY}"
          elif [[ "${VERIFY_OUTCOME:-}" == "success" ]]; then
            status="${DELIVERY_STATUS:-READY_FULL}"
          elif [[ "${PREFETCH_OUTCOME:-}" != "success" ]]; then
            status="FAILED_PREFETCH"
          elif [[ "${REPORT_OUTCOME:-}" != "success" ]]; then
            status="FAILED_REPORT"
          else
            status="FAILED_VERIFY"
          fi

          body="$RUNNER_TEMP/receipt.md"
          {
            echo "<!-- FPL_MASTER_RECEIPT occurrence_id=${OCCURRENCE_ID:-UNKNOWN} status=$status -->"
            echo "FPL_MASTER_RECEIPT"
            echo
            echo "- occurrence_id: \`${OCCURRENCE_ID:-UNKNOWN}\`"
            echo "- report_mode: \`${REPORT_MODE:-UNKNOWN}\`"
            echo "- report_slot: \`${REPORT_SLOT:-UNKNOWN}\`"
            echo "- status: \`$status\`"
            echo "- orchestrator_run: \`$GITHUB_RUN_ID\`"
            echo "- request_id: \`$REQUEST_ID\`"
            echo "- reused: \`${REUSE:-false}\`"
            echo "- reuse_source: \`${REUSE_SOURCE:-NONE}\`"
            echo "- prefetch_run: \`${PREFETCH_RUN:-UNAVAILABLE}\`"
            echo "- report_run: \`${REPORT_RUN:-UNAVAILABLE}\`"
            echo "- private_report_sha256: \`${REPORT_SHA:-UNAVAILABLE}\`"
            echo "- canonical_body_sha256: \`${CANONICAL_BODY_SHA256:-UNAVAILABLE}\`"
            echo "- private_report_size: \`${REPORT_SIZE:-UNAVAILABLE}\`"
            echo "- private_report_path: \`${HISTORY_PATH:-UNAVAILABLE}\`"
            echo "- user_visible_required: \`true\`"
            echo "- generated_at_utc: \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`"
          } > "$body"

          gh issue comment 431 --repo "$GITHUB_REPOSITORY" --body-file "$body"

          case "$status" in
            READY_FULL|READY_DEGRADED|READY_REUSED) exit 0 ;;
            *) exit 1 ;;
          esac
