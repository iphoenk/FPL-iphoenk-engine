name: V5 Dev Subsecond Performance

on:
  push:
    branches: [v5-rec02-robust-rates]
    paths:
      - 'src/v5/**'
      - 'config/v5_*.json'
      - 'config/intelligence/**'
      - 'deploy/v5/**'
      - 'tests/test_v5_runtime_performance_policy.py'
      - '.github/workflows/v5-dev-subsecond-performance.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  hot-path-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve team and execution-plane runtime budgets
        shell: bash
        run: |
          set -euo pipefail
          TEAM_ID=$(python -c "import json; print(json.load(open('config/engine.json'))['team_id'])")
          HARD_MS=$(python -c "import json; print(float(json.load(open('config/v5_performance_budgets.json'))['budgets']['hot_path_hard_limit_seconds'])*1000)")
          PLANE_HARD_MS=$(python -c "import json; print(float(json.load(open('config/v5_execution_plane_registry.json'))['planes']['hot']['hard_limit_ms']))")
          REFRESH_CEILING_MS=$(python -c "import json; print(float(json.load(open('config/v5_performance_budgets.json'))['budgets']['refresh_pipeline_observability_ceiling_seconds'])*1000)")
          test "$HARD_MS" = "$PLANE_HARD_MS"
          echo "FPL_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "V5_HOT_HARD_MS=$HARD_MS" >> "$GITHUB_ENV"
          echo "V5_REFRESH_CEILING_MS=$REFRESH_CEILING_MS" >> "$GITHUB_ENV"
          echo "team_id=$TEAM_ID hot_hard_ms=$HARD_MS refresh_observability_ceiling_ms=$REFRESH_CEILING_MS"

      - name: Start V5 bounded-context cluster
        env:
          FPL_AUTH_MODE: ${{ secrets.FPL_AUTH_MODE }}
          FPL_SESSION_B64: ${{ secrets.FPL_SESSION_B64 }}
          FPL_ACCESS_TOKEN: ${{ secrets.FPL_ACCESS_TOKEN }}
          FPL_REFRESH_TOKEN: ${{ secrets.FPL_REFRESH_TOKEN }}
          FPL_OIDC_TOKEN_URL: ${{ secrets.FPL_OIDC_TOKEN_URL }}
          FPL_OIDC_CLIENT_ID: ${{ secrets.FPL_OIDC_CLIENT_ID }}
          FPL_OIDC_CLIENT_SECRET: ${{ secrets.FPL_OIDC_CLIENT_SECRET }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: docker compose -f deploy/v5/docker-compose.yml up -d --build

      - name: Wait for cluster health
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8100/health >/dev/null; then
              echo "V5 cluster healthy"
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/v5/docker-compose.yml ps
          exit 1

      - name: Warm full refresh then enforce isolated hot-path SLA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          team_id = int(os.environ['FPL_TEAM_ID'])
          hard_ms = float(os.environ['V5_HOT_HARD_MS'])
          refresh_ceiling_ms = float(os.environ['V5_REFRESH_CEILING_MS'])

          def invoke(operation, payload, timeout=30):
              body = json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  f'http://127.0.0.1:8100/v1/invoke/{operation}',
                  data=body,
                  headers={'Content-Type': 'application/json', 'Accept': 'application/json'},
                  method='POST',
              )
              started = time.perf_counter()
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  envelope = json.load(response)
              external_ms = (time.perf_counter() - started) * 1000.0
              if not envelope.get('ok'):
                  raise SystemExit(f"orchestrator {operation} failed: {envelope.get('error')}")
              return envelope.get('data') or {}, external_ms

          refresh, refresh_external_ms = invoke('run', {
              'mode': 'daily',
              'team_id': team_id,
              'persist': True,
              'correlation_id': 'dev-refresh-warmup',
          })
          refresh_perf = refresh.get('service_performance') or {}
          refresh_internal_ms = float(refresh_perf.get('full_beta_end_to_end_ms') or 0.0)
          materialization = refresh.get('execution_plane') or {}
          assert materialization.get('hot_materialization') == 'READY', materialization
          assert materialization.get('hot_materialization_commit_order') == 'AFTER_SUPPORTING_ARTIFACTS', materialization

          hot, hot_external_ms = invoke('hot_run', {
              'mode': 'daily',
              'team_id': team_id,
              'correlation_id': 'dev-hot-probe',
          })
          hot_perf = hot.get('service_performance') or {}
          hot_internal_ms = float(hot_perf.get('hot_path_wall_ms') or 0.0)
          freshness = ((hot.get('governance') or {}).get('freshness') or {})

          result = {
              'refresh_plane': {
                  'internal_ms': refresh_internal_ms,
                  'external_ms': round(refresh_external_ms, 3),
                  'observability_ceiling_ms': refresh_ceiling_ms,
                  'within_observability_ceiling': refresh_external_ms <= refresh_ceiling_ms,
                  'release_blocking': False,
              },
              'hot_path': {
                  'internal_ms': hot_internal_ms,
                  'external_ms': round(hot_external_ms, 3),
                  'hard_limit_ms': hard_ms,
                  'internal_pass': 0 < hot_internal_ms <= hard_ms,
                  'external_pass': 0 < hot_external_ms <= hard_ms,
                  'freshness': freshness,
                  'materialization_read': hot_perf.get('materialization_read'),
              },
          }
          print(json.dumps(result, indent=2, ensure_ascii=False))

          assert freshness.get('eligible') is True, freshness
          assert (hot.get('governance') or {}).get('hidden_synchronous_refresh') is False
          assert hot_internal_ms > 0.0, f'missing hot-path runtime telemetry: {hot_perf}'
          assert hot_internal_ms <= hard_ms, f'V5 hot internal runtime exceeded hard limit: {hot_internal_ms:.1f}ms > {hard_ms:.1f}ms'
          assert hot_external_ms <= hard_ms, f'V5 user-facing hot round trip exceeded hard limit: {hot_external_ms:.1f}ms > {hard_ms:.1f}ms'
          PY

      - name: Recreate orchestrator with enabled deadline refresh worker
        shell: bash
        run: |
          set -euo pipefail
          V5_REFRESH_WORKER_ENABLED=true \
          V5_REFRESH_WORKER_MODE=deadline \
          docker compose -f deploy/v5/docker-compose.yml up -d --no-deps --force-recreate orchestrator

      - name: Validate enabled refresh-worker canary and hot SLA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          hard_ms = float(os.environ['V5_HOT_HARD_MS'])
          team_id = int(os.environ['FPL_TEAM_ID'])
          deadline = time.monotonic() + 45.0
          worker = {}
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3) as response:
                      health = json.load(response)
                  worker = health.get('refresh_worker') or {}
                  if worker.get('enabled') is True and worker.get('running') is True and int(worker.get('successes') or 0) >= 1:
                      break
              except (urllib.error.URLError, TimeoutError, json.JSONDecodeError):
                  pass
              time.sleep(0.5)
          else:
              raise SystemExit(f'refresh worker did not produce a successful materialization: {worker}')

          assert worker.get('mode') == 'deadline', worker
          assert int(worker.get('interval_seconds') or 0) == 20, worker
          assert worker.get('scheduler_class') == 'SUBMINUTE_WORKER_REQUIRED', worker
          assert int(worker.get('failures') or 0) == 0, worker
          assert worker.get('last_materialization_status') == 'READY', worker

          body = json.dumps({
              'mode': 'deadline',
              'team_id': team_id,
              'correlation_id': 'dev-worker-hot-canary',
          }).encode('utf-8')
          req = urllib.request.Request(
              'http://127.0.0.1:8100/v1/invoke/hot_run',
              data=body,
              headers={'Content-Type': 'application/json', 'Accept': 'application/json'},
              method='POST',
          )
          started = time.perf_counter()
          with urllib.request.urlopen(req, timeout=10) as response:
              envelope = json.load(response)
          external_ms = (time.perf_counter() - started) * 1000.0
          assert envelope.get('ok') is True, envelope
          hot = envelope.get('data') or {}
          perf = hot.get('service_performance') or {}
          freshness = ((hot.get('governance') or {}).get('freshness') or {})
          internal_ms = float(perf.get('hot_path_wall_ms') or 0.0)
          result = {
              'worker': worker,
              'hot_path_with_worker_enabled': {
                  'internal_ms': internal_ms,
                  'external_ms': round(external_ms, 3),
                  'hard_limit_ms': hard_ms,
                  'freshness': freshness,
              },
          }
          print(json.dumps(result, indent=2, ensure_ascii=False))
          assert freshness.get('eligible') is True, freshness
          assert freshness.get('mode') == 'deadline', freshness
          assert 0.0 < internal_ms <= hard_ms, perf
          assert 0.0 < external_ms <= hard_ms, result
          assert (hot.get('governance') or {}).get('hidden_synchronous_refresh') is False
          PY

      - name: Show cluster diagnostics on failure
        if: failure()
        run: |
          docker compose -f deploy/v5/docker-compose.yml ps
          docker compose -f deploy/v5/docker-compose.yml logs --tail=200 orchestrator decision prediction snapshot || true

      - name: Stop V5 cluster
        if: always()
        run: docker compose -f deploy/v5/docker-compose.yml down -v
