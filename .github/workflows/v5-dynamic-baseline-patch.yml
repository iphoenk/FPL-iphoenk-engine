name: V5 Dynamic Baseline Patch

on:
  push:
    branches:
      - codex/v5-p0-control-plane-consolidation
    paths:
      - .github/workflows/v5-dynamic-baseline-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v5-p0-control-plane-consolidation
          fetch-depth: 0
      - name: Apply dynamic baseline migration
        run: python tools/v5_dynamic_baseline_patch.py
      - name: Validate generated code and metadata
        run: |
          python -m py_compile src/v5/production_baseline.py src/v5/release_attestation.py src/v5/shadow_acceptance.py src/v5/acceptance.py scripts/v5_evidence_scheduler_gate.py scripts/v5_dispatch_shadow_trigger.py tools/v5_dynamic_baseline_patch.py
          python -m json.tool config/v5_convergence_manifest.json >/dev/null
          python -m json.tool config/v5_acceptance_registry.json >/dev/null
          python -m json.tool config/v5_capability_parity_registry.json >/dev/null
          python -m json.tool IMPLEMENTATION_STATUS.json >/dev/null
          git diff --check
      - name: Commit dynamic baseline migration
        run: |
          git config user.name "iphoenk"
          git config user.email "103485057+iphoenk@users.noreply.github.com"
          git add src/v5/production_baseline.py src/v5/release_attestation.py src/v5/shadow_acceptance.py src/v5/acceptance.py scripts/v5_evidence_scheduler_gate.py .github/workflows/v5-unified-gate.yml .github/workflows/v5-shadow-cycle.yml config/v5_convergence_manifest.json config/v5_acceptance_registry.json config/v5_capability_parity_registry.json IMPLEMENTATION_STATUS.json tests/test_v5_release_attestation.py tests/test_v5_current_v3_parity.py tests/test_v5_metadata_authority_hygiene.py tests/test_v5_operational_acceptance_manifest.py tests/test_v5_control_plane_governance.py tests/test_v5_prediction_baseline_provenance.py tests/test_v5_production_baseline.py
          git commit -m "fix(v5): resolve production baseline from deployed runtime authority"
          git push origin HEAD:codex/v5-p0-control-plane-consolidation
