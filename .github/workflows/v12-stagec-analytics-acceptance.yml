name: V12 semantic delivery acceptance

on:
  push:
    branches:
      - main
      - analytics/universe-breakout-external-challenge-20260925
    paths:
      - "src/engines/v12_*.py"
      - "src/engines/live_state_service.py"
      - "src/engines/base_state.py"
      - "src/models/v12_*.py"
      - "src/runtime_v6/domains/report_plane/**"
      - "config/intelligence/v12_*.json"
      - "tests/test_stage1_analytics_foundation.py"
      - "tests/test_integrated_report_runner.py"
      - "tests/test_deep_decision_content_delivery_barrier.py"
      - "tests/test_visible_report_content_contract.py"
      - "tests/test_mini_league_overlay.py"
      - "tests/test_lineup_watchlist_and_governance.py"
      - "tests/test_match_mode_live_score_contract.py"
      - "tests/test_natural_deep_report_orchestration.py"
      - "tests/test_contextual_player_dynamics.py"
      - "tests/test_report_runtime_conformance.py"
      - "tests/test_price_delivery_barrier.py"
      - "tests/test_price_radar_serving_all15_mandatory.py"
      - "tests/test_price_radar_trajectory.py"
      - "tests/test_personal_data_plane.py"
      - "tests/test_private_delivery_security.py"
      - "tests/test_private_publisher.py"
      - "tests/test_private_data_boundary.py"
      - "config/security/v12_delivery_classification.json"
      - ".github/workflows/v12-stagec-analytics-acceptance.yml"
  pull_request:
    paths:
      - "src/engines/v12_*.py"
      - "src/engines/live_state_service.py"
      - "src/engines/base_state.py"
      - "src/models/v12_*.py"
      - "src/runtime_v6/domains/report_plane/**"
      - "config/intelligence/v12_*.json"
      - "tests/test_stage1_analytics_foundation.py"
      - "tests/test_integrated_report_runner.py"
      - "tests/test_deep_decision_content_delivery_barrier.py"
      - "tests/test_visible_report_content_contract.py"
      - "tests/test_mini_league_overlay.py"
      - "tests/test_lineup_watchlist_and_governance.py"
      - "tests/test_match_mode_live_score_contract.py"
      - "tests/test_natural_deep_report_orchestration.py"
      - "tests/test_contextual_player_dynamics.py"
      - "tests/test_report_runtime_conformance.py"
      - "tests/test_price_delivery_barrier.py"
      - "tests/test_price_radar_serving_all15_mandatory.py"
      - "tests/test_price_radar_trajectory.py"
      - "tests/test_personal_data_plane.py"
      - "tests/test_private_delivery_security.py"
      - "tests/test_private_publisher.py"
      - "tests/test_private_data_boundary.py"
      - "config/security/v12_delivery_classification.json"
      - ".github/workflows/v12-stagec-analytics-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v12-semantic-delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install locked CI dependencies
        run: python -m pip install --no-deps -r requirements-ci.lock
      - name: Run core analytics and integrated regression
        env:
          V12_STAGEC_SCANNER_ENABLED: "1"
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_stage1_analytics_foundation.py \
            tests/test_integrated_report_runner.py \
            tests/test_personal_data_plane.py \
            tests/test_private_delivery_security.py \
            tests/test_private_publisher.py \
            tests/test_private_data_boundary.py

      - name: Run P1 synthetic private/public acceptance
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/p1-synthetic-acceptance"
          rm -rf "$root"
          python -m src.engines.v12_p1_synthetic_acceptance \
            --root "$root" \
            --run-id "${GITHUB_RUN_ID}" \
            --model-sha "${GITHUB_SHA}" \
            --runtime-sha "${GITHUB_SHA}"

      - name: Upload P1 synthetic safe public proof
        uses: actions/upload-artifact@v4
        with:
          name: p1-synthetic-public-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/p1-synthetic-acceptance/public/public_proof.json
          if-no-files-found: error
          retention-days: 14

  semantic-deep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install locked CI dependencies
        run: python -m pip install --no-deps -r requirements-ci.lock
      - name: Run DEEP semantic and decision contracts
        env:
          V12_STAGEC_SCANNER_ENABLED: "1"
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_deep_decision_content_delivery_barrier.py \
            tests/test_visible_report_content_contract.py \
            tests/test_mini_league_overlay.py \
            tests/test_lineup_watchlist_and_governance.py

  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install locked CI dependencies
        run: python -m pip install --no-deps -r requirements-ci.lock
      - name: Run MATCH POST_MATCH POST_ALL_MATCH lifecycle contracts
        env:
          V12_STAGEC_SCANNER_ENABLED: "1"
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_match_mode_live_score_contract.py \
            tests/test_natural_deep_report_orchestration.py \
            tests/test_contextual_player_dynamics.py \
            tests/test_report_runtime_conformance.py

  price-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install locked CI dependencies
        run: python -m pip install --no-deps -r requirements-ci.lock
      - name: Run price freshness and visible ETA contracts
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_price_delivery_barrier.py \
            tests/test_price_radar_serving_all15_mandatory.py \
            tests/test_price_radar_trajectory.py
