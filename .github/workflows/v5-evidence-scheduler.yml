name: V5 Evidence Scheduler Manual Gate

on:
  workflow_dispatch:

# Scheduled authority lives on the default branch as a thin dispatcher.
# This workflow remains a manual diagnostic entrypoint and executes the same governed gate script.
permissions:
  contents: write
  pull-requests: read

concurrency:
  group: v5-evidence-scheduler
  cancel-in-progress: true

env:
  V5_SHADOW_BRANCH: v5-shadow-runtime
  V3_RUNTIME_BRANCH: runtime-data
  V5_CODE_BRANCH: v5-unified-engine
  TZ_AUTHORITY: Asia/Jakarta

jobs:
  evidence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      reasons: ${{ steps.gate.outputs.reasons }}
    steps:
      - name: Checkout V5 scheduler authority
        uses: actions/checkout@v4
        with:
          ref: v5-unified-engine
          fetch-depth: 0

      - name: Enforce V5 canonical merged-PR provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V5_PROVENANCE_BRANCH=v5-unified-engine \
          V5_PROVENANCE_SHA="$(git rev-parse HEAD)" \
          python -m src.v5.canonical_provenance

      - name: Evaluate governed evidence window
        id: gate
        run: python scripts/v5_evidence_scheduler_gate.py --event-name workflow_dispatch

      - name: No-op outside governed evidence windows or during baseline drift
        if: steps.gate.outputs.should_run != 'true'
        run: echo "No heavy V5 cycle required; either outside evidence window or deployed production baseline is not reconciled."

  shadow-cycle:
    needs: evidence-gate
    if: needs.evidence-gate.outputs.should_run == 'true'
    uses: ./.github/workflows/v5-shadow-cycle.yml
    with:
      scheduler_reasons: ${{ needs.evidence-gate.outputs.reasons }}
      scheduler_source: v5-manual-governed-scheduler
    secrets: inherit
