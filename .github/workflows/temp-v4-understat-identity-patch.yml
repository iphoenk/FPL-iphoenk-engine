name: TEMP V4 Understat identity patch

on:
  push:
    branches:
      - fix/v4-official-understat-player-mapping-20260902

permissions:
  contents: write

jobs:
  patch-attest-test:
    if: ${{ !contains(github.event.head_commit.message, '[identity-patched]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v4-official-understat-player-mapping-20260902
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Apply narrow identity/crosswalk patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/intelligence/understat_tactical.py')
          text = path.read_text(encoding='utf-8')

          old_map = '''def _map_player(official: dict, candidates: list[dict], policy: dict) -> tuple[dict | None, float, str]:
              team = _norm(official.get("team") or official.get("club"))
              name = _norm(official.get("name"))
              team_candidates = [row for row in candidates if team and team in row.get("normalized_teams", [])]
              exact = [row for row in team_candidates if row.get("normalized_name") == name]
              if len(exact) == 1:
                  return exact[0], 1.0, "TEAM_AND_NORMALIZED_NAME_EXACT"
              scored = sorted(
                  ((SequenceMatcher(None, name, row.get("normalized_name") or "").ratio(), row) for row in team_candidates),
                  key=lambda item: item[0], reverse=True,
              )
              minimum = float((policy.get("identity") or {}).get("fuzzy_minimum_confidence") or 0.94)
              ambiguity = float((policy.get("identity") or {}).get("ambiguity_margin") or 0.03)
              if scored and scored[0][0] >= minimum and (len(scored) == 1 or scored[0][0] - scored[1][0] >= ambiguity):
                  return scored[0][1], scored[0][0], "TEAM_SCOPED_FUZZY_NAME"
              return None, 0.0, "UNRESOLVED"
          '''
          old_map = '\n'.join(line[12:] if line.startswith('            ') else line for line in old_map.splitlines()) + '\n'

          new_map = '''def _map_player(official: dict, candidates: list[dict], policy: dict) -> tuple[dict | None, float, str]:
              team = _norm(official.get("team") or official.get("club"))
              raw_names = [
                  official.get("name"),
                  official.get("full_name"),
                  official.get("web_name"),
                  official.get("second_name"),
                  *((official.get("name_variants") or [])),
              ]
              names = []
              seen = set()
              for value in raw_names:
                  normalized = _norm(value)
                  if normalized and normalized not in seen:
                      seen.add(normalized)
                      names.append(normalized)
              team_candidates = [row for row in candidates if team and team in row.get("normalized_teams", [])]
              exact = [row for row in team_candidates if row.get("normalized_name") in names]
              if len(exact) == 1:
                  return exact[0], 1.0, "TEAM_AND_NORMALIZED_NAME_EXACT"
              # Deadline transfers can make the Official current club newer than
              # Understat's latest represented club. Allow only a globally unique
              # exact normalized identity in that case. Never use global fuzzy or
              # player-specific aliases.
              global_exact = [row for row in candidates if row.get("normalized_name") in names]
              if len(global_exact) == 1:
                  return global_exact[0], 0.97, "GLOBAL_NORMALIZED_NAME_EXACT_TEAM_TRANSITION"
              scored = sorted(
                  (
                      (
                          max(
                              (SequenceMatcher(None, name, row.get("normalized_name") or "").ratio() for name in names),
                              default=0.0,
                          ),
                          row,
                      )
                      for row in team_candidates
                  ),
                  key=lambda item: item[0], reverse=True,
              )
              minimum = float((policy.get("identity") or {}).get("fuzzy_minimum_confidence") or 0.94)
              ambiguity = float((policy.get("identity") or {}).get("ambiguity_margin") or 0.03)
              if scored and scored[0][0] >= minimum and (len(scored) == 1 or scored[0][0] - scored[1][0] >= ambiguity):
                  return scored[0][1], scored[0][0], "TEAM_SCOPED_FUZZY_NAME"
              return None, 0.0, "UNRESOLVED"
          '''
          new_map = '\n'.join(line[12:] if line.startswith('            ') else line for line in new_map.splitlines()) + '\n'

          if text.count(old_map) != 1:
              raise SystemExit(f'expected exactly one _map_player block, got {text.count(old_map)}')
          text = text.replace(old_map, new_map)

          old_missing = '''        if not row:
              unresolved.append({"element": element, "name": official.get("name"), "team": official.get("team"), "state": "UNRESOLVED"})
              mapped[str(element)] = {
                  "element": element,
                  "mapping": {"state": "UNRESOLVED", "confidence": 0.0, "method": method},
                  "season_to_date": None,
                  "rolling_windows": {"last_1": None, "last_3": None, "last_5": None},
                  "missingness": "UNDERSTAT_PLAYER_MAPPING_UNRESOLVED",
              }
              continue
          '''
          old_missing = '\n'.join(line[8:] if line.startswith('        ') else line for line in old_missing.splitlines()) + '\n'
          new_missing = '''        if not row:
              official_minutes = _f(official.get("minutes"))
              source_absent = official_minutes is not None and official_minutes <= 0
              state = "SOURCE_ABSENT_CURRENT_SEASON" if source_absent else "UNRESOLVED"
              if not source_absent:
                  unresolved.append({
                      "element": element,
                      "name": official.get("name"),
                      "team": official.get("team"),
                      "state": "IDENTITY_UNRESOLVED",
                      "official_minutes": official_minutes,
                  })
              mapped[str(element)] = {
                  "element": element,
                  "official_name": official.get("name"),
                  "official_team": official.get("team"),
                  "mapping": {"state": state, "confidence": 0.0, "method": method},
                  "season_to_date": None,
                  "rolling_windows": {"last_1": None, "last_3": None, "last_5": None},
                  "missingness": "UNDERSTAT_SOURCE_ABSENT_CURRENT_SEASON"
                  if source_absent
                  else "UNDERSTAT_PLAYER_IDENTITY_UNRESOLVED",
              }
              continue
          '''
          new_missing = '\n'.join(line[8:] if line.startswith('        ') else line for line in new_missing.splitlines()) + '\n'
          if text.count(old_missing) != 1:
              raise SystemExit(f'expected exactly one unresolved block, got {text.count(old_missing)}')
          text = text.replace(old_missing, new_missing)

          old_counts = '''    mapped = sum((row.get("mapping") or {}).get("state") == "RESOLVED" for row in players.values())
              usable_matchups = sum(row.get("state") != "INSUFFICIENT_EVIDENCE" for row in matchups.values())
          '''
          old_counts = '\n'.join(line[4:] if line.startswith('    ') else line for line in old_counts.splitlines()) + '\n'
          new_counts = '''    mapped = sum((row.get("mapping") or {}).get("state") == "RESOLVED" for row in players.values())
              source_absent = sum((row.get("mapping") or {}).get("state") == "SOURCE_ABSENT_CURRENT_SEASON" for row in players.values())
              classified = sum(
                  (row.get("mapping") or {}).get("state") in {"RESOLVED", "SOURCE_ABSENT_CURRENT_SEASON", "UNRESOLVED"}
                  for row in players.values()
              )
              usable_matchups = sum(row.get("state") != "INSUFFICIENT_EVIDENCE" for row in matchups.values())
          '''
          new_counts = '\n'.join(line[4:] if line.startswith('    ') else line for line in new_counts.splitlines()) + '\n'
          if text.count(old_counts) != 1:
              raise SystemExit(f'expected exactly one count block, got {text.count(old_counts)}')
          text = text.replace(old_counts, new_counts)

          old_health = '''            "player_mapping_count": mapped,
                  "player_mapping_coverage": round(mapped / max(1, len(official_universe)), 4),
                  "unresolved_mapping_count": len(unresolved),
          '''
          old_health = '\n'.join(line[12:] if line.startswith('            ') else line for line in old_health.splitlines()) + '\n'
          new_health = '''            "player_mapping_count": mapped,
                  "player_mapping_coverage": round(mapped / max(1, len(official_universe)), 4),
                  "player_crosswalk_classified_count": classified,
                  "player_crosswalk_coverage": round(classified / max(1, len(official_universe)), 4),
                  "source_absent_current_season_count": source_absent,
                  "identity_unresolved_count": len(unresolved),
                  "unresolved_mapping_count": len(unresolved),
          '''
          new_health = '\n'.join(line[12:] if line.startswith('            ') else line for line in new_health.splitlines()) + '\n'
          if text.count(old_health) != 1:
              raise SystemExit(f'expected exactly one health mapping block, got {text.count(old_health)}')
          text = text.replace(old_health, new_health)

          old_guard = '''            "full_official_universe_mapping_attempted": True,
                  "intelligence_parity_not_decision_parity": True,
          '''
          old_guard = '\n'.join(line[12:] if line.startswith('            ') else line for line in old_guard.splitlines()) + '\n'
          new_guard = '''            "full_official_universe_mapping_attempted": True,
                  "full_official_universe_crosswalk_classified": classified == len(official_universe),
                  "source_absent_not_fabricated_as_direct_match": True,
                  "player_specific_aliases": False,
                  "global_fuzzy_identity_match": False,
                  "intelligence_parity_not_decision_parity": True,
          '''
          new_guard = '\n'.join(line[12:] if line.startswith('            ') else line for line in new_guard.splitlines()) + '\n'
          if text.count(old_guard) != 1:
              raise SystemExit(f'expected exactly one guard block, got {text.count(old_guard)}')
          text = text.replace(old_guard, new_guard)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Regenerate governed V4 architecture attestation
        run: python tools/v4_architecture_guard_attest.py
      - name: Full regression
        run: python -m pytest -q --tb=short
      - name: Commit validated patch and attestation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/intelligence/understat_tactical.py config/architecture_guard_attestation.json
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 1
          fi
          git commit -m "fix(v4): complete Official-Understat identity crosswalk [identity-patched]"
          git push origin HEAD:fix/v4-official-understat-player-mapping-20260902
