name: V4 frontier insertion profiler temp

on:
  push:
    branches: [codex/v4-full-universe-tactical-20260903]
    paths:
      - .github/workflows/v4-frontier-insertion-profiler-temp.yml

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: codex/v4-full-universe-tactical-20260903, fetch-depth: 1}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements.txt}
      - run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Apply ephemeral exact layer-envelope optimization
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/engines/v4_full_universe_exact_state_frontier.py')
          text=path.read_text()
          text=text.replace('from dataclasses import dataclass\n','from dataclasses import dataclass\nfrom functools import cached_property\n',1)
          text=text.replace('    gw_values: tuple[tuple[tuple[float, ...], ...], ...]\n\n\ndef _f','''    gw_values: tuple[tuple[tuple[float, ...], ...], ...]\n\n    @cached_property\n    def gw_flat(self) -> tuple[float, ...]:\n        return tuple(value for position in self.gw_values for gw_values in position for value in gw_values)\n\n\ndef _f''',1)
          old='''def _gw_no_worse(left: IncomingState, right: IncomingState) -> bool:\n    for left_pos, right_pos in zip(left.gw_values, right.gw_values):\n        for left_values, right_values in zip(left_pos, right_pos):\n            if len(left_values) != len(right_values):\n                return False\n            if any(left_value < right_value for left_value, right_value in zip(left_values, right_values)):\n                return False\n    return True\n'''
          new='''def _gw_no_worse(left: IncomingState, right: IncomingState) -> bool:\n    left_values = left.gw_flat\n    right_values = right.gw_flat\n    return len(left_values) == len(right_values) and all(\n        left_value >= right_value for left_value, right_value in zip(left_values, right_values)\n    )\n'''
          assert old in text
          text=text.replace(old,new,1)

          marker='def _front_insert('
          start=text.index(marker)
          end=text.index('\ndef _skyband_insert(',start)
          helpers='''_RANK_LAYER_ENVELOPE_CACHE: dict[int, dict[str, object]] = {}\n\n\ndef _rank_layer_envelope(layer: list[IncomingState]) -> dict[str, object]:\n    cached = _RANK_LAYER_ENVELOPE_CACHE.get(id(layer))\n    if cached is not None and cached[\"layer\"] is layer and cached[\"length\"] == len(layer):\n        return cached\n    envelope: dict[str, object] = {\n        \"layer\": layer,\n        \"length\": len(layer),\n        \"min_cost\": min(row.cost for row in layer),\n        \"max_cost\": max(row.cost for row in layer),\n        \"min_x15\": min(row.x15 for row in layer),\n        \"max_x15\": max(row.x15 for row in layer),\n        \"min_projection_uncertainty\": min(row.projection_uncertainty for row in layer),\n        \"max_projection_uncertainty\": max(row.projection_uncertainty for row in layer),\n        \"min_xmins_uncertainty\": min(row.xmins_uncertainty for row in layer),\n        \"max_xmins_uncertainty\": max(row.xmins_uncertainty for row in layer),\n        \"min_tactical_uncertainty\": min(row.tactical_uncertainty for row in layer),\n        \"max_tactical_uncertainty\": max(row.tactical_uncertainty for row in layer),\n        \"min_roster_change_uncertainty\": min(row.roster_change_uncertainty for row in layer),\n        \"max_roster_change_uncertainty\": max(row.roster_change_uncertainty for row in layer),\n    }\n    _RANK_LAYER_ENVELOPE_CACHE[id(layer)] = envelope\n    return envelope\n\n\ndef _rank_envelope_extend(envelope: dict[str, object], candidate: IncomingState) -> None:\n    envelope[\"length\"] = int(envelope[\"length\"]) + 1\n    envelope[\"min_cost\"] = min(float(envelope[\"min_cost\"]), candidate.cost)\n    envelope[\"max_cost\"] = max(float(envelope[\"max_cost\"]), candidate.cost)\n    envelope[\"min_x15\"] = min(float(envelope[\"min_x15\"]), candidate.x15)\n    envelope[\"max_x15\"] = max(float(envelope[\"max_x15\"]), candidate.x15)\n    for field in (\"projection_uncertainty\", \"xmins_uncertainty\", \"tactical_uncertainty\", \"roster_change_uncertainty\"):\n        value = float(getattr(candidate, field))\n        envelope[f\"min_{field}\"] = min(float(envelope[f\"min_{field}\"]), value)\n        envelope[f\"max_{field}\"] = max(float(envelope[f\"max_{field}\"]), value)\n\n\ndef _rank_envelope_may_dominate(envelope: dict[str, object], candidate: IncomingState) -> bool:\n    return not (\n        float(envelope[\"min_cost\"]) > candidate.cost\n        or float(envelope[\"max_x15\"]) < candidate.x15\n        or float(envelope[\"min_projection_uncertainty\"]) > candidate.projection_uncertainty\n        or float(envelope[\"min_xmins_uncertainty\"]) > candidate.xmins_uncertainty\n        or float(envelope[\"min_tactical_uncertainty\"]) > candidate.tactical_uncertainty\n        or float(envelope[\"min_roster_change_uncertainty\"]) > candidate.roster_change_uncertainty\n    )\n\n\ndef _rank_candidate_may_displace(envelope: dict[str, object], candidate: IncomingState) -> bool:\n    return not (\n        float(envelope[\"max_cost\"]) < candidate.cost\n        or float(envelope[\"min_x15\"]) > candidate.x15\n        or float(envelope[\"max_projection_uncertainty\"]) < candidate.projection_uncertainty\n        or float(envelope[\"max_xmins_uncertainty\"]) < candidate.xmins_uncertainty\n        or float(envelope[\"max_tactical_uncertainty\"]) < candidate.tactical_uncertainty\n        or float(envelope[\"max_roster_change_uncertainty\"]) < candidate.roster_change_uncertainty\n    )\n\n\n'''
          replacement='''def _front_insert(\n    layer: list[IncomingState],\n    candidate: IncomingState,\n    *,\n    frontier_epsilon: float,\n    relation: Callable[..., bool],\n    metrics: dict[str, int] | None = None,\n) -> tuple[bool, list[IncomingState]]:\n    _metric_add(metrics, \"frontier_insert_calls\")\n    if not layer:\n        layer.append(candidate)\n        return True, []\n\n    if not _supports_x5_index(relation):\n        checks = 0\n        for incumbent in layer:\n            checks += 1\n            if relation(incumbent, candidate, frontier_epsilon=frontier_epsilon):\n                _metric_add(metrics, \"dominance_full_checks\", checks)\n                _metric_add(metrics, \"frontier_insert_rejected\")\n                return False, []\n        displaced = []\n        for incumbent in layer:\n            checks += 1\n            if relation(candidate, incumbent, frontier_epsilon=frontier_epsilon):\n                displaced.append(incumbent)\n        _metric_add(metrics, \"dominance_full_checks\", checks)\n        if displaced:\n            displaced_ids = {id(row) for row in displaced}\n            layer[:] = [row for row in layer if id(row) not in displaced_ids]\n            _metric_add(metrics, \"frontier_states_displaced\", len(displaced))\n        layer.append(candidate)\n        _RANK_LAYER_ENVELOPE_CACHE.pop(id(layer), None)\n        return True, displaced\n\n    candidate_key = -candidate.x5\n    layer_size = len(layer)\n    dominator_end = bisect_right(layer, candidate_key, key=_x5_sort_key)\n    displaced_start = bisect_left(layer, candidate_key, key=_x5_sort_key)\n    _metric_add(metrics, \"dominance_pairs_skipped_by_x5_index\", max(0, 2 * layer_size - dominator_end - (layer_size - displaced_start)))\n    envelope = _rank_layer_envelope(layer) if relation is rank_dominates else None\n    may_dominate = envelope is None or _rank_envelope_may_dominate(envelope, candidate)\n    may_displace = envelope is None or _rank_candidate_may_displace(envelope, candidate)\n\n    checks = 0\n    if may_dominate:\n        for index in range(dominator_end):\n            incumbent = layer[index]\n            checks += 1\n            if relation(incumbent, candidate, frontier_epsilon=frontier_epsilon):\n                _metric_add(metrics, \"dominance_full_checks\", checks)\n                _metric_add(metrics, \"frontier_insert_rejected\")\n                return False, []\n\n    displaced: list[IncomingState] = []\n    if may_displace:\n        for index in range(displaced_start, layer_size):\n            incumbent = layer[index]\n            checks += 1\n            if relation(candidate, incumbent, frontier_epsilon=frontier_epsilon):\n                displaced.append(incumbent)\n    _metric_add(metrics, \"dominance_full_checks\", checks)\n\n    if displaced:\n        displaced_ids = {id(row) for row in displaced}\n        layer[displaced_start:] = [row for row in layer[displaced_start:] if id(row) not in displaced_ids]\n        _metric_add(metrics, \"frontier_states_displaced\", len(displaced))\n        _RANK_LAYER_ENVELOPE_CACHE.pop(id(layer), None)\n\n    insert_at = bisect_right(layer, candidate_key, key=_x5_sort_key)\n    layer.insert(insert_at, candidate)\n    if envelope is not None and not displaced:\n        _rank_envelope_extend(envelope, candidate)\n    elif envelope is None:\n        _RANK_LAYER_ENVELOPE_CACHE.pop(id(layer), None)\n    return True, displaced\n'''
          path.write_text(text[:start]+helpers+replacement+text[end:])
          PY
          python -m py_compile src/engines/v4_full_universe_exact_state_frontier.py
      - name: Exact semantic oracle tests
        run: python -m pytest -q tests/test_v4_full_universe_exact_state_frontier.py tests/test_v4_full_universe_authority_fail_closed.py
      - name: Production-scale exact frontier regression
        run: /usr/bin/time -f 'regression_elapsed=%e' python -m pytest -q tests/test_v4_exact_frontier_production_scale.py
