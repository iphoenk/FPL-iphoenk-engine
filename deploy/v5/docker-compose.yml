services:
  ingestion:
    build:
      context: ../..
      dockerfile: deploy/v5/Dockerfile
    environment:
      V5_SERVICE_ID: ingestion
      V5_SERVICE_PORT: 8101
    ports: ["8101:8101"]
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://127.0.0.1:8101/health', timeout=2).raise_for_status()"]
      interval: 10s
      timeout: 3s
      retries: 5

  truth:
    build:
      context: ../..
      dockerfile: deploy/v5/Dockerfile
    environment:
      V5_SERVICE_ID: truth
      V5_SERVICE_PORT: 8102
    ports: ["8102:8102"]
    depends_on:
      ingestion:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://127.0.0.1:8102/health', timeout=2).raise_for_status()"]
      interval: 10s
      timeout: 3s
      retries: 5

  price:
    build:
      context: ../..
      dockerfile: deploy/v5/Dockerfile
    environment:
      V5_SERVICE_ID: price
      V5_SERVICE_PORT: 8103
    ports: ["8103:8103"]
    depends_on:
      truth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://127.0.0.1:8103/health', timeout=2).raise_for_status()"]
      interval: 10s
      timeout: 3s
      retries: 5

  prediction:
    build:
      context: ../..
      dockerfile: deploy/v5/Dockerfile
    environment:
      V5_SERVICE_ID: prediction
      V5_SERVICE_PORT: 8104
    ports: ["8104:8104"]
    depends_on:
      truth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://127.0.0.1:8104/health', timeout=2).raise_for_status()"]
      interval: 10s
      timeout: 3s
      retries: 5

  decision:
    build:
      context: ../..
      dockerfile: deploy/v5/Dockerfile
    environment:
      V5_SERVICE_ID: decision
      V5_SERVICE_PORT: 8105
    ports: ["8105:8105"]
    depends_on:
      price:
        condition: service_healthy
      prediction:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://127.0.0.1:8105/health', timeout=2).raise_for_status()"]
      interval: 10s
      timeout: 3s
      retries: 5

  snapshot:
    build:
      context: ../..
      dockerfile: deploy/v5/Dockerfile
    environment:
      V5_SERVICE_ID: snapshot
      V5_SERVICE_PORT: 8106
    ports: ["8106:8106"]
    volumes:
      - ../../data/v5:/app/data/v5
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://127.0.0.1:8106/health', timeout=2).raise_for_status()"]
      interval: 10s
      timeout: 3s
      retries: 5

  orchestrator:
    build:
      context: ../..
      dockerfile: deploy/v5/Dockerfile
    environment:
      V5_SERVICE_ID: orchestrator
      V5_SERVICE_PORT: 8100
      V5_SERVICE_INGESTION_URL: http://ingestion:8101
      V5_SERVICE_TRUTH_URL: http://truth:8102
      V5_SERVICE_PRICE_URL: http://price:8103
      V5_SERVICE_PREDICTION_URL: http://prediction:8104
      V5_SERVICE_DECISION_URL: http://decision:8105
      V5_SERVICE_SNAPSHOT_URL: http://snapshot:8106
    ports: ["8100:8100"]
    depends_on:
      ingestion:
        condition: service_healthy
      truth:
        condition: service_healthy
      price:
        condition: service_healthy
      prediction:
        condition: service_healthy
      decision:
        condition: service_healthy
      snapshot:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://127.0.0.1:8100/health', timeout=2).raise_for_status()"]
      interval: 10s
      timeout: 3s
      retries: 5
