name: FPL iphoenk collector v3.17.0 microservices

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  schedule:
    - cron: "55 * * * *"
    - cron: "15 * * * *"

permissions:
  contents: read

concurrency:
  group: fpl-iphoenk-${{ github.event_name == 'pull_request' && github.head_ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUNTIME_BRANCH: runtime-data

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      should_collect: ${{ steps.cadence.outputs.should_collect }}
      reason: ${{ steps.cadence.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide collector cadence
        id: cadence
        env:
          PYTHONPATH: ${{ github.workspace }}
          FPL_SCHEDULE_EXPR: ${{ github.event.schedule }}
        run: python -m src.engines.collector_gate

  test:
    needs: gate
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile runtime modules
        run: python -m compileall -q src live_service.py fpl_daily_tasks.py
      - name: Full engine test suite
        run: python -m pytest -q

  integration:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
      FPL_AUTH_MODE: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Run bounded microservices without publication
        run: python -m src.runtime_v3.orchestrator --mode daily --stats
      - name: Validate decision and report contract
        run: python -m src.engines.production_contract_validate
      - name: Validate full DSS watchlist contract
        run: python -m src.engines.watchlist_contract_validate
      - name: Validate fast report serving contract
        run: python -m src.engines.report_serving_validate
      - name: Verify runtime budget
        run: |
          python - <<'PY'
          import json
          r=json.load(open('data/runtime_performance.json'))
          assert r.get('within_target_budget') is True, r
          print({'runtime_ms': r.get('total_wall_ms'), 'services': {k:v.get('status') for k,v in r.get('services',{}).items()}})
          PY

  collect:
    if: always() && github.event_name != 'pull_request' && needs.gate.outputs.should_collect == 'true' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    needs: [gate, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Collector mode
        run: echo "Collector gate=${{ needs.gate.outputs.reason }} runtime_branch=${RUNTIME_BRANCH} architecture=V3_BOUNDED_PROCESS_MICROSERVICES"
      - name: Hydrate persisted state from runtime bridge
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$RUNTIME_BRANCH"
          for file in price_cache.json price_trajectory.json rules_source_state.json prediction_ledger.json challenger_observations.json report_state.json dss_watchlist.json; do
            if git cat-file -e "origin/${RUNTIME_BRANCH}:data/${file}" 2>/dev/null; then
              git show "origin/${RUNTIME_BRANCH}:data/${file}" > "data/${file}"
              echo "Hydrated data/${file} from ${RUNTIME_BRANCH}"
            else
              echo "No prior data/${file}; starting clean"
            fi
          done
          mkdir -p data/stats
          if git cat-file -e "origin/${RUNTIME_BRANCH}:data/stats/vaastav_previous_season.json" 2>/dev/null; then
            git show "origin/${RUNTIME_BRANCH}:data/stats/vaastav_previous_season.json" > data/stats/vaastav_previous_season.json
            echo "Hydrated previous-season prior source cache"
          else
            echo "No previous-season prior cache; network refresh permitted"
          fi
      - name: V3 bounded microservice runtime
        env:
          FPL_AUTH_MODE: ${{ secrets.FPL_AUTH_MODE }}
          FPL_SESSION_B64: ${{ secrets.FPL_SESSION_B64 }}
          FPL_ACCESS_TOKEN: ${{ secrets.FPL_ACCESS_TOKEN }}
          FPL_REFRESH_TOKEN: ${{ secrets.FPL_REFRESH_TOKEN }}
          FPL_OIDC_TOKEN_URL: ${{ secrets.FPL_OIDC_TOKEN_URL }}
          FPL_OIDC_CLIENT_ID: ${{ secrets.FPL_OIDC_CLIENT_ID }}
          FPL_OIDC_CLIENT_SECRET: ${{ secrets.FPL_OIDC_CLIENT_SECRET }}
        run: python -m src.runtime_v3.orchestrator --mode daily --stats
      - name: Validate production contract
        run: python -m src.engines.production_contract_validate
      - name: Validate full DSS watchlist contract
        run: python -m src.engines.watchlist_contract_validate
      - name: Validate fast report serving contract
        run: python -m src.engines.report_serving_validate
      - name: Stamp runtime publication metadata
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          p='data/latest.json'
          s=json.load(open(p))
          s['runtime_publish']={
              'branch': os.environ.get('RUNTIME_BRANCH','runtime-data'),
              'source_commit': os.environ.get('GITHUB_SHA'),
              'published_at': datetime.now(timezone.utc).isoformat(),
          }
          with open(p,'w') as f: json.dump(s,f,indent=2,ensure_ascii=False)
          PY
      - name: Publish validated bridge to isolated runtime worktree
        shell: bash
        run: |
          set -euo pipefail
          runtime_tmp="$(mktemp -d)"
          publish_tree="$(mktemp -d)"
          trap 'git worktree remove --force "$publish_tree" >/dev/null 2>&1 || true; rm -rf "$runtime_tmp" "$publish_tree"' EXIT
          cp -a data/. "$runtime_tmp/"

          git config user.name "fpl-iphoenk-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin "$RUNTIME_BRANCH"
          if ! git show-ref --verify --quiet "refs/remotes/origin/$RUNTIME_BRANCH"; then
            echo "ERROR: runtime branch $RUNTIME_BRANCH does not exist"
            exit 2
          fi

          git worktree add --detach "$publish_tree" "origin/$RUNTIME_BRANCH"
          cd "$publish_tree"
          for attempt in 1 2 3; do
            git fetch origin "$RUNTIME_BRANCH"
            git reset --hard "origin/$RUNTIME_BRANCH"
            rm -rf data
            mkdir -p data
            cp -a "$runtime_tmp/." data/
            git add data/

            if git diff --cached --quiet; then
              echo "No runtime data changes"
              exit 0
            fi

            git commit -m "data: refresh FPL runtime snapshot [skip ci]"
            if git push origin HEAD:"$RUNTIME_BRANCH"; then
              echo "Runtime bridge published successfully"
              exit 0
            fi

            echo "Runtime publish race detected, retrying attempt $((attempt + 1))/3"
            sleep $((attempt * 2))
          done
          echo "ERROR: failed to publish runtime bridge after 3 attempts"
          exit 3
