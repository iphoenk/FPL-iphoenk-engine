name: V4 temporary red-audit hardening

on:
  push:
    branches:
      - codex/v4-red-audit-hardening

permissions:
  contents: write

concurrency:
  group: v4-red-audit-hardening-temp
  cancel-in-progress: false

jobs:
  attest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/v4-red-audit-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Rebuild attestation from final branch bytes
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tools/v4_architecture_guard_attest.py
      - name: Persist attestation only
        run: |
          set -euo pipefail
          git config user.name "fpl-iphoenk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add config/architecture_guard_attestation.json
          if git diff --cached --quiet; then
            echo "Attestation already current"
            exit 0
          fi
          git commit -m "chore: refresh V4 red hardening attestation"
          git push origin HEAD:codex/v4-red-audit-hardening
