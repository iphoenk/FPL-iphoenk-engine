name: FPL iphoenk collector v3.24.0 microservices

on:
  workflow_dispatch:

# Collector policy schedule ownership moved to split workflows:
# primary -> v3-runtime-fast.yml  cron: "55 * * * *"
# adaptive -> v3-runtime-fast.yml cron: "*/15 * * * *"
# deep_stats -> v3-refresh-full.yml cron: "30 21 * * *"
# report_midday -> v3-runtime-fast.yml cron: "30 5 * * *"
# report_evening -> v3-runtime-fast.yml cron: "30 14 * * *"

permissions:
  contents: read

jobs:
  legacy-notice:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Legacy workflow notice
        run: |
          echo "The monolithic V3 workflow is retired."
          echo "Use v3-ci.yml, v3-runtime-fast.yml, or v3-refresh-full.yml."
