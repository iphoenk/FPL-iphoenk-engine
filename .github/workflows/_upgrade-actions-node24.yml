name: One-shot Node24 Actions upgrade

on:
  push:
    branches: [codex/main-node24-actions]

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/main-node24-actions
          fetch-depth: 0
      - name: Upgrade JavaScript actions to Node24 majors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root=Path('.github/workflows')
          changed=[]
          for path in sorted(root.glob('*.yml')):
              if path.name == '_upgrade-actions-node24.yml':
                  continue
              old=path.read_text(encoding='utf-8')
              new=(old
                   .replace('actions/checkout@v4','actions/checkout@v7')
                   .replace('actions/setup-python@v5','actions/setup-python@v7')
                   .replace('actions/upload-artifact@v4','actions/upload-artifact@v7'))
              if new != old:
                  path.write_text(new,encoding='utf-8')
                  changed.append(str(path))
          print('\n'.join(changed))
          if not changed:
              raise SystemExit('no Node20-targeting action references found')
          PY
      - name: Commit upgrades
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'fpl-iphoenk-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/*.yml
          git reset .github/workflows/_upgrade-actions-node24.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(ci): upgrade GitHub actions to Node24 majors'
          git push origin HEAD:codex/main-node24-actions
