name: V4 frontier insertion profiler temp

on:
  push:
    branches: [codex/v4-full-universe-tactical-20260903]
    paths:
      - .github/workflows/v4-frontier-insertion-profiler-temp.yml

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/v4-full-universe-tactical-20260903
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Profile frontier-only exact mixed k3
        run: |
          python - <<'PY'
          import cProfile
          import io
          import pstats
          from time import perf_counter
          from src.engines.v4_full_universe_exact_state_frontier import (
              ExactIncomingFrontierIndex,
              _flatten_frontier,
              _front_insert,
              _merge_disjoint_position,
              frontier_dominates,
          )
          from tests.test_v4_exact_frontier_production_scale import _pool, _risks

          pools = _pool()
          index = ExactIncomingFrontierIndex(pools, _risks(pools), frontier_epsilon=0.01, top_keep=12)
          states = None
          profiler = cProfile.Profile()
          profiler.enable()
          started = perf_counter()
          for position in ('DEF', 'MID', 'FWD'):
              group = tuple(index._single_state[p.element] for p in index.pools[position])
              if states is None:
                  states = group
                  print(position, 'singletons', len(states))
                  continue
              buckets = {}
              considered = 0
              for left in states:
                  for right in group:
                      considered += 1
                      merged = _merge_disjoint_position(left, right, position)
                      _front_insert(
                          buckets.setdefault(merged.club_signature, []),
                          merged,
                          frontier_epsilon=0.01,
                          relation=frontier_dominates,
                          metrics=None,
                      )
              states = _flatten_frontier(buckets)
              print(position, 'considered', considered, 'retained', len(states), 'elapsed', perf_counter() - started)
          profiler.disable()
          print('FINAL', len(states), 'elapsed', perf_counter() - started)
          stream = io.StringIO()
          pstats.Stats(profiler, stream=stream).strip_dirs().sort_stats('cumulative').print_stats(30)
          print(stream.getvalue())
          PY
