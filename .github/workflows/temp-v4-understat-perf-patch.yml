name: TEMP V4 Understat performance patch

on:
  push:
    branches:
      - fix/v4-official-understat-player-mapping-20260902

permissions:
  contents: write

jobs:
  patch-test-proof:
    if: ${{ contains(github.event.head_commit.message, '[understat-perf-ready]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v4-official-understat-player-mapping-20260902
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Apply semantic-preserving Understat hot-path optimization
        run: PYTHONPATH=. python tools/temp_v4_understat_perf_patch.py
      - name: Regenerate architecture attestation
        run: PYTHONPATH=. python tools/v4_architecture_guard_attest.py
      - name: Targeted Understat identity tests
        run: PYTHONPATH=. python -m pytest -q tests/test_v4_understat_official_identity_bridge.py tests/test_v4_understat_mononym_identity_guard.py --tb=short
      - name: Full regression
        run: PYTHONPATH=. python -m pytest -q --tb=short
      - name: Reprove live Official to Understat acceptance
        run: PYTHONPATH=. python tools/v4_understat_identity_live_proof.py
      - name: Persist production optimization only when strict proof remains green
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          proof=json.loads(Path('verification/v4_official_understat_identity_live_proof.json').read_text())
          assert (proof.get('acceptance') or {}).get('all_green') is True, proof
          assert (proof.get('understat') or {}).get('identity_unresolved_count') == 0, proof
          assert (proof.get('official') or {}).get('count') == (proof.get('understat') or {}).get('crosswalk_classified_count'), proof
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/intelligence/understat_tactical.py config/architecture_guard_attestation.json verification/v4_official_understat_identity_live_proof.json
          git commit -m "perf(v4): index Understat identity hot path without semantic drift [understat-perf-green]"
          git push origin HEAD:fix/v4-official-understat-player-mapping-20260902
