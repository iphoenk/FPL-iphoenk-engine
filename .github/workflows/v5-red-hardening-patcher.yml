name: V5 Red Hardening Patcher

on:
  push:
    branches: [codex/v5-red-hardening-prod-green]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'apply registry-authority hardening') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python scripts/_v5_red_hardening_patch.py
      - name: Validate syntax
        run: python -m py_compile src/v5/intelligence/projection.py src/v5/services/prediction.py tests/test_v5_microservices.py
      - name: Commit generated hardening changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/v5_prediction_service_registry.json config/v5_registry_catalog.json src/v5/intelligence/projection.py src/v5/services/prediction.py tests/test_v5_microservices.py
          git diff --cached --check
          git commit -m "V5 red hardening: apply registry-authority hardening"
          git push origin HEAD:codex/v5-red-hardening-prod-green
