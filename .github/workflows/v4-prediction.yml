name: FPL iphoenk V4 prediction gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fpl-iphoenk-v4-gate
  cancel-in-progress: true

jobs:
  validate-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout V4 prediction branch
        uses: actions/checkout@v4
        with:
          ref: v4-prediction-engine
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Unit and acceptance tests
        env: {PYTHONPATH: "${{ github.workspace }}"}
        run: python -m pytest -q
      - name: Mandatory FPL 2026/27 rules compliance audit
        env: {PYTHONPATH: "${{ github.workspace }}"}
        run: python -m src.engines.compliance_audit
      - name: Generate V4 point-in-time prediction snapshot
        env: {PYTHONPATH: "${{ github.workspace }}"}
        run: python -m src.engine daily --stats
      - name: Persist forward-valid deadline snapshot and reconcile finished GW when available
        env: {PYTHONPATH: "${{ github.workspace }}"}
        run: python -m src.engines.v4_validation_cycle cycle
      - name: V4.6.1 high-performance unified decision and evidence pipeline
        env: {PYTHONPATH: "${{ github.workspace }}"}
        run: python -m src.engines.v4_decision_pipeline
      - name: V4.6.1 acceptance and quality gate
        env: {PYTHONPATH: "${{ github.workspace }}"}
        run: |
          python - <<'PY'
          import json, statistics
          from src.engines.reliability import validate_snapshot
          s=json.load(open('data/latest.json')); r=validate_snapshot(s); assert r['ok'], r
          assert s['schema_version'] >= 40 and s['engine_version'].startswith('4.0')
          c=json.load(open('data/compliance_audit.json')); assert c.get('overall')=='PASS', c
          p=json.load(open('data/predictions_v4.json')); players=p.get('players',[])
          assert p.get('point_in_time') is True and len(players) >= 500

          w=json.load(open('data/wc_decision_v4.json'))
          assert int(w.get('schema_version',0)) >= 446, w
          assert str(w.get('engine','')).startswith('v4.4.5-wc-optimizer'), w
          assert w.get('screened_players',0)>=500 and len(w.get('optimized_elements',[]))==15
          assert w.get('classification') in {'KEEP_15','OPTIONAL_IMPROVEMENT','MATERIAL_UPGRADE'}
          wp=w.get('performance',{})
          assert wp.get('fast_finalist_scoring') and wp.get('winner_only_legality_check')
          assert wp.get('beam_size_unchanged') is True

          a=json.load(open('data/wc_package_audit_v4.json'))
          assert int(a.get('schema_version',0)) >= 447, a
          assert str(a.get('engine','')).startswith('v4.4.6-wc-package-audit'), a
          assert a.get('max_replacements')==4 and set(a.get('best_by_replacement_count',{}))=={'1','2','3','4'}
          assert a.get('overall_verdict') in {'KEEP_15','OPTIONAL_IMPROVEMENT','MATERIAL_UPGRADE'}
          assert a.get('guardrails',{}).get('risk_penalty_enabled') is True
          assert a.get('guardrails',{}).get('search_width_unchanged') is True
          perf=a.get('performance',{})
          assert perf.get('metrics_cache_entries',0) > 0
          assert perf.get('single_pass_metrics') is True and perf.get('compact_target_cache') is True
          assert perf.get('score_only_hotloop') is True
          assert perf.get('redundant_target_validation_removed') is True
          assert perf.get('candidate_reuse_supported') is True

          l=json.load(open('data/lineup_decision_v4.json'))
          assert int(l.get('schema_version',0)) >= 452, l
          assert str(l.get('engine','')).startswith('v4.5.2-lineup-robust-governance'), l
          assert len(l.get('starting_xi',[]))==11
          assert l.get('formation') in {'3-4-3','3-5-2','4-3-3','4-4-2','4-5-1','5-2-3','5-3-2','5-4-1'}
          xi_ids={x['element'] for x in l['starting_xi']}
          assert l['captain']['element'] in xi_ids and l['vice_captain']['element'] in xi_ids and l['captain']['element'] != l['vice_captain']['element']
          assert len(l.get('bench',{}).get('order',[]))==3 and l.get('bench',{}).get('gk')
          assert l.get('chip_context',{}).get('single_chip_rule_respected') is True
          guards=l.get('guardrails',{})
          assert guards.get('captain_risk_adjusted') and guards.get('captain_safe_pool_preferred')
          assert guards.get('manual_draft_not_overwritten_without_margin') and guards.get('prediction_interval_robustness')
          assert l.get('governance',{}).get('decision') in {'OPTIMIZER_ONLY','HOLD_MANUAL_DRAFT','CHANGE_RECOMMENDED'}

          e=json.load(open('data/recommendation_sanity_v4.json'))
          assert int(e.get('schema_version',0)) >= 460, e
          assert str(e.get('engine','')).startswith('v4.6-evidence-fusion-sanity'), e
          assert e.get('point_in_time') is True
          assert e.get('final_verdict') in {'KEEP_15','OPTIONAL_IMPROVEMENT','MATERIAL_UPGRADE'}
          eg=e.get('guardrails',{})
          assert eg.get('raw_optimizer_not_authoritative') and eg.get('rate_spike_detection')
          assert eg.get('team_cluster_penalty') and eg.get('outgoing_baseline_resistance')
          assert eg.get('early_season_multi_change_cap') and eg.get('point_in_time_required')
          if e.get('recommended_package'):
              assert 1 <= int(e['recommended_package']['replacements']) <= 4

          q=json.load(open('data/decision_pipeline_v4.json'))
          assert int(q.get('schema_version',0)) >= 461, q
          assert str(q.get('engine','')).startswith('v4.6.1-unified-decision-pipeline-fast-parallel'), q
          pg=q.get('performance_guardrails',{})
          assert pg.get('shared_json_loaded_once') and pg.get('shared_candidates_built_once')
          assert pg.get('fork_copy_on_write') and pg.get('parallel_wc_package')
          assert pg.get('fast_wc_finalist_scoring') and pg.get('redundant_package_validation_removed')
          assert pg.get('search_quality_reduction') is False
          assert pg.get('wc_beam_unchanged') and pg.get('package_frontier_beam_unchanged')
          timings=q.get('timings',{})
          assert timings.get('total_pipeline_ms',0) > 0
          assert timings.get('wc_decision_cpu_ms',0) > 0 and timings.get('package_audit_cpu_ms',0) > 0
          assert timings.get('wc_package_parallel_wall_ms',0) > 0 and timings.get('parallel_speedup_estimate',0) > 0

          all_x=[]
          for row in players:
              assert len(row.get('fixtures',[])) <= 15 and row.get('xpts_5',0) >= 0
              for fx in row.get('fixtures',[]):
                  x=fx['xpts']; all_x.append(x); assert 0 <= x < 25
                  assert fx['components'].get('defcon',0) <= 2.001
                  if row.get('position')=='GK': assert fx['components'].get('defcon',0)==0
                  assert fx['lower80'] <= x <= fx['upper80']
                  d=fx['xmins']; assert abs(d['start_probability']+d['bench_probability']+d['dnp_probability']-1) < .002
          assert all_x and statistics.median(all_x) < 8 and sum(x>15 for x in all_x)/len(all_x) < .03
          print('V4.6.1 QUALITY GATE PASS', {
              'rules':c['overall'], 'wc_raw':w['classification'], 'package_raw':a['overall_verdict'],
              'recommendation_final':e['final_verdict'], 'recommended_changes':(e.get('recommended_package') or {}).get('replacements'),
              'lineup':l['governance']['decision'], 'formation':l['formation'], 'captain':l['captain']['name'],
              'pipeline_ms':timings['total_pipeline_ms'], 'parallel_wall_ms':timings['wc_package_parallel_wall_ms'],
              'wc_cpu_ms':timings['wc_decision_cpu_ms'], 'package_cpu_ms':timings['package_audit_cpu_ms'],
              'speedup_estimate':timings['parallel_speedup_estimate'], 'score_only_hotloop':perf['score_only_hotloop']})
          PY
      - name: Package V4 quality-test inputs
        if: always()
        run: |
          mkdir -p v4-artifact
          cp data/predictions_v4.json data/latest.json data/live.json data/universe.json data/team.json data/compliance_audit.json data/wc_decision_v4.json data/wc_package_audit_v4.json data/lineup_decision_v4.json data/recommendation_sanity_v4.json data/decision_pipeline_v4.json v4-artifact/ 2>/dev/null || true
          cp config/manual_lineup.json v4-artifact/ 2>/dev/null || true
          if [ -d data/validation ]; then cp -R data/validation v4-artifact/; fi
      - name: Upload V4 prediction artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-prediction-quality-inputs
          path: v4-artifact/
          if-no-files-found: error
          retention-days: 30
