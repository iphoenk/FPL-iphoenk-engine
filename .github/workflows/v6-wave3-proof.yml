name: FPL V6 Wave 3 natural proof

on:
  issues:
    types: [edited]

permissions:
  contents: read
  actions: read

jobs:
  wave3-proof:
    if: >-
      github.event.issue.number == 431 &&
      github.actor == github.repository_owner &&
      github.event.changes.title &&
      startsWith(github.event.issue.title, 'FPL_MASTER_SLOT ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Authorize natural FPL Master title event
        env:
          V6_ISSUE_TITLE: ${{ github.event.issue.title }}
          V6_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python -m src.runtime_v6.workflow_control authorize-issue-edit

      - name: Resolve exact source acquisition run
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          found="false"
          for _ in $(seq 1 72); do
            gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/v6-natural-data-ingestion.yml/runs?event=issues&per_page=30" > "$RUNNER_TEMP/source-runs.json"
            state="$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads((Path(os.environ["RUNNER_TEMP"]) / "source-runs.json").read_text(encoding="utf-8"))
          matches = [run for run in payload.get("workflow_runs", []) if run.get("display_title") == os.environ["TARGET_TITLE"]]
          if not matches:
              print("NOT_FOUND")
          else:
              run = max(matches, key=lambda row: row.get("id", 0))
              status = str(run.get("status") or "")
              conclusion = str(run.get("conclusion") or "")
              if status != "completed":
                  print("RUNNING")
              elif conclusion == "success":
                  print("SUCCESS")
                  out = os.environ["GITHUB_OUTPUT"]
                  with open(out, "a", encoding="utf-8") as handle:
                      handle.write(f"run_id={run['id']}\n")
                      handle.write(f"run_attempt={run.get('run_attempt', 1)}\n")
                      handle.write(f"head_sha={run.get('head_sha', '')}\n")
              else:
                  print(f"FAILED:{conclusion}")
          PY
          )"
            case "$state" in
              SUCCESS)
                found="true"
                break
                ;;
              FAILED:*)
                echo "::error::Natural source acquisition failed: $state"
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done
          if [[ "$found" != "true" ]]; then
            echo "::error::Timed out resolving exact natural source acquisition run"
            exit 1
          fi

      - name: Verify source jobs and promotion result
        id: promotion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100" > "$RUNNER_TEMP/source-jobs.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads((Path(os.environ["RUNNER_TEMP"]) / "source-jobs.json").read_text(encoding="utf-8"))
          jobs = {str(job.get("name")): str(job.get("conclusion")) for job in payload.get("jobs", [])}
          collect = jobs.get("collect")
          publish = jobs.get("publish")
          fulfillment = jobs.get("orchestration-fulfillment")
          if collect != "success" or fulfillment != "success":
              raise SystemExit(f"source core jobs not successful: collect={collect} fulfillment={fulfillment}")
          countable = publish == "success"
          if publish not in {"success", "skipped"}:
              raise SystemExit(f"source publish job is not accepted: {publish}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"countable={'true' if countable else 'false'}\n")
          print({"collect": collect, "publish": publish, "fulfillment": fulfillment, "countable": countable})
          PY

      - name: Locate exact verified source publication artifact
        if: steps.promotion.outputs.countable == 'true'
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
        run: |
          set -euo pipefail
          expected="v6-runtime-publication-${SOURCE_RUN_ID}-${SOURCE_RUN_ATTEMPT}"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts" > "$RUNNER_TEMP/source-artifacts.json"
          ARTIFACT_NAME="$expected" python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads((Path(os.environ["RUNNER_TEMP"]) / "source-artifacts.json").read_text(encoding="utf-8"))
          matches = [a for a in payload.get("artifacts", []) if a.get("name") == os.environ["ARTIFACT_NAME"] and not a.get("expired")]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one immutable source publication artifact, found {len(matches)}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"name={os.environ['ARTIFACT_NAME']}\n")
          PY

      - name: Download immutable source publication artifact
        if: steps.promotion.outputs.countable == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          ARTIFACT_NAME: ${{ steps.artifact.outputs.name }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/v6-wave3-source"
          mkdir -p "$RUNNER_TEMP/v6-wave3-source"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir "$RUNNER_TEMP/v6-wave3-source"
          rm -rf "$RUNNER_TEMP/v6-wave3-source-tree"
          mkdir -p "$RUNNER_TEMP/v6-wave3-source-tree"
          tar -xf "$RUNNER_TEMP/v6-wave3-source/v6-runtime-data.tar" -C "$RUNNER_TEMP/v6-wave3-source-tree"

      - name: Resolve exact published runtime commit
        if: steps.promotion.outputs.countable == 'true'
        id: runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/branches/runtime-data-v6" > "$RUNNER_TEMP/runtime-branch.json"
          runtime_sha="$(python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = json.loads((Path(os.environ["RUNNER_TEMP"]) / "runtime-branch.json").read_text(encoding="utf-8"))
          print(str(((payload.get("commit") or {}).get("sha") or "")))
          PY
          )"
          if [[ ! "$runtime_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::runtime-data-v6 did not resolve to a full commit SHA"
            exit 1
          fi
          gh api "/repos/${GITHUB_REPOSITORY}/contents/data/v6/health/candidate_freeze.lock?ref=${runtime_sha}" > "$RUNNER_TEMP/runtime-freeze-content.json"
          RUNTIME_SHA="$runtime_sha" python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          envelope = json.loads((Path(os.environ["RUNNER_TEMP"]) / "runtime-freeze-content.json").read_text(encoding="utf-8"))
          raw = base64.b64decode(str(envelope.get("content") or "").replace("\n", ""))
          freeze = json.loads(raw.decode("utf-8"))
          if str(freeze.get("run_id")) != str(os.environ["SOURCE_RUN_ID"]):
              raise SystemExit("runtime branch no longer points to the source run generation")
          if str(freeze.get("run_attempt")) != str(os.environ["SOURCE_RUN_ATTEMPT"]):
              raise SystemExit("runtime branch run_attempt does not match source publication")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"sha={os.environ['RUNTIME_SHA']}\n")
          print({"published_runtime_sha": os.environ["RUNTIME_SHA"], "run_id": freeze.get("run_id"), "run_attempt": freeze.get("run_attempt")})
          PY

      - name: Build Wave 3 natural slot proof
        if: steps.promotion.outputs.countable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m src.runtime_v6.wave3_proof \
            --root "$RUNNER_TEMP/v6-wave3-source-tree/data/v6" \
            --source-commit "${{ steps.source.outputs.head_sha }}" \
            --source-run-id "${{ steps.source.outputs.run_id }}" \
            --source-run-attempt "${{ steps.source.outputs.run_attempt }}" \
            --published-runtime-sha "${{ steps.runtime.outputs.sha }}" \
            --output "$RUNNER_TEMP/wave3-slot-proof.json" \
            --production-validated \
            --promotion-verified

      - name: Upload Wave 3 natural slot proof
        if: steps.promotion.outputs.countable == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v6-wave3-slot-proof-${{ steps.source.outputs.run_id }}-${{ steps.source.outputs.run_attempt }}
          path: ${{ runner.temp }}/wave3-slot-proof.json
          retention-days: 14
          if-no-files-found: error

      - name: Record idempotent natural no-op
        if: steps.promotion.outputs.countable == 'false'
        run: echo "Source natural slot was an idempotent no-op; no new publication proof is counted."
