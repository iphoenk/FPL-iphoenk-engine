name: V4 apply same-process weather context reuse

on:
  push:
    branches: [codex/v4-cold-orchestration-under-5s]
    paths:
      - tools/apply_v4_weather_context_reuse.py
      - .github/workflows/v4-apply-weather-context-reuse.yml

permissions:
  contents: write

concurrency:
  group: v4-weather-reuse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Apply deterministic reuse patch
        run: python tools/apply_v4_weather_context_reuse.py

      - name: Compile patched modules
        run: >-
          python -m py_compile
          src/engines/v4_decision_pipeline.py
          src/services/optimization_slo_service.py
          tests/test_v4_weather_overlay_context_reuse.py

      - name: Full architecture scan and rebuild attestation
        run: python tools/v4_architecture_guard_attest.py

      - name: Verify attested runtime guard
        run: |
          python - <<'PY'
          from src.services import architecture_guard_service as guard
          attested = guard._attested_result()
          assert attested is not None and attested["status"] == "PASS"
          assert guard.run() == attested
          PY

      - name: Full deterministic suite
        run: python -m pytest -q --tb=short

      - name: Exact package parity and search width
        run: python tools/v4_prefix_parity.py

      - name: Commit source and matching attestation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/engines/v4_decision_pipeline.py \
            src/services/optimization_slo_service.py \
            tests/test_v4_weather_overlay_context_reuse.py \
            config/architecture_guard_attestation.json
          git commit -m "perf(v4): reuse prediction context for weather overlay"
          git push origin HEAD:codex/v4-cold-orchestration-under-5s
