name: V12 P1.7 benchmark diagnostics

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v12-p17-benchmark-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install locked V12 test dependencies
        run: python -m pip install --no-deps -r requirements-ci.lock

      - name: Run five-sample P1.7 diagnostics
        run: |
          python scripts/p17_benchmark_diagnostics.py \
            --repeats 5 \
            --scalar-route-count 65 \
            --artifact-dir artifacts/p17-benchmark

      - name: Compare isolated gate versus full-suite gate
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/p17-benchmark
          {
            echo "=== CPU ==="
            lscpu
            echo
            echo "=== NumPy runtime ==="
            python - <<'PY'
            import numpy as np
            print("numpy", np.__version__)
            if hasattr(np, "show_runtime"):
                np.show_runtime()
            else:
                np.show_config()
            PY
          } > artifacts/p17-benchmark/runtime_environment.txt 2>&1

          set +e
          python -m pytest -q             tests/test_lineup_distributional_optimizer.py::test_p17_cross_route_batch_2043_routes_five_gw_under_ten_seconds             > artifacts/p17-benchmark/isolated_gate.log 2>&1
          isolated_rc=$?

          python -m pytest -q             tests/test_legacy_execution_isolation.py             tests/test_active_native_p1_isolation.py             tests/test_fpl_master_v12_decision_conformance.py             tests/test_transfer_search_evidence_contract.py             tests/test_player_comparator_orchestration.py             tests/test_natural_deep_report_orchestration.py             tests/test_natural_report_acceptance_observability.py             tests/test_model_evidence_execution_binding.py             tests/test_model_evidence_calibration.py             tests/test_package_search_exact.py             tests/test_package_utility_canonical.py             tests/test_lineup_distributional_optimizer.py             tests/test_p0_5_canonical_delivery_stage2.py             tests/test_p0_5_scoring_integrity_stage3.py             tests/test_tactical_role_canonical_scorer.py             tests/test_contextual_player_dynamics.py             tests/test_player_minutes_finite_state.py             tests/test_player_events_posterior_predictive.py             tests/test_integrated_report_runner.py             tests/test_deep_decision_content_delivery_barrier.py             tests/test_price_delivery_barrier.py             tests/test_stage1_analytics_foundation.py             tests/test_monte_carlo_engine.py             tests/test_report_runtime_conformance.py             tests/test_visible_content_proof.py             tests/test_visible_report_content_contract.py             tests/test_visible_report_ux_pause_action_state.py             tests/test_data_platform_scheduler_authority.py             tests/test_data_platform_scheduler_recovery_guard.py             tests/test_data_platform_scheduler_watchdog.py             tests/test_data_platform_scheduler_redundancy.py             > artifacts/p17-benchmark/full_suite_gate.log 2>&1
          full_rc=$?
          set -e

          python - <<'PY'
          import json
          import re
          from pathlib import Path
          root = Path("artifacts/p17-benchmark")
          def extract(path):
              text = path.read_text(encoding="utf-8", errors="replace")
              match = re.search(r"assert ([0-9.]+) <= 10\.0", text)
              return {
                  "elapsed_seconds": float(match.group(1)) if match else None,
                  "tail": text[-2500:],
              }
          payload = {
              "isolated_gate": extract(root / "isolated_gate.log"),
              "full_suite_gate": extract(root / "full_suite_gate.log"),
          }
          (root / "gate_context_comparison.json").write_text(
              json.dumps(payload, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2))
          PY

          echo "isolated_rc=$isolated_rc"
          echo "full_rc=$full_rc"
          exit 0

      - name: Upload benchmark diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p17-benchmark-diagnostics-${{ github.run_id }}
          path: artifacts/p17-benchmark
          if-no-files-found: error
          retention-days: 14
