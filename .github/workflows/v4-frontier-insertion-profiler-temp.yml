name: V4 frontier insertion profiler temp

on:
  push:
    branches: [codex/v4-full-universe-tactical-20260903]
    paths:
      - .github/workflows/v4-frontier-insertion-profiler-temp.yml

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: codex/v4-full-universe-tactical-20260903, fetch-depth: 1}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements.txt}
      - run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Apply ephemeral specialized exact hotpath
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/engines/v4_full_universe_exact_state_frontier.py')
          text=path.read_text()
          text=text.replace('from dataclasses import dataclass\n','from dataclasses import dataclass\nfrom functools import cached_property\n',1)
          text=text.replace('    gw_values: tuple[tuple[tuple[float, ...], ...], ...]\n\n\ndef _f','''    gw_values: tuple[tuple[tuple[float, ...], ...], ...]\n\n    @cached_property\n    def gw_flat(self) -> tuple[float, ...]:\n        return tuple(value for position in self.gw_values for gw_values in position for value in gw_values)\n\n\ndef _f''',1)
          old='''def _gw_no_worse(left: IncomingState, right: IncomingState) -> bool:\n    for left_pos, right_pos in zip(left.gw_values, right.gw_values):\n        for left_values, right_values in zip(left_pos, right_pos):\n            if len(left_values) != len(right_values):\n                return False\n            if any(left_value < right_value for left_value, right_value in zip(left_values, right_values)):\n                return False\n    return True\n'''
          new='''def _gw_no_worse(left: IncomingState, right: IncomingState) -> bool:\n    left_values = left.gw_flat\n    right_values = right.gw_flat\n    return len(left_values) == len(right_values) and all(\n        left_value >= right_value for left_value, right_value in zip(left_values, right_values)\n    )\n'''
          assert old in text
          text=text.replace(old,new,1)
          start=text.index('def _front_insert(')
          end=text.index('\ndef _skyband_insert(',start)
          replacement='''def _front_insert(\n    layer: list[IncomingState],\n    candidate: IncomingState,\n    *,\n    frontier_epsilon: float,\n    relation: Callable[..., bool],\n    metrics: dict[str, int] | None = None,\n) -> tuple[bool, list[IncomingState]]:\n    \"\"\"Insert into an exact Pareto layer ordered by descending x5.\n\n    The rank relation has a specialized allocation-free path. The x5 prefix or\n    suffix selected below already proves the x5 no-worse condition, so only the\n    remaining exact rank dimensions and GW componentwise proof are evaluated.\n    Metric accounting is batched per insertion rather than per compared pair.\n    \"\"\"\n    _metric_add(metrics, \"frontier_insert_calls\")\n    if not layer:\n        layer.append(candidate)\n        return True, []\n\n    if not _supports_x5_index(relation):\n        checks = 0\n        for incumbent in layer:\n            checks += 1\n            if relation(incumbent, candidate, frontier_epsilon=frontier_epsilon):\n                _metric_add(metrics, \"dominance_full_checks\", checks)\n                _metric_add(metrics, \"frontier_insert_rejected\")\n                return False, []\n        displaced = []\n        for incumbent in layer:\n            checks += 1\n            if relation(candidate, incumbent, frontier_epsilon=frontier_epsilon):\n                displaced.append(incumbent)\n        _metric_add(metrics, \"dominance_full_checks\", checks)\n        if displaced:\n            displaced_ids = {id(row) for row in displaced}\n            layer[:] = [row for row in layer if id(row) not in displaced_ids]\n            _metric_add(metrics, \"frontier_states_displaced\", len(displaced))\n        layer.append(candidate)\n        return True, displaced\n\n    candidate_key = -candidate.x5\n    layer_size = len(layer)\n    dominator_end = bisect_right(layer, candidate_key, key=_x5_sort_key)\n    displaced_start = bisect_left(layer, candidate_key, key=_x5_sort_key)\n    _metric_add(\n        metrics,\n        \"dominance_pairs_skipped_by_x5_index\",\n        max(0, 2 * layer_size - dominator_end - (layer_size - displaced_start)),\n    )\n    rank_relation = relation is rank_dominates\n\n    checks = 0\n    for index in range(dominator_end):\n        incumbent = layer[index]\n        checks += 1\n        if rank_relation:\n            is_dominator = (\n                incumbent.cost <= candidate.cost\n                and incumbent.x15 >= candidate.x15\n                and incumbent.projection_uncertainty <= candidate.projection_uncertainty\n                and incumbent.xmins_uncertainty <= candidate.xmins_uncertainty\n                and incumbent.tactical_uncertainty <= candidate.tactical_uncertainty\n                and incumbent.roster_change_uncertainty <= candidate.roster_change_uncertainty\n                and (\n                    incumbent.x5 > candidate.x5 + _TWO_DP_ROUND_ERROR\n                    or incumbent.x15 > candidate.x15 + _TWO_DP_ROUND_ERROR\n                    or incumbent.cost < candidate.cost\n                )\n                and _gw_no_worse(incumbent, candidate)\n            )\n        else:\n            is_dominator = relation(incumbent, candidate, frontier_epsilon=frontier_epsilon)\n        if is_dominator:\n            _metric_add(metrics, \"dominance_full_checks\", checks)\n            _metric_add(metrics, \"frontier_insert_rejected\")\n            return False, []\n\n    displaced: list[IncomingState] = []\n    for index in range(displaced_start, layer_size):\n        incumbent = layer[index]\n        checks += 1\n        if rank_relation:\n            candidate_dominates = (\n                candidate.cost <= incumbent.cost\n                and candidate.x15 >= incumbent.x15\n                and candidate.projection_uncertainty <= incumbent.projection_uncertainty\n                and candidate.xmins_uncertainty <= incumbent.xmins_uncertainty\n                and candidate.tactical_uncertainty <= incumbent.tactical_uncertainty\n                and candidate.roster_change_uncertainty <= incumbent.roster_change_uncertainty\n                and (\n                    candidate.x5 > incumbent.x5 + _TWO_DP_ROUND_ERROR\n                    or candidate.x15 > incumbent.x15 + _TWO_DP_ROUND_ERROR\n                    or candidate.cost < incumbent.cost\n                )\n                and _gw_no_worse(candidate, incumbent)\n            )\n        else:\n            candidate_dominates = relation(candidate, incumbent, frontier_epsilon=frontier_epsilon)\n        if candidate_dominates:\n            displaced.append(incumbent)\n    _metric_add(metrics, \"dominance_full_checks\", checks)\n\n    if displaced:\n        displaced_ids = {id(row) for row in displaced}\n        layer[displaced_start:] = [\n            row for row in layer[displaced_start:] if id(row) not in displaced_ids\n        ]\n        _metric_add(metrics, \"frontier_states_displaced\", len(displaced))\n\n    insert_at = bisect_right(layer, candidate_key, key=_x5_sort_key)\n    layer.insert(insert_at, candidate)\n    return True, displaced\n'''
          path.write_text(text[:start]+replacement+text[end:])
          PY
          python -m py_compile src/engines/v4_full_universe_exact_state_frontier.py
      - name: Exact semantic oracle tests
        run: python -m pytest -q tests/test_v4_full_universe_exact_state_frontier.py tests/test_v4_full_universe_authority_fail_closed.py
      - name: Production-scale exact frontier regression
        run: /usr/bin/time -f 'regression_elapsed=%e' python -m pytest -q tests/test_v4_exact_frontier_production_scale.py
