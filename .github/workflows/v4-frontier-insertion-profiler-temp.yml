name: V4 frontier insertion profiler temp

on:
  push:
    branches: [codex/v4-full-universe-tactical-20260903]
    paths:
      - .github/workflows/v4-frontier-insertion-profiler-temp.yml

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: codex/v4-full-universe-tactical-20260903, fetch-depth: 1}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements.txt}
      - run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Profile exact batch shard hot path
        run: |
          python -u - <<'PY'
          import cProfile,pstats,io
          from time import perf_counter
          from src.engines.v4_full_universe_shard_planner import build_plan,_load_material
          from src.engines import v4_full_universe_shard_batch_kernel as batch

          plan=build_plan(); material=_load_material()
          task=max((t for s in plan['shards'] for t in s['tasks'] if int(t.get('estimated_work') or 0)>0),key=lambda t:(int(t['estimated_work']),str(t['task_id'])))
          top_keep=int(plan['registry']['planner']['top_keep_per_shard'])
          profiler=cProfile.Profile(); started=perf_counter(); profiler.enable()
          result,_=batch.execute_tasks(material,[task],top_per_size=top_keep,batch_size=1024)
          profiler.disable(); elapsed=perf_counter()-started
          diag=(result['search']['diagnostics'])
          print('RESULT',{'elapsed_s':round(elapsed,4),'packages':diag['packages_evaluated'],'pps':round(diag['packages_evaluated']/elapsed,1),'frontier':diag['packages_retained_on_frontier'],'flushes':diag['batch_flushes']})
          stream=io.StringIO(); pstats.Stats(profiler,stream=stream).strip_dirs().sort_stats('cumulative').print_stats(45)
          print(stream.getvalue())
          PY
