name: V4 frontier insertion profiler temp

on:
  push:
    branches: [codex/v4-full-universe-tactical-20260903]
    paths:
      - .github/workflows/v4-frontier-insertion-profiler-temp.yml

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: codex/v4-full-universe-tactical-20260903, fetch-depth: 1}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements.txt}
      - run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Apply ephemeral cached GW-vector optimization
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/engines/v4_full_universe_exact_state_frontier.py')
          text=path.read_text()
          old='from dataclasses import dataclass\n'
          new='from dataclasses import dataclass\nfrom functools import cached_property\n'
          assert text.count(old)==1
          text=text.replace(old,new,1)
          old='    gw_values: tuple[tuple[tuple[float, ...], ...], ...]\n\n\ndef _f'
          new='''    gw_values: tuple[tuple[tuple[float, ...], ...], ...]\n\n    @cached_property\n    def gw_flat(self) -> tuple[float, ...]:\n        return tuple(\n            value\n            for position in self.gw_values\n            for gw_values in position\n            for value in gw_values\n        )\n\n\ndef _f'''
          assert text.count(old)==1
          text=text.replace(old,new,1)
          old='''def _gw_no_worse(left: IncomingState, right: IncomingState) -> bool:\n    for left_pos, right_pos in zip(left.gw_values, right.gw_values):\n        for left_values, right_values in zip(left_pos, right_pos):\n            if len(left_values) != len(right_values):\n                return False\n            if any(left_value < right_value for left_value, right_value in zip(left_values, right_values)):\n                return False\n    return True\n'''
          new='''def _gw_no_worse(left: IncomingState, right: IncomingState) -> bool:\n    left_values = left.gw_flat\n    right_values = right.gw_flat\n    return (\n        len(left_values) == len(right_values)\n        and all(left_value >= right_value for left_value, right_value in zip(left_values, right_values))\n    )\n'''
          assert text.count(old)==1
          text=text.replace(old,new,1)
          path.write_text(text)
          PY
      - name: Production-scale exact frontier regression
        run: /usr/bin/time -f 'regression_elapsed=%e' python -m pytest -q tests/test_v4_exact_frontier_production_scale.py
