name: V3 Runtime

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["V3 CI"]
    types: [completed]
  schedule:
    # Logical FPL checkpoint remains :30. The :15 run precomputes its snapshot.
    # Off-minute 5-minute wakeups are probe/recovery only and no-op when the
    # logical checkpoint is already satisfied; they never become a second authority.
    - cron: "30 * * * *"
    - cron: "15 * * * *"
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: v3-runtime-publication
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  RUNTIME_BRANCH: runtime-data
  SOURCE_COMMIT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  compute:
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
      }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      should_publish: ${{ steps.cadence.outputs.should_collect }}
      profile: ${{ steps.runtime_profile.outputs.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source commit passed V3 CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          api = os.environ["GITHUB_API_URL"].rstrip("/")
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["SOURCE_COMMIT"]
          token = os.environ["GH_TOKEN"]
          url = f"{api}/repos/{repo}/actions/workflows/v3-ci.yml/runs?head_sha={sha}&branch=main&per_page=20"
          request = Request(
              url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urlopen(request, timeout=20) as response:
              payload = json.loads(response.read().decode("utf-8"))
          valid = [
              run
              for run in payload.get("workflow_runs", [])
              if run.get("head_sha") == sha
              and run.get("head_branch") == "main"
              and run.get("conclusion") == "success"
          ]
          if not valid:
              raise SystemExit(f"REFUSING_V3_RUNTIME_WITHOUT_GREEN_CI source_commit={sha}")
          print(json.dumps({"source_commit": sha, "v3_ci_run_id": valid[0].get("id"), "status": "PASS"}))
          PY

      - name: Fetch current runtime phase and precompute metadata
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "+${RUNTIME_BRANCH}:refs/remotes/origin/${RUNTIME_BRANCH}" || true
          mkdir -p data
          for file in latest.json runtime_manifest.json; do
            if git cat-file -e "origin/${RUNTIME_BRANCH}:data/${file}" 2>/dev/null; then
              git show "origin/${RUNTIME_BRANCH}:data/${file}" > "data/${file}"
            fi
          done

      - name: Decide governed cadence, precompute target and fallback
        id: cadence
        env:
          FPL_SCHEDULE_EXPR: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
        run: python -m src.runtime_v3.precompute_checkpoint

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.cadence.outputs.should_collect == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked runtime dependencies
        if: steps.cadence.outputs.should_collect == 'true'
        run: pip install --no-deps -r requirements.lock

      - name: Hydrate declared reusable canonical state
        if: steps.cadence.outputs.should_collect == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/hydrate-paths.txt"
          import json
          cfg=json.load(open('config/runtime/runtime_publish_registry.json'))
          for path in cfg.get('hydrate_paths', []):
              print(path)
          PY
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            if git cat-file -e "origin/${RUNTIME_BRANCH}:data/${file}" 2>/dev/null; then
              mkdir -p "data/$(dirname "$file")"
              git show "origin/${RUNTIME_BRANCH}:data/${file}" > "data/${file}"
              echo "Hydrated data/${file}"
            fi
          done < "$RUNNER_TEMP/hydrate-paths.txt"

      - name: Refresh Official FPL rules drift baseline
        if: steps.cadence.outputs.should_collect == 'true' && steps.cadence.outputs.visible_mode == 'NORMAL_DEEP_REVIEW'
        run: python -m src.engines.rules_compliance_audit --check-remote

      - name: Validate capability terminology contract
        if: steps.cadence.outputs.should_collect == 'true'
        run: python -m src.runtime_v3.capability_terminology_validate

      - name: Validate architecture ownership contract
        if: steps.cadence.outputs.should_collect == 'true'
        run: python -m src.engines.architecture_contract_validate

      - name: Validate canonical capability telemetry
        if: steps.cadence.outputs.should_collect == 'true'
        run: python -m src.runtime_v3.capability_telemetry

      - name: Validate hardened FAST lane contract
        if: steps.cadence.outputs.should_collect == 'true'
        run: python -m src.runtime_v3.fast_lane_contract_validate

      - name: Resolve registry-driven execution profile and checkpoint recovery
        if: steps.cadence.outputs.should_collect == 'true'
        id: runtime_profile
        env:
          FPL_VISIBLE_MODE: ${{ steps.cadence.outputs.visible_mode }}
          FPL_DEADLINE_INTENSIVE: ${{ steps.cadence.outputs.deadline_intensive }}
          FPL_MATCH_WINDOW: ${{ steps.cadence.outputs.match_window }}
          FPL_POST_DEADLINE_RECONCILIATION: ${{ steps.cadence.outputs.post_deadline_reconciliation }}
        run: python -m src.runtime_v3.execution_profile_resolver

      - name: Run governed canonical domain execution profile
        if: steps.cadence.outputs.should_collect == 'true'
        shell: bash
        env:
          FPL_AUTH_MODE: ${{ secrets.FPL_AUTH_MODE }}
          FPL_SESSION_B64: ${{ secrets.FPL_SESSION_B64 }}
          FPL_ACCESS_TOKEN: ${{ secrets.FPL_ACCESS_TOKEN }}
          FPL_REFRESH_TOKEN: ${{ secrets.FPL_REFRESH_TOKEN }}
          FPL_OIDC_TOKEN_URL: ${{ secrets.FPL_OIDC_TOKEN_URL }}
          FPL_OIDC_CLIENT_ID: ${{ secrets.FPL_OIDC_CLIENT_ID }}
          FPL_OIDC_CLIENT_SECRET: ${{ secrets.FPL_OIDC_CLIENT_SECRET }}
          FPL_RECOVERY_CHECKPOINT_IDS: ${{ steps.runtime_profile.outputs.recovery_checkpoint_ids }}
        run: |
          set -euo pipefail
          args=(--mode "${{ steps.runtime_profile.outputs.mode }}" --stats --profile "${{ steps.runtime_profile.outputs.profile }}")
          if [ "${{ steps.runtime_profile.outputs.extra }}" = "--deep-stats" ]; then
            args+=(--deep-stats)
          fi
          python -m src.runtime_v3.domain_orchestrator "${args[@]}"

      - name: Validate production decision contracts
        if: steps.cadence.outputs.should_collect == 'true'
        run: |
          python -m src.engines.source_contract_validate
          python -m src.engines.production_contract_validate
          python -m src.engines.watchlist_contract_validate
          python -m src.engines.report_serving_validate
          python -m src.engines.report_time_contract_validate

      - name: Enforce selected profile runtime SLO with one bounded warm retry
        if: steps.cadence.outputs.should_collect == 'true'
        shell: bash
        env:
          FPL_AUTH_MODE: ${{ secrets.FPL_AUTH_MODE }}
          FPL_SESSION_B64: ${{ secrets.FPL_SESSION_B64 }}
          FPL_ACCESS_TOKEN: ${{ secrets.FPL_ACCESS_TOKEN }}
          FPL_REFRESH_TOKEN: ${{ secrets.FPL_REFRESH_TOKEN }}
          FPL_OIDC_TOKEN_URL: ${{ secrets.FPL_OIDC_TOKEN_URL }}
          FPL_OIDC_CLIENT_ID: ${{ secrets.FPL_OIDC_CLIENT_ID }}
          FPL_OIDC_CLIENT_SECRET: ${{ secrets.FPL_OIDC_CLIENT_SECRET }}
          FPL_RECOVERY_CHECKPOINT_IDS: ${{ steps.runtime_profile.outputs.recovery_checkpoint_ids }}
        run: |
          set -euo pipefail
          profile="${{ steps.runtime_profile.outputs.profile }}"
          if python -m src.runtime_v3.performance_guard --profile "$profile"; then
            exit 0
          fi

          if [ "$profile" != "fast_decision" ]; then
            echo "SLO failure is not eligible for warm retry: profile=$profile"
            exit 2
          fi

          echo "FAST_SLO_WARM_RETRY: first attempt exceeded the unchanged 3000ms hard ceiling; retrying exactly once against current in-job canonical state"
          args=(--mode "${{ steps.runtime_profile.outputs.mode }}" --stats --profile "$profile")
          python -m src.runtime_v3.domain_orchestrator "${args[@]}"

          python -m src.engines.source_contract_validate
          python -m src.engines.production_contract_validate
          python -m src.engines.watchlist_contract_validate
          python -m src.engines.report_serving_validate
          python -m src.engines.report_time_contract_validate
          python -m src.runtime_v3.performance_guard --profile "$profile"

      - name: Verify V3 candidate definition of done before publication
        if: steps.cadence.outputs.should_collect == 'true'
        run: python -m src.runtime_v3.definition_of_done --scope candidate --source-commit "$SOURCE_COMMIT"

      - name: Materialize and validate publication whitelist
        if: steps.cadence.outputs.should_collect == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/runtime-publish"
          python -m src.runtime_v3.publish_snapshot \
            --source-data data \
            --output-dir "$RUNNER_TEMP/runtime-publish" \
            --profile "${{ steps.runtime_profile.outputs.profile }}" \
            --source-commit "$SOURCE_COMMIT" \
            --snapshot-role "${{ steps.cadence.outputs.snapshot_role }}" \
            --target-checkpoint "${{ steps.cadence.outputs.target_checkpoint_utc }}" \
            --target-visible-mode "${{ steps.cadence.outputs.target_visible_mode }}"
          python -m src.runtime_v3.publication_verify \
            --data-dir "$RUNNER_TEMP/runtime-publish/data" \
            --profile "${{ steps.runtime_profile.outputs.profile }}" \
            --source-commit "$SOURCE_COMMIT"

      - name: Transfer verified runtime snapshot to isolated publisher
        if: steps.cadence.outputs.should_collect == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v3-runtime-${{ github.run_id }}
          path: ${{ runner.temp }}/runtime-publish/data
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: compute
    if: needs.compute.outputs.should_publish == 'true'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint governed V3 runtime publisher token
        id: runtime_app_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.V3_RUNTIME_APP_ID }}
          private-key: ${{ secrets.V3_RUNTIME_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: FPL-iphoenk-engine
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Receive verified runtime snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: v3-runtime-${{ github.run_id }}
          path: ${{ runner.temp }}/runtime-publish/data

      - name: Assert source main is still canonical before publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${RUNTIME_BRANCH}:refs/remotes/origin/${RUNTIME_BRANCH}"
          canonical_main="$(git rev-parse refs/remotes/origin/main)"
          if [ "$canonical_main" != "$SOURCE_COMMIT" ]; then
            python -m src.runtime_v3.version_scope_validate \
              --source-commit "$SOURCE_COMMIT" \
              --canonical-main "$canonical_main"
          fi
          runtime_base="$(git rev-parse refs/remotes/origin/${RUNTIME_BRANCH})"
          echo "RUNTIME_BASE_SHA=$runtime_base" >> "$GITHUB_ENV"

      - name: Revalidate transferred publication artifact
        run: |
          python -m src.runtime_v3.publication_verify \
            --data-dir "$RUNNER_TEMP/runtime-publish/data" \
            --profile "${{ needs.compute.outputs.profile }}" \
            --source-commit "$SOURCE_COMMIT"

      - name: Publish rolling runtime snapshot atomically
        shell: bash
        env:
          GH_TOKEN: ${{ steps.runtime_app_token.outputs.token }}
        run: |
          set -euo pipefail
          publish_tree="$RUNNER_TEMP/runtime-worktree"
          rm -rf "$publish_tree"
          git config user.name "fpl-iphoenk-bot"
          git config user.email "actions@users.noreply.github.com"
          git worktree add --detach "$publish_tree" HEAD
          cd "$publish_tree"
          git checkout --orphan runtime-snapshot
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/runtime-publish/data" ./data
          git add -f data/
          git commit -m "data: rolling FPL runtime snapshot [skip ci]"
          published_sha="$(git rev-parse HEAD)"
          basic_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${basic_auth}" push \
            --force-with-lease="refs/heads/${RUNTIME_BRANCH}:${RUNTIME_BASE_SHA}" \
            origin "HEAD:refs/heads/${RUNTIME_BRANCH}"
          echo "PUBLISHED_RUNTIME_SHA=$published_sha" >> "$GITHUB_ENV"

      - name: Verify published runtime provenance and exact whitelist
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "+refs/heads/${RUNTIME_BRANCH}:refs/remotes/origin/${RUNTIME_BRANCH}"
          published_head="$(git rev-parse refs/remotes/origin/${RUNTIME_BRANCH})"
          if [ "$published_head" != "$PUBLISHED_RUNTIME_SHA" ]; then
            echo "Published runtime HEAD mismatch: expected=$PUBLISHED_RUNTIME_SHA actual=$published_head"
            exit 1
          fi

          verify_tree="$RUNNER_TEMP/runtime-verify"
          rm -rf "$verify_tree"
          git worktree add --detach "$verify_tree" "refs/remotes/origin/${RUNTIME_BRANCH}"

          unauthorized_root="$(git -C "$verify_tree" ls-files | grep -v '^data/' || true)"
          if [ -n "$unauthorized_root" ]; then
            echo "Unauthorized files outside data/:"
            echo "$unauthorized_root"
            exit 1
          fi

          python -m src.runtime_v3.publication_verify \
            --data-dir "$verify_tree/data" \
            --profile "${{ needs.compute.outputs.profile }}" \
            --source-commit "$SOURCE_COMMIT"

          diff -qr "$RUNNER_TEMP/runtime-publish/data" "$verify_tree/data"
