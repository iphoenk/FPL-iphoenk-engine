name: TEMP V4 architecture attestation

on:
  push:
    branches:
      - codex/v4-official-fact-completeness-p0

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate governed architecture attestation
        run: python tools/v4_architecture_guard_attest.py
      - name: Upload attestation
        uses: actions/upload-artifact@v7
        with:
          name: v4-architecture-attestation-${{ github.sha }}
          path: config/architecture_guard_attestation.json
          if-no-files-found: error
          retention-days: 1
