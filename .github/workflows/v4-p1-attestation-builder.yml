name: V4 P1 attestation builder

on:
  push:
    branches:
      - codex/v4-p1-structural-hardening

permissions:
  contents: read

jobs:
  build-attestation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build architecture attestation
        run: python tools/v4_architecture_guard_attest.py
      - name: Upload architecture attestation
        uses: actions/upload-artifact@v7
        with:
          name: v4-p1-architecture-attestation-${{ github.run_id }}
          path: config/architecture_guard_attestation.json
          if-no-files-found: error
          retention-days: 1
