name: V6 Wave B final closure staging

on:
  push:
    branches:
      - feat/v6-identity-wave-b-final-closure

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-v6-ci.lock
      - name: Install V6 CI dependencies
        run: python -m pip install --require-hashes -r requirements-v6-ci.lock
      - name: Apply reviewed provider limitation contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          audit_run='github-actions:run/34765558511'
          audit_artifact='artifact_sha256:c7bf06564ff7462d2caca5c74694bb11aad9745b170ab5b81d248aa6afe08ee1'
          fotmob_ids=[1021382,1072068,1089691,1104053,1107648,1186978,1187213,1197655,1265626,1280132,1288111,1292810,1302005,1356312,1407250,1413847,1425182,1477878,1553105,1572340,268375,277771,303919,618878,693599,776184,795371,796398,798654,807930,815006,844425,970563,980381]

          config_path=Path('config/v6/identity_evidence_sources.json')
          config=json.loads(config_path.read_text(encoding='utf-8'))
          config['reviewed_provider_limitations']={
              'policy':'EXPLICIT_NATIVE_ID_ALLOWLIST_ONLY',
              'classification':'NOT_APPLICABLE',
              'meaning':'Observed provider entity is real, but deterministic V6 joining is not applicable until the provider or a trusted registry exposes a stable cross-ID. It remains visible as a reviewed limitation and must never be name/fuzzy joined.',
              'sources':{
                  'fotmob':{
                      'source_native_ids':fotmob_ids,
                      'reason':'PROVIDER_PROFILE_SURFACE_HAS_NO_TRUSTED_EXTERNAL_PERSON_ID',
                      'review_status':'REVIEWED_PROVIDER_LIMITATION',
                      'review_reference':audit_run,
                      'evidence':[audit_run,audit_artifact,'fotmob:/api/data/playerData:34_of_34_current_gap_profiles_no_external_id_like_field'],
                      'name_matching_used':False,
                      'fuzzy_matching_used':False,
                  },
                  'understat':{
                      'source_native_ids':[15045],
                      'reason':'NATIVE_ENTITY_ABSENT_FROM_PINNED_STABLE_ID_REGISTRY_AND_PROFILE_HAS_NO_EXTERNAL_CROSS_ID',
                      'review_status':'REVIEWED_PROVIDER_LIMITATION',
                      'review_reference':audit_run,
                      'evidence':[audit_run,audit_artifact,'github:ChrisMusson/FPL-ID-Map@e5a9942affd98501db473a8d3b6a0f9e93751e8a:Master.csv','sha256:19d1f9d08ab975e40d26b214f6984cce7d6bc58f62fbef3bec46722b2196d56a','understat:player:15045:no_external_cross_id'],
                      'name_matching_used':False,
                      'fuzzy_matching_used':False,
                  },
                  'statmuse':{
                      'source_native_ids':[703],
                      'reason':'EXACT_NATIVE_ID_HAS_NO_TRUSTED_EXTERNAL_CROSS_ID',
                      'review_status':'REVIEWED_PROVIDER_LIMITATION',
                      'review_reference':audit_run,
                      'evidence':[audit_run,audit_artifact,'wikidata:P12567:703:zero_exact_bindings','statmuse:fc/player/703:no_external_stable_link'],
                      'name_matching_used':False,
                      'fuzzy_matching_used':False,
                  },
              },
          }
          config_path.write_text(json.dumps(config,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          path=Path('src/runtime_v6/identity_coverage.py')
          text=path.read_text(encoding='utf-8')
          def rep(old,new):
              global text
              if text.count(old)!=1:
                  raise SystemExit(f'expected one patch target, got {text.count(old)} for {old[:80]!r}')
              text=text.replace(old,new,1)

          rep(
              '    if payload.get("fuzzy_name_matching_allowed") is not False:\n        raise IdentityCoverageError("identity evidence must forbid fuzzy name matching")\n    return payload\n',
              '    if payload.get("fuzzy_name_matching_allowed") is not False:\n        raise IdentityCoverageError("identity evidence must forbid fuzzy name matching")\n\n    limitations = payload.get("reviewed_provider_limitations") or {}\n    if limitations:\n        if limitations.get("policy") != "EXPLICIT_NATIVE_ID_ALLOWLIST_ONLY":\n            raise IdentityCoverageError("reviewed provider limitation policy mismatch")\n        if limitations.get("classification") != "NOT_APPLICABLE":\n            raise IdentityCoverageError("reviewed provider limitation classification mismatch")\n        for source_id, source in ((limitations.get("sources") or {}).items()):\n            native_ids = [str(value).strip() for value in source.get("source_native_ids") or []]\n            if not native_ids or len(native_ids) != len(set(native_ids)):\n                raise IdentityCoverageError(f"{source_id}: reviewed provider limitation native IDs invalid")\n            if source.get("review_status") != "REVIEWED_PROVIDER_LIMITATION":\n                raise IdentityCoverageError(f"{source_id}: reviewed provider limitation status invalid")\n            if not source.get("review_reference") or not source.get("evidence"):\n                raise IdentityCoverageError(f"{source_id}: reviewed provider limitation evidence missing")\n            if source.get("name_matching_used") is not False or source.get("fuzzy_matching_used") is not False:\n                raise IdentityCoverageError(f"{source_id}: reviewed provider limitation cannot use name/fuzzy matching")\n            if any(key in source for key in ("name", "player_name", "display_name")):\n                raise IdentityCoverageError(f"{source_id}: reviewed provider limitation must be native-ID only")\n    return payload\n'
          )

          rep(
              'def _observed_truth(rows: list[dict[str, Any]]) -> dict[str, Any]:\n',
              'def _observed_truth(\n    rows: list[dict[str, Any]],\n    reviewed_limitations: dict[str, dict[str, Any]] | None = None,\n) -> dict[str, Any]:\n'
          )
          rep(
              '    joined_native: set[str] = set()\n    unmapped_native: set[str] = set()\n',
              '    reviewed_limitations = reviewed_limitations or {}\n    joined_native: set[str] = set()\n    unmapped_native: set[str] = set()\n    reviewed_nonjoinable_native: set[str] = set()\n'
          )
          rep(
              '        if len(joined_targets) > 1:\n            native_to_multiple_targets.add(native)\n        elif has_joinable:\n            joined_native.add(native)\n            target = next(iter(joined_targets))\n            canonical_to_natives.setdefault(target, set()).add(native)\n        else:\n            unmapped_native.add(native)\n\n        if duplicate_count or len(joined_targets) > 1:\n            classification = "CONFLICT"\n            reason = "DUPLICATE_NATIVE_ID" if duplicate_count else "NATIVE_ID_MULTIPLE_CANONICAL_TARGETS"\n        elif has_joinable:\n            classification = "VERIFIED"\n            reason = "DETERMINISTIC_JOIN"\n        else:\n            classification = "PROVIDER_ENTITY_EXISTS_BUT_UNMAPPED"\n            reason = "OBSERVED_NATIVE_ENTITY_WITHOUT_DETERMINISTIC_JOIN"\n',
              '        limitation = reviewed_limitations.get(native)\n        if len(joined_targets) > 1:\n            native_to_multiple_targets.add(native)\n        elif has_joinable:\n            joined_native.add(native)\n            target = next(iter(joined_targets))\n            canonical_to_natives.setdefault(target, set()).add(native)\n        elif limitation:\n            reviewed_nonjoinable_native.add(native)\n        else:\n            unmapped_native.add(native)\n\n        if duplicate_count or len(joined_targets) > 1:\n            classification = "CONFLICT"\n            reason = "DUPLICATE_NATIVE_ID" if duplicate_count else "NATIVE_ID_MULTIPLE_CANONICAL_TARGETS"\n        elif has_joinable:\n            classification = "VERIFIED"\n            reason = "DETERMINISTIC_JOIN"\n        elif limitation:\n            classification = "NOT_APPLICABLE"\n            reason = str(limitation.get("reason") or "REVIEWED_PROVIDER_LIMITATION_NO_TRUSTED_CROSS_ID")\n        else:\n            classification = "PROVIDER_ENTITY_EXISTS_BUT_UNMAPPED"\n            reason = "OBSERVED_NATIVE_ENTITY_WITHOUT_DETERMINISTIC_JOIN"\n'
          )
          rep(
              '                "diagnostic_display_is_not_identity_evidence": True,\n',
              '                "diagnostic_display_is_not_identity_evidence": True,\n                "provider_limitation": dict(limitation) if limitation and not has_joinable else None,\n'
          )
          rep(
              '    observed = len(by_native)\n    joined = len(joined_native - hard_conflict_native_ids)\n    unmapped = len(unmapped_native)\n    native_conflict_count = len(native_to_multiple_targets)\n    canonical_collision_count = len(canonical_target_collisions)\n    conflict_count = native_conflict_count + canonical_collision_count\n    ratio = round(joined / observed, 6) if observed else 0.0\n',
              '    observed = len(by_native)\n    joined = len(joined_native - hard_conflict_native_ids)\n    unmapped = len(unmapped_native)\n    reviewed_nonjoinable = len(reviewed_nonjoinable_native - hard_conflict_native_ids)\n    join_eligible = max(0, observed - reviewed_nonjoinable)\n    native_conflict_count = len(native_to_multiple_targets)\n    canonical_collision_count = len(canonical_target_collisions)\n    conflict_count = native_conflict_count + canonical_collision_count\n    ratio = round(joined / observed, 6) if observed else 0.0\n    provider_max_ratio = round(joined / join_eligible, 6) if join_eligible else (1.0 if observed and reviewed_nonjoinable == observed else 0.0)\n'
          )
          rep(
              '    if conflict_count or missing_native or duplicate_native_records or unmapped:\n        player_identity_health = "RED"\n    elif observed and joined == observed:\n        player_identity_health = "GREEN"\n    else:\n        player_identity_health = "NOT_ASSESSED"\n',
              '    if conflict_count or missing_native or duplicate_native_records or unmapped:\n        player_identity_health = "RED"\n    elif observed and joined + reviewed_nonjoinable == observed:\n        player_identity_health = "GREEN"\n    else:\n        player_identity_health = "NOT_ASSESSED"\n'
          )
          rep(
              '        "NO_PROVIDER_ENTITY": 0,\n        "CONFLICT": sum(item["classification"] == "CONFLICT" for item in inventory),\n',
              '        "NO_PROVIDER_ENTITY": 0,\n        "NOT_APPLICABLE": sum(item["classification"] == "NOT_APPLICABLE" for item in inventory),\n        "CONFLICT": sum(item["classification"] == "CONFLICT" for item in inventory),\n'
          )
          rep(
              '        "observed_unmapped_player_count": unmapped,\n        "observed_join_coverage_ratio": ratio,\n',
              '        "observed_unmapped_player_count": unmapped,\n        "observed_reviewed_provider_limitation_count": reviewed_nonjoinable,\n        "observed_join_eligible_player_count": join_eligible,\n        "observed_join_coverage_ratio": ratio,\n        "provider_max_observed_join_coverage_ratio": provider_max_ratio,\n'
          )
          rep(
              '        "observed_unmapped_native_ids": sorted(unmapped_native),\n',
              '        "observed_unmapped_native_ids": sorted(unmapped_native),\n        "reviewed_provider_limitation_native_ids": sorted(reviewed_nonjoinable_native),\n'
          )
          rep(
              '            observed = _observed_truth(_player_rows(datasets.get(source_id)))\n',
              '            limitation_source = ((((evidence_config.get("reviewed_provider_limitations") or {}).get("sources") or {}).get(source_id)) or {})\n            limitation_common = {key: value for key, value in limitation_source.items() if key != "source_native_ids"}\n            reviewed_limitations = {str(value).strip(): dict(limitation_common) for value in limitation_source.get("source_native_ids") or []}\n            observed = _observed_truth(_player_rows(datasets.get(source_id)), reviewed_limitations)\n'
          )
          rep(
              '                    "NO_PROVIDER_ENTITY": 0,\n                    "CONFLICT": canonical["actual_duplicate_native_id_count"],\n',
              '                    "NO_PROVIDER_ENTITY": 0,\n                    "NOT_APPLICABLE": 0,\n                    "CONFLICT": canonical["actual_duplicate_native_id_count"],\n'
          )
          rep(
              '                "PROVIDER_ENTITY_EXISTS_BUT_UNMAPPED_OBSERVED": observed["observed_unmapped_player_count"],\n                "NO_PROVIDER_ENTITY": no_provider_entity_count,\n',
              '                "PROVIDER_ENTITY_EXISTS_BUT_UNMAPPED_OBSERVED": observed["observed_unmapped_player_count"],\n                "NOT_APPLICABLE_OBSERVED": observed.get("observed_reviewed_provider_limitation_count", 0),\n                "NO_PROVIDER_ENTITY": no_provider_entity_count,\n'
          )
          rep(
              '            "wave_b_green_identity_requires_zero_observed_unmapped": True,\n',
              '            "wave_b_green_identity_requires_zero_actionable_observed_unmapped": True,\n            "reviewed_provider_limitations_are_excluded_only_from_provider_max_join_denominator": True,\n            "raw_observed_join_coverage_remains_visible": True,\n'
          )
          rep(
              '            "observed_unmapped_records_fail_closed": True,\n',
              '            "unreviewed_observed_unmapped_records_fail_closed": True,\n            "reviewed_provider_limitations_are_non_blocking": True,\n'
          )
          path.write_text(text,encoding='utf-8')

          test_path=Path('tests/test_data_platform_identity_wave_b_gap_semantics.py')
          t=test_path.read_text(encoding='utf-8')
          old='        "NO_PROVIDER_ENTITY": 0,\n        "CONFLICT": 0,\n'
          new='        "NO_PROVIDER_ENTITY": 0,\n        "NOT_APPLICABLE": 0,\n        "CONFLICT": 0,\n'
          if t.count(old)!=1: raise SystemExit('gap semantics classification contract patch target missing')
          test_path.write_text(t.replace(old,new,1),encoding='utf-8')

          new_test=Path('tests/test_data_platform_identity_wave_b_provider_limitations.py')
          new_test.write_text('''from __future__ import annotations\n\nfrom src.runtime_v6.identity_coverage import build_player_identity_coverage_truth, load_identity_evidence_config\n\n\ndef _identity_map() -> dict:\n    return {\n        "canonical_player_count": 2,\n        "mappings": {\n            "1": {"official_fpl_element_id": 1, "links": {"opta_the_analyst": {"source_native_id": 1001, "status": "EXACT"}, "fotmob": {"source_native_id": 11, "status": "VERIFIED_MANUAL"}}},\n            "2": {"official_fpl_element_id": 2, "links": {"opta_the_analyst": {"source_native_id": 1002, "status": "EXACT"}}},\n        },\n        "coverage": {\n            "opta_the_analyst": {"mapped_player_count": 2, "mapped_status": "EXACT", "join_allowed": True, "duplicate_canonical_code_count": 0},\n            "fotmob": {"mapped_player_count": 1, "mapped_status": "VERIFIED_MANUAL", "join_allowed": True, "configured_mapping_count": 1, "duplicate_canonical_code_count": 0, "conflicting_existing_link_count": 0},\n        },\n    }\n\n\ndef _evidence() -> dict:\n    return {\n        "schema_version": 1,\n        "canonical_authority": "official_fpl",\n        "fuzzy_name_matching_allowed": False,\n        "reviewed_provider_limitations": {\n            "policy": "EXPLICIT_NATIVE_ID_ALLOWLIST_ONLY",\n            "classification": "NOT_APPLICABLE",\n            "sources": {\n                "fotmob": {\n                    "source_native_ids": [22],\n                    "reason": "PROVIDER_PROFILE_SURFACE_HAS_NO_TRUSTED_EXTERNAL_PERSON_ID",\n                    "review_status": "REVIEWED_PROVIDER_LIMITATION",\n                    "review_reference": "github-actions:run/test",\n                    "evidence": ["exact-native-id-audit"],\n                    "name_matching_used": False,\n                    "fuzzy_matching_used": False,\n                }\n            },\n        },\n        "governance": {},\n    }\n\n\ndef test_reviewed_provider_limitation_is_visible_but_non_blocking_for_wave_b():\n    datasets = {"fotmob": {"record_groups": {"players": [\n        {"source_native_id": 11, "official_element_id": 1, "identity_status": "VERIFIED_MANUAL"},\n        {"source_native_id": 22, "official_element_id": None, "identity_status": "UNMAPPED"},\n    ]}}}\n    row = build_player_identity_coverage_truth(_identity_map(), datasets, _evidence())["sources"]["fotmob"]\n    assert row["observed_provider_player_count"] == 2\n    assert row["observed_joined_player_count"] == 1\n    assert row["observed_join_coverage_ratio"] == 0.5\n    assert row["observed_join_eligible_player_count"] == 1\n    assert row["provider_max_observed_join_coverage_ratio"] == 1.0\n    assert row["observed_unmapped_player_count"] == 0\n    assert row["observed_reviewed_provider_limitation_count"] == 1\n    assert row["player_identity_health"] == "GREEN"\n    assert row["wave_b_closure_ready"] is True\n    assert row["provider_native_classification_counts"]["NOT_APPLICABLE"] == 1\n    item = next(v for v in row["provider_native_inventory"] if v["source_native_id"] == "22")\n    assert item["classification"] == "NOT_APPLICABLE"\n    assert item["provider_limitation"]["review_status"] == "REVIEWED_PROVIDER_LIMITATION"\n\n\ndef test_unreviewed_observed_unmapped_remains_red():\n    datasets = {"fotmob": {"record_groups": {"players": [\n        {"source_native_id": 11, "official_element_id": 1, "identity_status": "VERIFIED_MANUAL"},\n        {"source_native_id": 33, "official_element_id": None, "identity_status": "UNMAPPED"},\n    ]}}}\n    row = build_player_identity_coverage_truth(_identity_map(), datasets, _evidence())["sources"]["fotmob"]\n    assert row["observed_unmapped_player_count"] == 1\n    assert row["player_identity_health"] == "RED"\n    assert row["wave_b_closure_ready"] is False\n\n\ndef test_production_reviewed_limitations_are_native_id_only_and_audited():\n    evidence = load_identity_evidence_config()\n    limitations = evidence["reviewed_provider_limitations"]\n    assert limitations["policy"] == "EXPLICIT_NATIVE_ID_ALLOWLIST_ONLY"\n    assert limitations["classification"] == "NOT_APPLICABLE"\n    assert len(limitations["sources"]["fotmob"]["source_native_ids"]) == 34\n    assert limitations["sources"]["understat"]["source_native_ids"] == [15045]\n    assert limitations["sources"]["statmuse"]["source_native_ids"] == [703]\n    for source in limitations["sources"].values():\n        assert source["review_status"] == "REVIEWED_PROVIDER_LIMITATION"\n        assert source["review_reference"] == "github-actions:run/34765558511"\n        assert source["name_matching_used"] is False\n        assert source["fuzzy_matching_used"] is False\n        assert "name" not in source and "player_name" not in source and "display_name" not in source\n''',encoding='utf-8')
          PY
      - name: Run focused Wave B regression
        run: |
          python -m pytest -q \
            tests/test_data_platform_identity_wave_b_gap_semantics.py \
            tests/test_data_platform_identity_wave_b_provider_limitations.py \
            tests/test_data_platform_identity_fotmob_inventory_guard.py \
            tests/test_data_platform_identity_wave_b_promoted_crosswalk.py \
            tests/test_data_platform_identity_wave_b_understat_secondary.py \
            tests/test_data_platform_verified_player_crosswalk_materialized.py
      - name: Run full V6 contract tests
        run: python -m pytest -q tests/test_data_platform_*.py
      - name: Commit production closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/v6/identity_evidence_sources.json src/runtime_v6/identity_coverage.py tests/test_data_platform_identity_wave_b_gap_semantics.py tests/test_data_platform_identity_wave_b_provider_limitations.py
          git commit -m 'Close Wave B with reviewed provider limitations'
          git push origin HEAD:${GITHUB_REF_NAME}
