name: TEMP V3 Architecture Assessment Apply

on:
  push:
    branches: [codex/v3-architecture-assessment-20260904]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/v3-architecture-assessment-20260904
          fetch-depth: 0
      - name: Apply reviewed V3-only hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          ROOT = Path('.')

          def replace_once(path: str, old: str, new: str) -> None:
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement, found {count}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          def load_json(path: str):
              return json.loads((ROOT / path).read_text(encoding='utf-8'))

          def save_json(path: str, payload) -> None:
              (ROOT / path).write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # R1: keep existing semantics, move true governance thresholds into existing policy owners.
          xmins = load_json('config/intelligence/xmins_v2.json')
          xmins['contract_validation'] = {
              'probability_sum_tolerance': 0.002,
              'expected_minutes_identity_tolerance': 0.2,
          }
          save_json('config/intelligence/xmins_v2.json', xmins)

          projection = load_json('config/intelligence/projection.json')
          projection['validation'] = {
              **(projection.get('validation') or {}),
              'minimum_player_coverage_ratio': 0.95,
          }
          save_json('config/intelligence/projection.json', projection)

          reporting = load_json('config/intelligence/reporting.json')
          reporting['battle_reason_thresholds'] = {
              'xpts_delta': 0.10,
              'xmins_delta': 2.0,
              'start_probability_delta': 0.03,
          }
          save_json('config/intelligence/reporting.json', reporting)

          replace_once(
              'src/engines/framework_health_audit.py',
              'REGISTRIES = {\n',
              'XMINS_CONTRACT_VALIDATION = read_json(CONFIG / "intelligence" / "xmins_v2.json", {}).get("contract_validation") or {}\n'
              'PROJECTION_VALIDATION = read_json(CONFIG / "intelligence" / "projection.json", {}).get("validation") or {}\n'
              'XMINS_PROBABILITY_SUM_TOLERANCE = float(XMINS_CONTRACT_VALIDATION["probability_sum_tolerance"])\n'
              'MINIMUM_PLAYER_COVERAGE_RATIO = float(PROJECTION_VALIDATION["minimum_player_coverage_ratio"])\n\n'
              'REGISTRIES = {\n'
          )
          replace_once('src/engines/framework_health_audit.py', 'ratio >= 0.95', 'ratio >= MINIMUM_PLAYER_COVERAGE_RATIO')
          replace_once('src/engines/framework_health_audit.py', 'abs(total - 1.0) < 0.002', 'abs(total - 1.0) < XMINS_PROBABILITY_SUM_TOLERANCE')

          replace_once('src/engines/framework_health_service.py', 'abs((start + bench + dnp) - 1.0) < 0.002', 'abs((start + bench + dnp) - 1.0) < audit_engine.XMINS_PROBABILITY_SUM_TOLERANCE')

          replace_once(
              'src/engines/p0_framework_health_overlay.py',
              'from src.utils import DATA, ROOT, atomic_json, read_json\n',
              'from src.utils import DATA, ROOT, atomic_json, read_json\n\n'
              'XMINS_CONTRACT_VALIDATION = read_json(ROOT / "config" / "intelligence" / "xmins_v2.json", {}).get("contract_validation") or {}\n'
              'PROJECTION_VALIDATION = read_json(ROOT / "config" / "intelligence" / "projection.json", {}).get("validation") or {}\n'
              'XMINS_PROBABILITY_SUM_TOLERANCE = float(XMINS_CONTRACT_VALIDATION["probability_sum_tolerance"])\n'
              'MINIMUM_PLAYER_COVERAGE_RATIO = float(PROJECTION_VALIDATION["minimum_player_coverage_ratio"])\n'
          )
          replace_once('src/engines/p0_framework_health_overlay.py', 'abs(probs - 1.0) < 0.002', 'abs(probs - 1.0) < XMINS_PROBABILITY_SUM_TOLERANCE')
          replace_once('src/engines/p0_framework_health_overlay.py', 'coverage >= 0.95', 'coverage >= MINIMUM_PLAYER_COVERAGE_RATIO')

          replace_once(
              'src/engines/p0_decision_quality.py',
              'from typing import Any\n',
              'from typing import Any\n\nfrom src.utils import CONFIG, read_json\n\n'
              'XMINS_CONTRACT_VALIDATION = read_json(CONFIG / "intelligence" / "xmins_v2.json", {}).get("contract_validation") or {}\n'
              'XMINS_PROBABILITY_SUM_TOLERANCE = float(XMINS_CONTRACT_VALIDATION["probability_sum_tolerance"])\n'
              'XMINS_EXPECTED_MINUTES_IDENTITY_TOLERANCE = float(XMINS_CONTRACT_VALIDATION["expected_minutes_identity_tolerance"])\n'
          )
          replace_once('src/engines/p0_decision_quality.py', 'abs(probability_sum - 1.0) > 0.002', 'abs(probability_sum - 1.0) > XMINS_PROBABILITY_SUM_TOLERANCE')
          replace_once('src/engines/p0_decision_quality.py', 'abs(expected - published) > 0.2', 'abs(expected - published) > XMINS_EXPECTED_MINUTES_IDENTITY_TOLERANCE')

          replace_once(
              'src/engines/production_contract_validate.py',
              'assert abs(prob - 1.0) < 0.002',
              'xmins_contract = (load_config("config/intelligence/xmins_v2.json").get("contract_validation") or {})\n'
              '        probability_tolerance = float(xmins_contract["probability_sum_tolerance"])\n'
              '        assert abs(prob - 1.0) < probability_tolerance'
          )

          # Historical anti-hardcode guard must not itself hardcode the historical value.
          replace_once(
              'src/engines/architecture_contract_validate.py',
              'if "margin < 0.75" in lineup_text:',
              'if re.search(r"\\bmargin\\s*(?:<|<=|>|>=)\\s*\\d+(?:\\.\\d+)?\\b", lineup_text):'
          )

          # Reporting thresholds belong to the existing reporting policy, not source literals.
          replace_once(
              'src/engines/report_enrichment.py',
              'from src.utils import DATA, atomic_json, read_json\n',
              'from src.utils import CONFIG, DATA, atomic_json, read_json\n'
          )
          replace_once(
              'src/engines/report_enrichment.py',
              'def _battle_reasons(leader: dict[str, Any], challenger: dict[str, Any]) -> list[str]:\n    reasons: list[str] = []\n',
              'def _battle_reasons(leader: dict[str, Any], challenger: dict[str, Any]) -> list[str]:\n'
              '    thresholds = (read_json(CONFIG / "intelligence" / "reporting.json", {}).get("battle_reason_thresholds") or {})\n'
              '    required = ("xpts_delta", "xmins_delta", "start_probability_delta")\n'
              '    if any(_f(thresholds.get(key), -1.0) <= 0 for key in required):\n'
              '        raise RuntimeError("reporting battle reason thresholds must be positive and config-owned")\n'
              '    reasons: list[str] = []\n'
          )
          replace_once('src/engines/report_enrichment.py', 'if abs(xpts_delta) >= 0.10:', 'if abs(xpts_delta) >= _f(thresholds["xpts_delta"]):')
          replace_once('src/engines/report_enrichment.py', 'if abs(xmins_delta) >= 2.0:', 'if abs(xmins_delta) >= _f(thresholds["xmins_delta"]):')
          replace_once('src/engines/report_enrichment.py', 'if abs(start_delta) >= 0.03:', 'if abs(start_delta) >= _f(thresholds["start_probability_delta"]):')

          # DoD consumes the canonical instant-serving SLO instead of duplicating 1000 ms.
          replace_once(
              'src/runtime_v3/definition_of_done.py',
              '    benchmark_ok, benchmark = _run_json_module("src.runtime_v3.unified_fastpath", "--benchmark")\n'
              '    interactive_ms = benchmark.get("median_ms")\n'
              '    _check(rows, "INTERACTIVE_SERVING_UNDER_1S", benchmark_ok and interactive_ms is not None and float(interactive_ms) < 1000.0, benchmark)\n',
              '    benchmark_ok, benchmark = _run_json_module("src.runtime_v3.unified_fastpath", "--benchmark")\n'
              '    interactive_ms = benchmark.get("median_ms")\n'
              '    slo_registry = read_json(SLO_PATH, {})\n'
              '    instant_slo = ((slo_registry.get("profiles") or {}).get("instant_serving") or {})\n'
              '    instant_ceiling_ms = _finite_number(instant_slo.get("legacy_ceiling_ms"))\n'
              '    interactive_ok = bool(benchmark_ok and interactive_ms is not None and instant_ceiling_ms is not None and float(interactive_ms) < instant_ceiling_ms)\n'
              '    _check(rows, "INTERACTIVE_SERVING_UNDER_1S", interactive_ok, {**benchmark, "configured_ceiling_ms": instant_ceiling_ms})\n'
          )

          # R4: route cross-process JSON writes through the canonical atomic writer.
          replace_once('src/engines/price_radar.py', 'from src.utils import ROOT\n', 'from src.utils import ROOT, atomic_json\n')
          replace_once('src/engines/price_radar.py', 'prices_path.write_text(json.dumps(filtered, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")', 'atomic_json(prices_path, filtered)')
          replace_once('src/engines/price_radar.py', 'trajectory_path.write_text(json.dumps(new_state, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")', 'atomic_json(trajectory_path, new_state)')
          replace_once('src/engines/price_radar.py', 'alerts_path.write_text(json.dumps(alert_payload, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")', 'atomic_json(alerts_path, alert_payload)')
          replace_once('src/engines/price_radar.py', 'latest_path.write_text(json.dumps(latest, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")', 'atomic_json(latest_path, latest)')

          replace_once(
              'src/runtime_v3/measured_command.py',
              'from pathlib import Path\n',
              'from pathlib import Path\n\nfrom src.utils import atomic_json\n'
          )
          replace_once(
              'src/runtime_v3/measured_command.py',
              '    output.parent.mkdir(parents=True, exist_ok=True)\n    output.write_text(json.dumps(payload, ensure_ascii=False, separators=(",", ":")) + "\\n", encoding="utf-8")\n',
              '    atomic_json(output, payload)\n'
          )

          replace_once(
              'src/runtime_v3/package_optimizer_shards.py',
              '        Path(args.output).parent.mkdir(parents=True, exist_ok=True)\n        Path(args.output).write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")\n',
              '        atomic_json(Path(args.output), result)\n'
          )
          replace_once(
              'src/runtime_v3/package_optimizer_shards.py',
              '        output.parent.mkdir(parents=True, exist_ok=True)\n        output.write_text(json.dumps(result, ensure_ascii=False, separators=(",", ":")) + "\\n", encoding="utf-8")\n',
              '        atomic_json(output, result)\n'
          )

          replace_once('src/runtime_v3/registry_compiler.py', 'from src.utils import ROOT\n', 'from src.utils import ROOT, atomic_json\n')
          replace_once(
              'src/runtime_v3/registry_compiler.py',
              '        output.parent.mkdir(parents=True, exist_ok=True)\n        output.write_text(json.dumps(plan, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")\n',
              '        atomic_json(output, plan)\n'
          )

          # Permanent regression guard for this assessment. No intentionally failing probe remains.
          test_path = ROOT / 'tests' / 'test_architecture_assessment_hardening.py'
          test_path.write_text('''from __future__ import annotations\n\nimport json\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\n\n\ndef _json(path: str):\n    return json.loads((ROOT / path).read_text(encoding="utf-8"))\n\n\ndef test_assessment_thresholds_are_owned_by_existing_policies() -> None:\n    xmins = _json("config/intelligence/xmins_v2.json")["contract_validation"]\n    projection = _json("config/intelligence/projection.json")["validation"]\n    reporting = _json("config/intelligence/reporting.json")["battle_reason_thresholds"]\n    assert xmins == {"probability_sum_tolerance": 0.002, "expected_minutes_identity_tolerance": 0.2}\n    assert projection["minimum_player_coverage_ratio"] == 0.95\n    assert reporting == {"xpts_delta": 0.10, "xmins_delta": 2.0, "start_probability_delta": 0.03}\n\n\ndef test_assessment_removes_reviewed_source_threshold_literals() -> None:\n    sources = {\n        "src/engines/framework_health_audit.py": ("ratio >= 0.95", "abs(total - 1.0) < 0.002"),\n        "src/engines/framework_health_service.py": ("abs((start + bench + dnp) - 1.0) < 0.002",),\n        "src/engines/p0_framework_health_overlay.py": ("abs(probs - 1.0) < 0.002", "coverage >= 0.95"),\n        "src/engines/p0_decision_quality.py": ("abs(probability_sum - 1.0) > 0.002", "abs(expected - published) > 0.2"),\n        "src/engines/report_enrichment.py": ("abs(xpts_delta) >= 0.10", "abs(xmins_delta) >= 2.0", "abs(start_delta) >= 0.03"),\n        "src/runtime_v3/definition_of_done.py": ("float(interactive_ms) < 1000.0",),\n    }\n    for path, forbidden in sources.items():\n        text = (ROOT / path).read_text(encoding="utf-8")\n        for literal in forbidden:\n            assert literal not in text, f"{path} still hardcodes {literal}"\n\n\ndef test_assessment_reviewed_json_writers_are_atomic() -> None:\n    source_paths = [\n        "src/engines/price_radar.py",\n        "src/runtime_v3/measured_command.py",\n        "src/runtime_v3/package_optimizer_shards.py",\n        "src/runtime_v3/registry_compiler.py",\n    ]\n    for path in source_paths:\n        text = (ROOT / path).read_text(encoding="utf-8")\n        assert "atomic_json" in text\n        assert ".write_text(json.dumps(" not in text\n\n\ndef test_sharded_official_snapshot_boundary_remains_fail_closed() -> None:\n    workflow = (ROOT / ".github" / "workflows" / "v3-package-precompute.yml").read_text(encoding="utf-8")\n    registry = _json("config/v3_service_registry.json")\n    official = next(row for row in registry["services"] if row["service_id"] == "official_snapshot")\n    assert official["ephemeral_artifacts"] == ["official_snapshot.json"]\n    assert "data/official_snapshot.retry.json" in workflow\n    assert "cmp -s data/official_snapshot.json data/official_snapshot.retry.json" in workflow\n''', encoding='utf-8')

          (ROOT / 'tests' / 'test_v3_architecture_assessment_probe.py').unlink(missing_ok=True)
          (ROOT / '.github' / 'workflows' / 'v3-architecture-assessment-apply-temp.yml').unlink(missing_ok=True)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V3: harden config ownership and atomic artifact writes"
          git push origin HEAD:codex/v3-architecture-assessment-20260904
