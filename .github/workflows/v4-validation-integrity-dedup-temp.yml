name: V4 temporary validation integrity dedup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v4-validation-integrity-dedup-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/v4-final-yellow-closeout-20260901
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Apply single-pass reconciliation integrity verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          store = Path('src/engines/v4_backtest_store.py')
          text = store.read_text()
          old = '''def refresh_eligible_view(model_version: str | None) -> dict:\n    RECDIR.mkdir(parents=True, exist_ok=True)\n    for path in RECDIR.glob("gw*.json"):\n        path.unlink()\n    eligible: list[int] = []\n    rejected: list[dict] = []\n    if ARCHIVE_RECDIR.exists():\n        for path in sorted(ARCHIVE_RECDIR.glob("gw*.json")):\n            sample = read_json(path, {})\n            ok, reason = reconciled_integrity(sample, model_version=model_version)\n            if not ok:\n                rejected.append({"file": path.name, "reason": reason})\n                continue\n            gw = int(sample.get("gw"))\n            atomic_json(eligible_reconciled_path(gw), sample)\n            eligible.append(gw)\n    return {\n        "model_version": model_version,\n        "eligible_samples": len(eligible),\n        "eligible_gws": eligible,\n        "rejected_samples": rejected,\n        "archive_is_append_only": True,\n        "health_view_rebuilt": True,\n    }\n'''
          new = '''def refresh_eligible_view(model_version: str | None) -> dict:\n    RECDIR.mkdir(parents=True, exist_ok=True)\n    for path in RECDIR.glob("gw*.json"):\n        path.unlink()\n    eligible: list[int] = []\n    integrity_checked: list[int] = []\n    rejected: list[dict] = []\n    if ARCHIVE_RECDIR.exists():\n        for path in sorted(ARCHIVE_RECDIR.glob("gw*.json")):\n            sample = read_json(path, {})\n            # Full immutable-source integrity is the expensive check because legacy\n            # deadline snapshots can be tens of MB. Perform it once per archive row,\n            # then apply the model-version eligibility filter without rereading the\n            # source snapshot. This preserves both integrity and current-model rules.\n            ok, reason = reconciled_integrity(sample)\n            if not ok:\n                rejected.append({"file": path.name, "reason": reason})\n                continue\n            gw = int(sample.get("gw"))\n            integrity_checked.append(gw)\n            if model_version and sample.get("model_version") != model_version:\n                rejected.append({"file": path.name, "reason": "model_version_mismatch"})\n                continue\n            atomic_json(eligible_reconciled_path(gw), sample)\n            eligible.append(gw)\n    return {\n        "model_version": model_version,\n        "eligible_samples": len(eligible),\n        "eligible_gws": eligible,\n        "integrity_checked_gws": integrity_checked,\n        "rejected_samples": rejected,\n        "archive_is_append_only": True,\n        "health_view_rebuilt": True,\n        "single_pass_source_integrity": True,\n    }\n'''
          if old not in text:
              raise SystemExit('refresh_eligible_view anchor not found')
          store.write_text(text.replace(old, new, 1))

          lifecycle = Path('src/engines/v4_validation_cycle.py')
          text = lifecycle.read_text()
          old_sig = 'def reconcile_latest_finished(raw: dict | None = None, now: datetime | None = None) -> dict:\n'
          new_sig = 'def reconcile_latest_finished(raw: dict | None = None, now: datetime | None = None, *, defer_existing_integrity: bool = False) -> dict:\n'
          if old_sig not in text:
              raise SystemExit('reconcile signature anchor not found')
          text = text.replace(old_sig, new_sig, 1)
          old_existing = '''    archive_path = reconciled_path(int(gw))\n    if archive_path.exists():\n        result = reconcile_finished_gw(int(gw), {}, now=now)\n        metrics = ((result or {}).get("report") or {}).get("metrics") or {}\n        return {"status": "PASS", "action": "PRESERVED", "gw": int(gw), "metrics": metrics, "model_version": (result or {}).get("model_version")}\n'''
          new_existing = '''    archive_path = reconciled_path(int(gw))\n    if archive_path.exists():\n        if defer_existing_integrity:\n            # Consolidated cycle defers the expensive immutable-source check to the\n            # eligibility rebuild later in the same fail-closed cycle. Standalone\n            # reconciliation callers keep the original immediate verification.\n            result = read_json(archive_path, None)\n            if not result:\n                raise RuntimeError("existing reconciliation archive is unreadable")\n            if result.get("kind") != "post_gw_reconciliation" or int(result.get("gw") or -1) != int(gw):\n                raise RuntimeError("existing reconciliation archive identity mismatch")\n        else:\n            result = reconcile_finished_gw(int(gw), {}, now=now)\n        metrics = ((result or {}).get("report") or {}).get("metrics") or {}\n        return {\n            "status": "PASS",\n            "action": "PRESERVED",\n            "gw": int(gw),\n            "metrics": metrics,\n            "model_version": (result or {}).get("model_version"),\n            "integrity_deferred_to_eligibility": bool(defer_existing_integrity),\n        }\n'''
          if old_existing not in text:
              raise SystemExit('existing reconciliation anchor not found')
          text = text.replace(old_existing, new_existing, 1)
          old_cycle = '''        reconciliation = reconcile_latest_finished(raw, now=now)\n        snapshot = snapshot_current(raw, predictions, now=now)\n        eligibility = refresh_eligible_view(predictions.get("model_version"))\n'''
          new_cycle = '''        reconciliation = reconcile_latest_finished(raw, now=now, defer_existing_integrity=True)\n        snapshot = snapshot_current(raw, predictions, now=now)\n        eligibility = refresh_eligible_view(predictions.get("model_version"))\n        if reconciliation.get("integrity_deferred_to_eligibility"):\n            reconciliation_gw = int(reconciliation.get("gw") or -1)\n            integrity_checked = {int(value) for value in (eligibility.get("integrity_checked_gws") or [])}\n            if reconciliation_gw not in integrity_checked:\n                raise RuntimeError(\n                    f"deferred reconciliation integrity was not proven for GW{reconciliation_gw}"\n                )\n            reconciliation["integrity_verified_by_eligibility_rebuild"] = True\n'''
          if old_cycle not in text:
              raise SystemExit('cycle reconciliation anchor not found')
          lifecycle.write_text(text.replace(old_cycle, new_cycle, 1))

          test = Path('tests/test_v4_validation_integrity_dedup.py')
          test.write_text('''from __future__ import annotations\n\nimport pytest\n\nfrom src.engines import v4_validation_cycle as lifecycle\n\n\ndef test_existing_reconciliation_can_defer_duplicate_integrity(monkeypatch, tmp_path):\n    archive = tmp_path / "gw02.json"\n    archive.write_text("{}")\n    sample = {\n        "kind": "post_gw_reconciliation",\n        "gw": 2,\n        "model_version": "m",\n        "report": {"metrics": {"status": "PASS", "n": 1}},\n    }\n    monkeypatch.setattr(lifecycle, "reconciled_path", lambda gw: archive)\n    monkeypatch.setattr(lifecycle, "read_json", lambda path, default=None: sample if path == archive else default)\n\n    def forbidden(*args, **kwargs):\n        raise AssertionError("duplicate reconciliation integrity check must be deferred")\n\n    monkeypatch.setattr(lifecycle, "reconcile_finished_gw", forbidden)\n    result = lifecycle.reconcile_latest_finished(\n        {"phase": {"last_finished_gw": 2}}, defer_existing_integrity=True\n    )\n    assert result["status"] == "PASS"\n    assert result["action"] == "PRESERVED"\n    assert result["integrity_deferred_to_eligibility"] is True\n\n\ndef test_cycle_fails_closed_when_deferred_integrity_not_proven(monkeypatch):\n    raw = {"schema": "snapshot.v1", "phase": {}}\n    predictions = {"model_version": "m", "players": [{"element": 1}]}\n    monkeypatch.setattr(lifecycle, "capture_submitted_state", lambda *a, **k: {"status": "SKIP"})\n    monkeypatch.setattr(\n        lifecycle,\n        "reconcile_latest_finished",\n        lambda *a, **k: {\n            "status": "PASS",\n            "action": "PRESERVED",\n            "gw": 2,\n            "integrity_deferred_to_eligibility": True,\n        },\n    )\n    monkeypatch.setattr(lifecycle, "snapshot_current", lambda *a, **k: {"status": "PASS"})\n    monkeypatch.setattr(\n        lifecycle,\n        "refresh_eligible_view",\n        lambda *a, **k: {"eligible_samples": 0, "eligible_gws": [], "integrity_checked_gws": []},\n    )\n    monkeypatch.setattr(lifecycle, "atomic_json", lambda *a, **k: None)\n    with pytest.raises(RuntimeError, match="deferred reconciliation integrity was not proven"):\n        lifecycle.cycle(raw=raw, predictions=predictions)\n\n\ndef test_cycle_accepts_deferred_integrity_after_single_pass_proof(monkeypatch):\n    raw = {"schema": "snapshot.v1", "phase": {}}\n    predictions = {"model_version": "m", "players": [{"element": 1}]}\n    monkeypatch.setattr(lifecycle, "capture_submitted_state", lambda *a, **k: {"status": "SKIP"})\n    monkeypatch.setattr(\n        lifecycle,\n        "reconcile_latest_finished",\n        lambda *a, **k: {\n            "status": "PASS",\n            "action": "PRESERVED",\n            "gw": 2,\n            "integrity_deferred_to_eligibility": True,\n        },\n    )\n    monkeypatch.setattr(lifecycle, "snapshot_current", lambda *a, **k: {"status": "PASS"})\n    monkeypatch.setattr(\n        lifecycle,\n        "refresh_eligible_view",\n        lambda *a, **k: {"eligible_samples": 0, "eligible_gws": [], "integrity_checked_gws": [2]},\n    )\n    monkeypatch.setattr(lifecycle, "atomic_json", lambda *a, **k: None)\n    out = lifecycle.cycle(raw=raw, predictions=predictions)\n    assert out["status"] == "PASS"\n    assert out["reconciliation"]["integrity_verified_by_eligibility_rebuild"] is True\n''')
          PY
      - name: Rebuild governed architecture attestation
        run: python tools/v4_architecture_guard_attest.py
      - name: Install test dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Verify focused and full deterministic suite
        run: |
          python -m pytest -q tests/test_v4_validation_integrity_dedup.py
          python -m pytest -q
      - name: Commit validated dedup to V4 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/engines/v4_backtest_store.py src/engines/v4_validation_cycle.py tests/test_v4_validation_integrity_dedup.py config/architecture_guard_attestation.json
          git diff --cached --exit-code && exit 0 || true
          git commit -m 'perf(v4): deduplicate reconciliation source integrity checks'
          git push origin HEAD:codex/v4-final-yellow-closeout-20260901
