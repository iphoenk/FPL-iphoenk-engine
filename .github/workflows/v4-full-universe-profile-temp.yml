name: V4 temporary full-universe cold profiler

on:
  push:
    branches:
      - codex/v4-full-universe-tactical-20260903
    paths:
      - .github/workflows/v4-full-universe-profile-temp.yml

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/v4-full-universe-tactical-20260903
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install --disable-pip-version-check -r requirements.txt
      - name: Profile cold optimization
        run: |
          set +e
          python -m cProfile -o /tmp/v4-full-universe.prof -m src.services.optimization_slo_service
          rc=$?
          set -e
          python - <<'PY'
          import pstats
          p = pstats.Stats('/tmp/v4-full-universe.prof')
          p.strip_dirs().sort_stats('cumtime').print_stats(45)
          p.sort_stats('tottime').print_stats(45)
          PY
          echo "optimization_exit_code=$rc"
          exit 0
