name: V4.9.7 comparator one-shot migration

on:
  push:
    branches:
      - codex/v4.9.7-challenger-comparator

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v4.9.7-challenger-comparator
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic comparator migration
        run: python tools/v497_apply_challenger_comparator.py
      - name: Commit migration if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/challenger_comparator.json config/service_registry.json config/service_contract_registry.json config/architecture_ownership_registry.json src/services/challenger_comparator_service.py README.md
          git commit -m "feat(v4): wire challenger comparator microservice"
          git push origin HEAD:codex/v4.9.7-challenger-comparator
