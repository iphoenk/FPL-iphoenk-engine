name: FPL V6 hourly fresh-data acquisition

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Governed V6 invocation mode"
        required: true
        default: "master_orchestrated"
        type: choice
        options:
          - master_orchestrated
          - manual_recovery
          - report_prefetch
      reason:
        description: "Audit reason for governed V6 invocation"
        required: true
        type: string
      confirm:
        description: "For manual_recovery only: type RECOVER_V6"
        required: false
        type: string
      report_kind:
        description: "For report_prefetch: full_master, match_mode, deadline_review, ad_hoc, historical_backfill, or 05:30_price"
        required: false
        type: string
      logical_slot:
        description: "Timezone-aware ISO-8601 logical slot for governed report prefetch"
        required: false
        type: string
      scope:
        description: "For ad_hoc or historical_backfill scope"
        required: false
        type: string
      gw_from:
        description: "For historical_backfill: first completed GW, inclusive"
        required: false
        type: string
      gw_to:
        description: "For historical_backfill: last completed GW, inclusive"
        required: false
        type: string
      force:
        description: "Governed force retry for report_prefetch"
        required: false
        default: false
        type: boolean
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: fpl-v6-hourly-data-ingestion
  cancel-in-progress: false

env:
  RUNTIME_BRANCH: runtime-data-v6
  V6_SCHEDULE_POLICY: config/v6/schedule_policy.json

jobs:
  collect:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.number == 431 &&
        github.actor == github.repository_owner &&
        (
          startsWith(github.event.comment.body, '/v6-master-acquire') ||
          startsWith(github.event.comment.body, '/v6-report-prefetch')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.slot_guard.outputs.skip }}
      schedule_kind: ${{ steps.scheduler.outputs.kind }}
    env:
      V6_PREVIOUS_MANIFEST: /tmp/v6-previous-manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Authorize governed workflow dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          V6_DISPATCH_MODE: ${{ inputs.mode }}
          V6_DISPATCH_REASON: ${{ inputs.reason }}
          V6_MANUAL_CONFIRM: ${{ inputs.confirm }}
        run: python -m src.runtime_v6.workflow_control authorize-dispatch

      - name: Authorize governed issue command
        if: github.event_name == 'issue_comment'
        env:
          V6_COMMENT_BODY: ${{ github.event.comment.body }}
          V6_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python -m src.runtime_v6.workflow_control authorize-issue

      - name: Hydrate previous V6 last-good snapshot fail-closed
        shell: bash
        run: |
          set -euo pipefail
          rm -rf data/v6
          mkdir -p data
          if ! git fetch --depth=1 origin "+refs/heads/${RUNTIME_BRANCH}:refs/remotes/origin/${RUNTIME_BRANCH}"; then
            echo "::error::Unable to fetch ${RUNTIME_BRANCH}; refusing empty-tree acquisition"
            exit 1
          fi
          if ! git cat-file -e "origin/${RUNTIME_BRANCH}:data/v6/manifest.json" 2>/dev/null; then
            echo "::error::${RUNTIME_BRANCH} has no last-good data/v6/manifest.json; refusing empty-tree acquisition"
            exit 1
          fi
          git archive "origin/${RUNTIME_BRANCH}" data/v6 | tar -x -C .
          test -s data/v6/manifest.json
          cp data/v6/manifest.json "${V6_PREVIOUS_MANIFEST}"
          echo "Hydrated previous runtime-data-v6 snapshot"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-v6.lock

      - name: Classify scheduler invocation
        id: scheduler
        run: python -m src.runtime_v6.workflow_control classify

      - name: Guard already-published logical scheduler slot
        id: slot_guard
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from src.runtime_v6.registry import load_registry
          from src.runtime_v6.runtime_control import scheduled_slot_already_completed

          if os.environ.get("V6_SCHEDULE_KIND") == "report_prefetch":
              skip = False
          else:
              previous_path = Path(os.environ["V6_PREVIOUS_MANIFEST"])
              previous = json.loads(previous_path.read_text(encoding="utf-8")) if previous_path.exists() else {}
              registry = load_registry()
              interval = int((registry.get("cadence") or {}).get("scheduler_interval_minutes") or 60)
              skip = scheduled_slot_already_completed(
                  previous,
                  scheduler_interval_minutes=interval,
                  event_name=os.environ.get("GITHUB_EVENT_NAME"),
                  schedule_kind=os.environ.get("V6_SCHEDULE_KIND"),
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"skip={'true' if skip else 'false'}\n")
          print(f"logical scheduler slot already published: {skip}")
          PY

      - name: Install V6 locked runtime dependencies
        if: steps.slot_guard.outputs.skip != 'true'
        run: python -m pip install --require-hashes -r requirements-v6.lock

      - name: Validate V6 production preflight
        if: steps.slot_guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src/runtime_v6
          python -m src.runtime_v6.architecture_independence_validate
          python - <<'PY'
          from src.runtime_v6.registry import dependency_layers, load_registry
          registry = load_registry()
          assert registry["engine"] == "V6_FRESH_DATA_PLATFORM"
          assert registry["policy"]["data_only"] is True
          assert registry["policy"]["decision_authority"] == "NONE"
          assert registry["policy"]["prediction_authority"] == "NONE"
          assert registry["policy"]["optimizer_authority"] == "NONE"
          assert registry["override_lifecycle"]["role"] == "TEMPORARY_REPAIR_ONLY"
          assert registry["override_lifecycle"]["inactive_source_overrides"] == []
          assert dependency_layers(registry)
          print({
              "active_sources": registry["activation"]["active_source_count"],
              "active_overrides": registry["override_lifecycle"]["active_override_count"],
              "dependency_layers": dependency_layers(registry),
          })
          PY

      - name: Resolve governed V6 report-prefetch request
        if: steps.slot_guard.outputs.skip != 'true' && steps.scheduler.outputs.kind == 'report_prefetch'
        env:
          V6_DISPATCH_REPORT_KIND: ${{ inputs.report_kind }}
          V6_DISPATCH_LOGICAL_SLOT: ${{ inputs.logical_slot }}
          V6_DISPATCH_SCOPE: ${{ inputs.scope }}
          V6_DISPATCH_GW_FROM: ${{ inputs.gw_from }}
          V6_DISPATCH_GW_TO: ${{ inputs.gw_to }}
          V6_DISPATCH_FORCE: ${{ inputs.force }}
          V6_COMMENT_BODY: ${{ github.event.comment.body }}
        run: python -m src.runtime_v6.workflow_control resolve-prefetch

      - name: Run active V6 acquisition cycle
        if: steps.slot_guard.outputs.skip != 'true' && steps.scheduler.outputs.kind != 'report_prefetch'
        run: python -m src.runtime_v6.collector

      - name: Apply V6 scheduler and missed-cycle health
        if: steps.slot_guard.outputs.skip != 'true' && steps.scheduler.outputs.kind != 'report_prefetch'
        run: python -m src.runtime_v6.runtime_control

      - name: Run report-driven V6 personal and mini-league prefetch
        if: steps.slot_guard.outputs.skip != 'true' && steps.scheduler.outputs.kind == 'report_prefetch'
        shell: bash
        env:
          FPL_AUTH_MODE: ${{ vars.FPL_AUTH_MODE || 'disabled' }}
          FPL_SESSION_B64: ${{ secrets.FPL_SESSION_B64 }}
          FPL_ACCESS_TOKEN: ${{ secrets.FPL_ACCESS_TOKEN }}
          FPL_TEAM_ID: ${{ vars.FPL_TEAM_ID }}
          FPL_PRIORITY_LEAGUES: ${{ vars.FPL_PRIORITY_LEAGUES }}
        run: |
          set -euo pipefail
          if [[ "$V6_PREFETCH_REPORT_KIND" == "historical_backfill" ]]; then
            args=(--gw-from "$V6_PREFETCH_GW_FROM" --gw-to "$V6_PREFETCH_GW_TO" --requested-by "FPL_MASTER_MONITOR")
            [[ "$V6_PREFETCH_FORCE" == "true" ]] && args+=(--force)
            set +e
            python -m src.runtime_v6.historical_backfill "${args[@]}"
            rc=$?
            set -e
          else
            args=(
              --report-kind "$V6_PREFETCH_REPORT_KIND"
              --logical-slot "$V6_PREFETCH_LOGICAL_SLOT"
              --requested-by "FPL_MASTER_MONITOR"
              --requested-for-report "$V6_PREFETCH_REPORT_KIND"
            )
            [[ "$V6_PREFETCH_PERSONAL" == "true" ]] && args+=(--personal)
            [[ "$V6_PREFETCH_MINI_LEAGUE" == "true" ]] && args+=(--mini-league)
            [[ "$V6_PREFETCH_LIVE" == "true" ]] && args+=(--live)
            [[ "$V6_PREFETCH_FORCE" == "true" ]] && args+=(--force)
            set +e
            python -m src.runtime_v6.report_prefetch "${args[@]}"
            rc=$?
            set -e
          fi
          if [[ $rc -ne 0 && $rc -ne 3 ]]; then
            exit "$rc"
          fi
          echo "V6 report-prefetch process exit=$rc; published health truth controls completeness"

      - name: Apply V6 report-prefetch runtime control
        if: steps.slot_guard.outputs.skip != 'true' && steps.scheduler.outputs.kind == 'report_prefetch'
        run: python -m src.runtime_v6.runtime_control

      - name: Validate V6 publish-tree integrity
        if: steps.slot_guard.outputs.skip != 'true'
        run: python -m src.runtime_v6.publish_integrity

      - name: Validate publishable V6 manifest
        if: steps.slot_guard.outputs.skip != 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from src.runtime_v6.registry import load_registry

          root = Path("data/v6")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          integrity = json.loads((root / "health" / "publish_integrity.json").read_text(encoding="utf-8"))
          identity = json.loads((root / "evidence" / "player_identity_map.json").read_text(encoding="utf-8"))
          registry = load_registry()
          control = manifest["runtime_control"]
          event_name = os.environ["GITHUB_EVENT_NAME"]
          schedule_kind = os.environ["V6_SCHEDULE_KIND"]

          assert manifest["source_count"] == registry["activation"]["active_source_count"]
          assert manifest["activation"]["required_active_sources"] == registry["activation"]["required_active_sources"]
          assert registry["override_lifecycle"]["inactive_source_overrides"] == []
          assert manifest["governance"]["data_only"] is True
          assert manifest["governance"]["decision_authority"] == "NONE"
          assert manifest["governance"]["weather_direct_xpts_multiplier"] is False
          assert manifest["governance"]["production_authoritative_snapshots_require_schedule"] is False
          assert manifest["governance"]["production_authoritative_snapshots_require_governed_trigger"] is True
          assert manifest["governance"]["master_orchestrated_is_authoritative"] is True
          assert manifest["governance"]["report_prefetch_is_authoritative"] is True
          assert manifest["governance"]["report_prefetch_completes_core_operational_slot"] is False
          assert manifest["governance"]["manual_recovery_is_authoritative"] is False
          assert manifest["governance"]["single_logical_acquisition_per_scheduler_slot"] is True
          assert manifest["governance"]["publish_integrity_required"] is True
          assert manifest["governance"]["identity_mapping_is_deterministic_only"] is True
          assert manifest["governance"]["fuzzy_identity_matching"] is False
          assert identity["governance"]["fuzzy_name_matching_allowed"] is False
          assert integrity["status"] == "PASS", integrity
          assert integrity["current_source_files_exact"] is True
          assert integrity["resolved_registry_exact"] is True
          assert integrity["identity_map_consistent"] is True
          assert control["event_name"] == event_name
          assert control["schedule_kind"] == schedule_kind

          if schedule_kind == "report_prefetch":
              assert control["authoritative_runtime_snapshot"] is True
              assert control["report_prefetch"] is True
              assert control["counts_as_completed_report_slot"] is True
              assert control["counts_as_completed_operational_slot"] is False
              report_kind = os.environ["V6_PREFETCH_REPORT_KIND"]
              if report_kind == "historical_backfill":
                  history = json.loads((root / "health" / "historical_backfill.json").read_text(encoding="utf-8"))
                  assert history["report_kind"] == "historical_backfill"
                  assert history["scope"] == "mini_league"
                  assert history["gw_from"] == int(os.environ["V6_PREFETCH_GW_FROM"])
                  assert history["gw_to"] == int(os.environ["V6_PREFETCH_GW_TO"])
                  assert history["cohort_semantics"] == "CURRENT_COHORT_HISTORY"
                  assert history["governance"]["data_only"] is True
                  assert history["governance"]["decision_authority"] == "NONE"
                  assert history["governance"]["prediction_authority"] == "NONE"
                  assert history["governance"]["optimizer_authority"] == "NONE"
                  assert history["governance"]["bayesian_authority"] == "NONE"
                  assert history["governance"]["monte_carlo_authority"] == "NONE"
                  assert history["overall_status"] in {"GREEN", "AMBER"}
              else:
                  prefetch = json.loads((root / "report_prefetch" / "latest.json").read_text(encoding="utf-8"))
                  health = json.loads((root / "health" / "report_prefetch.json").read_text(encoding="utf-8"))
                  assert prefetch["report_kind"] == report_kind
                  assert prefetch["target_logical_report_slot"] == os.environ["V6_PREFETCH_LOGICAL_SLOT"]
                  assert prefetch["governance"]["data_only"] is True
                  assert prefetch["governance"]["decision_authority"] == "NONE"
                  assert prefetch["governance"]["prediction_authority"] == "NONE"
                  assert prefetch["governance"]["optimizer_authority"] == "NONE"
                  assert prefetch["governance"]["independent_prefetch_cron"] is False
                  assert health["fresh_for_target_report"] == prefetch["fresh_for_target_report"]
                  if report_kind == "05:30_price":
                      assert prefetch["telemetry"]["request_count"] == 0
          elif event_name == "issue_comment" and schedule_kind == "chatgpt_scheduler":
              requested = datetime.fromisoformat(os.environ["V6_MASTER_LOGICAL_SLOT"]).astimezone(timezone.utc)
              assert control["chatgpt_scheduler"] is True
              assert control["chatgpt_scheduler_proof"] is True
              assert control["scheduled_cycle"] is True
              assert control["master_orchestrated"] is True
              assert control["authoritative_runtime_snapshot"] is True
              assert control["counts_as_completed_operational_slot"] is True
              assert control["logical_slot_source"] == "CHATGPT_COMMAND"
              assert control["expected_cycle_at"] == requested.isoformat()
              assert manifest["governance"]["production_ingestion_schedule_only"] is False
              assert manifest["governance"]["chatgpt_scheduler_is_authority"] is True
          elif event_name == "workflow_dispatch" and schedule_kind == "master_orchestrated":
              assert control["scheduled_cycle"] is False
              assert control["master_orchestrated"] is True
              assert control["authoritative_runtime_snapshot"] is True
              assert control["counts_as_completed_operational_slot"] is True
              assert control["manual_recovery"] is False
              assert "NON_AUTHORITATIVE_MANUAL_RECOVERY" not in manifest["control_failures"]
          elif event_name == "workflow_dispatch" and schedule_kind == "manual_recovery":
              assert control["scheduled_cycle"] is False
              assert control["authoritative_runtime_snapshot"] is False
              assert control["counts_as_completed_operational_slot"] is False
              assert control["manual_recovery"] is True
              assert "NON_AUTHORITATIVE_MANUAL_RECOVERY" in manifest["control_failures"]
          else:
              raise AssertionError(f"unexpected V6 production event: {event_name}/{schedule_kind}")
          print(json.dumps({"overall": manifest["overall"], "runtime_control": control, "publish_integrity": integrity}, indent=2))
          PY

      - name: Package verified runtime snapshot
        if: steps.slot_guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tar -C "$GITHUB_WORKSPACE" -cf "$RUNNER_TEMP/v6-runtime-data.tar" data/v6

      - name: Transfer verified runtime snapshot to isolated publisher
        if: steps.slot_guard.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v6-runtime-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v6-runtime-data.tar
          retention-days: 14
          if-no-files-found: error

  publish:
    needs: collect
    if: needs.collect.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: v6-runtime-publisher
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require dedicated V6 publisher app configuration
        shell: bash
        env:
          V6_RUNTIME_APP_ID: ${{ vars.V6_RUNTIME_APP_ID }}
          V6_RUNTIME_APP_PRIVATE_KEY: ${{ secrets.V6_RUNTIME_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$V6_RUNTIME_APP_ID"
          test -n "$V6_RUNTIME_APP_PRIVATE_KEY"
          echo "Dedicated V6 publisher app configuration present"

      - name: Mint governed V6 runtime publisher token
        id: runtime_app_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.V6_RUNTIME_APP_ID }}
          private-key: ${{ secrets.V6_RUNTIME_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: FPL-iphoenk-engine
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          token: ${{ steps.runtime_app_token.outputs.token }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Download verified runtime snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: v6-runtime-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v6-runtime-publication

      - name: Revalidate transferred runtime snapshot
        shell: bash
        env:
          V6_EXPECTED_SCHEDULE_KIND: ${{ needs.collect.outputs.schedule_kind }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/v6-publication-check"
          mkdir -p "$RUNNER_TEMP/v6-publication-check"
          tar -xf "$RUNNER_TEMP/v6-runtime-publication/v6-runtime-data.tar" -C "$RUNNER_TEMP/v6-publication-check"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "v6-publication-check" / "data" / "v6"
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          integrity = json.loads((root / "health" / "publish_integrity.json").read_text(encoding="utf-8"))
          control = manifest["runtime_control"]
          assert manifest["governance"]["data_only"] is True
          assert manifest["governance"]["decision_authority"] == "NONE"
          assert manifest["governance"]["prediction_authority"] == "NONE"
          assert manifest["governance"]["optimizer_authority"] == "NONE"
          assert manifest["governance"]["production_authoritative_snapshots_require_schedule"] is False
          assert manifest["governance"]["production_authoritative_snapshots_require_governed_trigger"] is True
          assert manifest["governance"]["manual_recovery_is_authoritative"] is False
          assert control["schedule_kind"] == os.environ["V6_EXPECTED_SCHEDULE_KIND"]
          if control["schedule_kind"] == "chatgpt_scheduler":
              assert control["chatgpt_scheduler_proof"] is True
              assert control["logical_slot_source"] == "CHATGPT_COMMAND"
          if control["schedule_kind"] == "report_prefetch":
              assert control["authoritative_runtime_snapshot"] is True
              assert control["counts_as_completed_operational_slot"] is False
          assert integrity["status"] == "PASS", integrity
          assert integrity["resolved_registry_exact"] is True
          print({"overall": manifest["overall"], "schedule_kind": control["schedule_kind"], "tree_sha256": integrity.get("tree_sha256")})
          PY

      - name: Capture runtime branch lease
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "+refs/heads/${RUNTIME_BRANCH}:refs/remotes/origin/${RUNTIME_BRANCH}"
          runtime_base="$(git rev-parse "refs/remotes/origin/${RUNTIME_BRANCH}")"
          echo "RUNTIME_BASE_SHA=$runtime_base" >> "$GITHUB_ENV"

      - name: Publish atomic V6 runtime snapshot
        shell: bash
        env:
          PUBLISH_TOKEN: ${{ steps.runtime_app_token.outputs.token }}
        run: |
          set -euo pipefail
          publish_tree="$RUNNER_TEMP/v6-runtime-worktree"
          rm -rf "$publish_tree"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add --detach "$publish_tree" "$GITHUB_SHA"
          cd "$publish_tree"
          git checkout --orphan runtime-snapshot
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xf "$RUNNER_TEMP/v6-runtime-publication/v6-runtime-data.tar"
          git add -f data/v6
          git commit -m "data(v6): atomic hourly snapshot ${{ github.run_id }} [${{ needs.collect.outputs.schedule_kind }}] [dedicated_v6_github_app]"
          published_sha="$(git rev-parse HEAD)"
          basic_auth="$(printf 'x-access-token:%s' "$PUBLISH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic_auth" push \
            --force-with-lease="refs/heads/${RUNTIME_BRANCH}:${RUNTIME_BASE_SHA}" \
            origin "HEAD:refs/heads/${RUNTIME_BRANCH}"
          echo "PUBLISHED_RUNTIME_SHA=$published_sha" >> "$GITHUB_ENV"

      - name: Verify published V6 runtime provenance and exact tree
        shell: bash
        env:
          V6_EXPECTED_SCHEDULE_KIND: ${{ needs.collect.outputs.schedule_kind }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "+refs/heads/${RUNTIME_BRANCH}:refs/remotes/origin/${RUNTIME_BRANCH}"
          published_head="$(git rev-parse "refs/remotes/origin/${RUNTIME_BRANCH}")"
          test "$published_head" = "$PUBLISHED_RUNTIME_SHA"
          verify_tree="$RUNNER_TEMP/v6-runtime-verify"
          rm -rf "$verify_tree"
          git worktree add --detach "$verify_tree" "refs/remotes/origin/${RUNTIME_BRANCH}"
          unauthorized="$(git -C "$verify_tree" ls-files | grep -v '^data/v6/' || true)"
          if [ -n "$unauthorized" ]; then
            echo "Unauthorized files outside data/v6/:"
            echo "$unauthorized"
            exit 1
          fi
          diff -qr "$RUNNER_TEMP/v6-publication-check/data/v6" "$verify_tree/data/v6"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "v6-runtime-verify" / "data" / "v6"
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          integrity = json.loads((root / "health" / "publish_integrity.json").read_text(encoding="utf-8"))
          control = manifest["runtime_control"]
          assert manifest["governance"]["data_only"] is True
          assert manifest["governance"]["decision_authority"] == "NONE"
          assert manifest["governance"]["production_authoritative_snapshots_require_schedule"] is False
          assert manifest["governance"]["production_authoritative_snapshots_require_governed_trigger"] is True
          assert control["schedule_kind"] == os.environ["V6_EXPECTED_SCHEDULE_KIND"]
          if control["schedule_kind"] == "chatgpt_scheduler":
              assert control["chatgpt_scheduler_proof"] is True
              assert control["logical_slot_source"] == "CHATGPT_COMMAND"
          assert integrity["status"] == "PASS", integrity
          assert integrity["resolved_registry_exact"] is True
          evidence = {
              "published": True,
              "overall": manifest["overall"],
              "generated_at": manifest["generated_at"],
              "schedule_kind": control["schedule_kind"],
              "logical_slot": control.get("expected_cycle_at"),
              "authoritative_runtime_snapshot": control.get("authoritative_runtime_snapshot"),
              "counts_as_completed_operational_slot": control.get("counts_as_completed_operational_slot"),
              "publisher_mode": "dedicated_v6_github_app",
              "tree_sha256": integrity.get("tree_sha256"),
          }
          print(evidence)
          PY

  orchestration-fulfillment:
    name: orchestration-fulfillment
    needs: [collect, publish]
    if: >-
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.number == 431 &&
          github.actor == github.repository_owner &&
          (
            startsWith(github.event.comment.body, '/v6-master-acquire') ||
            startsWith(github.event.comment.body, '/v6-report-prefetch')
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Classify orchestration fulfillment
        env:
          COLLECT_RESULT: ${{ needs.collect.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          SLOT_SKIP: ${{ needs.collect.outputs.skip }}
          SCHEDULE_KIND: ${{ needs.collect.outputs.schedule_kind }}
        shell: bash
        run: |
          set -euo pipefail
          state="WORKFLOW_RECEIVED"
          if [[ "$COLLECT_RESULT" != "success" ]]; then
            state="WORKFLOW_RECEIVED_ACQUISITION_NOT_COMPLETE"
            echo "state=$state" >> "$GITHUB_STEP_SUMMARY"
            echo "collect=$COLLECT_RESULT publish=$PUBLISH_RESULT" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$SLOT_SKIP" == "true" ]]; then
            state="IDEMPOTENT_NOOP_ALREADY_PUBLISHED"
          elif [[ "$PUBLISH_RESULT" == "success" ]]; then
            state="SNAPSHOT_PUBLISHED_VALIDATED"
          else
            state="ACQUISITION_COMPLETE_PUBLICATION_NOT_VALIDATED"
          fi
          {
            echo "state=$state"
            echo "schedule_kind=$SCHEDULE_KIND"
            echo "collect=$COLLECT_RESULT"
            echo "publish=$PUBLISH_RESULT"
            echo "slot_skip=$SLOT_SKIP"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "orchestration fulfillment: $state"
          if [[ "$state" == "ACQUISITION_COMPLETE_PUBLICATION_NOT_VALIDATED" ]]; then
            exit 1
          fi
