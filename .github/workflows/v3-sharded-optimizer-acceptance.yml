name: V3 Sharded Optimizer Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "src/engines/package_optimizer_exhaustive_*.py"
      - "src/models/package_optimizer_*.py"
      - "src/runtime_v3/full_authority_cache.py"
      - "src/runtime_v3/package_optimizer_shards.py"
      - "src/runtime_v3/precompute_checkpoint.py"
      - "src/runtime_v3/sharded_pipeline_resume.py"
      - "config/intelligence/package_optimizer.json"
      - "config/runtime/package_optimizer_sharding.json"
      - ".github/workflows/v3-package-precompute.yml"
      - ".github/workflows/v3-sharded-optimizer-acceptance.yml"
      - "tests/test_package_optimizer_sharded_*.py"
      - "tests/test_prediction_full_optimizer_reuse.py"
      - "tests/test_sharded_*.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: v3-sharded-optimizer-acceptance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  RUNTIME_BRANCH: runtime-data

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      shard_count: ${{ steps.matrix.outputs.shard_count }}
      task_count: ${{ steps.matrix.outputs.task_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - run: pip install --no-deps -r requirements.lock

      - name: Hydrate production-scale optimizer LKG only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "+${RUNTIME_BRANCH}:refs/remotes/origin/${RUNTIME_BRANCH}"
          mkdir -p data
          for file in projections.json team.json; do
            git cat-file -e "origin/${RUNTIME_BRANCH}:data/${file}"
            git show "origin/${RUNTIME_BRANCH}:data/${file}" > "data/${file}"
          done

      - name: Validate sharding policy and build exact plan
        run: |
          python - <<'PY'
          from src.runtime_v3.package_optimizer_shards import load_policy
          policy = load_policy()
          assert policy["execution_only"] is True
          assert policy["contracts"]["complete_outgoing_pair_task_cover_required"] is True
          assert policy["contracts"]["business_authority_is_not_sharded"] is True
          print(policy["registry"])
          PY
          python -m src.runtime_v3.package_optimizer_shards plan --output package-shard-plan.json

      - name: Export registry-derived matrix
        id: matrix
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          plan=json.load(open('package-shard-plan.json'))
          print('matrix='+json.dumps(plan['matrix'], separators=(',',':')))
          print('shard_count='+str(plan['shard_count']))
          print('task_count='+str(plan['task_count']))
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v3-shard-acceptance-input-${{ github.run_id }}
          path: |
            package-shard-plan.json
            data/projections.json
            data/team.json
          if-no-files-found: error
          retention-days: 1

  shard:
    needs: prepare
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - run: pip install --no-deps -r requirements.lock

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: v3-shard-acceptance-input-${{ github.run_id }}
          path: .

      - name: Execute exact shard
        run: |
          mkdir -p shard-results
          python -m src.runtime_v3.package_optimizer_shards run-shard \
            --plan package-shard-plan.json \
            --shard-id "${{ matrix.shard_id }}" \
            --output "shard-results/shard-${{ matrix.shard_id }}.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v3-shard-acceptance-result-${{ github.run_id }}-${{ matrix.shard_id }}
          path: shard-results/shard-${{ matrix.shard_id }}.json
          if-no-files-found: error
          retention-days: 1

  reduce:
    needs: [prepare, shard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - run: pip install --no-deps -r requirements.lock

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: v3-shard-acceptance-input-${{ github.run_id }}
          path: .

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: v3-shard-acceptance-result-${{ github.run_id }}-*
          path: shard-results
          merge-multiple: true

      - name: Exact single-writer reduce
        run: python -m src.runtime_v3.package_optimizer_shards reduce --plan package-shard-plan.json --shard-dir shard-results

      - name: Finalize cross-runner wall-clock evidence
        run: |
          python -m src.runtime_v3.package_optimizer_shards finalize-runtime --plan package-shard-plan.json
          python -m src.runtime_v3.performance_guard --profile exhaustive_precompute

      - name: Assert truthful FULL sharded acceptance
        shell: bash
        run: |
          python - <<'PY'
          import json
          optimizer=json.load(open('data/package_optimizer.json'))
          diag=optimizer['search_diagnostics']
          perf=json.load(open('data/runtime_performance.json'))
          assert optimizer['status'] == 'READY'
          assert diag['search_authority'] == 'FULL'
          assert diag['lossy_pruning'] is False
          assert diag['candidate_pruning_applied'] is False
          assert diag['all_step_legal_packages_scored'] is True
          assert diag['shard_complete_task_cover'] is True
          assert diag['shard_duplicate_tasks'] is False
          assert diag['shard_task_count'] == int('${{ needs.prepare.outputs.task_count }}')
          assert diag['shard_count'] == int('${{ needs.prepare.outputs.shard_count }}')
          assert perf['within_target_slo'] is True
          assert perf['within_target_budget'] is True
          print(json.dumps({
              'status':'PASS',
              'search_authority':diag['search_authority'],
              'shards':diag['shard_count'],
              'tasks':diag['shard_task_count'],
              'pair_exact_scored':diag['pair_candidates_exact_scored'],
              'scalar_fallback_rate':diag['batch_scalar_fallback_rate'],
              'package_count':optimizer['package_count'],
              'cross_runner_wall_ms':perf['total_wall_ms'],
              'target_wall_ms':perf['target_wall_ms'],
          }, sort_keys=True))
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v3-sharded-optimizer-acceptance-${{ github.run_id }}
          path: |
            package-shard-plan.json
            data/package_optimizer.json
            data/runtime_performance.json
          if-no-files-found: error
          retention-days: 7
