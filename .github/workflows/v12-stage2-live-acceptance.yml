name: V12 Stage2 live acceptance

on:
  pull_request:
    paths:
      - "src/engines/v12_position_probability_components.py"
      - "src/engines/v12_stage2_acceptance.py"
      - "src/models/historical_projection.py"
      - "src/models/team_strength.py"
      - "src/models/v12_analytics_foundation.py"
      - "tests/test_player_events_posterior_predictive.py"
      - ".github/workflows/v12-stage2-live-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v12-stage2-live-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact Stage2 code head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: app
          persist-credentials: false

      - name: Prove exact Stage1 branch origin and zero V6-owned diff
        if: github.event_name == 'pull_request'
        working-directory: app
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_STAGE1_BASE: d8a286a9428d8114125abb9093639de00c82103b
        shell: bash
        run: |
          set -euo pipefail
          merge_base="$(git merge-base HEAD "$BASE_SHA")"
          if [[ "$merge_base" != "$EXPECTED_STAGE1_BASE" ]]; then
            echo "::error::Stage2 did not originate from exact GREEN Stage1 head: merge_base=$merge_base expected=$EXPECTED_STAGE1_BASE"
            exit 1
          fi
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          printf '%s\n' "$changed"
          v6_changed="$(printf '%s\n' "$changed" | python src/platform/v6_ci_contract.py changed-paths)"
          if [[ "$v6_changed" != "false" ]]; then
            echo "::error::Stage2 V6 freeze boundary violated"
            exit 1
          fi
          echo "Exact Stage1 origin and zero V6-owned diff proven"

      - name: Checkout fresh factual runtime-data-v6 read-only
        uses: actions/checkout@v4
        with:
          ref: runtime-data-v6
          path: runtime-data
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-ci.lock

      - name: Install locked V12 dependencies
        working-directory: app
        run: python -m pip install --no-deps -r requirements-ci.lock

      - name: Execute Stage2 live read-only acceptance
        id: acceptance
        working-directory: app
        shell: bash
        run: |
          set +e
          python -m src.engines.v12_stage2_acceptance             --runtime-data-root "../runtime-data"             --output "artifacts/v12-stage2/stage2_live_acceptance.json"             --strict
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Stage2 immutable acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v12-stage2-live-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/artifacts/v12-stage2/stage2_live_acceptance.json
          retention-days: 14
          if-no-files-found: error

      - name: Enforce Stage2 acceptance
        if: always()
        working-directory: app
        env:
          EXIT_CODE: ${{ steps.acceptance.outputs.exit_code }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          proof = json.loads(
              Path("artifacts/v12-stage2/stage2_live_acceptance.json").read_text(
                  encoding="utf-8"
              )
          )
          print(
              json.dumps(
                  {
                      "status": proof.get("status"),
                      "stage2_engine_status": proof.get("stage2_engine_status"),
                      "current_authenticated_squad_status": proof.get(
                          "current_authenticated_squad_status"
                      ),
                      "auth_state": (proof.get("source_runtime") or {}).get(
                          "auth_state"
                      ),
                      "checks": proof.get("checks"),
                  },
                  indent=2,
                  sort_keys=True,
              )
          )
          if proof.get("stage2_engine_status") != "PASS":
              raise SystemExit("Stage2 engine acceptance failed")
          if proof.get("current_authenticated_squad_status") != "PASS":
              raise SystemExit(
                  "Stage2 live acceptance blocked by external V6 authenticated-squad evidence; see separate V6 issue"
              )
          if proof.get("status") != "GREEN":
              raise SystemExit("Stage2 acceptance is not GREEN")
          PY
