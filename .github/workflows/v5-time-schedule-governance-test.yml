name: V5 Time Schedule Governance Test

on:
  push:
    branches: [codex/v5-time-schedule-governance]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Compile touched V5 modules
        run: python -m py_compile src/v5/schedule_governance.py src/v5/reporting.py src/v5/services/governance.py src/v5/services/truth.py src/v5/services/orchestrator_beta.py
      - name: Time schedule governance tests
        run: python -m pytest -q tests/test_v5_time_schedule_governance.py
      - name: Reporting and governance regression tests
        run: python -m pytest -q tests/test_v5_reporting_watchlist_performance.py tests/test_v5_v313_reporting_watchlist.py tests/test_v5_decision_governance.py tests/test_v5_on_demand_report.py tests/test_v5_microservices.py
