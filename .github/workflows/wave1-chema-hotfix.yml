name: Wave 1 Chema hotfix

on:
  pull_request:
    branches: [main]
    paths:
      - 'config/v6/verified_crosswalks.json'
      - 'tests/test_wave1_understat_identity.py'
      - '.github/workflows/wave1-chema-hotfix.yml'

permissions:
  contents: write

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply deterministic Chema identity correction when needed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('config/v6/verified_crosswalks.json')
          data = json.loads(p.read_text())
          rows = data['sources']['understat']['players']
          matches = [r for r in rows if str(r.get('source_native_id')) == '13078']
          assert len(matches) == 1, len(matches)
          row = matches[0]
          old = (int(row['official_fpl_code']), int(row['official_fpl_element_id']))
          if old == (601772, 636):
              row['official_fpl_code'] = 592984
              row['official_fpl_element_id'] = 639
              row['verified_at'] = '2026-09-15T20:37:00Z'
              row['review_reference'] = 'wave1-understat-identity-chema-correction-2026-09-15'
              row['evidence'] = [
                  'official_fpl:bootstrap.elements.code:592984',
                  'official_fpl:bootstrap.elements.id:639',
                  'runtime-data-v6:understat.observed_native_player_id:13078',
              ]
              p.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n')
          else:
              assert old == (592984, 639), old
          PY
      - name: Verify targeted Wave 1 regression
        run: python -m pytest -q tests/test_wave1_understat_identity.py
      - name: Commit correction to PR branch if changed
        run: |
          if git diff --quiet -- config/v6/verified_crosswalks.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/v6/verified_crosswalks.json
          git diff --cached --check
          git commit -m 'fix: correct Chema deterministic Understat identity'
          git push origin HEAD:${{ github.head_ref }}
