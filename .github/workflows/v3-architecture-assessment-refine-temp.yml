name: TEMP Refine V3 Architecture Hardening

on:
  push:
    branches: [codex/v3-architecture-assessment-20260904]

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/v3-architecture-assessment-20260904
          fetch-depth: 0
      - name: Preserve representation and minimize config diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          python - <<'PY'
          from __future__ import annotations

          import subprocess
          from pathlib import Path

          ROOT = Path('.')

          def replace_once(path: str, old: str, new: str) -> None:
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          def main_text(path: str) -> str:
              return subprocess.check_output(['git', 'show', f'origin/main:{path}'], text=True)

          # Restore exact main formatting, then append only the reviewed policy keys.
          path = 'config/intelligence/xmins_v2.json'
          text = main_text(path)
          marker = '\n  }\n}\n'
          if not text.endswith(marker):
              raise SystemExit('unexpected xmins_v2.json tail')
          text = text[:-len(marker)] + '\n  },\n  "contract_validation": {\n    "probability_sum_tolerance": 0.002,\n    "expected_minutes_identity_tolerance": 0.2\n  }\n}\n'
          (ROOT / path).write_text(text, encoding='utf-8')

          path = 'config/intelligence/projection.json'
          text = main_text(path)
          marker = '\n  }\n}\n'
          if not text.endswith(marker):
              raise SystemExit('unexpected projection.json tail')
          text = text[:-len(marker)] + '\n  },\n  "validation": {\n    "minimum_player_coverage_ratio": 0.95\n  }\n}\n'
          (ROOT / path).write_text(text, encoding='utf-8')

          path = 'config/intelligence/reporting.json'
          text = main_text(path)
          marker = '\n  }\n}\n'
          if not text.endswith(marker):
              raise SystemExit('unexpected reporting.json tail')
          text = text[:-len(marker)] + '\n  },\n  "battle_reason_thresholds": {\n    "xpts_delta": 0.10,\n    "xmins_delta": 2.0,\n    "start_probability_delta": 0.03\n  }\n}\n'
          (ROOT / path).write_text(text, encoding='utf-8')

          # Preserve compact representation for outputs that were compact before atomic hardening.
          replace_once(
              'src/utils.py',
              'def atomic_json(path: Path, payload):\n    path.parent.mkdir(parents=True, exist_ok=True)\n    tmp = path.with_suffix(path.suffix + ".tmp")\n    if path.name in _COMPACT_JSON_ARTIFACTS:\n',
              'def atomic_json(path: Path, payload, *, compact: bool | None = None):\n    path.parent.mkdir(parents=True, exist_ok=True)\n    tmp = path.with_suffix(path.suffix + ".tmp")\n    use_compact = path.name in _COMPACT_JSON_ARTIFACTS if compact is None else bool(compact)\n    if use_compact:\n'
          )
          replace_once('src/runtime_v3/measured_command.py', '    atomic_json(output, payload)\n', '    atomic_json(output, payload, compact=True)\n')
          replace_once('src/runtime_v3/package_optimizer_shards.py', '        atomic_json(output, result)\n', '        atomic_json(output, result, compact=True)\n')

          # Load xMins contract once per validation run, not once per player.
          replace_once(
              'src/engines/production_contract_validate.py',
              '    for row in pr.get("players", []):\n        xm = row.get("xmins", {})\n        prob = sum(float(xm.get(k, 0)) for k in ("start_probability", "bench_probability", "dnp_probability"))\n        xmins_contract = (load_config("config/intelligence/xmins_v2.json").get("contract_validation") or {})\n        probability_tolerance = float(xmins_contract["probability_sum_tolerance"])\n',
              '    xmins_contract = (load_config("config/intelligence/xmins_v2.json").get("contract_validation") or {})\n    probability_tolerance = float(xmins_contract["probability_sum_tolerance"])\n    for row in pr.get("players", []):\n        xm = row.get("xmins", {})\n        prob = sum(float(xm.get(k, 0)) for k in ("start_probability", "bench_probability", "dnp_probability"))\n'
          )

          (ROOT / '.github' / 'workflows' / 'v3-architecture-assessment-refine-temp.yml').unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V3: preserve compact artifacts and minimal policy diffs"
          git push origin HEAD:codex/v3-architecture-assessment-20260904
