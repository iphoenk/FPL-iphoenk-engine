name: V4 owned challenger runtime fix

on:
  push:
    branches:
      - codex/v4-owned-challenger-decision-engine

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Remove Prediction-owned latest.json mutation and wire serving composition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          owned = Path('src/services/owned_challenger_decision_service.py')
          text = owned.read_text(encoding='utf-8')
          start = text.index('def run() -> dict[str, Any]:')
          end = text.index('\n\nif __name__ == "__main__":', start)
          replacement = '''def run() -> dict[str, Any]:
              out = build()
              atomic_json(OUT, out)
              print(json.dumps({
                  "status": out.get("status"),
                  "owned_count": out.get("owned_count"),
                  "governed_watchlist_count": out.get("governed_watchlist_count"),
                  "comparison_count": out.get("comparison_count"),
                  "main_transfer_battle_count": len(out.get("main_transfer_battles") or []),
                  "multi_transfer_package_count": len(out.get("multi_transfer_packages") or []),
                  "overall_decision": out.get("overall_decision"),
                  "execution_authorized": out.get("execution_authorized"),
              }, ensure_ascii=False))
              return out
          '''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          owned.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          governance = Path('src/services/governance_service.py')
          text = governance.read_text(encoding='utf-8')
          import_anchor = 'from src.engines import v4_checkpoint_governance, v4_maturity_reconciler\n'
          import_line = 'from src.engines.v4_challenger_serving_composition import compose as compose_challenger_serving\n'
          if import_line not in text:
              text = text.replace(import_anchor, import_anchor + import_line)
          call_anchor = '    checkpoint_ms = round((perf_counter() - started) * 1000.0, 2)\n\n    integrity = _publication_integrity_state()'
          call_replacement = '    checkpoint_ms = round((perf_counter() - started) * 1000.0, 2)\n\n    challenger_serving = compose_challenger_serving()\n\n    integrity = _publication_integrity_state()'
          if call_anchor not in text:
              raise SystemExit('governance composition anchor not found')
          text = text.replace(call_anchor, call_replacement, 1)
          governance.write_text(text, encoding='utf-8')
          PY
      - name: Full regression suite
        run: python -m pytest -q
      - name: Refresh governed architecture attestation
        run: python tools/v4_architecture_guard_attest.py
      - name: Commit runtime fix and attestation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/owned_challenger_decision_service.py src/services/governance_service.py config/architecture_guard_attestation.json
          git commit -m "V4: keep challenger runtime read-only and publish transfer battles"
          git push origin HEAD:codex/v4-owned-challenger-decision-engine
