name: V4 temporary red-audit QAQC

on:
  push:
    branches:
      - codex/v4-red-audit-hardening

permissions:
  contents: write

concurrency:
  group: v4-red-audit-qaqc-temp
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/v4-red-audit-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Apply QA/QC remediation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tools/v4_red_audit_qaqc_fix.py
      - name: Rebuild architecture attestation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tools/v4_architecture_guard_attest.py
      - name: Run focused regression
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_v4_owned_challenger_authority_governance.py tests/test_v496_housekeeping_integrity.py tests/test_v4_weather_overlay_context_reuse.py
      - name: Commit validated fix
        run: |
          set -euo pipefail
          git config user.name "fpl-iphoenk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src tests config/architecture_guard_attestation.json
          git commit -m "fix: preserve challenger authority under test isolation"
          git push origin HEAD:codex/v4-red-audit-hardening
