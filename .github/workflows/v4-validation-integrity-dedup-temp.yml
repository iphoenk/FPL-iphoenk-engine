name: V4 temporary prediction validation handoff

on:
  push:
    branches: [codex/v4-validation-integrity-dedup-runner-20260901]
    paths:
      - '.github/workflows/v4-validation-integrity-dedup-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/v4-final-yellow-closeout-20260901
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Apply explicit prediction-to-validation handoff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          prediction = Path('src/services/prediction_service.py')
          text = prediction.read_text()
          if 'def run(*, return_predictions: bool = False):' not in text:
              if 'def run():' not in text:
                  raise SystemExit('prediction run signature anchor not found')
              text = text.replace('def run():', 'def run(*, return_predictions: bool = False):', 1)
          old = '\n    return latest\n\n\nif __name__ == "__main__":\n'
          new = '\n    if return_predictions:\n        return {"latest": latest, "predictions": predictions}\n    return latest\n\n\nif __name__ == "__main__":\n'
          if new not in text:
              if old not in text:
                  raise SystemExit('prediction return anchor not found')
              text = text.replace(old, new, 1)
          prediction.write_text(text)

          wrapper = Path('src/services/prediction_service_price_mover.py')
          text = wrapper.read_text()
          old = '''def run():\n    result = run_prediction()\n    patch_price_artifacts(DATA)\n    return result\n'''
          new = '''def run(*, return_predictions: bool = False):\n    result = run_prediction(return_predictions=True) if return_predictions else run_prediction()\n    patch_price_artifacts(DATA)\n    return result\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('prediction wrapper anchor not found')
              text = text.replace(old, new, 1)
          wrapper.write_text(text)

          validation = Path('src/services/validation_service.py')
          text = validation.read_text()
          if 'def run(*, predictions_snapshot: dict | None = None) -> dict:' not in text:
              if 'def run() -> dict:' not in text:
                  raise SystemExit('validation run signature anchor not found')
              text = text.replace(
                  'def run() -> dict:',
                  'def run(*, predictions_snapshot: dict | None = None) -> dict:',
                  1,
              )
          old = '''    snapshot_started = perf_counter()\n    raw_snapshot = read_json(RAW_SNAPSHOT, {})\n    predictions_snapshot = read_json(PREDICTIONS, {})\n    timings["parent_snapshot_load_ms"] = round((perf_counter() - snapshot_started) * 1000.0, 2)\n'''
          new = '''    snapshot_started = perf_counter()\n    raw_snapshot = read_json(RAW_SNAPSHOT, {})\n    predictions_preloaded = predictions_snapshot is not None\n    if predictions_snapshot is None:\n        predictions_snapshot = read_json(PREDICTIONS, {})\n    timings["parent_snapshot_load_ms"] = round((perf_counter() - snapshot_started) * 1000.0, 2)\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('validation snapshot load anchor not found')
              text = text.replace(old, new, 1)
          old = '''            "parent_predictions_loaded_once": True,\n            "lifecycle_received_preloaded_raw": True,\n'''
          new = '''            "parent_predictions_loaded_once": not predictions_preloaded,\n            "parent_predictions_received_preloaded": predictions_preloaded,\n            "lifecycle_received_preloaded_raw": True,\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('validation reuse evidence anchor not found')
              text = text.replace(old, new, 1)
          old = '''            "parent_snapshot_reuse_fail_closed": True,\n            "official_api_refetch": False,\n'''
          new = '''            "parent_snapshot_reuse_fail_closed": True,\n            "prediction_handoff_is_explicit_optional_input": True,\n            "file_backed_prediction_fallback_preserved": True,\n            "official_api_refetch": False,\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('validation handoff guardrail anchor not found')
              text = text.replace(old, new, 1)
          validation.write_text(text)

          hot = Path('src/services/hot_orchestrator.py')
          text = hot.read_text()
          old = '''def _validation_worker(conn) -> None:\n'''
          new = '''def _validation_worker(conn, predictions_snapshot: dict) -> None:\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('hot validation worker signature anchor not found')
              text = text.replace(old, new, 1)
          old = '''        detail = validation_service.run()\n'''
          new = '''        detail = validation_service.run(predictions_snapshot=predictions_snapshot)\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('hot validation invocation anchor not found')
              text = text.replace(old, new, 1)
          old = '''    prediction_service_price_mover.run()\n    service_ms["prediction"] = round((perf_counter() - t) * 1000.0, 2)\n    prediction_cache = prediction_model_cache.last_status()\n'''
          new = '''    prediction_bundle = prediction_service_price_mover.run(return_predictions=True)\n    service_ms["prediction"] = round((perf_counter() - t) * 1000.0, 2)\n    predictions_snapshot = (prediction_bundle or {}).get("predictions") or {}\n    if not predictions_snapshot.get("model_version") or not predictions_snapshot.get("players"):\n        raise RuntimeError("hot-path prediction handoff missing full prediction contract")\n    prediction_cache = prediction_model_cache.last_status()\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('hot prediction invocation anchor not found')
              text = text.replace(old, new, 1)
          old = '''        args=(validation_send,),\n        name="v496-hot-validation",\n'''
          new = '''        args=(validation_send, predictions_snapshot),\n        name="v496-hot-validation",\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('hot validation process args anchor not found')
              text = text.replace(old, new, 1)
          old = '''            "validation_fork_removes_interpreter_bootstrap_only": True,\n            "architecture_guard_runs_first": True,\n'''
          new = '''            "validation_fork_removes_interpreter_bootstrap_only": True,\n            "prediction_validation_handoff_explicit": True,\n            "prediction_validation_handoff_copy_on_write": True,\n            "production_file_backed_validation_fallback_preserved": True,\n            "architecture_guard_runs_first": True,\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('hot handoff guardrail anchor not found')
              text = text.replace(old, new, 1)
          hot.write_text(text)

          test = Path('tests/test_v4_prediction_validation_handoff.py')
          test.write_text('''from __future__ import annotations\n\nimport inspect\n\nfrom src.services import hot_orchestrator, prediction_service_price_mover, validation_service\n\n\ndef test_prediction_wrapper_preserves_default_and_exposes_optional_bundle(monkeypatch):\n    calls = []\n    def fake_prediction(*, return_predictions=False):\n        calls.append(return_predictions)\n        if return_predictions:\n            return {"latest": {"status": "ok"}, "predictions": {"model_version": "m", "players": [{"element": 1}]}}\n        return {"status": "default"}\n    monkeypatch.setattr(prediction_service_price_mover, "run_prediction", fake_prediction)\n    monkeypatch.setattr(prediction_service_price_mover, "patch_price_artifacts", lambda *_a, **_k: None)\n    assert prediction_service_price_mover.run() == {"status": "default"}\n    bundle = prediction_service_price_mover.run(return_predictions=True)\n    assert bundle["predictions"]["model_version"] == "m"\n    assert calls == [False, True]\n\n\ndef test_validation_service_keeps_file_fallback_and_optional_handoff_contract():\n    signature = inspect.signature(validation_service.run)\n    assert "predictions_snapshot" in signature.parameters\n    source = inspect.getsource(validation_service.run)\n    assert "if predictions_snapshot is None" in source\n    assert "parent_predictions_received_preloaded" in source\n    assert "file_backed_prediction_fallback_preserved" in source\n\n\ndef test_hot_path_passes_prediction_object_to_forked_validation():\n    source = inspect.getsource(hot_orchestrator.run)\n    worker = inspect.getsource(hot_orchestrator._validation_worker)\n    assert "run(return_predictions=True)" in source\n    assert "args=(validation_send, predictions_snapshot)" in source\n    assert "validation_service.run(predictions_snapshot=predictions_snapshot)" in worker\n    assert "prediction_validation_handoff_explicit" in source\n''')
          PY
      - name: Rebuild governed architecture attestation
        run: python tools/v4_architecture_guard_attest.py
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Verify focused and full deterministic suite
        run: |
          python -m pytest -q tests/test_v4_prediction_validation_handoff.py tests/test_v4_validation_integrity_dedup.py
          python -m pytest -q
      - name: Measure repeated FAST p95 without threshold change
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math, statistics, subprocess
          subprocess.run(['python','-m','src.services.hot_orchestrator','daily','--stats','--deep-stats'], check=True)
          setup=json.load(open('data/hot_orchestration_v4.json'))
          runs=[]
          for i in range(5):
              subprocess.run(['python','-m','src.services.hot_orchestrator','daily','--stats','--deep-stats'], check=True)
              h=json.load(open('data/hot_orchestration_v4.json'))
              assert h['status']=='PASS', h
              assert (h.get('prediction_base_cache') or {}).get('hit') is True, h
              assert h['guardrails']['prediction_validation_handoff_explicit'] is True, h
              runs.append(float(h['serving_e2e_excluding_startup_assurance_ms']))
          ordered=sorted(runs)
          p95=ordered[max(0,min(len(ordered)-1,math.ceil(.95*len(ordered))-1))]
          print(json.dumps({'setup_ms':setup['serving_e2e_excluding_startup_assurance_ms'],'runs':runs,'median_ms':statistics.median(runs),'p95_ms':p95,'target_ms':3000.0}))
          assert p95 < 3000.0, {'runs':runs,'p95_ms':p95,'target_ms':3000.0}
          PY
      - name: Commit validated handoff to V4 closeout branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/prediction_service.py src/services/prediction_service_price_mover.py src/services/validation_service.py src/services/hot_orchestrator.py tests/test_v4_prediction_validation_handoff.py config/architecture_guard_attestation.json
          git diff --cached --exit-code && exit 0 || true
          git commit -m 'perf(v4): hand prediction snapshot directly to hot validation'
          git fetch origin codex/v4-final-yellow-closeout-20260901
          git rebase origin/codex/v4-final-yellow-closeout-20260901
          python tools/v4_architecture_guard_attest.py
          git add config/architecture_guard_attestation.json
          git diff --cached --quiet || git commit --amend --no-edit
          git push origin HEAD:codex/v4-final-yellow-closeout-20260901
