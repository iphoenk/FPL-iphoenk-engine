name: V12 P4 private scenario package

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  # Only real /v12-p4-build commands share the governed replacement queue.
  # A newer owner command supersedes an obsolete in-progress P4 build because
  # P4 authority is bound to the exact production SHA at command acceptance.
  # Unrelated issue-comment fanout gets a unique group and cannot cancel P4.
  group: >-
    ${{
      (
        github.event.issue.number == 431 &&
        github.actor == github.repository_owner &&
        startsWith(github.event.comment.body, '/v12-p4-build ')
      ) &&
      'v12-p4-private-scenario-package-command' ||
      format('v12-p4-private-scenario-package-noise-{0}', github.event.comment.id)
    }}
  cancel-in-progress: true

jobs:
  build-private-package:
    if: >-
      github.event.issue.number == 431 &&
      github.actor == github.repository_owner &&
      startsWith(github.event.comment.body, '/v12-p4-build ')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: v12-private-reports-publisher
    permissions:
      contents: read
    steps:
      - name: Parse governed P4 request
        id: request
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from datetime import datetime
          from pathlib import Path

          raw = os.environ["COMMENT_BODY"].strip().split()
          if not raw or raw[0] != "/v12-p4-build":
              raise SystemExit("P4 marker mismatch")
          values = {}
          for token in raw[1:]:
              if "=" not in token:
                  raise SystemExit(f"malformed token: {token}")
              key, value = token.split("=", 1)
              if key in values or not key or not value:
                  raise SystemExit(f"invalid token: {token}")
              values[key] = value
          if set(values) != {"report_slot"}:
              raise SystemExit(f"P4 request requires only report_slot, got {sorted(values)}")
          parsed = datetime.fromisoformat(values["report_slot"].replace("Z", "+00:00"))
          if parsed.tzinfo is None or parsed.utcoffset() is None:
              raise SystemExit("report_slot must be timezone-aware")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as fh:
              fh.write(f"report_slot={parsed.isoformat()}\n")
          PY

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact production main
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "main"
          echo "production_sha=${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: iphoenk/FPL-iphoenk-engine
          ref: runtime-data-v6
          path: runtime-data
          fetch-depth: 1
          persist-credentials: false

      - name: Require private publisher credential
        shell: bash
        env:
          FPL_PRIVATE_REPORTS_TOKEN: ${{ secrets.FPL_PRIVATE_REPORTS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FPL_PRIVATE_REPORTS_TOKEN"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: iphoenk/fpl-reports-private
          ref: main
          path: private-reports
          token: ${{ secrets.FPL_PRIVATE_REPORTS_TOKEN }}
          persist-credentials: true
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked canonical runtime
        run: python -m pip install --require-hashes -r requirements.lock

      # Reuse only caches already governed by the integrated production runner.
      # Stage-2 is public-safe; P1.7/MC remain encrypted AEAD private state.
      - name: Restore deterministic Stage-2 derived projection cache
        id: p4-stage2-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: app/.cache/v12-stage2
          key: v12-stage2-derived-${{ runner.os }}-${{ hashFiles('src/engines/v12_stage2_derived_cache.py', 'src/models/historical_projection.py', 'src/engines/v12_contextual_dynamics.py', 'src/engines/v12_player_events.py', 'src/engines/v12_player_minutes.py', 'src/engines/v12_position_probability_components.py', 'src/engines/p0_decision_quality.py', 'src/models/v12_stage1_analytics.py', 'src/rules.py', 'config/intelligence/player_events.json', 'config/intelligence/player_minutes.json', 'config/intelligence/historical_priors.json', 'config/intelligence/v12_contextual_dynamics.json') }}-p4-${{ github.run_id }}
          restore-keys: |
            v12-stage2-derived-${{ runner.os }}-${{ hashFiles('src/engines/v12_stage2_derived_cache.py', 'src/models/historical_projection.py', 'src/engines/v12_contextual_dynamics.py', 'src/engines/v12_player_events.py', 'src/engines/v12_player_minutes.py', 'src/engines/v12_position_probability_components.py', 'src/engines/p0_decision_quality.py', 'src/models/v12_stage1_analytics.py', 'src/rules.py', 'config/intelligence/player_events.json', 'config/intelligence/player_minutes.json', 'config/intelligence/historical_priors.json', 'config/intelligence/v12_contextual_dynamics.json') }}-

      - name: Restore encrypted P1.7 and MC decision caches
        id: p4-private-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            app/.cache/v12-p17
            app/.cache/v12-mc
          key: v12-private-aead-v1-${{ runner.os }}-${{ hashFiles('src/engines/private_cache_crypto.py', 'src/engines/v12_lineup_optimizer.py', 'src/engines/v12_monte_carlo.py', 'src/engines/v12_cache_runtime_identity.py', 'config/intelligence/v12_lineup_optimizer.json', 'config/intelligence/v12_monte_carlo.json') }}-p4-${{ github.run_id }}
          restore-keys: |
            v12-private-aead-v1-${{ runner.os }}-${{ hashFiles('src/engines/private_cache_crypto.py', 'src/engines/v12_lineup_optimizer.py', 'src/engines/v12_monte_carlo.py', 'src/engines/v12_cache_runtime_identity.py', 'config/intelligence/v12_lineup_optimizer.json', 'config/intelligence/v12_monte_carlo.json') }}-

      - name: Enforce restored P4 cache security boundary
        shell: bash
        env:
          FPL_V12_PRIVATE_CACHE_KEY_B64: ${{ secrets.FPL_V12_PRIVATE_CACHE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$FPL_V12_PRIVATE_CACHE_KEY_B64"
          mkdir -p app/.cache/v12-stage2 app/.cache/v12-p17 app/.cache/v12-mc
          if find app/.cache/v12-p17 app/.cache/v12-mc -type f ! -name '*.aead.json' -print -quit | grep -q .; then
            echo "non-AEAD file found in restored P4 private cache" >&2
            exit 1
          fi
          python - <<'PY'
          import base64
          import os
          raw = os.environ["FPL_V12_PRIVATE_CACHE_KEY_B64"]
          key = base64.b64decode(raw, validate=True)
          if len(key) != 32:
              raise SystemExit("P4 private cache key must decode to exactly 32 bytes")
          print("P4 governed cache restore boundary: PASS")
          PY

      - name: Build canonical private P4 package
        env:
          V12_STAGE2_DERIVED_CACHE_DIR: ${{ github.workspace }}/app/.cache/v12-stage2
          V12_P17_CACHE_DIR: ${{ github.workspace }}/app/.cache/v12-p17
          V12_MC_CACHE_DIR: ${{ github.workspace }}/app/.cache/v12-mc
          V12_P17_CACHE_KEY_B64: ${{ secrets.FPL_V12_PRIVATE_CACHE_KEY_B64 }}
          V12_MC_CACHE_KEY_B64: ${{ secrets.FPL_V12_PRIVATE_CACHE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/p4-work"
          mkdir -p "$RUNNER_TEMP/p4-work" private-reports/scenarios
          python -m src.engines.v12_p4_scenario_production             --app-root "$GITHUB_WORKSPACE"             --runtime-data-root "$GITHUB_WORKSPACE/runtime-data"             --private-root "$GITHUB_WORKSPACE/private-reports"             --report-slot "${{ steps.request.outputs.report_slot }}"             --workspace "$RUNNER_TEMP/p4-work"             --output "$GITHUB_WORKSPACE/private-reports/scenarios/latest.json"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("private-reports/scenarios")
          payload = json.loads((root / "latest.json").read_text(encoding="utf-8"))
          fingerprint = str(payload["package_fingerprint"])
          if payload.get("private_only") is not True:
              raise SystemExit("P4 package is not private-only")
          if int(payload.get("scenario_count") or 0) < 16:
              raise SystemExit("P4 scenario coverage incomplete")
          (root / f"{fingerprint}.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print({"package_fingerprint": fingerprint, "scenario_count": payload["scenario_count"]})
          PY

      - name: Revalidate exact production main before private persist
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(git ls-remote https://github.com/iphoenk/FPL-iphoenk-engine.git refs/heads/main | awk '{print $1}')"
          test -n "$current_main"
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "STALE_P4_PRODUCTION_SHA expected=$GITHUB_SHA current=$current_main"
            exit 1
          fi
          echo "P4_PRODUCTION_SHA_REVALIDATED=$current_main" >> "$GITHUB_STEP_SUMMARY"

      - name: Persist package only in private plane
        working-directory: private-reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- scenarios
          if git diff --cached --quiet; then
            echo "P4_PRIVATE_PACKAGE=NO_CHANGE" >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "scenario(private): canonical P4 package ${GITHUB_RUN_ID}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$local_sha" = "$remote_sha"
          echo "private_remote_sha=$remote_sha" >> "$GITHUB_STEP_SUMMARY"
          echo "P4_PRIVATE_PACKAGE=PASS" >> "$GITHUB_STEP_SUMMARY"
