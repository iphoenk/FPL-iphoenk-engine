name: V3 Package Precompute

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["V3 CI"]
    types: [completed]
  schedule:
    - cron: "15 * * * *"
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: v3-package-precompute
  cancel-in-progress: ${{ github.event_name == 'schedule' && github.event.schedule == '15 * * * *' }}

env:
  PYTHONPATH: ${{ github.workspace }}
  RUNTIME_BRANCH: runtime-data
  SOURCE_COMMIT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  prepare:
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_run: ${{ steps.route.outputs.should_run }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      snapshot_role: ${{ steps.cadence.outputs.snapshot_role }}
      target_checkpoint_utc: ${{ steps.cadence.outputs.target_checkpoint_utc }}
      target_visible_mode: ${{ steps.cadence.outputs.target_visible_mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source commit passed V3 CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          api = os.environ["GITHUB_API_URL"].rstrip("/")
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["SOURCE_COMMIT"]
          token = os.environ["GH_TOKEN"]
          url = f"{api}/repos/{repo}/actions/workflows/v3-ci.yml/runs?head_sha={sha}&branch=main&per_page=20"
          request = Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urlopen(request, timeout=20) as response:
              payload = json.loads(response.read().decode("utf-8"))
          valid = [run for run in payload.get("workflow_runs", []) if run.get("head_sha") == sha and run.get("head_branch") == "main" and run.get("conclusion") == "success"]
          if not valid:
              raise SystemExit(f"REFUSING_SHARDED_PRECOMPUTE_WITHOUT_GREEN_CI source_commit={sha}")
          print(json.dumps({"source_commit": sha, "v3_ci_run_id": valid[0].get("id"), "status": "PASS"}))
          PY

      - name: Fetch current runtime checkpoint metadata
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "+${RUNTIME_BRANCH}:refs/remotes/origin/${RUNTIME_BRANCH}" || true
          mkdir -p data
          for file in latest.json runtime_manifest.json; do
            if git cat-file -e "origin/${RUNTIME_BRANCH}:data/${file}" 2>/dev/null; then
              git show "origin/${RUNTIME_BRANCH}:data/${file}" > "data/${file}"
            fi
          done

      - name: Decide targeted exhaustive cadence and recovery
        id: cadence
        env:
          FPL_SCHEDULE_EXPR: ${{ github.event.schedule }}
        run: python -m src.runtime_v3.precompute_checkpoint

      - name: Route only exhaustive precompute work to shard lane
        id: route
        shell: bash
        run: |
          if [ "${{ steps.cadence.outputs.should_collect }}" = "true" ] && [ "${{ steps.cadence.outputs.visible_mode }}" = "EXHAUSTIVE_PRECOMPUTE" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.route.outputs.should_run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked runtime dependencies
        if: steps.route.outputs.should_run == 'true'
        run: pip install --no-deps -r requirements.lock

      - name: Hydrate governed reusable runtime state
        if: steps.route.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/hydrate-paths.txt"
          import json
          cfg=json.load(open('config/runtime/runtime_publish_registry.json'))
          for path in cfg.get('hydrate_paths', []):
              print(path)
          PY
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            if git cat-file -e "origin/${RUNTIME_BRANCH}:data/${file}" 2>/dev/null; then
              mkdir -p "data/$(dirname "$file")"
              git show "origin/${RUNTIME_BRANCH}:data/${file}" > "data/${file}"
            fi
          done < "$RUNNER_TEMP/hydrate-paths.txt"

      - name: Validate architecture and shard policy before seed
        if: steps.route.outputs.should_run == 'true'
        run: |
          python -m src.runtime_v3.capability_terminology_validate
          python -m src.engines.architecture_contract_validate
          python -m src.engines.v3_architecture_ownership_guard
          python - <<'PY'
          from src.runtime_v3.package_optimizer_shards import load_policy
          print(load_policy()["registry"])
          PY

      - name: Build fresh governed seed snapshot on FAST lane
        if: steps.route.outputs.should_run == 'true'
        shell: bash
        env:
          FPL_AUTH_MODE: ${{ secrets.FPL_AUTH_MODE }}
          FPL_SESSION_B64: ${{ secrets.FPL_SESSION_B64 }}
          FPL_ACCESS_TOKEN: ${{ secrets.FPL_ACCESS_TOKEN }}
          FPL_REFRESH_TOKEN: ${{ secrets.FPL_REFRESH_TOKEN }}
          FPL_OIDC_TOKEN_URL: ${{ secrets.FPL_OIDC_TOKEN_URL }}
          FPL_OIDC_CLIENT_ID: ${{ secrets.FPL_OIDC_CLIENT_ID }}
          FPL_OIDC_CLIENT_SECRET: ${{ secrets.FPL_OIDC_CLIENT_SECRET }}
        run: python -m src.runtime_v3.domain_orchestrator --mode daily --stats --profile fast_decision

      - name: Plan exact workload-balanced optimizer shards
        if: steps.route.outputs.should_run == 'true'
        run: python -m src.runtime_v3.package_optimizer_shards plan --output package-shard-plan.json

      - name: Export dynamic matrix from registry-derived plan
        id: matrix
        shell: bash
        run: |
          if [ -f package-shard-plan.json ]; then
            python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          plan=json.load(open('package-shard-plan.json'))
          print('matrix='+json.dumps(plan['matrix'], separators=(',',':')))
          PY
          else
            echo 'matrix={"shard_id":[]}' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload minimal shard input
        if: steps.route.outputs.should_run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v3-package-shard-input-${{ github.run_id }}
          path: |
            package-shard-plan.json
            data/projections.json
            data/team.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload canonical seed for exact fan-in
        if: steps.route.outputs.should_run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v3-package-precompute-seed-${{ github.run_id }}
          path: |
            package-shard-plan.json
            data/
          if-no-files-found: error
          retention-days: 1

  shard:
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - run: pip install --no-deps -r requirements.lock

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: v3-package-shard-input-${{ github.run_id }}
          path: .

      - name: Execute one exact optimizer shard with resource sidecar
        run: |
          mkdir -p shard-results
          python -m src.runtime_v3.measured_command \
            --output "shard-results/resource-${{ matrix.shard_id }}.json" -- \
            python -m src.runtime_v3.package_optimizer_shards run-shard \
              --plan package-shard-plan.json \
              --shard-id "${{ matrix.shard_id }}" \
              --output "shard-results/shard-${{ matrix.shard_id }}.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v3-package-shard-${{ github.run_id }}-${{ matrix.shard_id }}
          path: |
            shard-results/shard-${{ matrix.shard_id }}.json
            shard-results/resource-${{ matrix.shard_id }}.json
          if-no-files-found: error
          retention-days: 1

  finalize:
    needs: [prepare, shard]
    if: needs.prepare.outputs.should_run == 'true' && needs.shard.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      profile: exhaustive_precompute
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - run: pip install --no-deps -r requirements.lock

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: v3-package-precompute-seed-${{ github.run_id }}
          path: .

      - name: Restore canonical Official snapshot from retry mirror for finalize only
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f data/official_snapshot.json ] && [ -f data/official_snapshot.retry.json ]; then
            cp data/official_snapshot.retry.json data/official_snapshot.json
          fi
          test -f data/official_snapshot.json
          test -f data/official_snapshot.retry.json
          cmp -s data/official_snapshot.json data/official_snapshot.retry.json

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: v3-package-shard-${{ github.run_id }}-*
          path: shard-results
          merge-multiple: true

      - name: Exact fan-in to single FULL optimizer authority
        run: |
          python -m src.runtime_v3.measured_command \
            --output reducer-resource.json -- \
            python -m src.runtime_v3.package_optimizer_shards reduce \
              --plan package-shard-plan.json \
              --shard-dir shard-results

      - name: Resume downstream domain DAG from registry boundary
        shell: bash
        env:
          FPL_AUTH_MODE: ${{ secrets.FPL_AUTH_MODE }}
          FPL_SESSION_B64: ${{ secrets.FPL_SESSION_B64 }}
          FPL_ACCESS_TOKEN: ${{ secrets.FPL_ACCESS_TOKEN }}
          FPL_REFRESH_TOKEN: ${{ secrets.FPL_REFRESH_TOKEN }}
          FPL_OIDC_TOKEN_URL: ${{ secrets.FPL_OIDC_TOKEN_URL }}
          FPL_OIDC_CLIENT_ID: ${{ secrets.FPL_OIDC_CLIENT_ID }}
          FPL_OIDC_CLIENT_SECRET: ${{ secrets.FPL_OIDC_CLIENT_SECRET }}
        run: python -m src.runtime_v3.sharded_pipeline_resume --mode daily --stats --profile exhaustive_precompute

      - name: Validate full production decision chain
        run: |
          python -m src.engines.source_contract_validate
          python -m src.engines.production_contract_validate
          python -m src.engines.watchlist_contract_validate
          python -m src.engines.report_serving_validate
          python -m src.engines.report_time_contract_validate
          python -m src.runtime_v3.full_authority_cache --profile exhaustive_precompute

      - name: Finalize true cross-runner runtime performance
        run: |
          python -m src.runtime_v3.package_optimizer_shards finalize-runtime --plan package-shard-plan.json
          python -m src.runtime_v3.sharded_resource_telemetry \
            --plan package-shard-plan.json \
            --shard-dir shard-results \
            --reducer-resource reducer-resource.json
          python -m src.runtime_v3.performance_guard --profile exhaustive_precompute

      - name: Verify V3 candidate definition of done
        run: python -m src.runtime_v3.definition_of_done --scope candidate --source-commit "$SOURCE_COMMIT"

      - name: Materialize verified targeted checkpoint snapshot
        run: |
          rm -rf "$RUNNER_TEMP/runtime-publish"
          python -m src.runtime_v3.publish_snapshot \
            --source-data data \
            --output-dir "$RUNNER_TEMP/runtime-publish" \
            --profile exhaustive_precompute \
            --source-commit "$SOURCE_COMMIT" \
            --snapshot-role "${{ needs.prepare.outputs.snapshot_role }}" \
            --target-checkpoint "${{ needs.prepare.outputs.target_checkpoint_utc }}" \
            --target-visible-mode "${{ needs.prepare.outputs.target_visible_mode }}"
          python -m src.runtime_v3.publication_verify \
            --data-dir "$RUNNER_TEMP/runtime-publish/data" \
            --profile exhaustive_precompute \
            --source-commit "$SOURCE_COMMIT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v3-package-runtime-${{ github.run_id }}
          path: ${{ runner.temp }}/runtime-publish/data
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, finalize]
    if: needs.prepare.outputs.should_run == 'true' && needs.finalize.result == 'success'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: v3-runtime-publication
      cancel-in-progress: false
    steps:
      - name: Mint governed V3 runtime publisher token
        id: runtime_app_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.V3_RUNTIME_APP_ID }}
          private-key: ${{ secrets.V3_RUNTIME_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: FPL-iphoenk-engine
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: v3-package-runtime-${{ github.run_id }}
          path: ${{ runner.temp }}/runtime-publish/data

      - name: Assert main/source and capture runtime branch base
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${RUNTIME_BRANCH}:refs/remotes/origin/${RUNTIME_BRANCH}"
          canonical_main="$(git rev-parse refs/remotes/origin/main)"
          if [ "$canonical_main" != "$SOURCE_COMMIT" ]; then
            python -m src.runtime_v3.version_scope_validate --source-commit "$SOURCE_COMMIT" --canonical-main "$canonical_main"
          fi
          runtime_base="$(git rev-parse refs/remotes/origin/${RUNTIME_BRANCH})"
          echo "RUNTIME_BASE_SHA=$runtime_base" >> "$GITHUB_ENV"

      - name: Revalidate transferred publication artifact
        run: python -m src.runtime_v3.publication_verify --data-dir "$RUNNER_TEMP/runtime-publish/data" --profile exhaustive_precompute --source-commit "$SOURCE_COMMIT"

      - name: Publish rolling runtime snapshot atomically
        shell: bash
        env:
          GH_TOKEN: ${{ steps.runtime_app_token.outputs.token }}
        run: |
          set -euo pipefail
          publish_tree="$RUNNER_TEMP/runtime-worktree"
          rm -rf "$publish_tree"
          git config user.name "fpl-iphoenk-bot"
          git config user.email "actions@users.noreply.github.com"
          git worktree add --detach "$publish_tree" HEAD
          cd "$publish_tree"
          git checkout --orphan runtime-snapshot
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/runtime-publish/data" ./data
          git add -f data/
          git commit -m "data: rolling FPL runtime snapshot [skip ci]"
          published_sha="$(git rev-parse HEAD)"
          basic_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${basic_auth}" push \
            --force-with-lease="refs/heads/${RUNTIME_BRANCH}:${RUNTIME_BASE_SHA}" \
            origin "HEAD:refs/heads/${RUNTIME_BRANCH}"
          echo "PUBLISHED_RUNTIME_SHA=$published_sha" >> "$GITHUB_ENV"

      - name: Verify published runtime provenance and content
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "+refs/heads/${RUNTIME_BRANCH}:refs/remotes/origin/${RUNTIME_BRANCH}"
          published_head="$(git rev-parse refs/remotes/origin/${RUNTIME_BRANCH})"
          test "$published_head" = "$PUBLISHED_RUNTIME_SHA"
          verify_tree="$RUNNER_TEMP/runtime-verify"
          rm -rf "$verify_tree"
          git worktree add --detach "$verify_tree" "refs/remotes/origin/${RUNTIME_BRANCH}"
          unauthorized_root="$(git -C "$verify_tree" ls-files | grep -v '^data/' || true)"
          test -z "$unauthorized_root"
          python -m src.runtime_v3.publication_verify --data-dir "$verify_tree/data" --profile exhaustive_precompute --source-commit "$SOURCE_COMMIT"
          diff -qr "$RUNNER_TEMP/runtime-publish/data" "$verify_tree/data"
