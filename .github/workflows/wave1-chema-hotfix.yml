name: Repository required verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-v6-ci.lock
      - name: Install V6 CI dependencies
        run: python -m pip install --require-hashes -r requirements-v6-ci.lock
      - name: Verify Wave 1 deterministic identity contracts
        run: |
          python -m pytest -q \
            tests/test_wave1_understat_identity.py \
            tests/test_data_platform_identity_wave_b_promoted_crosswalk.py
      - name: Verify V6 architecture and authority contracts
        run: |
          python -m src.runtime_v6.architecture_independence_validate
          python -m src.runtime_v6.authority_contract
