name: TEMP final V4 P0 attestation

on:
  push:
    branches:
      - codex/v4-official-fact-completeness-p0

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate governed architecture attestation
        run: python tools/v4_architecture_guard_attest.py
      - name: Persist attestation
        run: |
          if git diff --quiet -- config/architecture_guard_attestation.json; then
            echo "attestation already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/architecture_guard_attestation.json
          git commit -m "chore: refresh final V4 P0 architecture attestation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
