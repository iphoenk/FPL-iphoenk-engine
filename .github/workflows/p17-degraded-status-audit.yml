name: P17 degraded-status audit
on:
  push:
    branches:
      - audit/p17-degraded-status-2026-09-24
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 398a0609732eba0dbb1204ee196c5bab67cdfab9
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Exact targeted regressions
        run: |
          PYTHONPATH=. pytest -q tests/test_lineup_distributional_optimizer.py -k 'secondary_boundary_tie_falls_back_and_matches_scalar or fallback_budget_degrades_family_gw_to_scalar or bench_scalar_fallback_budget_fails_explicitly'
      - name: Full lineup optimizer suite
        run: |
          PYTHONPATH=. pytest -q tests/test_lineup_distributional_optimizer.py
      - name: Runner topology
        run: lscpu
