name: V5 Real Shadow Cycle

on:
  workflow_dispatch:
  push:
    branches: [v5-unified-engine]
    paths:
      - 'config/v5_shadow_trigger.json'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: v5-real-shadow-cycle
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  V3_SOURCE_BRANCH: main
  V3_RUNTIME_BRANCH: runtime-data
  V5_SHADOW_BRANCH: v5-shadow-runtime

jobs:
  shadow-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout V5 beta
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Enforce V5 canonical merged-PR provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V5_PROVENANCE_BRANCH=v5-unified-engine \
          V5_PROVENANCE_SHA="$(git rev-parse HEAD)" \
          python -m src.v5.canonical_provenance

      - name: Resolve deployed production baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$V3_SOURCE_BRANCH" "$V3_RUNTIME_BRANCH" --quiet
          AUTHORITY=$(python -c "import json; print(json.load(open('config/v5_convergence_manifest.json'))['baselines']['production_source_authority'])")
          test "$AUTHORITY" = "runtime-data:data/runtime_manifest.json#source_commit"
          BASELINE_SHA=$(git show "origin/${V3_RUNTIME_BRANCH}:data/runtime_manifest.json" | python -c "import json,sys; print(json.load(sys.stdin)['source_commit'])")
          [[ "$BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${BASELINE_SHA}^{commit}"
          git merge-base --is-ancestor "$BASELINE_SHA" "origin/$V3_SOURCE_BRANCH"
          TRUTH_BASELINE=$(python -c "import json; print(json.load(open('config/v5_convergence_manifest.json'))['baselines']['production_truth'])")
          RUNTIME_LABEL=$(python -c "import json; print(json.load(open('config/v5_convergence_manifest.json'))['baselines']['production_runtime'])")
          TEAM_ID=$(python -c "import json; print(json.load(open('config/engine.json'))['team_id'])")
          echo "V3_SOURCE_SHA=$BASELINE_SHA" >> "$GITHUB_ENV"
          echo "V5_PRODUCTION_SOURCE_SHA=$BASELINE_SHA" >> "$GITHUB_ENV"
          echo "V3_TRUTH_BASELINE=$TRUTH_BASELINE" >> "$GITHUB_ENV"
          echo "V3_RUNTIME_LABEL=$RUNTIME_LABEL" >> "$GITHUB_ENV"
          echo "FPL_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "accepted_truth=$TRUTH_BASELINE runtime=$RUNTIME_LABEL deployed_sha=$BASELINE_SHA team_id=$TEAM_ID"

      - name: Hydrate prior V5 shadow state and verify V3 runtime snapshot
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$V3_SOURCE_BRANCH" "$V3_RUNTIME_BRANCH" "$V5_SHADOW_BRANCH"
          MAIN_HEAD="$(git rev-parse origin/$V3_SOURCE_BRANCH)"
          git merge-base --is-ancestor "$V3_SOURCE_SHA" "origin/$V3_SOURCE_BRANCH"
          if [ "$V3_SOURCE_SHA" != "$MAIN_HEAD" ]; then
            echo "Repository main is ahead of deployed production; shadow reference stays anchored to deployed runtime source $V3_SOURCE_SHA until runtime-data advances."
          fi

          runtime_manifest_tmp="$(mktemp)"
          git show "origin/${V3_RUNTIME_BRANCH}:data/runtime_manifest.json" > "$runtime_manifest_tmp"
          python - "$runtime_manifest_tmp" <<'PY' >> "$GITHUB_ENV"
          import json, os, sys
          manifest=json.load(open(sys.argv[1]))
          accepted=os.environ['V3_SOURCE_SHA']
          actual=str(manifest.get('source_commit') or '')
          if actual != accepted:
              raise SystemExit(f'runtime-data source_commit drift: accepted={accepted} runtime={actual}')
          print(f"V3_EXPECTED_RUNTIME_ENGINE_VERSION={manifest.get('engine_version')}")
          print(f"V3_EXPECTED_RUNTIME_SCHEMA_VERSION={manifest.get('engine_schema_version')}")
          PY
          rm -f "$runtime_manifest_tmp"

          mkdir -p .shadow data/v5
          if git cat-file -e "origin/${V5_SHADOW_BRANCH}:data/v5/latest.json" 2>/dev/null; then
            shadow_tmp="$(mktemp -d)"
            git archive "origin/${V5_SHADOW_BRANCH}" data/v5 | tar -x -C "$shadow_tmp"
            rm -rf data/v5
            cp -a "$shadow_tmp/data/v5" data/v5
            rm -rf "$shadow_tmp"
            echo "Hydrated prior V5 shadow state"
          else
            echo "No prior V5 shadow state; starting clean"
          fi

      - name: Generate fresh accepted V3 reference
        shell: bash
        env:
          FPL_AUTH_MODE: ${{ secrets.FPL_AUTH_MODE }}
          FPL_SESSION_B64: ${{ secrets.FPL_SESSION_B64 }}
          FPL_ACCESS_TOKEN: ${{ secrets.FPL_ACCESS_TOKEN }}
          FPL_REFRESH_TOKEN: ${{ secrets.FPL_REFRESH_TOKEN }}
          FPL_OIDC_TOKEN_URL: ${{ secrets.FPL_OIDC_TOKEN_URL }}
          FPL_OIDC_CLIENT_ID: ${{ secrets.FPL_OIDC_CLIENT_ID }}
          FPL_OIDC_CLIENT_SECRET: ${{ secrets.FPL_OIDC_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          v3_tree="$(mktemp -d)"
          trap 'git worktree remove --force "$v3_tree" >/dev/null 2>&1 || true; rm -rf "$v3_tree"' EXIT
          git worktree add --detach "$v3_tree" "$V3_SOURCE_SHA"
          mkdir -p "$v3_tree/data"

          python - "$v3_tree/config/runtime/runtime_publish_registry.json" <<'PY' > "$RUNNER_TEMP/v3-shadow-hydrate-paths.txt"
          import json, sys
          cfg=json.load(open(sys.argv[1]))
          for path in cfg.get('hydrate_paths', []):
              print(path)
          PY
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            if git cat-file -e "origin/${V3_RUNTIME_BRANCH}:data/${file}" 2>/dev/null; then
              mkdir -p "$v3_tree/data/$(dirname "$file")"
              git show "origin/${V3_RUNTIME_BRANCH}:data/${file}" > "$v3_tree/data/${file}"
              echo "Hydrated V3 reference state data/${file}"
            fi
          done < "$RUNNER_TEMP/v3-shadow-hydrate-paths.txt"

          (
            cd "$v3_tree"
            export PYTHONPATH="$v3_tree"
            python -m src.runtime_v3.domain_orchestrator --mode daily --stats --profile fast_decision
            python -m src.engines.source_contract_validate
            python -m src.engines.production_contract_validate
            python -m src.engines.watchlist_contract_validate
            python -m src.engines.report_serving_validate
            python -m src.engines.report_time_contract_validate
            python -m src.runtime_v3.performance_guard --profile fast_decision
          )
          cp "$v3_tree/data/latest.json" .shadow/v3_latest.json
          cp "$v3_tree/data/lineup_decision.json" .shadow/v3_lineup_decision.json
          python - <<'PY'
          import json, os
          latest=json.load(open('.shadow/v3_latest.json'))
          lineup=json.load(open('.shadow/v3_lineup_decision.json'))
          expected_version=str(os.environ['V3_EXPECTED_RUNTIME_ENGINE_VERSION'])
          expected_schema=int(os.environ['V3_EXPECTED_RUNTIME_SCHEMA_VERSION'])
          observed_version=str(latest.get('engine_version') or '')
          observed_schema=int(latest.get('schema_version') or 0)
          print({
            'reference_sha':os.environ['V3_SOURCE_SHA'],
            'truth_baseline':os.environ['V3_TRUTH_BASELINE'],
            'runtime_label':os.environ['V3_RUNTIME_LABEL'],
            'engine_version':observed_version,
            'schema_version':observed_schema,
            'generated_at':latest.get('generated_at'),
            'planning_gw':(latest.get('phase') or {}).get('planning_gw'),
            'formation':lineup.get('formation'),
            'captain':(lineup.get('captain') or {}).get('element') if isinstance(lineup.get('captain'),dict) else lineup.get('captain'),
          })
          assert observed_version == expected_version, (observed_version, expected_version)
          assert observed_schema == expected_schema, (observed_schema, expected_schema)
          PY

      - name: Start V5 bounded-context microservices
        env:
          FPL_AUTH_MODE: ${{ secrets.FPL_AUTH_MODE }}
          FPL_SESSION_B64: ${{ secrets.FPL_SESSION_B64 }}
          FPL_ACCESS_TOKEN: ${{ secrets.FPL_ACCESS_TOKEN }}
          FPL_REFRESH_TOKEN: ${{ secrets.FPL_REFRESH_TOKEN }}
          FPL_OIDC_TOKEN_URL: ${{ secrets.FPL_OIDC_TOKEN_URL }}
          FPL_OIDC_CLIENT_ID: ${{ secrets.FPL_OIDC_CLIENT_ID }}
          FPL_OIDC_CLIENT_SECRET: ${{ secrets.FPL_OIDC_CLIENT_SECRET }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: docker compose -f deploy/v5/docker-compose.yml up -d --build

      - name: Wait for V5 cluster health
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8100/health >/dev/null; then
              echo "V5 cluster is healthy"
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/v5/docker-compose.yml ps
          exit 1

      - name: Run accepted V3 versus V5 shadow cycle
        env:
          V5_SERVICE_INGESTION_URL: http://127.0.0.1:8101
          V5_SERVICE_TRUTH_URL: http://127.0.0.1:8102
          V5_SERVICE_PRICE_URL: http://127.0.0.1:8103
          V5_SERVICE_PREDICTION_URL: http://127.0.0.1:8104
          V5_SERVICE_DECISION_URL: http://127.0.0.1:8105
          V5_SERVICE_SNAPSHOT_URL: http://127.0.0.1:8106
          V5_SERVICE_EVALUATION_URL: http://127.0.0.1:8107
          V5_SERVICE_GOVERNANCE_URL: http://127.0.0.1:8108
          V5_SERVICE_REPORTING_URL: http://127.0.0.1:8109
          V5_SERVICE_WATCHLIST_URL: http://127.0.0.1:8110
        run: python -m src.v5.shadow_cycle

      - name: Validate shadow acceptance invariants, reporting and source health
        id: validate_shadow
        run: |
          python - <<'PY'
          import json, os
          p=json.load(open('data/v5/shadow/latest_shadow_cycle.json'))
          w=json.load(open('data/v5/dss_watchlist.json'))
          f=json.load(open('data/v5/framework_health.json'))
          trigger=json.load(open('config/v5_shadow_trigger.json'))
          source_cfg=json.load(open('config/intelligence/source_fusion.json'))
          source_acceptance=source_cfg.get('shadow_acceptance') or {}
          checks=p['operational_invariants']['checks']
          positions=w.get('positions') or {}
          position_counts={pos:len(positions.get(pos) or []) for pos in ('GK','DEF','MID','FWD')}
          core=f.get('dss_core') or {}
          ext=f.get('dss_extensions') or {}
          enh=f.get('enhancements') or {}
          user=p['v5'].get('user_report') or {}
          source=p['v5'].get('source_fusion_health') or {}
          api=source.get('api_football') or {}
          report_xi=((user.get('starting_xi') or {}).get('starting_xi') or [])
          expected_version=str(os.environ['V3_EXPECTED_RUNTIME_ENGINE_VERSION'])
          expected_schema=int(os.environ['V3_EXPECTED_RUNTIME_SCHEMA_VERSION'])
          allowed_api_unavailability={str(value) for value in source_acceptance.get('api_football_acceptable_unavailability_classes') or []}
          api_status=str(api.get('status') or '')
          api_class=str(api.get('availability_class') or '')
          accepted_api_unavailability=(
            api_status == 'UNAVAILABLE'
            and api_class in allowed_api_unavailability
            and api.get('fail_neutral') is True
          )
          print({
            'accepted_truth_baseline':os.environ['V3_TRUTH_BASELINE'],
            'accepted_runtime_label':os.environ['V3_RUNTIME_LABEL'],
            'accepted_runtime_engine_version':expected_version,
            'accepted_runtime_schema_version':expected_schema,
            'v3_engine_version':p['v3'].get('engine_version'),
            'cycle_pass':p['acceptance_progress']['cycle_pass'],
            'post_validation_status_before_finalize':p['acceptance_progress'].get('post_validation_status'),
            'parity':p['parity'],
            'operational_invariants':checks,
            'watchlist_position_counts':position_counts,
            'dss_core_counts':core.get('counts'),
            'dss_extension_counts':ext.get('counts'),
            'enhancement_counts':enh.get('counts'),
            'report_owned_count':(user.get('owned_squad') or {}).get('count'),
            'report_mode':user.get('report_mode'),
            'report_xi_count':len(report_xi),
            'source_fusion':source,
            'api_football_acceptance':{
              'status':api_status,
              'availability_class':api_class,
              'accepted_external_unavailability':accepted_api_unavailability,
            },
          })
          assert str(p['v3'].get('engine_version') or '') == expected_version, (p['v3'].get('engine_version'), expected_version)
          assert all(checks.values()), f'V5 operational invariant failure: {checks}'
          assert all(position_counts[pos] == 5 for pos in position_counts), f'watchlist positional contract failed: {position_counts}'
          assert core.get('counts') == {'ACTIVE':50}, f'DSS core must be 50/50 ACTIVE: {core.get("counts")}'
          assert ext.get('counts') == {'ACTIVE':16}, f'DSS extensions must be 16/16 ACTIVE: {ext.get("counts")}'
          assert enh.get('counts') == {'ACTIVE':8}, f'Enhancements must be 8/8 ACTIVE: {enh.get("counts")}'
          assert p['parity']['pass'] is True, f"accepted V3/V5 parity failed: {p['parity']}"
          assert p['acceptance_progress']['cycle_pass'] is True, 'core shadow cycle must pass before postvalidation'
          assert p['acceptance_progress']['counts_as_successful_acceptance_cycle'] is False, 'cycle must not count before postvalidation finalizer'
          if trigger.get('require_reporting_contract', False):
            assert (user.get('owned_squad') or {}).get('count') == 15, user.get('owned_squad')
            if user.get('report_mode') == 'FULL_DECISION':
              assert len(report_xi) == 11, f'FULL_DECISION must publish 11 starters, got {len(report_xi)}'
            assert (user.get('external_watchlist') or {}).get('candidate_count') == 20, 'report must consume native watchlist payload'
          if trigger.get('require_source_fusion_observability', False):
            assert source.get('status') in {'ACTIVE','DEGRADED'}, source
            assert api_status in {'ACTIVE','DEGRADED'} or accepted_api_unavailability, api
            if source_acceptance.get('require_api_football_credential', True):
              assert api.get('credential_present') is True, 'API-Football credential was not received by Ingestion'
            if source_acceptance.get('require_competition_attempt', True):
              assert int(api.get('competitions_attempted') or 0) > 0, api
            if source_acceptance.get('require_network_or_cache_evidence', True):
              assert int(api.get('network_requests') or 0) + int(api.get('cache_hits') or 0) > 0, api
          PY

      - name: Finalize postvalidated acceptance accounting
        id: finalize_acceptance
        run: python -m src.v5.shadow_acceptance

      - name: Build compact season analytics mart
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('data/v5')
          analytics = root / 'analytics'
          analytics.mkdir(parents=True, exist_ok=True)
          ledger_path = root / 'prediction_ledger.json'
          accuracy_path = root / 'prediction_accuracy.json'
          acceptance_path = Path('config/v5_acceptance_registry.json')
          persistence_path = Path('config/v5_persistence_registry.json')

          ledger = json.loads(ledger_path.read_text(encoding='utf-8')) if ledger_path.exists() else {'records': {}}
          accuracy = json.loads(accuracy_path.read_text(encoding='utf-8')) if accuracy_path.exists() else {}
          acceptance = json.loads(acceptance_path.read_text(encoding='utf-8'))
          persistence = json.loads(persistence_path.read_text(encoding='utf-8'))
          gate = acceptance.get('prediction_calibration_gate') or {}
          storage_cfg = persistence.get('evidence_storage') or {}
          history_retention = (persistence.get('write_policy') or {}).get('history_retention') or {}
          records = ledger.get('records') if isinstance(ledger.get('records'), dict) else {}

          facts = []
          gw_metrics = []
          for key, record in records.items():
              if not isinstance(record, dict) or record.get('status') != 'SETTLED':
                  continue
              gw = int(record.get('gw') or key)
              forecast = (record.get('frozen_forecast') or {}).get('players') or []
              actual = (record.get('actual') or {}).get('players') or []
              amap = {int(row.get('element')): row for row in actual if isinstance(row, dict) and row.get('element') is not None}
              metrics = record.get('metrics') if isinstance(record.get('metrics'), dict) else {}
              gw_metrics.append({'gw': gw, **metrics})
              for row in forecast:
                  if not isinstance(row, dict) or row.get('element') is None:
                      continue
                  element = int(row['element'])
                  observed = amap.get(element)
                  if observed is None:
                      continue
                  xpts = float(row.get('xpts') or 0.0)
                  xmins = float(row.get('xmins') or 0.0)
                  points = float(observed.get('points') or 0.0)
                  minutes = float(observed.get('minutes') or 0.0)
                  start_probability = float(row.get('start_probability') or 0.0)
                  clean_sheet_probability = float(row.get('clean_sheet_probability') or 0.0)
                  started = observed.get('started')
                  clean_sheet = observed.get('clean_sheet')
                  facts.append({
                      'gw': gw,
                      'element': element,
                      'name': row.get('name'),
                      'position': row.get('position'),
                      'xpts': xpts,
                      'actual_points': points,
                      'points_error': round(points - xpts, 4),
                      'points_abs_error': round(abs(points - xpts), 4),
                      'xmins': xmins,
                      'actual_minutes': minutes,
                      'xmins_error': round(minutes - xmins, 2),
                      'xmins_abs_error': round(abs(minutes - xmins), 2),
                      'start_probability': start_probability,
                      'started': started,
                      'starter_brier_component': round((start_probability - float(started)) ** 2, 6) if started is not None else None,
                      'clean_sheet_probability': clean_sheet_probability,
                      'clean_sheet': clean_sheet,
                      'clean_sheet_brier_component': round((clean_sheet_probability - float(clean_sheet)) ** 2, 6) if clean_sheet is not None else None,
                      'forecast_generated_at': (record.get('frozen_forecast') or {}).get('generated_at'),
                      'settled_at': (record.get('actual') or {}).get('settled_at'),
                  })

          facts.sort(key=lambda row: (row['gw'], row['element']))
          gw_metrics.sort(key=lambda row: row['gw'])
          with (analytics / 'player_gw_fact.jsonl').open('w', encoding='utf-8') as handle:
              for row in facts:
                  handle.write(json.dumps(row, sort_keys=True, separators=(',', ':')) + '\n')
          (analytics / 'gw_metrics.json').write_text(json.dumps({'rows': gw_metrics}, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          overall = accuracy.get('overall') if isinstance(accuracy.get('overall'), dict) else {}
          settled = accuracy.get('settled_gameweeks') if isinstance(accuracy.get('settled_gameweeks'), list) else []
          readiness = {
              'settled_gameweeks': len(settled),
              'minimum_settled_gameweeks': int(gate.get('minimum_settled_gameweeks') or 0),
              'player_gw_samples': int(overall.get('sample_size') or 0),
              'minimum_player_gw_samples': int(gate.get('minimum_player_gw_samples') or 0),
              'starter_samples': int(overall.get('starter_sample_size') or 0),
              'minimum_starter_samples': int(gate.get('minimum_starter_samples') or 0),
              'clean_sheet_samples': int(overall.get('clean_sheet_sample_size') or 0),
              'minimum_clean_sheet_samples': int(gate.get('minimum_clean_sheet_samples') or 0),
              'temporal_guard_pass': bool((accuracy.get('temporal_guard') or {}).get('pass')),
              'frozen_baseline_non_regression': bool((accuracy.get('baseline_comparison') or {}).get('pass')),
          }
          readiness['sample_thresholds_pass'] = (
              readiness['settled_gameweeks'] >= readiness['minimum_settled_gameweeks']
              and readiness['player_gw_samples'] >= readiness['minimum_player_gw_samples']
              and readiness['starter_samples'] >= readiness['minimum_starter_samples']
              and readiness['clean_sheet_samples'] >= readiness['minimum_clean_sheet_samples']
          )
          summary = {
              'schema_version': 1,
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'model': 'V5_COMPACT_PREDICTION_ANALYTICS_MART_V1',
              'fact_rows': len(facts),
              'settled_gameweeks': settled,
              'readiness': readiness,
              'overall_metrics': overall,
              'governance': {
                  'derived_from_canonical_frozen_prediction_ledger': True,
                  'retroactive_prediction_reconstruction_forbidden': True,
                  'mart_is_derived_not_prediction_authority': True,
              },
          }
          (analytics / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          storage = {
              'schema_version': 2,
              'policy': 'V5_EVIDENCE_STORAGE_POLICY_V2',
              'raw_actions_artifact_retention_days': int(storage_cfg.get('raw_actions_artifact_retention_days') or 0),
              'canonical_shadow_state_retention': storage_cfg.get('canonical_prediction_ledger_retention'),
              'compact_analytics_mart_retention': storage_cfg.get('compact_analytics_mart_retention'),
              'rolling_history_canonical': bool(storage_cfg.get('history_jsonl_is_canonical', False)),
              'rolling_history_max_age_days': int(history_retention.get('max_age_days') or 0),
              'rolling_history_max_records': int(history_retention.get('max_records') or 0),
              'rolling_history_max_bytes': int(history_retention.get('max_bytes') or 0),
              'postseason_review_window_days': int(storage_cfg.get('postseason_review_window_days') or 0),
              'dwh_mode': 'NOT_REQUIRED_AT_CURRENT_SCALE' if storage_cfg.get('external_dwh_required_now') is False else 'REQUIRED',
              'dwh_escalation_trigger': storage_cfg.get('external_dwh_trigger'),
              'expected_single_season_player_gw_rows': 'approximately 25000-30000',
              'notes': [
                  'Actions artifacts auto-expire; do not use them as canonical evidence.',
                  'Canonical frozen ledger and derived compact analytics remain on v5-shadow-runtime for the season.',
                  'Rolling history is noncanonical and bounded independently from canonical prediction evidence.',
                  'The analytics mart is rebuildable from the canonical ledger and may be deleted/rebuilt without changing prediction authority.'
              ],
          }
          (analytics / 'storage_policy.json').write_text(json.dumps(storage, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print({'fact_rows': len(facts), 'settled_gameweeks': settled, 'readiness': readiness, 'storage': storage})
          PY

      - name: Upload shadow-cycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-real-shadow-cycle-${{ github.run_number }}
          path: |
            .shadow/v3_latest.json
            .shadow/v3_lineup_decision.json
            data/v5/shadow/
            data/v5/analytics/
            data/v5/source_fusion.json
            data/v5/source_cache/
            data/v5/user_report.json
            data/v5/technical_appendix.json
            data/v5/framework_health.json
            data/v5/dss_watchlist.json
            data/v5/owned_challenger_comparator.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish isolated V5 shadow state
        shell: bash
        run: |
          set -euo pipefail
          test -f data/v5/shadow/latest_shadow_cycle.json || { echo "No completed cycle to publish"; exit 0; }
          runtime_tmp="$(mktemp -d)"
          publish_tree="$(mktemp -d)"
          trap 'git worktree remove --force "$publish_tree" >/dev/null 2>&1 || true; rm -rf "$runtime_tmp" "$publish_tree"' EXIT
          cp -a data/v5 "$runtime_tmp/v5"
          git config user.name "fpl-iphoenk-shadow-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin "$V5_SHADOW_BRANCH"
          git worktree add --detach "$publish_tree" "origin/$V5_SHADOW_BRANCH"
          cd "$publish_tree"
          rm -rf data/v5
          mkdir -p data
          cp -a "$runtime_tmp/v5" data/v5
          git add data/v5
          if git diff --cached --quiet; then
            echo "No shadow-state changes"
            exit 0
          fi
          git commit -m "shadow: record postvalidated V3 V5 cycle $GITHUB_RUN_NUMBER [skip ci]"
          git push origin HEAD:"$V5_SHADOW_BRANCH"

      - name: Stop V5 cluster
        if: always()
        run: docker compose -f deploy/v5/docker-compose.yml down -v
