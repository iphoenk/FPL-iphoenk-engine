name: V4 temporary red-audit hardening

on:
  push:
    branches:
      - codex/v4-red-audit-hardening

permissions:
  contents: read

concurrency:
  group: v4-red-audit-hardening-temp
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/v4-red-audit-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply guarded hardening migration
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tools/v4_red_audit_hardening_apply.py
      - name: Rebuild architecture attestation from final governed bytes
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tools/v4_architecture_guard_attest.py
      - name: Export validated changed files
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/red-hardening"
          git diff --name-only | grep -v '^\.github/workflows/v4-red-audit-hardening-temp.yml$' | grep -v '^tools/v4_red_audit_hardening_apply.py$' > "$RUNNER_TEMP/red-hardening/files.txt"
          while IFS= read -r file; do
            mkdir -p "$RUNNER_TEMP/red-hardening/$(dirname "$file")"
            cp "$file" "$RUNNER_TEMP/red-hardening/$file"
          done < "$RUNNER_TEMP/red-hardening/files.txt"
          git diff -- . ':!.github/workflows/v4-red-audit-hardening-temp.yml' ':!tools/v4_red_audit_hardening_apply.py' > "$RUNNER_TEMP/red-hardening/hardening.patch"
      - name: Upload validated hardening bundle
        uses: actions/upload-artifact@v7
        with:
          name: v4-red-hardening-bundle
          path: ${{ runner.temp }}/red-hardening
          if-no-files-found: error
          retention-days: 7
