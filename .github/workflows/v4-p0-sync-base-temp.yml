name: TEMP V4 P0 sync latest base

on:
  push:
    branches:
      - codex/v4-official-fact-completeness-p0

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/v4-official-fact-completeness-p0
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Merge latest canonical V4 base
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin v4-prediction-engine
          if ! git merge --no-edit origin/v4-prediction-engine; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'conflicts=%s\n' "${conflicts[*]}"
            if [ "${#conflicts[@]}" -ne 1 ] || [ "${conflicts[0]}" != "config/architecture_guard_attestation.json" ]; then
              echo "Unexpected merge conflict set; refusing automatic resolution"
              exit 1
            fi
            git checkout --ours config/architecture_guard_attestation.json
            git add config/architecture_guard_attestation.json
            git commit --no-edit
          fi
      - name: Regenerate governed architecture attestation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python tools/v4_architecture_guard_attest.py
          git add config/architecture_guard_attestation.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh architecture attestation after base sync"
          fi
      - name: Push synchronized branch
        run: git push origin HEAD:codex/v4-official-fact-completeness-p0
