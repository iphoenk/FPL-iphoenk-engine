name: TEMP V4 Understat structural identity verification

on:
  push:
    branches:
      - fix/v4-official-understat-player-mapping-20260902

permissions:
  contents: write

jobs:
  patch-attest-test-live-proof:
    if: ${{ !contains(github.event.head_commit.message, '[identity-green]') && !contains(github.event.head_commit.message, '[structural-diagnostic]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v4-official-understat-player-mapping-20260902
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Apply generic structural identity patch
        run: PYTHONPATH=. python tools/temp_v4_understat_structural_identity_patch.py
      - name: Regenerate governed V4 architecture attestation
        run: PYTHONPATH=. python tools/v4_architecture_guard_attest.py
      - name: Full regression
        run: PYTHONPATH=. python -m pytest -q --tb=short
      - name: Generate live Official to Understat proof
        run: PYTHONPATH=. python tools/temp_v4_understat_live_proof.py
      - name: Require truthful 100 percent acceptance
        shell: bash
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          proof = json.loads(Path('verification/v4_official_understat_identity_live_proof.json').read_text())
          acceptance = proof.get('acceptance') or {}
          print(json.dumps(acceptance, sort_keys=True))
          if not acceptance.get('all_green'):
              raise SystemExit('Official-Understat identity acceptance is not all green')
          PY
      - name: Commit proven structural mapping
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/intelligence/understat_tactical.py config/architecture_guard_attestation.json verification/v4_official_understat_identity_live_proof.json
          git commit -m "fix(v4): prove 100% Official-Understat crosswalk [identity-green]"
          git push origin HEAD:fix/v4-official-understat-player-mapping-20260902
