name: FPL iphoenk V3 compatibility marker

on:
  workflow_dispatch:

# Inert compatibility marker for architecture tooling during V3 migration.
# Active runtime scheduling is owned exclusively by v3-runtime.yml.
# Collector policy expressions retained here as documentation only:
# cron: "30 * * * *"
# cron: "15 * * * *"
# cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: read

jobs:
  compatibility-notice:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "V3 runtime is unified in .github/workflows/v3-runtime.yml"
