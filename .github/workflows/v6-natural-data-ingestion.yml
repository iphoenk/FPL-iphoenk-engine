name: FPL V6 hourly fresh-data acquisition

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Governed V6 invocation mode"
        required: true
        default: "master_orchestrated"
        type: choice
        options:
          - master_orchestrated
          - manual_recovery
          - report_prefetch
      reason:
        description: "Audit reason for governed V6 invocation"
        required: true
        type: string
      confirm:
        description: "For manual_recovery only: type RECOVER_V6"
        required: false
        type: string
      report_kind:
        description: "For report_prefetch: full_master, match_mode, deadline_review, ad_hoc, historical_backfill, or 05:30_price"
        required: false
        type: string
      logical_slot:
        description: "For normal report_prefetch: timezone-aware ISO-8601 logical report slot"
        required: false
        type: string
      scope:
        description: "For ad_hoc or historical_backfill scope"
        required: false
        type: string
      gw_from:
        description: "For historical_backfill: first completed GW, inclusive"
        required: false
        type: string
      gw_to:
        description: "For historical_backfill: last completed GW, inclusive"
        required: false
        type: string
      force:
        description: "Governed force retry for report_prefetch"
        required: false
        default: false
        type: boolean
  issue_comment:
    types: [created]
  schedule:
    - cron: "23 * * * *"
    - cron: "53 * * * *"

permissions:
  contents: read

concurrency:
  group: fpl-v6-hourly-data-ingestion
  cancel-in-progress: false

env:
  RUNTIME_BRANCH: runtime-data-v6
  V6_SCHEDULE_POLICY: config/v6/schedule_policy.json

jobs:
  collect:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.number == 431 &&
        github.actor == github.repository_owner &&
        (
          startsWith(github.event.comment.body, '/v6-master-acquire') ||
          startsWith(github.event.comment.body, '/v6-report-prefetch')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.slot_guard.outputs.skip }}
      schedule_kind: ${{ steps.scheduler.outputs.kind }}
    env:
      V6_PREVIOUS_MANIFEST: /tmp/v6-previous-manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Authorize governed manual recovery and FPL Master orchestration
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          V6_DISPATCH_MODE: ${{ inputs.mode }}
          V6_DISPATCH_REASON: ${{ inputs.reason }}
          V6_MANUAL_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          policy = json.loads(Path(os.environ["V6_SCHEDULE_POLICY"]).read_text(encoding="utf-8"))
          mode = str(os.environ.get("V6_DISPATCH_MODE") or "")
          reason = str(os.environ.get("V6_DISPATCH_REASON") or "").strip()
          if os.environ.get("GITHUB_ACTOR") != os.environ.get("GITHUB_REPOSITORY_OWNER"):
              raise SystemExit("V6 governed dispatch is restricted to the repository owner")
          if not reason:
              raise SystemExit("V6 governed dispatch requires an audit reason")
          if mode == "master_orchestrated":
              control = dict(policy.get("master_orchestrated") or {})
              if control.get("enabled") is not True or control.get("authoritative_runtime_snapshot") is not True:
                  raise SystemExit("V6 master orchestration is not authorized")
          elif mode == "manual_recovery":
              control = dict(policy.get("manual_recovery") or {})
              if control.get("enabled") is not True:
                  raise SystemExit("V6 governed manual recovery is disabled")
              if os.environ.get("V6_MANUAL_CONFIRM") != str(control.get("confirmation_phrase") or ""):
                  raise SystemExit("V6 manual recovery confirmation phrase mismatch")
          elif mode == "report_prefetch":
              control = dict(policy.get("report_prefetch") or {})
              if control.get("enabled") is not True or control.get("report_driven") is not True:
                  raise SystemExit("V6 report prefetch is disabled")
              if control.get("independent_cron") is not False:
                  raise SystemExit("V6 report prefetch policy must prohibit independent cron")
          else:
              raise SystemExit(f"Unsupported V6 governed dispatch mode: {mode}")
          print(f"Governed V6 {mode} dispatch authorized")
          PY

      - name: Authorize FPL Master issue-command orchestration
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          V6_COMMENT_BODY: ${{ github.event.comment.body }}
          V6_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import shlex
          from pathlib import Path

          policy = json.loads(Path(os.environ["V6_SCHEDULE_POLICY"]).read_text(encoding="utf-8"))
          tokens = shlex.split(str(os.environ.get("V6_COMMENT_BODY") or "").strip())
          command = tokens[0] if tokens else ""
          master = dict(policy.get("master_orchestrated") or {})
          prefetch = dict(policy.get("report_prefetch") or {})
          if command == str(master.get("issue_comment_command") or ""):
              control, label = master, "Master acquisition"
          elif command == str(prefetch.get("issue_comment_command") or ""):
              control, label = prefetch, "report prefetch"
          else:
              raise SystemExit("V6 governed issue command mismatch")
          if control.get("enabled") is not True:
              raise SystemExit(f"V6 {label} is disabled")
          if os.environ.get("GITHUB_ACTOR") != os.environ.get("GITHUB_REPOSITORY_OWNER"):
              raise SystemExit("V6 governed issue command is restricted to repository owner")
          if int(os.environ.get("V6_ISSUE_NUMBER") or "0") != int(control.get("control_issue_number") or 0):
              raise SystemExit("V6 governed control issue number mismatch")
          print(f"Governed V6 {label} issue-command authorized")
          PY

      - name: Hydrate previous V6 last-good snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf data/v6
          mkdir -p data
          if git fetch --depth=1 origin "+refs/heads/${RUNTIME_BRANCH}:refs/remotes/origin/${RUNTIME_BRANCH}"; then
            if git cat-file -e "origin/${RUNTIME_BRANCH}:data/v6" 2>/dev/null; then
              git archive "origin/${RUNTIME_BRANCH}" data/v6 | tar -x -C .
              echo "Hydrated previous runtime-data-v6 snapshot"
            else
              echo "runtime-data-v6 exists without data/v6; starting clean"
            fi
          else
            echo "runtime-data-v6 not available yet; starting clean"
          fi
          if [[ -f data/v6/manifest.json ]]; then
            cp data/v6/manifest.json "${V6_PREVIOUS_MANIFEST}"
          else
            printf '{}\n' > "${V6_PREVIOUS_MANIFEST}"
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-v6.lock

      - name: Classify scheduler invocation
        id: scheduler
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import shlex
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          policy = json.loads(Path(os.environ["V6_SCHEDULE_POLICY"]).read_text(encoding="utf-8"))
          event_name = str(os.environ.get("GITHUB_EVENT_NAME") or "")
          schedule = str(event.get("schedule") or "")
          scheduled_kinds = {
              str(policy["primary_cron_utc"]): "primary",
              str(policy["recovery_cron_utc"]): "recovery",
          }
          if event_name == "schedule":
              kind = scheduled_kinds.get(schedule, "scheduled_unknown")
          elif event_name == "issue_comment":
              master = dict(policy.get("master_orchestrated") or {})
              prefetch = dict(policy.get("report_prefetch") or {})
              tokens = shlex.split(str((event.get("comment") or {}).get("body") or "").strip())
              command = tokens[0] if tokens else ""
              if command == str(master.get("issue_comment_command") or ""):
                  kind = str(master.get("schedule_kind") or "master_orchestrated")
              elif command == str(prefetch.get("issue_comment_command") or ""):
                  kind = str(prefetch.get("schedule_kind") or "report_prefetch")
              else:
                  kind = "governed_issue_command_unknown"
          elif event_name == "workflow_dispatch":
              mode = str((event.get("inputs") or {}).get("mode") or "")
              if mode == "master_orchestrated" and (policy.get("master_orchestrated") or {}).get("enabled") is True:
                  kind = str((policy.get("master_orchestrated") or {}).get("schedule_kind") or "master_orchestrated")
              elif mode == "manual_recovery" and (policy.get("manual_recovery") or {}).get("enabled") is True:
                  kind = str((policy.get("manual_recovery") or {}).get("schedule_kind") or "manual_recovery")
              elif mode == "report_prefetch" and (policy.get("report_prefetch") or {}).get("enabled") is True:
                  kind = str((policy.get("report_prefetch") or {}).get("schedule_kind") or "report_prefetch")
              else:
                  kind = "governed_dispatch_unknown"
          else:
              kind = "non_production_local"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"V6_SCHEDULE_KIND={kind}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"kind={kind}\n")
          print(f"V6 schedule kind: {kind}")
          PY

      - name: Guard already-published logical scheduler slot
        id: slot_guard
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from src.runtime_v6.registry import load_registry
          from src.runtime_v6.runtime_control import scheduled_slot_already_completed

          if os.environ.get("V6_SCHEDULE_KIND") == "report_prefetch":
              skip = False
          else:
              previous_path = Path(os.environ["V6_PREVIOUS_MANIFEST"])
              previous = json.loads(previous_path.read_text(encoding="utf-8")) if previous_path.exists() else {}
              registry = load_registry()
              interval = int((registry.get("cadence") or {}).get("scheduler_interval_minutes") or 60)
              skip = scheduled_slot_already_completed(
                  previous,
                  scheduler_interval_minutes=interval,
                  event_name=os.environ.get("GITHUB_EVENT_NAME"),
                  schedule_kind=os.environ.get("V6_SCHEDULE_KIND"),
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"skip={'true' if skip else 'false'}\n")
          print(f"logical scheduler slot already published: {skip}")
          PY

      - name: Install V6 locked runtime dependencies
        if: steps.slot_guard.outputs.skip != 'true'
        run: python -m pip install --require-hashes -r requirements-v6.lock

      - name: Validate V6 production preflight
        if: steps.slot_guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src/runtime_v6
          python -m src.runtime_v6.architecture_independence_validate
          python - <<'PY'
          from src.runtime_v6.registry import dependency_layers, load_registry
          registry = load_registry()
          assert registry["engine"] == "V6_FRESH_DATA_PLATFORM"
          assert registry["policy"]["data_only"] is True
          assert registry["policy"]["decision_authority"] == "NONE"
          assert registry["policy"]["prediction_authority"] == "NONE"
          assert registry["policy"]["optimizer_authority"] == "NONE"
          assert dependency_layers(registry)
          print({"active_sources": registry["activation"]["active_source_count"], "required_sources": registry["activation"]["required_active_sources"], "dependency_layers": dependency_layers(registry)})
          PY

      - name: Resolve governed V6 report-prefetch request
        if: steps.slot_guard.outputs.skip != 'true' && steps.scheduler.outputs.kind == 'report_prefetch'
        shell: bash
        env:
          V6_DISPATCH_REPORT_KIND: ${{ inputs.report_kind }}
          V6_DISPATCH_LOGICAL_SLOT: ${{ inputs.logical_slot }}
          V6_DISPATCH_SCOPE: ${{ inputs.scope }}
          V6_DISPATCH_GW_FROM: ${{ inputs.gw_from }}
          V6_DISPATCH_GW_TO: ${{ inputs.gw_to }}
          V6_DISPATCH_FORCE: ${{ inputs.force }}
          V6_COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import shlex
          from datetime import datetime
          from pathlib import Path

          policy = json.loads(Path(os.environ["V6_SCHEDULE_POLICY"]).read_text(encoding="utf-8"))
          prefetch = dict(policy.get("report_prefetch") or {})
          event_name = os.environ.get("GITHUB_EVENT_NAME")
          if event_name == "issue_comment":
              values = {}
              tokens = shlex.split(str(os.environ.get("V6_COMMENT_BODY") or ""))
              for token in tokens[1:]:
                  if "=" not in token:
                      raise SystemExit(f"Malformed report-prefetch token: {token}")
                  key, value = token.split("=", 1)
                  if key in values:
                      raise SystemExit(f"Duplicate report-prefetch argument: {key}")
                  values[key] = value
              unknown = set(values) - {"report_kind", "logical_slot", "scope", "gw_from", "gw_to", "force", "reason"}
              if unknown:
                  raise SystemExit(f"Unsupported report-prefetch arguments: {sorted(unknown)}")
              if not str(values.get("reason") or "").strip():
                  raise SystemExit("Issue-command report prefetch requires reason=<audit reason>")
          else:
              values = {
                  "report_kind": os.environ.get("V6_DISPATCH_REPORT_KIND") or "",
                  "logical_slot": os.environ.get("V6_DISPATCH_LOGICAL_SLOT") or "",
                  "scope": os.environ.get("V6_DISPATCH_SCOPE") or "",
                  "gw_from": os.environ.get("V6_DISPATCH_GW_FROM") or "",
                  "gw_to": os.environ.get("V6_DISPATCH_GW_TO") or "",
                  "force": os.environ.get("V6_DISPATCH_FORCE") or "false",
              }

          report_kind = str(values.get("report_kind") or "").strip()
          if report_kind not in set(prefetch.get("supported_report_kinds") or []):
              raise SystemExit(f"Unsupported report_kind={report_kind}")
          historical = report_kind == "historical_backfill"
          logical_slot = str(values.get("logical_slot") or "").strip()
          scope_raw = str(values.get("scope") or "").strip()
          scopes = [part.strip() for part in scope_raw.split(",") if part.strip()]
          aliases = {"mini": "mini_league", "league": "mini_league"}
          scopes = [aliases.get(scope, scope) for scope in scopes]
          if len(scopes) != len(set(scopes)):
              raise SystemExit("report-prefetch scope contains duplicates")
          unknown_scopes = set(scopes) - {"personal", "mini_league", "live"}
          if unknown_scopes:
              raise SystemExit(f"Unsupported report-prefetch scopes: {sorted(unknown_scopes)}")

          gw_from = ""
          gw_to = ""
          if historical:
              if logical_slot:
                  raise SystemExit("historical_backfill does not accept logical_slot")
              if scopes != ["mini_league"]:
                  raise SystemExit("historical_backfill requires scope=mini_league")
              try:
                  gw_from_value = int(str(values.get("gw_from") or ""))
                  gw_to_value = int(str(values.get("gw_to") or ""))
              except ValueError as exc:
                  raise SystemExit("historical_backfill requires integer gw_from and gw_to") from exc
              if gw_from_value < 1 or gw_to_value < 1 or gw_from_value > gw_to_value:
                  raise SystemExit("historical_backfill GW range is invalid")
              gw_from, gw_to = str(gw_from_value), str(gw_to_value)
          else:
              if values.get("gw_from") or values.get("gw_to"):
                  raise SystemExit("gw_from/gw_to are valid only for historical_backfill")
              if not logical_slot:
                  raise SystemExit("report-prefetch logical_slot is required")
              parsed = datetime.fromisoformat(logical_slot)
              if parsed.tzinfo is None or parsed.utcoffset() is None:
                  raise SystemExit("report-prefetch logical_slot must include timezone offset")
              if report_kind != "ad_hoc" and scopes:
                  raise SystemExit("scope override is allowed only for ad_hoc report prefetch")
              if report_kind == "ad_hoc" and not scopes:
                  raise SystemExit("ad_hoc report prefetch requires a non-empty scope")

          force_raw = str(values.get("force") or "false").strip().lower()
          if force_raw not in {"true", "false", "1", "0", "yes", "no"}:
              raise SystemExit("force must be boolean")
          force = force_raw in {"true", "1", "yes"}
          env = {
              "V6_PREFETCH_REPORT_KIND": report_kind,
              "V6_PREFETCH_LOGICAL_SLOT": logical_slot,
              "V6_PREFETCH_PERSONAL": "true" if "personal" in scopes else "false",
              "V6_PREFETCH_MINI_LEAGUE": "true" if "mini_league" in scopes else "false",
              "V6_PREFETCH_LIVE": "true" if "live" in scopes else "false",
              "V6_PREFETCH_GW_FROM": gw_from,
              "V6_PREFETCH_GW_TO": gw_to,
              "V6_PREFETCH_FORCE": "true" if force else "false",
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              for key, value in env.items():
                  handle.write(f"{key}={value}\n")
          print({"report_kind": report_kind, "logical_slot": logical_slot, "scope": scopes, "gw_from": gw_from, "gw_to": gw_to, "force": force})
          PY

      - name: Run active V6 acquisition cycle
        if: steps.slot_guard.outputs.skip != 'true' && steps.scheduler.outputs.kind != 'report_prefetch'
        run: python -m src.runtime_v6.collector

      - name: Apply V6 scheduler and missed-cycle health
        if: steps.slot_guard.outputs.skip != 'true' && steps.scheduler.outputs.kind != 'report_prefetch'
        run: python -m src.runtime_v6.runtime_control

      - name: Run report-driven V6 personal and mini-league prefetch
        if: steps.slot_guard.outputs.skip != 'true' && steps.scheduler.outputs.kind == 'report_prefetch'
        shell: bash
        env:
          FPL_AUTH_MODE: ${{ vars.FPL_AUTH_MODE || 'disabled' }}
          FPL_SESSION_B64: ${{ secrets.FPL_SESSION_B64 }}
          FPL_ACCESS_TOKEN: ${{ secrets.FPL_ACCESS_TOKEN }}
          FPL_TEAM_ID: ${{ vars.FPL_TEAM_ID }}
          FPL_PRIORITY_LEAGUES: ${{ vars.FPL_PRIORITY_LEAGUES }}
        run: |
          set -euo pipefail
          if [[ "$V6_PREFETCH_REPORT_KIND" == "historical_backfill" ]]; then
            args=(--gw-from "$V6_PREFETCH_GW_FROM" --gw-to "$V6_PREFETCH_GW_TO" --requested-by "FPL_MASTER_MONITOR")
            [[ "$V6_PREFETCH_FORCE" == "true" ]] && args+=(--force)
            set +e
            python -m src.runtime_v6.historical_backfill "${args[@]}"
            rc=$?
            set -e
          else
            args=(
              --report-kind "$V6_PREFETCH_REPORT_KIND"
              --logical-slot "$V6_PREFETCH_LOGICAL_SLOT"
              --requested-by "FPL_MASTER_MONITOR"
              --requested-for-report "$V6_PREFETCH_REPORT_KIND"
            )
            [[ "$V6_PREFETCH_PERSONAL" == "true" ]] && args+=(--personal)
            [[ "$V6_PREFETCH_MINI_LEAGUE" == "true" ]] && args+=(--mini-league)
            [[ "$V6_PREFETCH_LIVE" == "true" ]] && args+=(--live)
            [[ "$V6_PREFETCH_FORCE" == "true" ]] && args+=(--force)
            set +e
            python -m src.runtime_v6.report_prefetch "${args[@]}"
            rc=$?
            set -e
          fi
          if [[ $rc -ne 0 && $rc -ne 3 ]]; then
            exit "$rc"
          fi
          echo "V6 report-prefetch process exit=$rc; published health truth controls completeness"

      - name: Validate V6 publish-tree integrity
        if: steps.slot_guard.outputs.skip != 'true'
        run: python -m src.runtime_v6.publish_integrity

      - name: Validate publishable V6 manifest
        if: steps.slot_guard.outputs.skip != 'true'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from src.runtime_v6.registry import load_registry

          manifest = json.loads(Path("data/v6/manifest.json").read_text())
          integrity = json.loads(Path("data/v6/health/publish_integrity.json").read_text())
          identity = json.loads(Path("data/v6/evidence/player_identity_map.json").read_text())
          registry = load_registry()
          assert manifest["source_count"] == registry["activation"]["active_source_count"]
          assert manifest["activation"]["required_active_sources"] == registry["activation"]["required_active_sources"]
          assert manifest["governance"]["data_only"] is True
          assert manifest["governance"]["decision_authority"] == "NONE"
          assert manifest["governance"]["weather_direct_xpts_multiplier"] is False
          assert manifest["governance"]["production_authoritative_snapshots_require_schedule"] is False
          assert manifest["governance"]["production_authoritative_snapshots_require_governed_trigger"] is True
          assert manifest["governance"]["master_orchestrated_is_authoritative"] is True
          assert manifest["governance"]["manual_recovery_is_authoritative"] is False
          assert manifest["governance"]["single_logical_acquisition_per_scheduler_slot"] is True
          assert manifest["governance"]["scheduled_recovery_is_idempotent"] is True
          assert manifest["governance"]["publish_integrity_required"] is True
          assert manifest["governance"]["identity_mapping_is_deterministic_only"] is True
          assert manifest["governance"]["fuzzy_identity_matching"] is False
          assert identity["governance"]["fuzzy_name_matching_allowed"] is False
          assert integrity["status"] == "PASS", integrity
          assert integrity["current_source_files_exact"] is True
          assert integrity["resolved_registry_exact"] is True
          assert integrity["identity_map_consistent"] is True

          event_name = os.environ["GITHUB_EVENT_NAME"]
          schedule_kind = os.environ["V6_SCHEDULE_KIND"]
          if schedule_kind == "report_prefetch":
              report_kind = os.environ["V6_PREFETCH_REPORT_KIND"]
              if report_kind == "historical_backfill":
                  history = json.loads(Path("data/v6/health/historical_backfill.json").read_text(encoding="utf-8"))
                  assert history["report_kind"] == "historical_backfill"
                  assert history["scope"] == "mini_league"
                  assert history["gw_from"] == int(os.environ["V6_PREFETCH_GW_FROM"])
                  assert history["gw_to"] == int(os.environ["V6_PREFETCH_GW_TO"])
                  assert history["cohort_semantics"] == "CURRENT_COHORT_HISTORY"
                  assert history["governance"]["data_only"] is True
                  assert history["governance"]["decision_authority"] == "NONE"
                  assert history["governance"]["prediction_authority"] == "NONE"
                  assert history["governance"]["optimizer_authority"] == "NONE"
                  assert history["governance"]["bayesian_authority"] == "NONE"
                  assert history["governance"]["monte_carlo_authority"] == "NONE"
                  assert history["overall_status"] in {"GREEN", "AMBER"}
                  print(json.dumps({"historical_backfill": history, "publish_integrity": integrity}, indent=2))
              else:
                  prefetch = json.loads(Path("data/v6/report_prefetch/latest.json").read_text(encoding="utf-8"))
                  health = json.loads(Path("data/v6/health/report_prefetch.json").read_text(encoding="utf-8"))
                  assert prefetch["report_kind"] == report_kind
                  assert prefetch["target_logical_report_slot"] == os.environ["V6_PREFETCH_LOGICAL_SLOT"]
                  assert prefetch["governance"]["data_only"] is True
                  assert prefetch["governance"]["decision_authority"] == "NONE"
                  assert prefetch["governance"]["prediction_authority"] == "NONE"
                  assert prefetch["governance"]["optimizer_authority"] == "NONE"
                  assert prefetch["governance"]["independent_prefetch_cron"] is False
                  assert prefetch["governance"]["core_source_freshness_separate"] is True
                  assert prefetch["governance"]["report_prefetch_freshness_separate"] is True
                  assert health["fresh_for_target_report"] == prefetch["fresh_for_target_report"]
                  if report_kind == "05:30_price":
                      assert prefetch["personal_requested"] is False
                      assert prefetch["mini_league_requested"] is False
                      assert prefetch["live_requested"] is False
                      assert prefetch["personal_status"] == "NOT_REFRESHED_FOR_05_30_PRICE_CHECKPOINT"
                      assert prefetch["telemetry"]["request_count"] == 0
                  print(json.dumps({"report_prefetch": prefetch, "publish_integrity": integrity}, indent=2))
          else:
              control = manifest["runtime_control"]
              assert control["event_name"] == event_name
              assert control["schedule_kind"] == schedule_kind
              if event_name == "schedule":
                  assert control["scheduled_cycle"] is True
                  assert control["authoritative_runtime_snapshot"] is True
                  assert control["manual_recovery"] is False
                  assert manifest["governance"]["production_ingestion_schedule_only"] is True
              elif event_name in {"workflow_dispatch", "issue_comment"} and schedule_kind == "master_orchestrated":
                  assert control["scheduled_cycle"] is False
                  assert control["master_orchestrated"] is True
                  assert control["authoritative_runtime_snapshot"] is True
                  assert control["manual_recovery"] is False
                  assert control["counts_as_completed_operational_slot"] is True
                  assert "NON_AUTHORITATIVE_MANUAL_RECOVERY" not in manifest["control_failures"]
              elif event_name == "workflow_dispatch" and schedule_kind == "manual_recovery":
                  assert control["scheduled_cycle"] is False
                  assert control["master_orchestrated"] is False
                  assert control["authoritative_runtime_snapshot"] is False
                  assert control["manual_recovery"] is True
                  assert "NON_AUTHORITATIVE_MANUAL_RECOVERY" in manifest["control_failures"]
              else:
                  raise AssertionError(f"unexpected V6 production event: {event_name}/{schedule_kind}")
              print(json.dumps({"overall": manifest["overall"], "elapsed_ms": manifest["elapsed_ms"], "runtime_control": control, "publish_integrity": integrity}, indent=2))
          PY

      - name: Package verified runtime snapshot
        if: steps.slot_guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tar -C "$GITHUB_WORKSPACE" -cf "$RUNNER_TEMP/v6-runtime-data.tar" data/v6

      - name: Transfer verified runtime snapshot to isolated publisher
        if: steps.slot_guard.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v6-runtime-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v6-runtime-data.tar
          retention-days: 14
          if-no-files-found: error

  publish:
    needs: collect
    if: needs.collect.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: v6-runtime-publisher
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require dedicated V6 publisher app configuration
        shell: bash
        env:
          V6_RUNTIME_APP_ID: ${{ vars.V6_RUNTIME_APP_ID }}
          V6_RUNTIME_APP_PRIVATE_KEY: ${{ secrets.V6_RUNTIME_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$V6_RUNTIME_APP_ID"
          test -n "$V6_RUNTIME_APP_PRIVATE_KEY"
          echo "Dedicated V6 publisher app configuration present"

      - name: Mint governed V6 runtime publisher token
        id: runtime_app_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.V6_RUNTIME_APP_ID }}
          private-key: ${{ secrets.V6_RUNTIME_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: FPL-iphoenk-engine
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          token: ${{ steps.runtime_app_token.outputs.token }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Download verified runtime snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: v6-runtime-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v6-runtime-publication

      - name: Revalidate transferred runtime snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/v6-publication-check"
          mkdir -p "$RUNNER_TEMP/v6-publication-check"
          tar -xf "$RUNNER_TEMP/v6-runtime-publication/v6-runtime-data.tar" -C "$RUNNER_TEMP/v6-publication-check"
          test -f "$RUNNER_TEMP/v6-publication-check/data/v6/manifest.json"
          test -f "$RUNNER_TEMP/v6-publication-check/data/v6/health/publish_integrity.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "v6-publication-check" / "data" / "v6"
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          integrity = json.loads((root / "health" / "publish_integrity.json").read_text(encoding="utf-8"))
          assert manifest["governance"]["data_only"] is True
          assert manifest["governance"]["decision_authority"] == "NONE"
          assert manifest["governance"]["prediction_authority"] == "NONE"
          assert manifest["governance"]["optimizer_authority"] == "NONE"
          assert manifest["governance"]["production_authoritative_snapshots_require_schedule"] is False
          assert manifest["governance"]["production_authoritative_snapshots_require_governed_trigger"] is True
          assert manifest["governance"]["manual_recovery_is_authoritative"] is False
          assert integrity["status"] == "PASS", integrity
          assert integrity["resolved_registry_exact"] is True
          historical = root / "health" / "historical_backfill.json"
          if historical.exists():
              history = json.loads(historical.read_text(encoding="utf-8"))
              assert history["governance"]["data_only"] is True
              assert history["cohort_semantics"] == "CURRENT_COHORT_HISTORY"
          report_prefetch = root / "report_prefetch" / "latest.json"
          if report_prefetch.exists():
              prefetch = json.loads(report_prefetch.read_text(encoding="utf-8"))
              assert prefetch["governance"]["data_only"] is True
              assert prefetch["governance"]["independent_prefetch_cron"] is False
          print({"overall": manifest["overall"], "tree_sha256": integrity.get("tree_sha256")})
          PY

      - name: Capture runtime branch lease
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "+refs/heads/${RUNTIME_BRANCH}:refs/remotes/origin/${RUNTIME_BRANCH}"
          runtime_base="$(git rev-parse "refs/remotes/origin/${RUNTIME_BRANCH}")"
          echo "RUNTIME_BASE_SHA=$runtime_base" >> "$GITHUB_ENV"

      - name: Publish atomic V6 runtime snapshot
        shell: bash
        env:
          PUBLISH_TOKEN: ${{ steps.runtime_app_token.outputs.token }}
        run: |
          set -euo pipefail
          publish_tree="$RUNNER_TEMP/v6-runtime-worktree"
          rm -rf "$publish_tree"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add --detach "$publish_tree" "$GITHUB_SHA"
          cd "$publish_tree"
          git checkout --orphan runtime-snapshot
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xf "$RUNNER_TEMP/v6-runtime-publication/v6-runtime-data.tar"
          git add -f data/v6
          git commit -m "data(v6): atomic hourly snapshot ${{ github.run_id }} [${{ needs.collect.outputs.schedule_kind }}] [dedicated_v6_github_app]"
          published_sha="$(git rev-parse HEAD)"
          basic_auth="$(printf 'x-access-token:%s' "$PUBLISH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic_auth" push \
            --force-with-lease="refs/heads/${RUNTIME_BRANCH}:${RUNTIME_BASE_SHA}" \
            origin "HEAD:refs/heads/${RUNTIME_BRANCH}"
          echo "PUBLISHED_RUNTIME_SHA=$published_sha" >> "$GITHUB_ENV"

      - name: Verify published V6 runtime provenance and exact tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "+refs/heads/${RUNTIME_BRANCH}:refs/remotes/origin/${RUNTIME_BRANCH}"
          published_head="$(git rev-parse "refs/remotes/origin/${RUNTIME_BRANCH}")"
          test "$published_head" = "$PUBLISHED_RUNTIME_SHA"
          verify_tree="$RUNNER_TEMP/v6-runtime-verify"
          rm -rf "$verify_tree"
          git worktree add --detach "$verify_tree" "refs/remotes/origin/${RUNTIME_BRANCH}"
          unauthorized="$(git -C "$verify_tree" ls-files | grep -v '^data/v6/' || true)"
          if [ -n "$unauthorized" ]; then
            echo "Unauthorized files outside data/v6/:"
            echo "$unauthorized"
            exit 1
          fi
          diff -qr "$RUNNER_TEMP/v6-publication-check/data/v6" "$verify_tree/data/v6"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "v6-runtime-verify" / "data" / "v6"
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          integrity = json.loads((root / "health" / "publish_integrity.json").read_text(encoding="utf-8"))
          assert manifest["governance"]["data_only"] is True
          assert manifest["governance"]["decision_authority"] == "NONE"
          assert manifest["governance"]["production_authoritative_snapshots_require_schedule"] is False
          assert manifest["governance"]["production_authoritative_snapshots_require_governed_trigger"] is True
          assert integrity["status"] == "PASS", integrity
          assert integrity["resolved_registry_exact"] is True
          evidence = {
              "published": True,
              "overall": manifest["overall"],
              "generated_at": manifest["generated_at"],
              "schedule_kind": manifest["runtime_control"]["schedule_kind"],
              "authoritative_runtime_snapshot": manifest["runtime_control"].get("authoritative_runtime_snapshot"),
              "publisher_mode": "dedicated_v6_github_app",
              "tree_sha256": integrity.get("tree_sha256"),
          }
          historical = root / "health" / "historical_backfill.json"
          if historical.exists():
              history = json.loads(historical.read_text(encoding="utf-8"))
              evidence["historical_backfill"] = {
                  "league_id": history.get("league_id"),
                  "gw_from": history.get("gw_from"),
                  "gw_to": history.get("gw_to"),
                  "overall_status": history.get("overall_status"),
                  "current_cohort_manager_count": history.get("current_cohort_manager_count"),
                  "cache": history.get("cache"),
              }
          report_prefetch = root / "report_prefetch" / "latest.json"
          if report_prefetch.exists():
              prefetch = json.loads(report_prefetch.read_text(encoding="utf-8"))
              evidence["report_prefetch"] = {
                  "request_id": prefetch.get("request_id"),
                  "report_kind": prefetch.get("report_kind"),
                  "complete": prefetch.get("complete"),
                  "fresh_for_target_report": prefetch.get("fresh_for_target_report"),
              }
          print(evidence)
          PY
