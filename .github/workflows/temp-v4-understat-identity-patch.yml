name: TEMP V4 Understat identity patch

on:
  push:
    branches:
      - fix/v4-official-understat-player-mapping-20260902

permissions:
  contents: write

jobs:
  patch-attest-test:
    if: ${{ !contains(github.event.head_commit.message, '[identity-patched]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v4-official-understat-player-mapping-20260902
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Apply governed source and identity patch
        run: python tools/temp_v4_understat_identity_patch.py
      - name: Regenerate governed V4 architecture attestation
        run: python tools/v4_architecture_guard_attest.py
      - name: Full regression
        run: python -m pytest -q --tb=short
      - name: Generate live Official to Understat proof
        run: python tools/temp_v4_understat_live_proof.py
      - name: Commit validated patch, attestation and live proof
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sources/understat.py src/intelligence/understat_tactical.py src/services/enrichment_service.py tests/test_v4_understat_official_identity_bridge.py config/architecture_guard_attestation.json verification/v4_official_understat_identity_live_proof.json
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 1
          fi
          git commit -m "fix(v4): complete Official-Understat identity crosswalk [identity-patched]"
          git push origin HEAD:fix/v4-official-understat-player-mapping-20260902
