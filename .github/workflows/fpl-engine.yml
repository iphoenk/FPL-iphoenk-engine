name: FPL iphoenk collector v3.3

on:
  workflow_dispatch:
  schedule:
    - cron: "20 * * * *"

permissions:
  contents: write

concurrency:
  group: fpl-iphoenk-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Reliability tests
        run: python -m pytest -q
      - name: Generate API + advanced-stats snapshot
        run: python -m src.engine daily --stats
      - name: Validate generated snapshot
        run: |
          python - <<'PY'
          import json
          from src.engines.reliability import validate_snapshot
          s=json.load(open('data/latest.json'))
          r=validate_snapshot(s)
          print(r)
          if not r['ok']: raise SystemExit(2)
          PY
      - name: Commit data safely
        shell: bash
        run: |
          git config user.name "fpl-iphoenk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "data: refresh FPL v3.3 snapshot"
          git fetch origin main
          git rebase origin/main
          git push origin main
