name: Temporary V4 attestation refresh

on:
  push:
    branches:
      - codex/v4-top20-price-mover-serving

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/v4-top20-price-mover-serving
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Refresh governed architecture attestation
        run: python tools/v4_architecture_guard_attest.py
      - name: Commit refreshed attestation when changed
        run: |
          if git diff --quiet -- config/architecture_guard_attestation.json; then
            echo "Attestation already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/architecture_guard_attestation.json
          git commit -m "chore(v4): refresh architecture attestation"
          git push origin HEAD:codex/v4-top20-price-mover-serving
