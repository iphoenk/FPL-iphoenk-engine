name: V4 optimizer profile temp

on:
  push:
    branches: [codex/v4-full-universe-tactical-20260903]
    paths:
      - .github/workflows/v4-optimizer-profile-temp.yml

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/v4-full-universe-tactical-20260903
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install --disable-pip-version-check -r requirements.txt
      - name: Profile optimizer production path without authority
        run: |
          set +e
          timeout 300s python -m cProfile -o /tmp/v4-opt.prof -m src.services.optimization_slo_service
          rc=$?
          set -e
          if [ -f /tmp/v4-opt.prof ]; then
            python - <<'PY'
          import pstats
          s=pstats.Stats('/tmp/v4-opt.prof')
          s.strip_dirs().sort_stats('cumtime').print_stats(80)
          PY
          fi
          echo "probe_exit=$rc"
          exit 0
