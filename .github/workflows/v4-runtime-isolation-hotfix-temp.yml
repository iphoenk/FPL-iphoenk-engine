name: TEMP V4 runtime isolation hotfix

on:
  push:
    branches:
      - hotfix/v4-postmerge-runtime-test-isolation

permissions:
  contents: write

jobs:
  patch-test-attest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hotfix/v4-postmerge-runtime-test-isolation
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply explicit publication dependency isolation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/engines/v4_checkpoint_governance.py')
          text = path.read_text(encoding='utf-8')
          old = '''    atomic_json(OUTFILE,out);effective_plan=effective_plan or read_json(DATA/"effective_plan_v4.json",{});team=team or read_json(DATA/"team.json",{});tactical=tactical or read_json(DATA/"tactical_serving_v4.json",{});prices=prices or read_json(DATA/"prices.json",{});competitive=competitive or read_json(DATA/"competitive_load_v4.json",{})\n    if effective_plan and team and tactical:\n        serving=write_serving_payload(canonical,effective_plan,team,tactical,lineup,prices,latest,competitive);out["serving_payload"]={"path":"data/serving_payload_v4.json","canonical_resolution_id":serving.get("canonical_resolution_id"),"quick_serving_ms":serving.get("quick_serving_ms")};atomic_json(OUTFILE,out)\n    return out\n\n\ndef run(now=None):return govern_checkpoint(read_json(DATA/"latest.json",{}),read_json(DATA/"framework_health_v4.json",{}),read_json(DATA/"recommendation_sanity_v4.json",{}),read_json(DATA/"lineup_decision_v4.json",{}),read_json(CONFIG/"locked_squad.json",{}),read_json(DATA/"gw_scorecard_v4.json",{}),now=now,canonical=read_json(DATA/"decision_arbitration_v4.json",{}),effective_plan=read_json(DATA/"effective_plan_v4.json",{}))\n'''
          new = '''    atomic_json(OUTFILE,out)\n    publication_inputs=(effective_plan,team,tactical,prices,competitive)\n    if any(value is not None for value in publication_inputs):\n        if any(value is None for value in publication_inputs):\n            raise RuntimeError("report governance publication dependencies must be supplied together")\n        serving=write_serving_payload(canonical,effective_plan,team,tactical,lineup,prices,latest,competitive);out["serving_payload"]={"path":"data/serving_payload_v4.json","canonical_resolution_id":serving.get("canonical_resolution_id"),"quick_serving_ms":serving.get("quick_serving_ms")};atomic_json(OUTFILE,out)\n    return out\n\n\ndef run(now=None):return govern_checkpoint(read_json(DATA/"latest.json",{}),read_json(DATA/"framework_health_v4.json",{}),read_json(DATA/"recommendation_sanity_v4.json",{}),read_json(DATA/"lineup_decision_v4.json",{}),read_json(CONFIG/"locked_squad.json",{}),read_json(DATA/"gw_scorecard_v4.json",{}),now=now,canonical=read_json(DATA/"decision_arbitration_v4.json",{}),effective_plan=read_json(DATA/"effective_plan_v4.json",{}),team=read_json(DATA/"team.json",{}),tactical=read_json(DATA/"tactical_serving_v4.json",{}),prices=read_json(DATA/"prices.json",{}),competitive=read_json(DATA/"competitive_load_v4.json",{}))\n'''
          if old not in text:
              raise SystemExit('expected checkpoint governance tail not found; refusing blind patch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Regenerate architecture attestation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tools/v4_architecture_guard_attest.py
      - name: Hydrate production runtime state
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin +refs/heads/runtime-data-v4:refs/remotes/origin/runtime-data-v4
          if git cat-file -e origin/runtime-data-v4:data 2>/dev/null; then
            rm -rf data
            git archive origin/runtime-data-v4 data | tar -x
          fi
      - name: Run full suite against hydrated runtime state
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q --tb=short
      - name: Commit hotfix and attestation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- data || true
          git add src/engines/v4_checkpoint_governance.py config/architecture_guard_attestation.json
          git commit -m "fix: isolate checkpoint governance from hydrated runtime state"
          git push origin HEAD:hotfix/v4-postmerge-runtime-test-isolation
