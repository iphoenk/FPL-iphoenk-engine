name: V6 Wave B promote Understat secondary v2

on:
  push:
    branches:
      - feat/v6-identity-wave-b-understat-secondary

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-v6-ci.lock
      - name: Install V6 test dependencies
        run: python -m pip install --require-hashes -r requirements-v6-ci.lock
      - name: Hydrate deterministic evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/waveb-understat
          git fetch --depth=1 origin '+refs/heads/runtime-data-v6:refs/remotes/origin/runtime-data-v6'
          git show origin/runtime-data-v6:data/v6/normalized/sources/understat.json > /tmp/waveb-understat/understat.json
          git show origin/runtime-data-v6:data/v6/evidence/player_identity_map.json > /tmp/waveb-understat/player_identity_map.json
          curl --fail --silent --show-error --location --retry 3 --retry-delay 1 \
            'https://raw.githubusercontent.com/ChrisMusson/FPL-ID-Map/e5a9942affd98501db473a8d3b6a0f9e93751e8a/Master.csv' \
            -o /tmp/waveb-understat/Master.csv
          test "$(sha256sum /tmp/waveb-understat/Master.csv | awk '{print $1}')" = '19d1f9d08ab975e40d26b214f6984cce7d6bc58f62fbef3bec46722b2196d56a'
      - name: Execute unchanged reviewed promotion logic
        env:
          REVIEW_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/v6-wave-b-promote-understat-secondary.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          block = source[start:end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          exec(compile(code, 'wave_b_understat_secondary_embedded.py', 'exec'), {'__name__': '__main__'})
          PY
      - name: Validate focused contracts
        run: |
          python -m pytest -q \
            tests/test_data_platform_identity_wave_b_understat_secondary.py \
            tests/test_data_platform_verified_player_crosswalk_materialized.py \
            tests/test_data_platform_identity_wave_b_promoted_crosswalk.py
      - name: Commit reviewed extension
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/v6/verified_crosswalks.json \
                  tests/test_data_platform_verified_player_crosswalk_materialized.py \
                  tests/test_data_platform_identity_wave_b_understat_secondary.py
          git commit -m 'Promote 68 deterministic Understat Wave B secondary mappings'
          git push origin HEAD:${GITHUB_REF_NAME}
