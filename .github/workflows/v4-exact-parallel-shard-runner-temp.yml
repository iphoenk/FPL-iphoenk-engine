name: V4 temporary exact parallel-shard acceptance
on:
  push:
    branches:
      - codex/v4-full-universe-tactical-20260903
    paths:
      - .github/workflows/v4-exact-parallel-shard-runner-temp.yml
permissions:
  contents: write
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/v4-full-universe-tactical-20260903
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Apply exact parallel-shard hardening
        run: python tools/v4_exact_parallel_shard_patch_temp.py
      - name: Refresh governed architecture attestation
        run: python tools/v4_architecture_guard_attest.py
      - name: Focused full-universe correctness regression
        run: python -m pytest -q tests/test_v4_full_universe_package_search_proof.py tests/test_v4_full_universe_authority_fail_closed.py tests/test_v496_e2e_performance_hardening.py tests/test_v4_p1_structural_hardening.py
      - name: Full V4 regression
        run: python -m pytest -q
      - name: Cold optimization hard SLO proof
        run: /usr/bin/time -f 'cold_optimization_elapsed=%e' timeout 44s python -m src.services.optimization_slo_service
      - name: Commit governed exact parallel-shard hardening
        run: |
          git config user.name 'fpl-iphoenk-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/engines/v4_full_universe_package_search_core.py config/architecture/architecture_guard_attestation.json
          git diff --cached --quiet && exit 0
          git commit -m 'perf(v4): exact parallel package-search shards'
          git push origin HEAD:codex/v4-full-universe-tactical-20260903
# rerun: anchored public search definition
