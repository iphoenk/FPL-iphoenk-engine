name: V6 FFScout native identity dedupe staging

on:
  push:
    branches:
      - fix/v6-ffscout-native-identity-dedupe

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-v6-ci.lock
      - name: Install V6 CI dependencies
        run: python -m pip install --require-hashes -r requirements-v6-ci.lock
      - name: Apply FFScout native identity consolidation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/runtime_v6/ffscout_public.py')
          text = path.read_text(encoding='utf-8')

          anchor = '_PL_MEDIA_CODE_RE = re.compile(r"/players/(?:[^/?#]+/)?(\\d+)\\.png(?:[?#].*)?$", re.IGNORECASE)\n'
          if text.count(anchor) != 1:
              raise SystemExit('constant anchor mismatch')
          text = text.replace(anchor, anchor + '\n\nclass FFScoutPublicError(RuntimeError):\n    pass\n', 1)

          start = text.index('def _observed_rows(payload: dict[str, Any]) -> list[dict[str, Any]]:\n')
          end = text.index('\n\ndef _official_by_code', start)
          observed_fn = '''def _observed_rows(payload: dict[str, Any]) -> list[dict[str, Any]]:\n    by_code: dict[int, list[dict[str, Any]]] = {}\n    seen_occurrences: set[tuple[int, str, str]] = set()\n    for request_id in ("team_news", "home"):\n        body = _request_body(payload, request_id)\n        if not body.strip():\n            continue\n        parser = _PremierLeagueAvatarParser(request_id)\n        parser.feed(body)\n        for row in parser.rows:\n            code = _int(row.get("premierleague_media_code"))\n            if code is None:\n                continue\n            image_url = str(row.get("image_url") or "").strip()\n            occurrence = (code, request_id, image_url)\n            if occurrence in seen_occurrences:\n                continue\n            seen_occurrences.add(occurrence)\n            by_code.setdefault(code, []).append(dict(row))\n\n    rows: list[dict[str, Any]] = []\n    for code, evidence_rows in sorted(by_code.items()):\n        request_ids = sorted({str(row.get("request_id")) for row in evidence_rows if row.get("request_id")})\n        image_urls = sorted({str(row.get("image_url")) for row in evidence_rows if row.get("image_url")})\n        names = sorted({str(row.get("player_name")).strip() for row in evidence_rows if str(row.get("player_name") or "").strip()})\n        observations = sorted(\n            [\n                {\n                    "request_id": str(row.get("request_id") or "").strip() or None,\n                    "image_url": str(row.get("image_url") or "").strip() or None,\n                }\n                for row in evidence_rows\n            ],\n            key=lambda item: (str(item.get("request_id") or ""), str(item.get("image_url") or "")),\n        )\n        observation_types = sorted(\n            {\n                "PREDICTED_LINEUP_PUBLIC_REFERENCE" if request_id == "team_news" else "PUBLIC_PLAYER_REFERENCE"\n                for request_id in request_ids\n            }\n        )\n        rows.append(\n            {\n                "source_native_id": code,\n                "premierleague_media_code": code,\n                "player_name": names[0] if names else None,\n                "request_id": request_ids[0] if len(request_ids) == 1 else None,\n                "request_ids": request_ids,\n                "image_url": image_urls[0] if len(image_urls) == 1 else None,\n                "image_urls": image_urls,\n                "observation_type": (\n                    "PREDICTED_LINEUP_PUBLIC_REFERENCE"\n                    if "PREDICTED_LINEUP_PUBLIC_REFERENCE" in observation_types\n                    else "PUBLIC_PLAYER_REFERENCE"\n                ),\n                "observation_types": observation_types,\n                "observation_count": len(observations),\n                "observations": observations,\n            }\n        )\n    return rows\n'''
          text = text[:start] + observed_fn + text[end:]

          build_marker = 'def build_ffscout_public_dataset(\n'
          build_start = text.index(build_marker)
          helper = '''def _normalized_observations(row: dict[str, Any]) -> set[tuple[str, str]]:\n    observations: set[tuple[str, str]] = set()\n    for item in row.get("observations") or []:\n        if not isinstance(item, dict):\n            continue\n        request_id = str(item.get("request_id") or "").strip()\n        image_url = str(item.get("image_url") or "").strip()\n        if request_id or image_url:\n            observations.add((request_id, image_url))\n    if observations:\n        return observations\n    request_id = str(row.get("request_id") or "").strip()\n    image_url = str(row.get("image_url") or "").strip()\n    if request_id or image_url:\n        observations.add((request_id, image_url))\n    return observations\n\n\ndef _consolidate_normalized_player_rows(rows: list[dict[str, Any]]) -> list[dict[str, Any]]:\n    by_native: dict[str, list[dict[str, Any]]] = {}\n    for row in rows:\n        if not isinstance(row, dict) or row.get("source_native_id") is None:\n            continue\n        native = str(row.get("source_native_id")).strip()\n        if not native:\n            continue\n        by_native.setdefault(native, []).append(dict(row))\n\n    consolidated: list[dict[str, Any]] = []\n    for native, native_rows in sorted(by_native.items(), key=lambda item: (int(item[0]) if item[0].isdigit() else 10**18, item[0])):\n        official_ids = {\n            int(row["official_element_id"])\n            for row in native_rows\n            if row.get("official_element_id") is not None and str(row.get("official_element_id")).strip()\n        }\n        if len(official_ids) > 1:\n            raise FFScoutPublicError(\n                f"ffscout native id {native} maps to multiple Official FPL elements: {sorted(official_ids)}"\n            )\n\n        observations: set[tuple[str, str]] = set()\n        request_ids: set[str] = set()\n        image_urls: set[str] = set()\n        names: set[str] = set()\n        observation_types: set[str] = set()\n        for row in native_rows:\n            observations.update(_normalized_observations(row))\n            request_ids.update(str(value).strip() for value in (row.get("request_ids") or []) if str(value).strip())\n            image_urls.update(str(value).strip() for value in (row.get("image_urls") or []) if str(value).strip())\n            if str(row.get("request_id") or "").strip():\n                request_ids.add(str(row.get("request_id")).strip())\n            if str(row.get("image_url") or "").strip():\n                image_urls.add(str(row.get("image_url")).strip())\n            if str(row.get("player_name") or "").strip():\n                names.add(str(row.get("player_name")).strip())\n            observation_types.update(\n                str(value).strip() for value in (row.get("observation_types") or []) if str(value).strip()\n            )\n            if str(row.get("observation_type") or "").strip():\n                observation_types.add(str(row.get("observation_type")).strip())\n\n        for request_id, image_url in observations:\n            if request_id:\n                request_ids.add(request_id)\n            if image_url:\n                image_urls.add(image_url)\n        if "team_news" in request_ids:\n            observation_types.add("PREDICTED_LINEUP_PUBLIC_REFERENCE")\n        if any(request_id != "team_news" for request_id in request_ids):\n            observation_types.add("PUBLIC_PLAYER_REFERENCE")\n\n        mapped_rows = [row for row in native_rows if row.get("official_element_id") is not None]\n        status_rank = {"EXACT": 3, "VERIFIED_MANUAL": 2, "UNMAPPED": 0}\n        selected_status = max(\n            (str(row.get("identity_status") or "UNMAPPED") for row in mapped_rows),\n            key=lambda value: status_rank.get(value, 1),\n            default="UNMAPPED",\n        )\n        identity_method = next(\n            (str(row.get("identity_method")) for row in reversed(mapped_rows) if row.get("identity_method")),\n            None,\n        )\n        sorted_requests = sorted(request_ids)\n        sorted_images = sorted(image_urls)\n        sorted_types = sorted(observation_types)\n        sorted_observations = [\n            {"request_id": request_id or None, "image_url": image_url or None}\n            for request_id, image_url in sorted(observations)\n        ]\n        code = _int(native)\n        consolidated.append(\n            {\n                "source_native_id": code if code is not None else native,\n                "premierleague_media_code": code if code is not None else native,\n                "player_name": sorted(names)[0] if names else None,\n                "request_id": sorted_requests[0] if len(sorted_requests) == 1 else None,\n                "request_ids": sorted_requests,\n                "image_url": sorted_images[0] if len(sorted_images) == 1 else None,\n                "image_urls": sorted_images,\n                "observation_type": (\n                    "PREDICTED_LINEUP_PUBLIC_REFERENCE"\n                    if "PREDICTED_LINEUP_PUBLIC_REFERENCE" in observation_types\n                    else (sorted_types[0] if sorted_types else "PUBLIC_PLAYER_REFERENCE")\n                ),\n                "observation_types": sorted_types,\n                "observation_count": len(sorted_observations),\n                "observations": sorted_observations,\n                "official_element_id": next(iter(official_ids)) if official_ids else None,\n                "identity_status": selected_status if official_ids else "UNMAPPED",\n                "join_ready": bool(official_ids and selected_status in {"EXACT", "VERIFIED_MANUAL"}),\n                "identity_method": identity_method if official_ids else None,\n            }\n        )\n    return consolidated\n\n\n'''
          text = text[:build_start] + helper + text[build_start:]

          old_build = '''        player["observation_type"] = (\n            "PREDICTED_LINEUP_PUBLIC_REFERENCE"\n            if row.get("request_id") == "team_news"\n            else "PUBLIC_PLAYER_REFERENCE"\n        )\n'''
          new_build = '''        player["observation_type"] = str(\n            row.get("observation_type")\n            or (\n                "PREDICTED_LINEUP_PUBLIC_REFERENCE"\n                if row.get("request_id") == "team_news"\n                else "PUBLIC_PLAYER_REFERENCE"\n            )\n        )\n'''
          if text.count(old_build) != 1:\n              raise SystemExit('build observation type patch target mismatch')
          text = text.replace(old_build, new_build, 1)

          old_players = '        "record_groups": {"players": players},\n'
          new_players = '        "record_groups": {"players": _consolidate_normalized_player_rows(players)},\n'
          if text.count(old_players) != 1:\n              raise SystemExit('build players patch target mismatch')
          text = text.replace(old_players, new_players, 1)
          text = text.replace('        "record_count": len(players),\n', '        "record_count": len(_consolidate_normalized_player_rows(players)),\n', 1)

          governance_anchor = '            "identity_join_requires_embedded_premierleague_media_code": True,\n'
          governance_add = governance_anchor + '            "player_identity_rows_are_unique_by_source_native_id": True,\n            "multiple_observations_for_same_native_id_are_consolidated": True,\n            "observation_evidence_is_retained": True,\n'
          if text.count(governance_anchor) != 1:\n              raise SystemExit('governance anchor mismatch')
          text = text.replace(governance_anchor, governance_add, 1)

          aug_start = text.index('def augment_ffscout_public_dataset(\n')
          augment_fn = '''def augment_ffscout_public_dataset(\n    results: dict[str, dict[str, Any]],\n    identity_map: dict[str, Any],\n    datasets: dict[str, dict[str, Any]],\n) -> dict[str, dict[str, Any]]:\n    payload = results.get("ffscout")\n    if not isinstance(payload, dict):\n        return datasets\n    out = dict(datasets)\n    overlay = build_ffscout_public_dataset(payload, identity_map)\n    existing = out.get("ffscout")\n    if not isinstance(existing, dict):\n        out["ffscout"] = overlay\n        return out\n\n    merged = deepcopy(existing)\n    groups = merged.setdefault("record_groups", {})\n    current = groups.get("players") if isinstance(groups.get("players"), list) else []\n    observed = ((overlay.get("record_groups") or {}).get("players") or [])\n    groups["players"] = _consolidate_normalized_player_rows([*current, *observed])\n    merged["record_count"] = sum(len(rows) for rows in groups.values() if isinstance(rows, list))\n    if groups["players"]:\n        merged["normalization_status"] = "NORMALIZED"\n    merged.setdefault("governance", {}).update(overlay["governance"])\n    merged["governance"]["ffscout_public_player_normalization_version"] = NORMALIZATION_VERSION\n    merged["governance"]["player_identity_rows_are_unique_by_source_native_id"] = True\n    merged["governance"]["multiple_observations_for_same_native_id_are_consolidated"] = True\n    merged["governance"]["observation_evidence_is_retained"] = True\n    out["ffscout"] = merged\n    return out\n'''
          text = text[:aug_start] + augment_fn
          path.write_text(text, encoding='utf-8')

          test = Path('tests/test_data_platform_ffscout_native_identity_inventory.py')
          test.write_text('''from __future__ import annotations\n\nimport pytest\n\nfrom src.runtime_v6.ffscout_public import (\n    FFScoutPublicError,\n    augment_ffscout_public_dataset,\n    build_ffscout_public_dataset,\n)\n\n\ndef _img(code: int, name: str) -> str:\n    return f'<img src="https://resources.premierleague.com/premierleague/photos/players/110x140/p{code}.png" alt="Avatar of {name}">'\n\n\ndef _payload() -> dict:\n    return {\n        "checked_at": "2026-09-13T00:00:00Z",\n        "health": "GREEN",\n        "effective_state": "LIVE_CHANGED",\n        "current_run_action": "FETCHED",\n        "data": {\n            "team_news": {"body": _img(84146, "Example Player"), "sha256": "a"},\n            "home": {"body": _img(84146, "Example Player"), "sha256": "b"},\n        },\n    }\n\n\ndef _identity() -> dict:\n    return {\n        "mappings": {\n            "10": {\n                "official_fpl_element_id": 10,\n                "links": {\n                    "ffscout": {\n                        "source_native_id": 84146,\n                        "status": "EXACT",\n                        "joinable": True,\n                    }\n                },\n            }\n        }\n    }\n\n\ndef test_build_consolidates_same_native_id_across_public_request_surfaces():\n    dataset = build_ffscout_public_dataset(_payload(), _identity())\n    rows = dataset["record_groups"]["players"]\n    assert len(rows) == 1\n    row = rows[0]\n    assert row["source_native_id"] == 84146\n    assert row["official_element_id"] == 10\n    assert row["identity_status"] == "EXACT"\n    assert row["request_ids"] == ["home", "team_news"]\n    assert row["observation_count"] == 2\n    assert len(row["observations"]) == 2\n    assert row["observation_type"] == "PREDICTED_LINEUP_PUBLIC_REFERENCE"\n    assert dataset["governance"]["player_identity_rows_are_unique_by_source_native_id"] is True\n    assert dataset["governance"]["observation_evidence_is_retained"] is True\n\n\ndef test_augment_collapses_legacy_duplicate_rows_and_preserves_evidence():\n    existing = {\n        "ffscout": {\n            "record_groups": {\n                "players": [\n                    {"source_native_id": 84146, "request_id": "home", "image_url": "home.png", "official_element_id": None, "identity_status": "UNMAPPED"},\n                    {"source_native_id": 84146, "request_id": "team_news", "image_url": "news.png", "official_element_id": 10, "identity_status": "EXACT", "join_ready": True, "identity_method": "legacy"},\n                ]\n            },\n            "governance": {},\n        }\n    }\n    out = augment_ffscout_public_dataset({"ffscout": _payload()}, _identity(), existing)\n    rows = out["ffscout"]["record_groups"]["players"]\n    assert len(rows) == 1\n    row = rows[0]\n    assert row["source_native_id"] == 84146\n    assert row["official_element_id"] == 10\n    assert row["identity_status"] == "EXACT"\n    assert row["request_ids"] == ["home", "team_news"]\n    assert {item["image_url"] for item in row["observations"]} >= {"home.png", "news.png"}\n    assert out["ffscout"]["governance"]["multiple_observations_for_same_native_id_are_consolidated"] is True\n\n\ndef test_augment_fails_closed_if_same_native_id_targets_multiple_official_elements():\n    existing = {\n        "ffscout": {\n            "record_groups": {\n                "players": [\n                    {"source_native_id": 84146, "request_id": "home", "official_element_id": 10, "identity_status": "EXACT"},\n                    {"source_native_id": 84146, "request_id": "team_news", "official_element_id": 11, "identity_status": "EXACT"},\n                ]\n            },\n            "governance": {},\n        }\n    }\n    with pytest.raises(FFScoutPublicError, match="multiple Official FPL elements"):\n        augment_ffscout_public_dataset({"ffscout": _payload()}, _identity(), existing)\n''', encoding='utf-8')
          PY
      - name: Run focused FFScout and identity tests
        run: |
          python -m pytest -q \
            tests/test_data_platform_ffscout_native_identity_inventory.py \
            tests/test_data_platform_identity_wave_b_gap_semantics.py \
            tests/test_data_platform_identity_wave_b_provider_limitations.py
      - name: Run full V6 data-platform contracts
        run: python -m pytest -q tests/test_data_platform_*.py
      - name: Commit production fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/runtime_v6/ffscout_public.py tests/test_data_platform_ffscout_native_identity_inventory.py
          git commit -m 'Deduplicate FFScout native identity inventory'\n          git push origin HEAD:${GITHUB_REF_NAME}
