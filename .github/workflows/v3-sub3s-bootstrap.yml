name: V3 Sub3s Bootstrap

on:
  push:
    branches:
      - codex/v3-sub3s-hardening-v4-v5-adoption

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v3-sub3s-hardening-v4-v5-adoption
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply guarded patch
        run: python tools/apply_v3_sub3s_hardening.py
      - name: Commit final candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fpl-iphoenk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "perf(v3): coalesce fast lane and harden sub-3s acceptance"
          git push origin HEAD:codex/v3-sub3s-hardening-v4-v5-adoption
